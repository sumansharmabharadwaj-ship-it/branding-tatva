name: Import original Services Stakes backdrop

on:
  push:
    branches:
      - services-original-stakes-backdrop
    paths:
      - .github/workflows/import-services-stakes-backdrop.yml

permissions:
  contents: write

jobs:
  import-backdrop:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 8

    steps:
      - name: Check out focused branch
        uses: actions/checkout@v4
        with:
          ref: services-original-stakes-backdrop
          fetch-depth: 0

      - name: Download and validate the generated positioning image
        env:
          STAKES_IMAGE_URL: "https://photoshop-api.adobe.io/v2/short-url/urn:aaid:ps:US:361b45fa-f121-401b-8cd8-c7dddc9280f5"
        run: |
          set -euo pipefail
          mkdir -p public/images/generated
          curl --fail --location --retry 4 --retry-all-errors \
            "$STAKES_IMAGE_URL" \
            --output public/images/generated/bt-services-stakes-positioning.png

          test -s public/images/generated/bt-services-stakes-positioning.png
          file public/images/generated/bt-services-stakes-positioning.png | grep -q "PNG image data"

          python <<'PY'
          from pathlib import Path
          import struct

          path = Path("public/images/generated/bt-services-stakes-positioning.png")
          data = path.read_bytes()
          if data[:8] != b"\x89PNG\r\n\x1a\n":
              raise SystemExit("Downloaded asset is not a PNG")
          width, height = struct.unpack(">II", data[16:24])
          if width < 2000 or height < 1100:
              raise SystemExit(f"Backdrop resolution is too small: {width}x{height}")
          print(f"Validated original Stakes backdrop: {width}x{height}, {path.stat().st_size} bytes")
          PY

      - name: Commit the original backdrop
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/images/generated/bt-services-stakes-positioning.png
          git commit -m "Import original Services positioning backdrop"
          git push origin HEAD:services-original-stakes-backdrop
