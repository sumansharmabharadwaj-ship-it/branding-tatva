name: Apply Work opening polish

on:
  push:
    branches:
      - homepage-cinematic-recovery
    paths:
      - .github/workflows/apply-work-opening-polish.yml

permissions:
  contents: write
  actions: write

concurrency:
  group: work-opening-polish-patch
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the working branch
        uses: actions/checkout@v4
        with:
          ref: homepage-cinematic-recovery
          fetch-depth: 0

      - name: Use Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Activate pnpm
        run: corepack enable

      - name: Apply, build, publish, and verify
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          for attempt in 1 2 3; do
            echo "Work opening polish attempt ${attempt}"
            git fetch origin homepage-cinematic-recovery
            git reset --hard origin/homepage-cinematic-recovery
            git clean -fd

            python <<'PY'
          from pathlib import Path

          ROOT = Path(".")
          OPENING = ROOT / "src/sections/Work/WorkOpening.tsx"
          CASE = ROOT / "src/sections/Work/CaseStudyExperience.tsx"
          WORKFLOW = ROOT / ".github/workflows/apply-work-opening-polish.yml"

          def replace_once(text: str, old: str, new: str, path: Path) -> str:
            count = text.count(old)
            if count != 1:
              raise RuntimeError(f"Expected one occurrence in {path}, found {count}: {old[:100]!r}")
            return text.replace(old, new, 1)

          text = OPENING.read_text(encoding="utf-8")
          text = replace_once(
            text,
            '        <div className="grid items-center gap-12 lg:grid-cols-[0.95fr_1.15fr] lg:gap-16 xl:gap-20">',
            '        <div className="grid items-start gap-12 lg:grid-cols-[minmax(0,1.08fr)_minmax(0,0.92fr)] lg:gap-12 xl:gap-16">',
            OPENING,
          )
          text = replace_once(
            text,
            '              className="mt-5 font-display text-[clamp(2.75rem,5.8vw,4.9rem)] font-normal leading-[1.03] tracking-[-0.015em]"',
            '              className="mt-5 font-display text-[clamp(2.75rem,5.1vw,4.55rem)] font-normal leading-[1.03] tracking-[-0.015em]"',
            OPENING,
          )
          text = replace_once(text, '                  className="block"', '                  className="block lg:whitespace-nowrap"', OPENING)
          text = replace_once(text, '            className="min-w-0"', '            className="min-w-0 lg:pt-14"', OPENING)

          start_marker = '              <Link href={`/work/${current.slug}`} className="group block focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-4" style={{ outlineColor: WORK.moss }}>'
          end_marker = '              </Link>'
          start = text.find(start_marker)
          if start < 0:
            raise RuntimeError("Could not find the current Work opening preview link")
          end = text.find(end_marker, start)
          if end < 0:
            raise RuntimeError("Could not find the closing Work opening preview link")
          end += len(end_marker)

          replacement = '''              <Link
                href={`/work/${current.slug}`}
                className="group block focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-4"
                style={{ outlineColor: WORK.moss }}
              >
                <div className="relative aspect-[4/3] overflow-hidden bg-black/10">
                  <AnimatePresence mode="wait" initial={false}>
                    <motion.img
                      key={current.slug}
                      src={record.evidencePoster}
                      alt={`${current.title} evidence diagram`}
                      className="absolute inset-0 h-full w-full object-cover"
                      initial={prefersReducedMotion ? { opacity: 0 } : { opacity: 0, scale: 1.025 }}
                      animate={{ opacity: 1, scale: 1 }}
                      exit={{ opacity: 0 }}
                      transition={{ duration: prefersReducedMotion ? 0 : 0.58, ease: EASE_ORGANIC }}
                    />
                  </AnimatePresence>
                  <div
                    aria-hidden="true"
                    className="absolute inset-x-0 bottom-0 h-16"
                    style={{ background: "linear-gradient(180deg, transparent, rgba(8,12,10,0.3))" }}
                  />
                </div>

                <div
                  className="border-t p-5 sm:p-6"
                  style={{ borderColor: "rgba(255,255,255,0.12)", backgroundColor: WORK.forest }}
                >
                  <AnimatePresence mode="wait" initial={false}>
                    <motion.div
                      key={`${current.slug}-copy`}
                      initial={prefersReducedMotion ? undefined : { opacity: 0, y: 10 }}
                      animate={{ opacity: 1, y: 0 }}
                      exit={prefersReducedMotion ? undefined : { opacity: 0, y: -6 }}
                      transition={{ duration: prefersReducedMotion ? 0 : 0.38, ease: EASE_ORGANIC }}
                    >
                      <div className="flex items-start justify-between gap-5">
                        <div className="min-w-0">
                          <p className="text-[0.62rem] font-medium uppercase tracking-[0.18em]" style={{ color: WORK.sand }}>
                            {record.evidenceLabel} · {current.industry}
                          </p>
                          <h2 className="mt-1 font-display text-3xl font-normal text-white sm:text-4xl">{current.title}</h2>
                        </div>
                        <span className="shrink-0 font-display text-sm text-white/70">
                          {String(active + 1).padStart(2, "0")} / {String(projects.length).padStart(2, "0")}
                        </span>
                      </div>
                      <p className="mt-3 max-w-xl text-sm leading-relaxed text-white/80 sm:text-base">{decisiveLine(active)}</p>
                      <span className="mt-4 inline-flex items-center gap-2 text-sm font-medium text-white">
                        Open the project <span aria-hidden="true" className="transition-transform duration-300 group-hover:translate-x-1">→</span>
                      </span>
                    </motion.div>
                  </AnimatePresence>
                </div>
              </Link>'''
          text = text[:start] + replacement + text[end:]
          OPENING.write_text(text, encoding="utf-8")

          case_text = CASE.read_text(encoding="utf-8")
          radial = '          <div className="absolute inset-0" style={{ background: `radial-gradient(circle at 78% 22%, ${palette.accent}33, transparent 38%)` }} />'
          case_text = replace_once(
            case_text,
            radial,
            radial + '\n          <div aria-hidden="true" className="absolute inset-0 bg-black/30 sm:hidden" />',
            CASE,
          )
          CASE.write_text(case_text, encoding="utf-8")

          WORKFLOW.unlink()
          print("Polished the Work opening and reduced-motion mobile hero")
          PY

            pnpm install --frozen-lockfile
            pnpm build

            git add src/sections/Work/WorkOpening.tsx src/sections/Work/CaseStudyExperience.tsx .github/workflows/apply-work-opening-polish.yml
            if git diff --cached --quiet; then
              echo "Polish is already present on the latest branch."
              gh workflow run work-page-gate.yml --ref homepage-cinematic-recovery
              exit 0
            fi

            git commit -m "Polish the Work opening evidence hierarchy"
            if git push origin HEAD:homepage-cinematic-recovery; then
              gh workflow run work-page-gate.yml --ref homepage-cinematic-recovery
              echo "Work opening polish published and the browser gate dispatched."
              exit 0
            fi

            echo "Branch moved during verification; replaying on the newest head."
          done

          echo "Could not publish after three conflict-safe attempts."
          exit 1
