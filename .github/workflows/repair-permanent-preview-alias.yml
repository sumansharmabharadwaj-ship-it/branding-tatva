name: Repair permanent preview alias

on:
  workflow_dispatch:
  push:
    branches:
      - homepage-cinematic-recovery
    paths:
      - .github/workflows/repair-permanent-preview-alias.yml

permissions:
  contents: read

concurrency:
  group: branding-tatva-permanent-preview-alias-repair
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
      TEAM_ID: team_Y7dQ5jNk61chQvy2A92AEyTt
      DEPLOYMENT_ID: dpl_AGKbgVhHmrtPjDHPNZVvCxZs97UF
      EXPECTED_COMMIT: 79ede2c19d3825df2d6dca2e3d41ccc34c5f7bef
      PREVIEW_ALIAS: branding-tatva-git-homepage-cinematic-recovery-suman22.vercel.app

    steps:
      - name: Require the Vercel management token
        run: |
          if [ -z "$VERCEL_TOKEN" ]; then
            echo "::error::The VERCEL_TOKEN repository secret is not configured."
            exit 1
          fi

      - name: Confirm the release deployment is ready and exact
        run: |
          set -euo pipefail
          curl --fail --silent --show-error \
            "https://api.vercel.com/v13/deployments/${DEPLOYMENT_ID}?teamId=${TEAM_ID}" \
            -H "Authorization: Bearer ${VERCEL_TOKEN}" \
            -H "Accept: application/json" \
            > /tmp/deployment.json

          node <<'NODE'
          const fs = require("node:fs");
          const deployment = JSON.parse(fs.readFileSync("/tmp/deployment.json", "utf8"));
          const expected = process.env.EXPECTED_COMMIT;
          if ((deployment.readyState || deployment.state) !== "READY") {
            throw new Error(`Release deployment is not READY: ${deployment.readyState || deployment.state}`);
          }
          if (deployment.meta?.githubCommitSha !== expected) {
            throw new Error(`Release deployment source mismatch: ${deployment.meta?.githubCommitSha} !== ${expected}`);
          }
          if (deployment.meta?.githubCommitRef !== "homepage-cinematic-recovery") {
            throw new Error(`Release deployment branch mismatch: ${deployment.meta?.githubCommitRef}`);
          }
          NODE

      - name: Move only the permanent review alias to the certified deployment
        run: |
          set -euo pipefail
          curl --fail --silent --show-error \
            -X POST \
            "https://api.vercel.com/v2/deployments/${DEPLOYMENT_ID}/aliases?teamId=${TEAM_ID}" \
            -H "Authorization: Bearer ${VERCEL_TOKEN}" \
            -H "Content-Type: application/json" \
            --data "{\"alias\":\"${PREVIEW_ALIAS}\",\"redirect\":null}" \
            > /tmp/alias.json

          node <<'NODE'
          const fs = require("node:fs");
          const result = JSON.parse(fs.readFileSync("/tmp/alias.json", "utf8"));
          if (result.alias !== process.env.PREVIEW_ALIAS) {
            throw new Error(`Alias assignment returned an unexpected alias: ${result.alias}`);
          }
          console.log(`Permanent review alias now points to ${process.env.DEPLOYMENT_ID}`);
          if (result.oldDeploymentId) console.log(`Replaced stale deployment ${result.oldDeploymentId}`);
          NODE

      - name: Verify alias resolution through the Vercel API
        run: |
          set -euo pipefail
          curl --fail --silent --show-error \
            "https://api.vercel.com/v13/deployments/${PREVIEW_ALIAS}?teamId=${TEAM_ID}" \
            -H "Authorization: Bearer ${VERCEL_TOKEN}" \
            -H "Accept: application/json" \
            > /tmp/alias-target.json

          node <<'NODE'
          const fs = require("node:fs");
          const deployment = JSON.parse(fs.readFileSync("/tmp/alias-target.json", "utf8"));
          if (deployment.id !== process.env.DEPLOYMENT_ID) {
            throw new Error(`Alias resolves to ${deployment.id}, expected ${process.env.DEPLOYMENT_ID}`);
          }
          if (deployment.meta?.githubCommitSha !== process.env.EXPECTED_COMMIT) {
            throw new Error(`Alias commit mismatch: ${deployment.meta?.githubCommitSha}`);
          }
          NODE

      - name: Verify the protected release endpoint when an automation bypass exists
        if: env.VERCEL_AUTOMATION_BYPASS_SECRET != ''
        run: |
          set -euo pipefail
          curl --fail --silent --show-error \
            "https://${PREVIEW_ALIAS}/api/release" \
            -H "x-vercel-protection-bypass: ${VERCEL_AUTOMATION_BYPASS_SECRET}" \
            -H "x-vercel-set-bypass-cookie: true" \
            > /tmp/release.json

          node <<'NODE'
          const fs = require("node:fs");
          const release = JSON.parse(fs.readFileSync("/tmp/release.json", "utf8"));
          if (release.commit !== process.env.EXPECTED_COMMIT) {
            throw new Error(`Protected alias release mismatch: ${release.commit}`);
          }
          if (release.branch !== "homepage-cinematic-recovery" || release.environment !== "preview") {
            throw new Error(`Protected alias runtime mismatch: ${JSON.stringify(release)}`);
          }
          NODE
