name: Generate original Services Authority film

on:
  push:
    branches:
      - services-original-authority-film
    paths:
      - .github/workflows/import-services-authority-film.yml

permissions:
  contents: write

jobs:
  generate-film:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out focused branch
        uses: actions/checkout@v4
        with:
          ref: services-original-authority-film
          fetch-depth: 0

      - name: Prepare image and video tools
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          python -m pip install --disable-pip-version-check --quiet pillow numpy
          ffmpeg -version | head -n 1

      - name: Download the original five-layer keyframe
        env:
          AUTHORITY_IMAGE_URL: "https://photoshop-api.adobe.io/v2/short-url/urn:aaid:ps:US:9e0b83dd-7a7a-4a99-8a4c-23010a62eb82"
        run: |
          set -euo pipefail
          curl --fail --location --retry 4 --retry-all-errors \
            "$AUTHORITY_IMAGE_URL" \
            --output /tmp/bt-services-authority-source.png
          test -s /tmp/bt-services-authority-source.png
          file /tmp/bt-services-authority-source.png | grep -q "PNG image data"

      - name: Direct and render the seamless Authority film
        run: |
          set -euo pipefail
          mkdir -p \
            /tmp/authority-desktop \
            /tmp/authority-mobile \
            public/videos/generated \
            public/images/generated

          python scripts/generate_services_authority_film.py \
            --source /tmp/bt-services-authority-source.png \
            --desktop-dir /tmp/authority-desktop \
            --mobile-dir /tmp/authority-mobile

          ffmpeg -hide_banner -loglevel error -y \
            -framerate 25 -i /tmp/authority-desktop/frame-%04d.jpg \
            -c:v libx264 -preset slow -crf 24 -pix_fmt yuv420p -movflags +faststart -an \
            public/videos/generated/bt-services-authority-layers.mp4

          ffmpeg -hide_banner -loglevel error -y \
            -framerate 25 -i /tmp/authority-mobile/frame-%04d.jpg \
            -c:v libx264 -preset slow -crf 25 -pix_fmt yuv420p -movflags +faststart -an \
            public/videos/generated/bt-services-authority-layers-mobile.mp4

          cp /tmp/authority-desktop/frame-0090.jpg \
            public/images/generated/bt-services-authority-layers-poster.jpg

      - name: Validate the responsive silent media contract
        run: |
          set -euo pipefail
          for file in \
            public/videos/generated/bt-services-authority-layers.mp4 \
            public/videos/generated/bt-services-authority-layers-mobile.mp4 \
            public/images/generated/bt-services-authority-layers-poster.jpg
          do
            test -s "$file"
          done

          python <<'PY'
          import json
          import subprocess
          from pathlib import Path

          expected = {
              Path('public/videos/generated/bt-services-authority-layers.mp4'): (1600, 900),
              Path('public/videos/generated/bt-services-authority-layers-mobile.mp4'): (720, 1280),
          }
          for path, dimensions in expected.items():
              probe = json.loads(subprocess.check_output([
                  'ffprobe', '-v', 'error', '-show_streams', '-show_format',
                  '-of', 'json', str(path)
              ]))
              duration = float(probe['format']['duration'])
              audio = [stream for stream in probe['streams'] if stream.get('codec_type') == 'audio']
              video = [stream for stream in probe['streams'] if stream.get('codec_type') == 'video']
              if not 5.8 <= duration <= 6.2:
                  raise SystemExit(f'{path}: unexpected duration {duration}')
              if audio:
                  raise SystemExit(f'{path}: audio stream found')
              if len(video) != 1:
                  raise SystemExit(f'{path}: expected one video stream')
              actual = (video[0]['width'], video[0]['height'])
              if actual != dimensions:
                  raise SystemExit(f'{path}: expected {dimensions}, found {actual}')
              print(path, duration, actual, path.stat().st_size)
          PY

      - name: Commit the original Authority film
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            public/videos/generated/bt-services-authority-layers.mp4 \
            public/videos/generated/bt-services-authority-layers-mobile.mp4 \
            public/images/generated/bt-services-authority-layers-poster.jpg
          git commit -m "Generate the original Services Authority film"
          git push origin HEAD:services-original-authority-film
