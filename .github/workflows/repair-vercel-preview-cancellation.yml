name: Repair canonical preview build cancellation

on:
  workflow_dispatch:
  push:
    branches:
      - homepage-cinematic-recovery
    paths:
      - ".github/workflows/repair-vercel-preview-cancellation.yml"

permissions:
  contents: write

concurrency:
  group: branding-tatva-vercel-cancellation-repair
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 8

    steps:
      - name: Check out the canonical branch
        uses: actions/checkout@v4
        with:
          ref: homepage-cinematic-recovery
          fetch-depth: 0

      - name: Keep source builds alive through evidence-only follow-up commits
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('node:fs');
          const file = 'vercel.json';
          const config = JSON.parse(fs.readFileSync(file, 'utf8'));
          config.github = {
            ...(config.github || {}),
            autoJobCancelation: false,
          };
          fs.writeFileSync(file, `${JSON.stringify(config, null, 2)}\n`);
          NODE

          git rm -f .github/workflows/repair-vercel-preview-cancellation.yml
          git diff --check
          git status --short

      - name: Commit the permanent preview policy
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Prevent canonical preview builds from being auto-cancelled"
          git fetch origin homepage-cinematic-recovery
          git rebase origin/homepage-cinematic-recovery
          git push origin HEAD:homepage-cinematic-recovery
