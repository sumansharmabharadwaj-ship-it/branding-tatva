name: Shared media release gate

on:
  workflow_dispatch:
  push:
    branches:
      - homepage-cinematic-recovery
    paths:
      - ".github/workflows/shared-media-release-gate.yml"
      - "scripts/shared_footer_media_gate.cjs"
      - "src/sections/Footer/index.tsx"
      - "src/components/SeasonalCalendarPanel.tsx"
      - "public/images/site-footer-peaks-film-v2-poster.jpg"
      - "public/images/site-seasonal-conversation-film-v2-poster.jpg"
      - "public/videos/site-footer-peaks-film-v2.mp4"
      - "public/videos/site-seasonal-conversation-film-v2.mp4"
  pull_request:
    paths:
      - ".github/workflows/shared-media-release-gate.yml"
      - "scripts/shared_footer_media_gate.cjs"
      - "src/sections/Footer/index.tsx"
      - "src/components/SeasonalCalendarPanel.tsx"
      - "public/images/site-footer-peaks-film-v2-poster.jpg"
      - "public/images/site-seasonal-conversation-film-v2-poster.jpg"
      - "public/videos/site-footer-peaks-film-v2.mp4"
      - "public/videos/site-seasonal-conversation-film-v2.mp4"

permissions:
  contents: read

jobs:
  shared-media:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out only the shared release media
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/public/videos/*
            !/public/audio/*
            /public/videos/site-footer-peaks-film-v2.mp4
            /public/videos/site-seasonal-conversation-film-v2.mp4

      - name: Use Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Reject repeated or short-loop footer media
        run: node scripts/shared_footer_media_gate.cjs
