name: Execute Insights waterlight finalizer

on:
  workflow_dispatch:
  push:
    branches:
      - homepage-cinematic-recovery
    paths:
      - "docs/.insights-waterlight-finalizer-trigger-v2"

permissions:
  contents: write

concurrency:
  group: branding-tatva-insights-waterlight-finalizer
  cancel-in-progress: false

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 12

    steps:
      - name: Check out the canonical branch
        uses: actions/checkout@v4
        with:
          ref: homepage-cinematic-recovery
          fetch-depth: 0

      - name: Wait for the repaired asset and install its permanent gate contract
        run: |
          set -euo pipefail

          target="public/images/cinematic-waterlight-poster.jpg"
          report="docs/INSIGHTS_WATERLIGHT_ASSET_REPAIR_2026-08-07.md"

          ready=false
          for attempt in $(seq 1 72); do
            git fetch origin homepage-cinematic-recovery
            git reset --hard origin/homepage-cinematic-recovery
            if [ -s "$target" ] && [ -s "$report" ] && [ "$(file -b --mime-type "$target")" = "image/jpeg" ]; then
              ready=true
              break
            fi
            echo "Waiting for the poster repair (${attempt}/72)"
            sleep 5
          done

          if [ "$ready" != true ]; then
            echo "The repaired poster and its audit record did not become valid in time."
            exit 1
          fi

          node <<'NODE'
          const fs = require('node:fs');
          const workflows = [
            '.github/workflows/insights-authority-gate.yml',
            '.github/workflows/insights-browser-gate.yml',
            '.github/workflows/insights-discovery-gate.yml',
          ];
          const mediaPath = '      - public/images/cinematic-waterlight-poster.jpg';

          for (const file of workflows) {
            let content = fs.readFileSync(file, 'utf8');
            if (!content.includes('public/images/cinematic-waterlight-poster.jpg')) {
              const anchor = '      - next.config.ts';
              if (!content.includes(anchor)) {
                throw new Error(`${file}: next.config.ts path anchor is missing`);
              }
              content = content.replace(anchor, `${mediaPath}\n${anchor}`);
            }
            fs.writeFileSync(file, content);
          }
          NODE

          git rm -f --ignore-unmatch \
            .github/workflows/repair-insights-waterlight-poster.yml \
            .github/workflows/finalize-insights-waterlight-repair.yml \
            .github/workflows/fallback-finalize-insights-waterlight-repair.yml \
            .github/workflows/finalize-insights-waterlight-repair-v2.yml \
            docs/.insights-waterlight-finalizer-trigger \
            docs/.insights-waterlight-finalizer-trigger-v2

          git diff --check
          git status --short

      - name: Commit the exact-head Insights verification trigger
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "The finalizer had already completed; no additional commit is needed."
            exit 0
          fi
          git commit -m "Verify the repaired Insights poster across every gate"
          git fetch origin homepage-cinematic-recovery
          git rebase origin/homepage-cinematic-recovery
          git push origin HEAD:homepage-cinematic-recovery
