name: Insights sitemap, RSS, metadata, and AI discovery gate
run-name: Insights discovery · ${{ github.sha }}

on:
  workflow_dispatch:
  push:
    branches:
      - homepage-cinematic-recovery
    paths:
      - .github/workflows/insights-discovery-gate.yml
      - scripts/insights_discovery_gate.cjs
      - src/app/insights/**
      - src/app/sitemap.ts
      - src/app/robots.ts
      - src/data/**insight**
      - src/data/**article**
      - public/llms.txt
      - package.json
      - pnpm-lock.yaml
      - next.config.ts

permissions:
  contents: read

concurrency:
  group: branding-tatva-insights-discovery
  cancel-in-progress: true

jobs:
  discovery:
    runs-on: ubuntu-latest
    timeout-minutes: 22

    steps:
      - name: Check out the application without the media archive
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/public/videos/*
            !/public/audio/*

      - name: Use Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Activate pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.28.0 --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build the production application
        env:
          NEXT_TELEMETRY_DISABLED: 1
        run: pnpm build

      - name: Start the production server
        env:
          NEXT_TELEMETRY_DISABLED: 1
        run: |
          pnpm start --hostname 127.0.0.1 --port 3000 > /tmp/branding-tatva-insights-discovery.log 2>&1 &
          echo $! > /tmp/branding-tatva-insights-discovery.pid
          for attempt in {1..90}; do
            if curl --fail --silent http://127.0.0.1:3000/insights > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/branding-tatva-insights-discovery.log
          exit 1

      - name: Verify guide routes, topics, sitemap, robots, feeds, metadata, schema, citations, and conversion pathways
        env:
          AUDIT_BASE_URL: http://127.0.0.1:3000
          AUDIT_COMMIT: ${{ github.sha }}
          INSIGHTS_EXPECTED_MIN: 27
          INSIGHTS_EXPECTED_TOPICS: 5
        run: node scripts/insights_discovery_gate.cjs

      - name: Stop the production server
        if: always()
        run: |
          if [ -f /tmp/branding-tatva-insights-discovery.pid ]; then
            kill "$(cat /tmp/branding-tatva-insights-discovery.pid)" || true
          fi
          cat /tmp/branding-tatva-insights-discovery.log || true

      - name: Upload discovery evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: branding-tatva-insights-discovery
          path: insights-discovery-audit/*
          if-no-files-found: warn
          retention-days: 7
