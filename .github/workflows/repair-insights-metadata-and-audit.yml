name: Repair Insights metadata and aggregate the audit

on:
  push:
    branches:
      - homepage-cinematic-recovery
    paths:
      - .github/workflows/repair-insights-metadata-and-audit.yml

permissions:
  contents: write
  actions: write

concurrency:
  group: branding-tatva-insights-metadata-repair
  cancel-in-progress: false

jobs:
  repair:
    if: github.event.head_commit.message == 'Trigger the next Insights metadata repair'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out the exact triggering commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Shorten the verified title and make the gate report every article failure
        run: |
          python - <<'PY'
          from pathlib import Path

          proof_path = Path("src/data/clientProofInsights.ts")
          proof = proof_path.read_text()
          old_title = 'seoTitle: "Case study strategy for service businesses: turn proof into positioning",'
          new_title = 'seoTitle: "Client proof strategy for service-business positioning",'
          if proof.count(old_title) != 1:
              raise SystemExit("The expected client-proof SEO title was not found exactly once.")
          proof_path.write_text(proof.replace(old_title, new_title))

          gate_path = Path("scripts/insights_discovery_gate.cjs")
          gate = gate_path.read_text()
          old_loop = '''  for (let index = 0; index < guideLinks.length; index += 5) {
            const batch = guideLinks.slice(index, index + 5);
            RUN_STATE.articleResults.push(...(await Promise.all(batch.map(auditArticle))));
          }
'''
          new_loop = '''  RUN_STATE.articleFailures = [];
          for (let index = 0; index < guideLinks.length; index += 5) {
            const batch = guideLinks.slice(index, index + 5);
            const auditedBatch = await Promise.all(
              batch.map(async (href) => {
                try {
                  return { article: await auditArticle(href) };
                } catch (error) {
                  return {
                    failure: {
                      href,
                      message: error instanceof Error ? error.message : String(error),
                    },
                  };
                }
              }),
            );

            for (const result of auditedBatch) {
              if (result.article) RUN_STATE.articleResults.push(result.article);
              if (result.failure) RUN_STATE.articleFailures.push(result.failure);
            }
          }

          if (RUN_STATE.articleFailures.length > 0) {
            const details = RUN_STATE.articleFailures
              .map((failure) => `${failure.href}: ${failure.message}`)
              .join("\\n");
            throw new Error(
              `Article discovery failures (${RUN_STATE.articleFailures.length}):\\n${details}`,
            );
          }
'''
          if gate.count(old_loop) != 1:
              raise SystemExit("The expected Insights audit loop was not found exactly once.")
          gate_path.write_text(gate.replace(old_loop, new_loop))
          PY

      - name: Remove this one-use workflow and push the verified repair
        run: |
          set -euo pipefail
          rm -f .github/workflows/repair-insights-metadata-and-audit.yml
          git config user.name "Branding Tatva release repair"
          git config user.email "actions@users.noreply.github.com"
          git add src/data/clientProofInsights.ts scripts/insights_discovery_gate.cjs .github/workflows/repair-insights-metadata-and-audit.yml
          git commit -m "Shorten client-proof metadata and aggregate Insights audit failures"
          git push origin HEAD:homepage-cinematic-recovery

      - name: Dispatch the complete Insights gate on the repaired branch head
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run insights-discovery-gate.yml --ref homepage-cinematic-recovery
