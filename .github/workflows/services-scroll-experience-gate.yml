name: Services scroll experience gate
run-name: Services scroll macOS · ${{ github.sha }}

on:
  workflow_dispatch:
  push:
    branches:
      - services-scroll-experience-v1
    paths:
      - .github/workflows/services-scroll-experience-gate.yml

permissions:
  contents: write

concurrency:
  group: branding-tatva-services-scroll-experience
  cancel-in-progress: true

jobs:
  audit:
    if: github.actor != 'github-actions[bot]'
    runs-on: macos-14
    timeout-minutes: 30

    steps:
      - name: Check out the application without the media archive
        uses: actions/checkout@v4
        with:
          ref: services-scroll-experience-v1
          fetch-depth: 1
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/public/videos/*
            !/public/audio/*

      - name: Repair the scroll-root controller contract
        run: |
          python3 -m py_compile scripts/fix_services_scroll_root_narrowing.py
          python3 scripts/fix_services_scroll_root_narrowing.py
          git diff --check

      - name: Use Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Activate pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.28.0 --activate

      - name: Install dependencies and Chromium
        run: |
          pnpm install --frozen-lockfile
          pnpm add --save-dev --lockfile=false playwright@1.54.2
          pnpm exec playwright install chromium

      - name: Build the production application
        env:
          NEXT_TELEMETRY_DISABLED: 1
        run: pnpm build

      - name: Start the production server
        env:
          NEXT_TELEMETRY_DISABLED: 1
        run: |
          pnpm start --hostname 127.0.0.1 --port 3000 > /tmp/branding-tatva-services-scroll.log 2>&1 &
          echo $! > /tmp/branding-tatva-services-scroll.pid
          for attempt in {1..90}; do
            if curl --fail --silent http://127.0.0.1:3000/services > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/branding-tatva-services-scroll.log
          exit 1

      - name: Audit native control, scene compression, progress, media, and viewports
        env:
          AUDIT_BASE_URL: http://127.0.0.1:3000
          AUDIT_COMMIT: ${{ github.sha }}
        run: node scripts/services_scroll_gate.cjs

      - name: Stop the production server
        if: always()
        run: |
          if [ -f /tmp/branding-tatva-services-scroll.pid ]; then
            kill "$(cat /tmp/branding-tatva-services-scroll.pid)" || true
          fi
          cat /tmp/branding-tatva-services-scroll.log || true

      - name: Upload Services scroll evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: branding-tatva-services-scroll-experience
          path: services-scroll-audit/*
          if-no-files-found: warn
          retention-days: 7

      - name: Remove one-time repair tools
        run: |
          rm scripts/fix_services_scroll_root_narrowing.py
          rm .github/workflows/services-scroll-experience-gate.yml

      - name: Commit the verified Services scroll system
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            src/sections/Services/ServicesScrollExperience.tsx \
            scripts/fix_services_scroll_root_narrowing.py \
            .github/workflows/services-scroll-experience-gate.yml
          git diff --cached --check
          git commit -m "Stabilize the Services scroll director"
          git push origin HEAD:services-scroll-experience-v1
