name: Services scroll-experience gate
run-name: Services scroll compression · ${{ github.sha }}

on:
  workflow_dispatch:
  push:
    branches:
      - homepage-cinematic-recovery
    paths:
      - .github/workflows/services-scroll-experience-gate.yml
      - scripts/services_scroll_experience_gate.cjs
      - src/app/services/layout.tsx
      - src/app/services/ServicesExperienceRuntime.tsx
      - src/app/services/services-scroll-compression.css
      - src/app/services/page.tsx
      - src/sections/Services/ServiceDisciplineExplorer.tsx
      - src/sections/Services/PinnedBrandBuild.tsx
      - src/components/SectionJumpNav.tsx
      - src/components/BackgroundVideo.tsx
      - src/components/PhotoHero.tsx
      - src/hooks/useVideoFadeIn.ts
      - package.json
      - pnpm-lock.yaml
      - next.config.ts

permissions:
  contents: read

concurrency:
  group: branding-tatva-services-scroll-experience
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 24

    steps:
      - name: Check out the application without the media archive
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/public/videos/*
            !/public/audio/*

      - name: Use Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Activate pnpm
        shell: bash
        run: |
          corepack enable
          corepack prepare pnpm@10.28.0 --activate

      - name: Install dependencies and Chromium
        shell: bash
        run: |
          pnpm install --frozen-lockfile
          pnpm add --save-dev --lockfile=false playwright@1.54.2
          pnpm exec playwright install --with-deps chromium

      - name: Build the production application
        env:
          NEXT_TELEMETRY_DISABLED: 1
        run: pnpm build

      - name: Start production server
        env:
          NEXT_TELEMETRY_DISABLED: 1
        shell: bash
        run: |
          pnpm start --hostname 127.0.0.1 --port 3000 > /tmp/services-scroll.log 2>&1 &
          echo $! > /tmp/services-scroll.pid
          for attempt in {1..90}; do
            if curl --fail --silent http://127.0.0.1:3000/services > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/services-scroll.log
          exit 1

      - name: Measure native control, exploration density, and compressed scenes
        env:
          AUDIT_BASE_URL: http://127.0.0.1:3000
          AUDIT_COMMIT: ${{ github.sha }}
        run: node scripts/services_scroll_experience_gate.cjs

      - name: Stop production server
        if: always()
        shell: bash
        run: |
          if [ -f /tmp/services-scroll.pid ]; then
            kill "$(cat /tmp/services-scroll.pid)" || true
          fi
          cat /tmp/services-scroll.log || true

      - name: Upload scroll-experience evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: services-scroll-experience-evidence
          path: services-scroll-audit/*
          if-no-files-found: error
          retention-days: 7
