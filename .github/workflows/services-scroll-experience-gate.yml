name: Services scroll experience gate
run-name: Services scroll · ${{ github.sha }}

on:
  workflow_dispatch:
  push:
    branches:
      - services-scroll-experience-v1
    paths:
      - .github/workflows/services-scroll-experience-gate.yml
      - docs/SERVICES_SCROLL_MAP.md
      - scripts/services_scroll_gate.cjs
      - src/app/services/**
      - src/components/BackgroundVideo.tsx
      - src/components/PhotoHero.tsx
      - src/sections/Services/**
      - src/hooks/**
      - src/data/services.ts
      - package.json
      - pnpm-lock.yaml
      - next.config.ts

permissions:
  contents: read

concurrency:
  group: branding-tatva-services-scroll-experience
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 24

    steps:
      - name: Check out the application without the media archive
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/public/videos/*
            !/public/audio/*

      - name: Use Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Activate pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.28.0 --activate

      - name: Install dependencies
        run: |
          pnpm install --frozen-lockfile
          pnpm add --save-dev --lockfile=false playwright@1.54.2

      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Build the production application
        env:
          NEXT_TELEMETRY_DISABLED: 1
        run: pnpm build

      - name: Start the production server
        env:
          NEXT_TELEMETRY_DISABLED: 1
        run: |
          pnpm start --hostname 127.0.0.1 --port 3000 > /tmp/branding-tatva-services-scroll.log 2>&1 &
          echo $! > /tmp/branding-tatva-services-scroll.pid
          for attempt in {1..90}; do
            if curl --fail --silent http://127.0.0.1:3000/services > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/branding-tatva-services-scroll.log
          exit 1

      - name: Audit native control, scene compression, progress, media, and viewports
        env:
          AUDIT_BASE_URL: http://127.0.0.1:3000
          AUDIT_COMMIT: ${{ github.sha }}
        run: node scripts/services_scroll_gate.cjs

      - name: Stop the production server
        if: always()
        run: |
          if [ -f /tmp/branding-tatva-services-scroll.pid ]; then
            kill "$(cat /tmp/branding-tatva-services-scroll.pid)" || true
          fi
          cat /tmp/branding-tatva-services-scroll.log || true

      - name: Upload Services scroll evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: branding-tatva-services-scroll-experience
          path: services-scroll-audit/*
          if-no-files-found: error
          retention-days: 7
