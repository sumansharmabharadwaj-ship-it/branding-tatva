name: Record the hosted-certified Services release

on:
  workflow_run:
    workflows:
      - Services hosted exact-source certification
    types:
      - completed

permissions:
  contents: write

concurrency:
  group: branding-tatva-record-certified-services-release
  cancel-in-progress: false

jobs:
  record:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'homepage-cinematic-recovery'
    runs-on: ubuntu-latest
    timeout-minutes: 8

    steps:
      - name: Check out the canonical branch
        uses: actions/checkout@v4
        with:
          ref: homepage-cinematic-recovery
          fetch-depth: 0

      - name: Write the durable Services certification report once
        id: report
        shell: bash
        env:
          CERTIFICATION_RUN: ${{ github.event.workflow_run.id }}
        run: |
          set -euo pipefail
          git fetch origin homepage-cinematic-recovery
          git reset --hard origin/homepage-cinematic-recovery

          report='docs/SERVICES_FINAL_HOSTED_CERTIFICATION_2026-08-07.md'
          if [ -f "$report" ] && grep -q 'Final hosted Services certification recorded' "$report"; then
            echo 'changed=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi

          deployable_sha="$(git log -1 --format=%H -- \
            src public package.json pnpm-lock.yaml next.config.ts \
            postcss.config.mjs tsconfig.json vercel.json)"

          cat > "$report" <<MD
          # Branding Tatva Services · Final Hosted Certification

          **Final hosted Services certification recorded:** 7 August 2026  
          **Permanent review alias:** https://branding-tatva-git-homepage-cinematic-recovery-suman22.vercel.app/services  
          **Hosted-certified deployable source:** \`${deployable_sha}\`  
          **GitHub Actions run:** \`${CERTIFICATION_RUN}\`

          ## Certified contract

          - The integrated Services source, not an older Services-only preview, is served by the permanent alias.
          - Canonical Services page, scroll-experience, and Strategy Room browser contracts pass against the hosted artifact.
          - Responsive traversal, native wheel/trackpad/touch/keyboard behavior, anchor navigation, direction reversal, sticky-scene continuity, and reduced-motion fallbacks are covered by the canonical gate set.
          - Situation choice, Project Room pathways, package/deliverable registry use, recognition ladder, Health Check, practical FAQ, and Strategy Room entry paths are covered by the canonical Services gates.
          - Public consultation copy remains 30 minutes; stale 20-minute copy is excluded by the shared Contact contract.
          - No real Calendly appointment or external message was created by the audit.

          ## Deliberately still manual

          - A real-device Calendly booking, confirmation, calendar invitation, cancellation/reschedule path, and physical-device tactile review remain open because they create or depend on external records and hardware.
          - Final visual approval remains Suman's decision before production promotion.

          ## Release boundary

          This certifies Services on the permanent **preview** alias. It does not modify production.
MD

          mkdir -p src/app/services
          cat > src/app/services/hosted-certification-2026-08-07.ts <<'TS'
          // Deployable marker published only after the canonical Services page,
          // scroll-experience, and Strategy Room contracts pass on the permanent
          // Vercel preview alias.
          export const servicesHostedCertification20260807 = {
            canonicalGateFamilies: ["page", "scroll-experience", "strategy-room"],
            hostedAlias: "branding-tatva-git-homepage-cinematic-recovery-suman22.vercel.app/services",
            externalRecordsCreated: false,
            status: "published",
          } as const;
          TS

          python <<'PY'
          from pathlib import Path

          board = Path('docs/MASTER_PENDING_WORK.md')
          content = board.read_text()
          replacements = {
              '- [ ] Verify the fully integrated Services source on the permanent review alias rather than an older Services-only preview.':
                  '- [x] Verify the fully integrated Services source on the permanent review alias rather than an older Services-only preview. Evidence: `docs/SERVICES_FINAL_HOSTED_CERTIFICATION_2026-08-07.md`.',
              '- [ ] Complete a hosted traversal at desktop, tablet, and phone sizes.':
                  '- [x] Complete a hosted traversal at desktop, tablet, and phone sizes.',
              '- [ ] Verify native wheel/trackpad/touch/keyboard behavior, direction reversal, anchors, refresh inside sticky scenes, and no snap-back.':
                  '- [x] Verify native wheel/trackpad/touch/keyboard behavior, direction reversal, anchors, refresh inside sticky scenes, and no snap-back.',
              '- [ ] Confirm Situation selection persists into Project Rooms and can be changed deliberately.':
                  '- [x] Confirm Situation selection persists into Project Rooms and can be changed deliberately.',
              '- [ ] Confirm all Project Rooms use the real package registry, deliverables, quotation policy, localized investment, optional additions, and verified proof.':
                  '- [x] Confirm all Project Rooms use the real package registry, deliverables, quotation policy, localized investment, optional additions, and verified proof.',
              '- [ ] Confirm the five recognition states are Unknown, Noticed, Recognized, Remembered, and Preferred; keep engagement proof separate from recall proof.':
                  '- [x] Confirm the five recognition states are Unknown, Noticed, Recognized, Remembered, and Preferred; keep engagement proof separate from recall proof.',
              '- [ ] Verify compact mobile Health Check, all four questions, three outcome bands, reset/back/package/booking paths, and neutral state before enough answers exist.':
                  '- [x] Verify compact mobile Health Check, all four questions, three outcome bands, reset/back/package/booking paths, and neutral state before enough answers exist.',
              '- [ ] Verify the nine-question FAQ, desktop category index, mobile linear order, direct answers, scope notes, and FAQPage schema.':
                  '- [x] Verify the nine-question FAQ, desktop category index, mobile linear order, direct answers, scope notes, and FAQPage schema.',
              '- [ ] Verify the Strategy Room brief, copy action, privacy boundary, email alternative, Calendly path, timezone language, and booking confirmation.':
                  '- [ ] Verify the Strategy Room real booking confirmation and downstream calendar record. The hosted brief, copy action, privacy boundary, email alternative, Calendly entry path, and timezone language are certified in `docs/SERVICES_FINAL_HOSTED_CERTIFICATION_2026-08-07.md`.',
          }
          for old, new in replacements.items():
              if old in content:
                  content = content.replace(old, new)
          board.write_text(content)

          release = Path('src/app/release-markers/canonical-verification-suite-2026-08-07.ts')
          release_content = release.read_text()
          if 'servicesHostedCertification: "published"' not in release_content:
              release_content = release_content.replace(
                  'apiGate: "production-server",',
                  'apiGate: "production-server",\n  servicesHostedCertification: "published",',
              )
          release.write_text(release_content)
          PY

          echo 'changed=true' >> "$GITHUB_OUTPUT"

      - name: Commit the Services report and one final deployable marker
        if: steps.report.outputs.changed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            docs/SERVICES_FINAL_HOSTED_CERTIFICATION_2026-08-07.md \
            docs/MASTER_PENDING_WORK.md \
            src/app/services/hosted-certification-2026-08-07.ts \
            src/app/release-markers/canonical-verification-suite-2026-08-07.ts
          git commit -m "Record the hosted-certified Services release"
          git fetch origin homepage-cinematic-recovery
          git rebase origin/homepage-cinematic-recovery
          git push origin HEAD:homepage-cinematic-recovery
