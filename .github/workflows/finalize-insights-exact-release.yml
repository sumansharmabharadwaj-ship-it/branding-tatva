name: Finalize the exact 29-guide Insights release
run-name: Finalize Insights · ${{ github.sha }}

on:
  workflow_dispatch:
  push:
    branches:
      - homepage-cinematic-recovery
    paths:
      - .github/workflows/finalize-insights-exact-release.yml
      - public/images/cinematic-waterlight-poster.jpg
      - src/app/insights/**
      - src/app/release-markers/**
      - src/components/InsightCard.tsx
      - src/components/InsightsExplorer.tsx
      - src/data/**Insights.ts
      - src/data/insightLibrary.ts
      - src/data/insights.ts
      - src/data/pillarInsights.ts
      - scripts/insights_authority_gate.cjs
      - scripts/insights_browser_gate.cjs
      - scripts/insights_discovery_gate.cjs
      - scripts/permanent_preview_source_gate.cjs
      - public/llms.txt
      - vercel.json
      - package.json
      - pnpm-lock.yaml
      - next.config.ts

permissions:
  contents: write

concurrency:
  group: branding-tatva-finalize-exact-insights-release
  cancel-in-progress: true

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 52

    steps:
      - name: Check out the newest canonical branch without the media archive
        uses: actions/checkout@v4
        with:
          ref: homepage-cinematic-recovery
          fetch-depth: 0
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/public/videos/*
            !/public/audio/*

      - name: Reset to the newest remote head
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin homepage-cinematic-recovery
          git reset --hard origin/homepage-cinematic-recovery

      - name: Use Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Activate pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.28.0 --activate

      - name: Ensure a valid waterlight poster exists
        shell: bash
        run: |
          set -euo pipefail
          target="public/images/cinematic-waterlight-poster.jpg"
          mkdir -p "$(dirname "$target")"

          if ! command -v ffmpeg >/dev/null 2>&1 || ! command -v ffprobe >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y ffmpeg
          fi

          valid_image() {
            local file="$1"
            [ -s "$file" ] && \
              ffprobe -v error -select_streams v:0 -show_entries stream=width,height \
                -of csv=s=x:p=0 "$file" | grep -Eq '^[0-9]+x[0-9]+$'
          }

          if valid_image "$target"; then
            echo "Existing waterlight poster is valid."
            exit 0
          fi

          materialize() {
            local source_path="$1"
            local destination="$2"
            git show "HEAD:${source_path}" > "$destination"
            if head -n 1 "$destination" | grep -q 'version https://git-lfs.github.com/spec'; then
              rm -f "$destination"
              git lfs install --local
              git lfs pull --include="$source_path" --exclude=""
              cp "$source_path" "$destination"
            fi
          }

          render() {
            local source_path="$1"
            local temp="/tmp/insights-poster-source.${source_path##*.}"
            rm -f "$temp" "$target"
            materialize "$source_path" "$temp"
            case "${source_path,,}" in
              *.mp4|*.webm|*.mov|*.m4v)
                ffmpeg -hide_banner -loglevel error -y -ss 1 -i "$temp" \
                  -frames:v 1 -vf "scale='min(1600,iw)':-2:flags=lanczos" -q:v 3 "$target" \
                  || ffmpeg -hide_banner -loglevel error -y -i "$temp" \
                    -frames:v 1 -vf "scale='min(1600,iw)':-2:flags=lanczos" -q:v 3 "$target"
                ;;
              *.jpg|*.jpeg|*.png|*.webp|*.avif)
                ffmpeg -hide_banner -loglevel error -y -i "$temp" \
                  -frames:v 1 -vf "scale='min(1600,iw)':-2:flags=lanczos" -q:v 3 "$target"
                ;;
              *) return 1 ;;
            esac
            valid_image "$target"
          }

          mapfile -t candidates < <(
            {
              git ls-tree -r --name-only HEAD \
                | grep -Ei '^public/(videos|images)/.*(cinematic.*water.*light|water.*light|light.*water).*\.(mp4|webm|mov|m4v|jpe?g|png|webp|avif)$' \
                | grep -v '^public/images/cinematic-waterlight-poster\.jpg$' || true
              grep -hoE '/images/[A-Za-z0-9._/-]+\.(jpg|jpeg|png|webp|avif)' \
                src/app/insights/page.tsx src/app/insights/'[slug]'/page.tsx 2>/dev/null \
                | sed 's#^/#public/#' || true
            } | awk '!seen[$0]++'
          )

          restored_from=""
          for source_path in "${candidates[@]}"; do
            if git cat-file -e "HEAD:${source_path}" 2>/dev/null && render "$source_path"; then
              restored_from="$source_path"
              break
            fi
          done

          if [ -z "$restored_from" ] || ! valid_image "$target"; then
            echo "Unable to restore a valid waterlight poster from approved repository media." >&2
            exit 1
          fi

          echo "Restored $target from $restored_from"
          ffprobe -v error -select_streams v:0 -show_entries stream=width,height \
            -of csv=s=x:p=0 "$target"

      - name: Seal the deployable source and stop Vercel from cancelling the final preview build
        shell: bash
        run: |
          set -euo pipefail
          cat > src/app/insights/authority-poster-repair-2026-08-07.ts <<'TS'
          // Exact deployable source seal for the canonical 29-guide Insights
          // library after restoring the missing waterlight poster and passing
          // authority, browser, discovery, keyboard, and reduced-motion gates.
          export const insightsWaterlightPosterRepair20260807 = {
            guides: 29,
            topics: 5,
            poster: "/images/cinematic-waterlight-poster.jpg",
            posterState: "valid",
            verification: "authority-browser-discovery",
            hostedAlias: "branding-tatva-git-homepage-cinematic-recovery-suman22.vercel.app",
          } as const;
          TS

          python <<'PY'
          from pathlib import Path
          import json

          marker = Path('src/app/release-markers/canonical-verification-suite-2026-08-07.ts')
          content = marker.read_text()
          if 'insightsPoster: "waterlight-valid"' not in content:
              content = content.replace(
                  'insightsTopics: 5,',
                  'insightsTopics: 5,\n  insightsPoster: "waterlight-valid",\n  insightsCertification: "authority-browser-discovery",',
              )
          marker.write_text(content)

          config_path = Path('vercel.json')
          config = json.loads(config_path.read_text())
          config.setdefault('github', {})['autoJobCancelation'] = False
          config_path.write_text(json.dumps(config, indent=2) + '\n')
          PY

      - name: Install dependencies and Chromium
        run: |
          pnpm install --frozen-lockfile
          pnpm add --save-dev --lockfile=false playwright@1.54.2
          pnpm exec playwright install --with-deps chromium

      - name: Build the exact production source
        env:
          NEXT_TELEMETRY_DISABLED: 1
        run: pnpm build

      - name: Start the exact production server
        env:
          NEXT_TELEMETRY_DISABLED: 1
        run: |
          pnpm start --hostname 127.0.0.1 --port 3000 > /tmp/branding-tatva-final-insights.log 2>&1 &
          echo $! > /tmp/branding-tatva-final-insights.pid
          for attempt in {1..90}; do
            if curl --fail --silent http://127.0.0.1:3000/insights > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/branding-tatva-final-insights.log
          exit 1

      - name: Verify the poster through Next Image itself
        shell: bash
        run: |
          set -euo pipefail
          headers="$(mktemp)"
          image="$(mktemp)"
          curl --fail --silent --show-error \
            -D "$headers" \
            -o "$image" \
            'http://127.0.0.1:3000/_next/image?url=%2Fimages%2Fcinematic-waterlight-poster.jpg&w=1200&q=75'
          grep -Eqi '^content-type: image/' "$headers"
          test -s "$image"
          ffprobe -v error -select_streams v:0 -show_entries stream=width,height \
            -of csv=s=x:p=0 "$image" | grep -Eq '^[0-9]+x[0-9]+$'

      - name: Certify all 29 guides, metadata, schema, routes, and viewports
        env:
          AUDIT_BASE_URL: http://127.0.0.1:3000
          AUDIT_COMMIT: ${{ github.sha }}
          INSIGHTS_EXPECTED_MIN: 29
        run: node scripts/insights_authority_gate.cjs

      - name: Certify archive search, filters, articles, keyboard, and reduced motion
        env:
          AUDIT_BASE_URL: http://127.0.0.1:3000
          AUDIT_COMMIT: ${{ github.sha }}
          INSIGHTS_EXPECTED_GUIDES: 29
        run: node scripts/insights_browser_gate.cjs

      - name: Certify sitemap, feeds, robots, citations, topics, and AI discovery
        env:
          AUDIT_BASE_URL: http://127.0.0.1:3000
          AUDIT_COMMIT: ${{ github.sha }}
          INSIGHTS_EXPECTED_MIN: 29
          INSIGHTS_EXPECTED_TOPICS: 5
        run: node scripts/insights_discovery_gate.cjs

      - name: Stop the local production server
        if: always()
        run: |
          if [ -f /tmp/branding-tatva-final-insights.pid ]; then
            kill "$(cat /tmp/branding-tatva-final-insights.pid)" || true
          fi
          cat /tmp/branding-tatva-final-insights.log || true

      - name: Commit the exact locally certified source
        id: commit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            public/images/cinematic-waterlight-poster.jpg \
            src/app/insights/authority-poster-repair-2026-08-07.ts \
            src/app/release-markers/canonical-verification-suite-2026-08-07.ts \
            vercel.json

          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git commit -m "Finalize the exact 29-guide Insights release"
          git fetch origin homepage-cinematic-recovery
          git rebase origin/homepage-cinematic-recovery
          git push origin HEAD:homepage-cinematic-recovery
          echo "changed=true" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Let the self-triggered exact-head run take over after a source commit
        if: steps.commit.outputs.changed == 'true'
        run: |
          echo "The final source was pushed. Its exact-head run will perform hosted certification."
          exit 0

      - name: Wait for the permanent alias to serve this exact commit
        if: steps.commit.outputs.changed == 'false'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PREVIEW_URL: https://branding-tatva-git-homepage-cinematic-recovery-suman22.vercel.app
          CANONICAL_BRANCH: homepage-cinematic-recovery
          GATE_TIMEOUT_MS: "900000"
          GATE_POLL_MS: "15000"
        run: node scripts/permanent_preview_source_gate.cjs

      - name: Certify the hosted authority inventory and article viewports
        if: steps.commit.outputs.changed == 'false'
        env:
          AUDIT_BASE_URL: https://branding-tatva-git-homepage-cinematic-recovery-suman22.vercel.app
          AUDIT_COMMIT: ${{ steps.commit.outputs.sha }}
          INSIGHTS_EXPECTED_MIN: 29
        run: node scripts/insights_authority_gate.cjs

      - name: Certify hosted archive interaction, representative articles, keyboard, and reduced motion
        if: steps.commit.outputs.changed == 'false'
        env:
          AUDIT_BASE_URL: https://branding-tatva-git-homepage-cinematic-recovery-suman22.vercel.app
          AUDIT_COMMIT: ${{ steps.commit.outputs.sha }}
          INSIGHTS_EXPECTED_GUIDES: 29
        run: node scripts/insights_browser_gate.cjs

      - name: Certify hosted sitemap, feeds, robots, citations, topics, and AI discovery
        if: steps.commit.outputs.changed == 'false'
        env:
          AUDIT_BASE_URL: https://branding-tatva-git-homepage-cinematic-recovery-suman22.vercel.app
          AUDIT_COMMIT: ${{ steps.commit.outputs.sha }}
          INSIGHTS_EXPECTED_MIN: 29
          INSIGHTS_EXPECTED_TOPICS: 5
        run: node scripts/insights_discovery_gate.cjs

      - name: Create an immutable hosted-certification tag
        if: steps.commit.outputs.changed == 'false'
        shell: bash
        env:
          CERTIFIED_SHA: ${{ steps.commit.outputs.sha }}
        run: |
          set -euo pipefail
          short="${CERTIFIED_SHA:0:12}"
          tag="insights-hosted-certified-${short}"
          if git ls-remote --exit-code --tags origin "refs/tags/${tag}" >/dev/null 2>&1; then
            echo "Certification tag ${tag} already exists."
            exit 0
          fi
          git tag -a "$tag" "$CERTIFIED_SHA" -m "29-guide Insights library certified on the permanent Vercel alias"
          git push origin "$tag"

      - name: Upload complete local and hosted evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: branding-tatva-final-insights-${{ steps.commit.outputs.sha || github.sha }}
          path: |
            insights-authority-audit/*
            insights-browser-audit/*
            insights-discovery-audit/*
          if-no-files-found: warn
          retention-days: 14
