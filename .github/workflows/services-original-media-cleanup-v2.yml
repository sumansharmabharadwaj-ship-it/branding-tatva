name: Seal the Services original-media system v2

on:
  push:
    branches:
      - services-original-media-cleanup
    paths:
      - .github/workflows/services-original-media-cleanup-v2.yml

permissions:
  contents: write

concurrency:
  group: services-original-media-cleanup-v2
  cancel-in-progress: true

jobs:
  clean-audit-build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Check out the focused branch
        uses: actions/checkout@v4
        with:
          ref: services-original-media-cleanup
          fetch-depth: 1

      - name: Remove stale stock-era direction and repair source formatting
        run: python scripts/clean_services_media_direction.py

      - name: Install the media inspector
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          ffprobe -version | head -n 1

      - name: Audit every generated Services film and still
        run: python scripts/audit_services_original_media.py --write-report

      - name: Check the cleaned source contract
        run: |
          set -euo pipefail
          ! grep -qi 'Pexels' src/app/services/page.tsx
          ! grep -q 'fungi clip' src/app/services/page.tsx
          ! grep -q 'stream clip' src/app/services/page.tsx
          ! grep -q 'ScrollTrigger.pin' src/app/services/page.tsx
          ! grep -q 'GSAP-pinned' src/app/services/page.tsx
          ! grep -q '^<BackgroundVideo' src/app/services/page.tsx
          ! grep -q '^<DeliverablesCinematicBackdrop' src/app/services/page.tsx
          grep -q 'zero stock-library media paths' docs/SERVICES_ORIGINAL_MEDIA_AUDIT.md
          grep -q '8 responsive silent films' docs/SERVICES_ORIGINAL_MEDIA_AUDIT.md
          grep -q '2 generated material stills' docs/SERVICES_ORIGINAL_MEDIA_AUDIT.md
          git diff --check
          git diff --stat

      - name: Use Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Activate pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.28.0 --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build the Next.js application
        run: pnpm build

      - name: Commit the sealed original-media pass and remove one-time tools
        run: |
          set -euo pipefail
          rm -f \
            .github/workflows/services-original-media-cleanup.yml \
            .github/workflows/services-original-media-cleanup-v2.yml \
            scripts/clean_services_media_direction.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            src/app/services/page.tsx \
            public/videos/generated/README.txt \
            docs/SERVICES_ORIGINAL_MEDIA_AUDIT.md \
            scripts/audit_services_original_media.py \
            scripts/clean_services_media_direction.py \
            .github/workflows/services-original-media-cleanup.yml \
            .github/workflows/services-original-media-cleanup-v2.yml
          git commit -m "Seal the Services original-media system"
          git push origin HEAD:services-original-media-cleanup
