name: Certify the repaired Insights release v2

on:
  workflow_dispatch:
  push:
    branches:
      - homepage-cinematic-recovery
    paths:
      - "docs/.certify-insights-waterlight-release-v2"

permissions:
  contents: write

concurrency:
  group: branding-tatva-insights-release-certifier
  cancel-in-progress: false

jobs:
  certify:
    runs-on: ubuntu-latest
    timeout-minutes: 38

    steps:
      - name: Check out the canonical branch
        uses: actions/checkout@v4
        with:
          ref: homepage-cinematic-recovery
          fetch-depth: 0
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/public/videos/*
            !/public/audio/*

      - name: Wait for the permanent poster contract
        run: |
          set -euo pipefail
          target="public/images/cinematic-waterlight-poster.jpg"
          report="docs/INSIGHTS_WATERLIGHT_ASSET_REPAIR_2026-08-07.md"
          ready=false

          for attempt in $(seq 1 90); do
            git fetch origin homepage-cinematic-recovery
            git reset --hard origin/homepage-cinematic-recovery

            media_filters=0
            for workflow in \
              .github/workflows/insights-authority-gate.yml \
              .github/workflows/insights-browser-gate.yml \
              .github/workflows/insights-discovery-gate.yml; do
              if grep -q 'public/images/cinematic-waterlight-poster.jpg' "$workflow"; then
                media_filters=$((media_filters + 1))
              fi
            done

            if [ -s "$target" ] \
              && [ -s "$report" ] \
              && [ "$(file -b --mime-type "$target")" = "image/jpeg" ] \
              && [ "$media_filters" -eq 3 ]; then
              ready=true
              break
            fi

            echo "Waiting for the permanent Insights media contract (${attempt}/90)"
            sleep 5
          done

          if [ "$ready" != true ]; then
            echo "The repaired poster contract did not become ready in time."
            exit 1
          fi

          git rev-parse HEAD | tee /tmp/insights-certified-source-sha
          sha256sum "$target" | awk '{print $1}' | tee /tmp/insights-certified-poster-sha

      - name: Use Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Activate pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.28.0 --activate

      - name: Install dependencies and Chromium
        run: |
          pnpm install --frozen-lockfile
          pnpm add --save-dev --lockfile=false playwright@1.54.2
          pnpm exec playwright install --with-deps chromium

      - name: Build the production application
        env:
          NEXT_TELEMETRY_DISABLED: 1
        run: pnpm build

      - name: Start the production server
        env:
          NEXT_TELEMETRY_DISABLED: 1
        run: |
          pnpm start --hostname 127.0.0.1 --port 3000 > /tmp/branding-tatva-insights-certifier.log 2>&1 &
          echo $! > /tmp/branding-tatva-insights-certifier.pid
          for attempt in {1..90}; do
            if curl --fail --silent http://127.0.0.1:3000/insights > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/branding-tatva-insights-certifier.log
          exit 1

      - name: Certify responsive archive and representative guides
        env:
          AUDIT_BASE_URL: http://127.0.0.1:3000
          INSIGHTS_EXPECTED_GUIDES: 29
        run: AUDIT_COMMIT="$(cat /tmp/insights-certified-source-sha)" node scripts/insights_browser_gate.cjs

      - name: Certify the complete authority library
        env:
          AUDIT_BASE_URL: http://127.0.0.1:3000
          INSIGHTS_EXPECTED_MIN: 29
        run: AUDIT_COMMIT="$(cat /tmp/insights-certified-source-sha)" node scripts/insights_authority_gate.cjs

      - name: Certify canonical discovery and feeds
        env:
          AUDIT_BASE_URL: http://127.0.0.1:3000
          INSIGHTS_EXPECTED_MIN: 29
          INSIGHTS_EXPECTED_TOPICS: 5
        run: AUDIT_COMMIT="$(cat /tmp/insights-certified-source-sha)" node scripts/insights_discovery_gate.cjs

      - name: Stop the production server
        if: always()
        run: |
          if [ -f /tmp/branding-tatva-insights-certifier.pid ]; then
            kill "$(cat /tmp/branding-tatva-insights-certifier.pid)" || true
          fi
          cat /tmp/branding-tatva-insights-certifier.log || true

      - name: Stamp the deployable source after all three gates pass
        run: |
          set -euo pipefail
          certified_source="$(cat /tmp/insights-certified-source-sha)"
          poster_sha="$(cat /tmp/insights-certified-poster-sha)"
          certificate="docs/INSIGHTS_RELEASE_CERTIFICATE_2026-08-07.md"

          CERTIFIED_SOURCE="$certified_source" POSTER_SHA="$poster_sha" node <<'NODE'
          const fs = require('node:fs');
          const file = 'src/app/release-markers/canonical-verification-suite-2026-08-07.ts';
          let content = fs.readFileSync(file, 'utf8');
          const source = process.env.CERTIFIED_SOURCE;
          const poster = process.env.POSTER_SHA;
          const values = {
            insightsGates: 'browser-authority-discovery-green',
            insightsMedia: 'waterlight-poster-verified',
            insightsCertifiedSource: source,
            insightsPosterSha256: poster,
          };

          for (const [key, value] of Object.entries(values)) {
            const entry = `  ${key}: ${JSON.stringify(value)},`;
            const pattern = new RegExp(`^\\s*${key}:.*$`, 'm');
            if (pattern.test(content)) content = content.replace(pattern, entry);
            else content = content.replace(/\n} as const;\s*$/, `\n${entry}\n} as const;\n`);
          }

          fs.writeFileSync(file, content);
          NODE

          {
            echo '# Insights release certificate'
            echo
            echo '- Certified: 7 August 2026'
            echo "- Exact tested source: \`${certified_source}\`"
            echo '- Canonical library: `29 guides`'
            echo '- Topic hubs: `5`'
            echo '- Browser gate: `passed`'
            echo '- Authority gate: `passed`'
            echo '- Discovery gate: `passed`'
            echo '- Responsive archive search and filters: `passed`'
            echo '- Sourced and unsourced representative guide checks: `passed`'
            echo '- Googlebot image-preview directives: `passed`'
            echo '- Keyboard and reduced-motion checks: `passed`'
            echo '- Canonical feeds, sitemap, robots, schema, citations, and conversion paths: `passed`'
            echo "- Restored poster SHA-256: \`${poster_sha}\`"
            echo
            echo 'The release marker commit is a direct child of the tested source and changes only certification metadata plus temporary-workflow cleanup.'
          } > "$certificate"

          git rm -f --ignore-unmatch \
            .github/workflows/certify-insights-waterlight-release.yml \
            .github/workflows/certify-insights-waterlight-release-v2.yml \
            .github/workflows/repair-insights-waterlight-poster.yml \
            .github/workflows/finalize-insights-waterlight-repair.yml \
            .github/workflows/fallback-finalize-insights-waterlight-repair.yml \
            .github/workflows/finalize-insights-waterlight-repair-v2.yml \
            docs/.insights-waterlight-finalizer-trigger \
            docs/.insights-waterlight-finalizer-trigger-v2 \
            docs/.certify-insights-waterlight-release \
            docs/.certify-insights-waterlight-release-v2

          git diff --check
          git status --short

      - name: Commit the certified preview source
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Certify the complete 29-guide Insights release"
          git fetch origin homepage-cinematic-recovery
          git rebase origin/homepage-cinematic-recovery
          git push origin HEAD:homepage-cinematic-recovery

      - name: Upload consolidated Insights evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: branding-tatva-insights-certified-release-v2
          path: |
            insights-browser-audit/*
            insights-authority-audit/*
            insights-discovery-audit/*
            docs/INSIGHTS_WATERLIGHT_ASSET_REPAIR_2026-08-07.md
          if-no-files-found: warn
          retention-days: 14
