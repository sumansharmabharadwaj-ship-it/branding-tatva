name: Homepage release-gate audit
run-name: Homepage release gate · ${{ github.sha }}

on:
  workflow_dispatch:
  push:
    branches:
      - reimagine-project-moves
    paths:
      - .github/workflows/home-audit-current-pass.yml
      - scripts/home_release_gate.cjs
      - src/app/page.tsx
      - src/app/layout.tsx
      - src/app/home-*.css
      - src/lib/videoVisibility.ts
      - src/sections/Home/**
      - src/sections/Elements/**
      - src/sections/Process/**

permissions:
  contents: read

concurrency:
  group: branding-tatva-homepage-release-gate
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 28

    steps:
      - name: Check out the preview branch
        uses: actions/checkout@v4
        with:
          ref: reimagine-project-moves
          fetch-depth: 1

      - name: Use Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Activate pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.28.0 --activate

      - name: Install project and audit dependencies
        run: |
          pnpm install --frozen-lockfile
          pnpm add --save-dev --lockfile=false playwright@1.54.2

      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Build the production application
        env:
          NEXT_TELEMETRY_DISABLED: 1
        run: pnpm build

      - name: Start the production application
        env:
          NEXT_TELEMETRY_DISABLED: 1
        run: |
          pnpm start --hostname 127.0.0.1 --port 3000 > /tmp/branding-tatva-start.log 2>&1 &
          echo $! > /tmp/branding-tatva-start.pid
          for attempt in {1..90}; do
            if curl --fail --silent http://127.0.0.1:3000/ > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/branding-tatva-start.log
          exit 1

      - name: Audit all chapters, autoplay systems, and required viewports
        env:
          AUDIT_COMMIT: ${{ github.sha }}
        run: node scripts/home_release_gate.cjs

      - name: Stop the application
        if: always()
        run: |
          if [ -f /tmp/branding-tatva-start.pid ]; then
            kill "$(cat /tmp/branding-tatva-start.pid)" || true
          fi

      - name: Upload the release-gate evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: branding-tatva-homepage-release-gate
          path: visual-audit/*
          if-no-files-found: error
          retention-days: 7
