name: Homepage release-gate audit v3
run-name: Homepage release gate v3 · ${{ github.sha }}

on:
  workflow_dispatch:
  push:
    branches:
      - reimagine-project-moves
    paths:
      - .github/workflows/home-audit-current-pass.yml
      - next.config.ts
      - scripts/api_contract_gate.cjs
      - scripts/home_link_integrity.cjs
      - scripts/home_release_gate_v2.cjs
      - src/app/page.tsx
      - src/app/layout.tsx
      - src/app/home-*.css
      - src/app/api/**
      - src/components/AmbientAudio.tsx
      - src/components/BackgroundVideo.tsx
      - src/components/MotionPreference.tsx
      - src/components/PageLoadVeil.tsx
      - src/components/VideoWarden.tsx
      - src/lib/api-protection.ts
      - src/lib/contact-schema.ts
      - src/lib/newsletter-schema.ts
      - src/lib/videoVisibility.ts
      - src/sections/Hero/**
      - src/sections/Home/**
      - src/sections/Elements/**
      - src/sections/Process/**
      - src/sections/FAQ/**
      - public/videos/home-reframe-*.webm

permissions:
  contents: read

concurrency:
  group: branding-tatva-homepage-release-gate-v3
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 28

    steps:
      - name: Check out the exact source revision under review
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/public/videos/*
            /public/videos/home-reframe-hero.webm
            /public/videos/home-reframe-framework.webm
            /public/videos/home-reframe-invitation.webm

      - name: Use Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Activate pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.28.0 --activate

      - name: Install project and audit dependencies
        run: |
          pnpm install --frozen-lockfile
          pnpm add --save-dev --lockfile=false playwright@1.54.2

      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Build the production application
        env:
          NEXT_TELEMETRY_DISABLED: 1
        run: pnpm build

      - name: Start the production application
        env:
          NEXT_TELEMETRY_DISABLED: 1
        run: |
          pnpm start --hostname 127.0.0.1 --port 3000 > /tmp/branding-tatva-start.log 2>&1 &
          echo $! > /tmp/branding-tatva-start.pid
          for attempt in {1..90}; do
            if curl --fail --silent http://127.0.0.1:3000/ > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/branding-tatva-start.log
          exit 1

      - name: Verify homepage CTA, case-study, and anchor destinations
        env:
          AUDIT_BASE_URL: http://127.0.0.1:3000
        run: node scripts/home_link_integrity.cjs

      - name: Verify contact and newsletter route contracts
        env:
          AUDIT_BASE_URL: http://127.0.0.1:3000
        run: node scripts/api_contract_gate.cjs

      - name: Audit chapters, media, controls, interactions, and viewports
        env:
          AUDIT_COMMIT: ${{ github.sha }}
        run: node scripts/home_release_gate_v2.cjs

      - name: Stop the application
        if: always()
        run: |
          if [ -f /tmp/branding-tatva-start.pid ]; then
            kill "$(cat /tmp/branding-tatva-start.pid)" || true
          fi

      - name: Upload final release-gate evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: branding-tatva-homepage-release-gate-v3
          path: visual-audit-v2/*
          if-no-files-found: error
          retention-days: 7
