name: Insights branch verification

on:
  push:
    branches:
      - feat/insights-authority-hub
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: insights-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - name: Check out application source
        uses: actions/checkout@v4
        with:
          filter: blob:none
          sparse-checkout: |
            /src/
            /package.json
            /pnpm-lock.yaml
            /next.config.ts
            /tsconfig.json
            /postcss.config.mjs
            /eslint.config.mjs
            /next-env.d.ts
          sparse-checkout-cone-mode: false

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.15.0 --activate

      - name: Install frozen dependencies
        run: pnpm install --frozen-lockfile

      - name: Type check
        run: pnpm exec tsc --noEmit

      - name: Build Next.js application
        run: pnpm build
