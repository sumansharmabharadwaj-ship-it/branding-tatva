name: Project Room production build
on:
  push:
    branches: [services-project-room-packages-v2]
    paths:
      - .github/workflows/services-project-room-v2-build.yml
      - src/sections/Services/PackageSelector.tsx
      - src/sections/Services/ProjectRoomPackage.tsx
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: corepack enable
      - run: corepack prepare pnpm@10.28.0 --activate
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
        env:
          NEXT_TELEMETRY_DISABLED: 1
