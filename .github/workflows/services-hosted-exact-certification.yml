name: Services hosted exact-source certification
run-name: Services hosted certification · ${{ github.sha }}

on:
  workflow_dispatch:
  push:
    branches:
      - homepage-cinematic-recovery
    paths:
      - .github/workflows/services-hosted-exact-certification.yml
      - .github/workflows/services-page-gate.yml
      - .github/workflows/services-scroll-experience-gate.yml
      - .github/workflows/services-strategy-room-gate.yml
      - scripts/services*.cjs
      - src/app/services/**
      - src/sections/Services/**
      - src/data/services.ts
      - src/data/servicePackages.ts
      - src/data/projects.ts
      - src/app/release-markers/**
      - src/components/**
      - src/layouts/**
      - package.json
      - pnpm-lock.yaml
      - next.config.ts
      - vercel.json

permissions:
  contents: write

concurrency:
  group: branding-tatva-services-hosted-exact-certification
  cancel-in-progress: true

jobs:
  certify-services:
    runs-on: macos-latest
    timeout-minutes: 48

    steps:
      - name: Check out the newest canonical application source without the media archive
        uses: actions/checkout@v4
        with:
          ref: homepage-cinematic-recovery
          fetch-depth: 0
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/public/videos/*
            !/public/audio/*

      - name: Resolve the newest deployable source commit
        id: source
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin homepage-cinematic-recovery
          git reset --hard origin/homepage-cinematic-recovery
          sha="$(git log -1 --format=%H -- \
            src public package.json pnpm-lock.yaml next.config.ts \
            postcss.config.mjs tsconfig.json vercel.json)"
          test -n "$sha"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "Deployable Services source: $sha"

      - name: Use Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Activate pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.28.0 --activate

      - name: Install the Services browser runner
        run: |
          pnpm install --frozen-lockfile
          pnpm add --save-dev --lockfile=false playwright@1.54.2
          pnpm exec playwright install chromium

      - name: Wait for the permanent alias to serve the exact deployable source
        shell: bash
        env:
          EXPECTED_SHA: ${{ steps.source.outputs.sha }}
          EXPECTED_BRANCH: homepage-cinematic-recovery
          PREVIEW_URL: https://branding-tatva-git-homepage-cinematic-recovery-suman22.vercel.app
        run: |
          set -euo pipefail
          node <<'NODE'
          const expectedSha = process.env.EXPECTED_SHA;
          const expectedBranch = process.env.EXPECTED_BRANCH;
          const baseUrl = process.env.PREVIEW_URL.replace(/\/$/, "");
          const deadline = Date.now() + 15 * 60 * 1000;
          function contains(value, needle) {
            if (typeof value === "string") return value.includes(needle);
            if (Array.isArray(value)) return value.some((item) => contains(item, needle));
            if (value && typeof value === "object") {
              return Object.entries(value).some(([key, item]) => contains(key, needle) || contains(item, needle));
            }
            return false;
          }
          while (Date.now() < deadline) {
            try {
              const response = await fetch(`${baseUrl}/api/release`, {
                cache: "no-store",
                headers: { "user-agent": "branding-tatva-services-hosted-certification" },
              });
              const text = await response.text();
              let body;
              try { body = JSON.parse(text); } catch { body = { text }; }
              if (response.ok && contains(body, expectedSha) && contains(body, expectedBranch)) {
                console.log(JSON.stringify({ exactSource: true, expectedSha, body }, null, 2));
                process.exit(0);
              }
              console.log(`Alias not exact yet: status=${response.status}, expected=${expectedSha.slice(0, 12)}`);
            } catch (error) {
              console.log(`Alias probe failed: ${error instanceof Error ? error.message : String(error)}`);
            }
            await new Promise((resolve) => setTimeout(resolve, 15_000));
          }
          throw new Error(`Permanent alias did not serve exact Services source ${expectedSha} within 15 minutes`);
          NODE

      - name: Discover the canonical Services browser contracts
        id: contracts
        shell: bash
        run: |
          set -euo pipefail
          files=(
            .github/workflows/services-page-gate.yml
            .github/workflows/services-scroll-experience-gate.yml
            .github/workflows/services-strategy-room-gate.yml
          )
          mapfile -t scripts < <(
            grep -hoE 'node scripts/[A-Za-z0-9_.-]+\.cjs' "${files[@]}" \
              | awk '{print $2}' \
              | grep -Ei 'services|strategy.room|health|faq|recognition|scroll' \
              | awk '!seen[$0]++'
          )
          if [ "${#scripts[@]}" -eq 0 ]; then
            echo "No canonical Services gate scripts were discovered." >&2
            exit 1
          fi
          printf '%s\n' "${scripts[@]}" | tee /tmp/services-hosted-contracts.txt
          {
            echo 'scripts<<EOF'
            printf '%s\n' "${scripts[@]}"
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Run every canonical Services contract against the hosted alias
        id: matrix
        continue-on-error: true
        shell: bash
        env:
          AUDIT_BASE_URL: https://branding-tatva-git-homepage-cinematic-recovery-suman22.vercel.app
          BASE_URL: https://branding-tatva-git-homepage-cinematic-recovery-suman22.vercel.app
          SITE_URL: https://branding-tatva-git-homepage-cinematic-recovery-suman22.vercel.app
          PREVIEW_URL: https://branding-tatva-git-homepage-cinematic-recovery-suman22.vercel.app
          AUDIT_COMMIT: ${{ steps.source.outputs.sha }}
          HAWK_API_KEY: ""
        run: |
          set -uo pipefail
          failures=()
          : > /tmp/services-hosted-matrix.tsv
          while IFS= read -r script; do
            [ -n "$script" ] || continue
            if [ ! -f "$script" ]; then
              printf '%s\tmissing\n' "$script" | tee -a /tmp/services-hosted-matrix.tsv
              failures+=("$script:missing")
              continue
            fi
            echo "::group::${script}"
            if node "$script"; then
              outcome=success
            else
              outcome=failure
              failures+=("$script:failure")
            fi
            echo "::endgroup::"
            printf '%s\t%s\n' "$script" "$outcome" | tee -a /tmp/services-hosted-matrix.tsv
          done < /tmp/services-hosted-contracts.txt
          if [ "${#failures[@]}" -gt 0 ]; then
            printf 'Services hosted failures: %s\n' "${failures[*]}"
            exit 1
          fi

      - name: Report the complete hosted Services verification matrix
        if: always()
        shell: bash
        env:
          SOURCE_SHA: ${{ steps.source.outputs.sha }}
          MATRIX_OUTCOME: ${{ steps.matrix.outcome }}
        run: |
          set -euo pipefail
          {
            echo "## Hosted Services verification matrix"
            echo
            echo "- Alias: https://branding-tatva-git-homepage-cinematic-recovery-suman22.vercel.app/services"
            echo "- Exact deployable source: \`$SOURCE_SHA\`"
            echo "- Combined outcome: \`$MATRIX_OUTCOME\`"
            echo
            echo "| Contract script | Outcome |"
            echo "|---|---|"
            if [ -f /tmp/services-hosted-matrix.tsv ]; then
              while IFS=$'\t' read -r script outcome; do
                echo "| \`$script\` | $outcome |"
              done < /tmp/services-hosted-matrix.tsv
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          test "$MATRIX_OUTCOME" = success

      - name: Create an immutable hosted Services certification tag
        shell: bash
        env:
          CERTIFIED_SHA: ${{ steps.source.outputs.sha }}
        run: |
          set -euo pipefail
          short="${CERTIFIED_SHA:0:12}"
          tag="services-hosted-certified-${short}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git ls-remote --exit-code --tags origin "refs/tags/${tag}" >/dev/null 2>&1; then
            echo "Certification tag ${tag} already exists."
            exit 0
          fi
          git tag -a "$tag" "$CERTIFIED_SHA" -m "Complete Services journey certified on the permanent Vercel alias"
          git push origin "$tag"

      - name: Upload hosted Services evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: branding-tatva-services-hosted-${{ steps.source.outputs.sha }}
          path: |
            *services*audit/*
            services-*/**/*
            strategy-room-*/**/*
            cinematic-recovery-audit/*
            /tmp/services-hosted-matrix.tsv
          if-no-files-found: warn
          retention-days: 14
