name: Retry a transient Work preview deployment

on:
  workflow_run:
    workflows:
      - Work hosted exact-source certification
    types:
      - completed

permissions:
  actions: read
  contents: write

concurrency:
  group: branding-tatva-retry-work-preview-deployment
  cancel-in-progress: false

jobs:
  inspect-and-retry:
    if: >-
      github.event.workflow_run.conclusion == 'failure' &&
      github.event.workflow_run.head_branch == 'homepage-cinematic-recovery'
    runs-on: ubuntu-latest
    timeout-minutes: 8

    steps:
      - name: Inspect the failed Work contract
        id: inspect
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          FAILED_RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          set -euo pipefail
          response="$(curl --fail --silent --show-error \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H 'Accept: application/vnd.github+json' \
            "https://api.github.com/repos/${GH_REPO}/actions/runs/${FAILED_RUN_ID}/jobs?per_page=100")"

          failed_steps="$(jq -r '[.jobs[].steps[]? | select(.conclusion == "failure") | .name] | unique | .[]' <<<"$response")"
          {
            echo 'failed_steps<<EOF'
            printf '%s\n' "$failed_steps"
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

          retry=false
          while IFS= read -r step; do
            case "$step" in
              'Wait for the permanent alias to serve the exact deployable source') retry=true ;;
            esac
          done <<< "$failed_steps"
          echo "retry=${retry}" >> "$GITHUB_OUTPUT"

      - name: Preserve a genuine Work contract failure
        if: steps.inspect.outputs.retry != 'true'
        run: |
          {
            echo '## No Work deployment retry was issued'
            echo
            echo 'The failure was not the bounded permanent-alias wait. A real Work interaction or accessibility contract must be repaired rather than masked.'
            echo
            echo 'Failed steps:'
            echo '${{ steps.inspect.outputs.failed_steps }}'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Check out the canonical branch for a bounded Work preview retry
        if: steps.inspect.outputs.retry == 'true'
        uses: actions/checkout@v4
        with:
          ref: homepage-cinematic-recovery
          fetch-depth: 0

      - name: Issue at most three source-bearing Work preview retries
        if: steps.inspect.outputs.retry == 'true'
        shell: bash
        env:
          FAILED_RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          set -euo pipefail
          git fetch origin homepage-cinematic-recovery
          git reset --hard origin/homepage-cinematic-recovery

          marker='src/app/release-markers/work-preview-deployment-retry.ts'
          current=0
          if [ -f "$marker" ]; then
            current="$(sed -nE 's/.*attempt: ([0-9]+).*/\1/p' "$marker" | head -n 1)"
            current="${current:-0}"
          fi

          if [ "$current" -ge 3 ]; then
            echo "Three bounded Work preview deployment retries have already been issued." >&2
            exit 1
          fi

          next=$((current + 1))
          cat > "$marker" <<TS
          // Bounded source-bearing retry for a transient Work branch-alias wait.
          // Real Work browser or accessibility failures never write here.
          export const workPreviewDeploymentRetry = {
            attempt: ${next},
            failedRun: "${FAILED_RUN_ID}",
          } as const;
          TS

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$marker"
          git commit -m "Retry the exact Work preview deployment (${next}/3)"
          git fetch origin homepage-cinematic-recovery
          git rebase origin/homepage-cinematic-recovery
          git push origin HEAD:homepage-cinematic-recovery
