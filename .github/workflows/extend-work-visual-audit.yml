name: Extend Work visual evidence matrix

on:
  push:
    branches:
      - homepage-cinematic-recovery
    paths:
      - .github/workflows/extend-work-visual-audit.yml

permissions:
  contents: write
  actions: write

concurrency:
  group: extend-work-visual-audit
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the working branch
        uses: actions/checkout@v4
        with:
          ref: homepage-cinematic-recovery
          fetch-depth: 0

      - name: Use Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Extend, validate, publish, and dispatch
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          for attempt in 1 2 3; do
            git fetch origin homepage-cinematic-recovery
            git reset --hard origin/homepage-cinematic-recovery
            git clean -fd

            echo '' | base64 -d > /tmp/extend-work-audit.py
            python /tmp/extend-work-audit.py
            node --check scripts/work_page_gate_v3.cjs

            git add scripts/work_page_gate_v3.cjs .github/workflows/extend-work-visual-audit.yml
            git commit -m "Capture Work decisions and final conversion scenes"
            if git push origin HEAD:homepage-cinematic-recovery; then
              gh workflow run work-page-gate.yml --ref homepage-cinematic-recovery
              exit 0
            fi
          done

          exit 1
