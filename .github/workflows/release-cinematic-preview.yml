name: Release consolidated site preview

on:
  workflow_dispatch:
    inputs:
      release_note:
        description: Short note for this consolidated preview
        required: false
        default: Consolidated site preview
  push:
    branches:
      - staging/site-integration
    paths:
      - .release/site-preview.txt

permissions:
  contents: write

concurrency:
  group: release-site-preview
  cancel-in-progress: true

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the latest integrated site
        uses: actions/checkout@v4
        with:
          ref: staging/site-integration
          fetch-depth: 0
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/public/videos/*
            !/public/audio/*

      - name: Use Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Activate pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.28.0 --activate

      - name: Synchronize the exact release candidate
        run: |
          set -euo pipefail
          git fetch origin staging/site-integration
          git reset --hard origin/staging/site-integration
          echo "RELEASE_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build the complete application
        run: pnpm build

      - name: Create the one-time deployment commit
        env:
          RELEASE_NOTE: ${{ github.event.inputs.release_note || 'trigger-file release' }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          python <<'PY'
          import json
          import os
          from pathlib import Path

          config_path = Path("vercel.json")
          config = json.loads(config_path.read_text(encoding="utf-8"))
          # Staging disables every automatic Git deployment. The release
          # commit removes that global lock only after the production build
          # has succeeded, so its push creates exactly one Vercel preview.
          config.setdefault("git", {}).pop("deploymentEnabled", None)
          config_path.write_text(json.dumps(config, indent=2) + "\n", encoding="utf-8")

          release_dir = Path(".release")
          release_dir.mkdir(exist_ok=True)
          release_dir.joinpath("site-preview.txt").write_text(
              "source-branch=staging/site-integration\n"
              f"source-commit={os.environ['RELEASE_SHA']}\n"
              f"release-note={os.environ['RELEASE_NOTE']}\n"
              "deployment-enabled=true\n",
              encoding="utf-8",
          )
          PY

          git add vercel.json .release/site-preview.txt
          git commit -m "Release integrated preview ${RELEASE_SHA:0:8}"
          echo "DEPLOY_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Publish the tested deployment commit to Vercel
        run: |
          set -euo pipefail
          git fetch origin preview/cinematic-release || true

          if git show-ref --verify --quiet refs/remotes/origin/preview/cinematic-release; then
            lease_sha="$(git rev-parse refs/remotes/origin/preview/cinematic-release)"
            git push \
              --force-with-lease="refs/heads/preview/cinematic-release:${lease_sha}" \
              origin HEAD:refs/heads/preview/cinematic-release
          else
            git push origin HEAD:refs/heads/preview/cinematic-release
          fi

          echo "Released ${DEPLOY_SHA} from tested source ${RELEASE_SHA}"

      - name: Write release summary
        run: |
          {
            echo "## Consolidated site preview"
            echo
            echo "- Source branch: \`staging/site-integration\`"
            echo "- Tested source commit: \`${RELEASE_SHA}\`"
            echo "- Deployment commit: \`${DEPLOY_SHA}\`"
            echo "- Vercel branch: \`preview/cinematic-release\`"
            echo "- Release note: ${{ github.event.inputs.release_note || 'trigger-file release' }}"
            echo
            echo "Vercel receives one deployment only after the production build succeeds."
          } >> "$GITHUB_STEP_SUMMARY"
