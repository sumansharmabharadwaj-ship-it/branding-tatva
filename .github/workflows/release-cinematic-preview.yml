name: Release consolidated site preview

on:
  workflow_dispatch:
    inputs:
      release_note:
        description: Short note for this consolidated preview
        required: false
        default: Consolidated site preview
  push:
    branches:
      - staging/site-integration
    paths:
      - .release/site-preview.txt

permissions:
  contents: write

concurrency:
  group: release-site-preview
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the latest integrated site
        uses: actions/checkout@v4
        with:
          ref: staging/site-integration
          fetch-depth: 0
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/public/videos/*
            !/public/audio/*

      - name: Use Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Activate pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.28.0 --activate

      - name: Synchronize the exact release candidate
        run: |
          set -euo pipefail
          git fetch origin staging/site-integration
          git reset --hard origin/staging/site-integration
          echo "RELEASE_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build the complete application
        run: pnpm build

      - name: Publish one tested commit to the Vercel release branch
        run: |
          set -euo pipefail
          git fetch origin preview/cinematic-release || true

          if git show-ref --verify --quiet refs/remotes/origin/preview/cinematic-release; then
            lease_sha="$(git rev-parse refs/remotes/origin/preview/cinematic-release)"
            git push \
              --force-with-lease="refs/heads/preview/cinematic-release:${lease_sha}" \
              origin HEAD:refs/heads/preview/cinematic-release
          else
            git push origin HEAD:refs/heads/preview/cinematic-release
          fi

          echo "Released ${RELEASE_SHA} to preview/cinematic-release"

      - name: Write release summary
        run: |
          {
            echo "## Consolidated site preview"
            echo
            echo "- Source branch: \`staging/site-integration\`"
            echo "- Released commit: \`${RELEASE_SHA}\`"
            echo "- Vercel branch: \`preview/cinematic-release\`"
            echo "- Release note: ${{ github.event.inputs.release_note || 'trigger-file release' }}"
            echo
            echo "Vercel receives one deployment only after the production build succeeds."
          } >> "$GITHUB_STEP_SUMMARY"
