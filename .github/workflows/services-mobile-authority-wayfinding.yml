name: Build and verify compact mobile Authority and corner wayfinding
run-name: Services mobile Authority and wayfinding pass 2 · ${{ github.sha }}

on:
  push:
    branches:
      - services-mobile-authority-wayfinding
    paths:
      - .github/workflows/services-mobile-authority-wayfinding.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: branding-tatva-services-mobile-authority-wayfinding
  cancel-in-progress: true

jobs:
  build-audit-commit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Check out the focused branch without the large media archive
        uses: actions/checkout@v4
        with:
          ref: services-mobile-authority-wayfinding
          fetch-depth: 1
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/public/videos/*
            !/public/audio/*

      - name: Install the compact Authority deck and corner guide contract
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path("scripts/apply_services_mobile_authority_wayfinding.py")
          text = path.read_text()
          text = text.replace('            "safe corner",', '            "small corner dial",')
          path.write_text(text)
          PY
          python -m py_compile scripts/apply_services_mobile_authority_wayfinding.py
          python scripts/apply_services_mobile_authority_wayfinding.py
          git diff --check

      - name: Use Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Activate pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.28.0 --activate

      - name: Install dependencies and Chromium
        run: |
          pnpm install --frozen-lockfile
          pnpm add --save-dev --lockfile=false playwright@1.54.2
          pnpm exec playwright install --with-deps chromium

      - name: Build the production application
        env:
          NEXT_TELEMETRY_DISABLED: 1
        run: pnpm build

      - name: Start the production server
        env:
          NEXT_TELEMETRY_DISABLED: 1
        run: |
          pnpm start --hostname 127.0.0.1 --port 3000 > /tmp/services-mobile-authority.log 2>&1 &
          echo $! > /tmp/services-mobile-authority.pid
          for attempt in {1..90}; do
            if curl --fail --silent http://127.0.0.1:3000/services > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/services-mobile-authority.log
          exit 1

      - name: Walk the complete Services journey at three viewports
        env:
          AUDIT_BASE_URL: http://127.0.0.1:3000
        run: node scripts/services_page_gate.cjs

      - name: Stop the production server
        if: always()
        run: |
          if [ -f /tmp/services-mobile-authority.pid ]; then
            kill "$(cat /tmp/services-mobile-authority.pid)" || true
          fi
          cat /tmp/services-mobile-authority.log || true

      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: services-mobile-authority-wayfinding-evidence
          path: services-page-audit/*
          if-no-files-found: warn
          retention-days: 7

      - name: Remove one-time transformer and workflow
        run: |
          rm scripts/apply_services_mobile_authority_wayfinding.py
          rm .github/workflows/services-mobile-authority-wayfinding.yml

      - name: Commit the verified mobile Authority and wayfinding pass
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            src/components/SectionJumpNav.tsx \
            src/sections/Services/MobileAuthorityDeck.tsx \
            src/sections/Services/PinnedBrandBuild.tsx \
            scripts/services_page_gate.cjs \
            scripts/apply_services_mobile_authority_wayfinding.py \
            .github/workflows/services-mobile-authority-wayfinding.yml
          git diff --cached --check
          git commit -m "Compress mobile Authority and shrink the section guide"
          git push origin HEAD:services-mobile-authority-wayfinding
