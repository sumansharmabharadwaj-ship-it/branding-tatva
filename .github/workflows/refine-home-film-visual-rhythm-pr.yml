name: Apply homepage film visual refinement

on:
  pull_request:
    branches:
      - work/home-moodboard-film-2026-08-04

permissions:
  contents: write

jobs:
  refine-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out the refinement pull request
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply the idempotent visual patch
        run: python automation/refine_home_film_visual_rhythm.py

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build the complete site
        run: pnpm build

      - name: Push the verified source refinement
        run: |
          git fetch origin work/home-moodboard-film-2026-08-04
          git reset --mixed origin/work/home-moodboard-film-2026-08-04
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/sections/Home/MoodboardHome.tsx src/sections/Home/MoodboardTatvaFilm.tsx
          if git diff --cached --quiet; then
            echo "The visual refinement is already applied."
            exit 0
          fi
          git commit -m "Refine homepage film typography, contrast, and chapter rhythm"
          git push origin HEAD:work/home-moodboard-film-2026-08-04
