name: Work page final macOS gate
run-name: Work final macOS gate · ${{ github.sha }}

on:
  workflow_dispatch:
  push:
    branches:
      - homepage-cinematic-recovery
    paths:
      - .github/workflows/work-page-final-macos-gate.yml

permissions:
  contents: read

concurrency:
  group: branding-tatva-work-final-macos-gate
  cancel-in-progress: true

jobs:
  verify-work:
    runs-on: macos-latest
    timeout-minutes: 30

    steps:
      - name: Check out the integrated site without the media archive
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/public/videos/*
            !/public/audio/*

      - name: Use Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Activate pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.28.0 --activate

      - name: Install application and browser dependencies
        run: |
          pnpm install --frozen-lockfile
          pnpm add --save-dev --lockfile=false playwright@1.54.2
          pnpm exec playwright install chromium

      - name: Build the production application
        env:
          NEXT_TELEMETRY_DISABLED: 1
        run: pnpm build

      - name: Start the production server
        env:
          NEXT_TELEMETRY_DISABLED: 1
        run: |
          pnpm start --hostname 127.0.0.1 --port 3000 > /tmp/branding-tatva-work-final.log 2>&1 &
          echo $! > /tmp/branding-tatva-work-final.pid
          for attempt in {1..90}; do
            if curl --fail --silent http://127.0.0.1:3000/work > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/branding-tatva-work-final.log
          exit 1

      - name: Verify Work hierarchy, filters, case studies, viewports, and reduced motion
        env:
          AUDIT_BASE_URL: http://127.0.0.1:3000
          AUDIT_COMMIT: ${{ github.sha }}
        run: node scripts/work_page_gate_v3.cjs

      - name: Verify compact mobile narratives and focused dossiers
        env:
          AUDIT_BASE_URL: http://127.0.0.1:3000
        run: node scripts/work_mobile_narrative_gate.cjs

      - name: Stop the production server
        if: always()
        run: |
          if [ -f /tmp/branding-tatva-work-final.pid ]; then
            kill "$(cat /tmp/branding-tatva-work-final.pid)" || true
          fi
          cat /tmp/branding-tatva-work-final.log || true

      - name: Upload final Work visual evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: branding-tatva-work-final-macos-evidence
          path: cinematic-recovery-audit/*
          if-no-files-found: warn
          retention-days: 7
