name: Reimagine preview build gate

on:
  push:
    branches:
      - reimagine-project-moves
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: reimagine-preview-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out application code
        uses: actions/checkout@v4
        with:
          ref: reimagine-project-moves
          fetch-depth: 1

      - name: Apply audited homepage repairs
        run: python scripts/apply_home_audit_sprint.py

      - name: Repair mobile cinema, audit interaction, and chapter framing
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          css = Path("src/app/home-release-candidate.css")
          text = css.read_text()
          before = "    top: 50% !important;\n    bottom: auto !important;\n    transform: translateY(-50%) !important;"
          after = "    top: calc(50% - 3.25rem) !important;\n    bottom: auto !important;\n    transform: none !important;"
          if before in text:
              text = text.replace(before, after, 1)
          css.write_text(text)

          audit = Path("scripts/home_release_gate.cjs")
          text = audit.read_text()
          before = "      await exploreButton.click();\n      await page.getByRole(\"button\", { name: \"Cinema and sound\" }).click();\n      await page.waitForTimeout(450);"
          after = "      await exploreButton.click();\n      await page.waitForTimeout(420);\n      const cinemaEntry = page.getByRole(\"button\", { name: \"Cinema and sound\" });\n      await cinemaEntry.waitFor({ state: \"visible\" });\n      await cinemaEntry.click();\n      await page.waitForTimeout(450);"
          if before in text:
              text = text.replace(before, after, 1)
          audit.write_text(text)

          offset_block = "      const chapter = target.dataset.homeChapter;\n      const offset = [\"process\", \"questions\", \"invitation\"].includes(\n        chapter ?? \"\",\n      )\n        ? 0\n        : -72;"
          for source in [
              Path("src/sections/Home/HomeAutoJourney.tsx"),
              Path("src/sections/Home/ChapterLadder.tsx"),
          ]:
              text = source.read_text()
              if offset_block in text:
                  text = text.replace(offset_block, "      const offset = 0;", 1)
              source.write_text(text)
          PY

      - name: Commit audited homepage repairs
        run: |
          if ! git diff --quiet; then
            git config user.name "Branding Tatva Build Bot"
            git config user.email "actions@users.noreply.github.com"
            git add \
              CLAUDE.md \
              scripts/home_release_gate.cjs \
              src/app/home-release-candidate.css \
              src/components/AmbientAudio.tsx \
              src/sections/Home/ClarityCTA.tsx \
              src/sections/Home/TatvaStrip.tsx \
              src/sections/Home/TatvaSystemLab.tsx \
              src/sections/Home/HomeQuestionsScene.tsx \
              src/sections/Home/HomeSceneBridge.tsx \
              src/sections/Home/HomeAutoJourney.tsx \
              src/sections/Home/ChapterLadder.tsx \
              src/sections/Home/HomeOpeningSignal.tsx
            git commit -m "Keep tablet controls compact and outside the content field"
            git push origin HEAD:reimagine-project-moves
          fi

      - name: Use Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Activate pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.28.0 --activate

      - name: Locate pnpm store
        id: pnpm-cache
        shell: bash
        run: echo "store=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-cache.outputs.store }}
          key: ${{ runner.os }}-pnpm-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build preview
        run: pnpm build
