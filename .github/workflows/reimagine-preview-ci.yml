name: Reimagine preview build gate

on:
  push:
    branches:
      - reimagine-project-moves
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: reimagine-preview-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out application code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /.env.example
            /.eslintrc.json
            /.gitignore
            /next.config.ts
            /package.json
            /pnpm-lock.yaml
            /postcss.config.mjs
            /tsconfig.json
            /src

      - name: Use Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Activate pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.28.0 --activate

      - name: Locate pnpm store
        id: pnpm-cache
        shell: bash
        run: echo "store=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-cache.outputs.store }}
          key: ${{ runner.os }}-pnpm-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build, lint, type-check, and generate all static pages
        env:
          NEXT_TELEMETRY_DISABLED: 1
        run: pnpm build
