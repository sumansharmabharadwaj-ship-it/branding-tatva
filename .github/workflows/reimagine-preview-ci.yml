name: Reimagine preview build gate

on:
  push:
    branches:
      - reimagine-project-moves
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: reimagine-preview-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out application code
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          sparse-checkout: |
            src
          sparse-checkout-cone-mode: true

      - name: Use Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Activate pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.28.0 --activate

      - name: Locate pnpm store
        id: pnpm-cache
        shell: bash
        run: echo "store=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-cache.outputs.store }}
          key: ${{ runner.os }}-pnpm-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Stabilize the Process video reference
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("src/sections/Process/RootSystem.tsx")
          text = path.read_text()
          before = '''  useEffect(() => {
    const currentVideo = videoRef.current;
    if (!currentVideo || prefersReducedMotion) return;

    function syncPlayback() {
      if (inView && !document.hidden) void currentVideo.play().catch(() => {});
      else currentVideo.pause();
    }

    syncPlayback();
    document.addEventListener("visibilitychange", syncPlayback);
    return () => {
      document.removeEventListener("visibilitychange", syncPlayback);
      currentVideo.pause();
    };
  }, [active, inView, prefersReducedMotion]);'''
          after = '''  useEffect(() => {
    if (prefersReducedMotion) return;
    const videoAtEffectStart = videoRef.current;

    function syncPlayback() {
      const video = videoRef.current;
      if (!video) return;
      if (inView && !document.hidden) void video.play().catch(() => {});
      else video.pause();
    }

    syncPlayback();
    document.addEventListener("visibilitychange", syncPlayback);
    return () => {
      document.removeEventListener("visibilitychange", syncPlayback);
      videoAtEffectStart?.pause();
    };
  }, [active, inView, prefersReducedMotion]);'''

          if before not in text:
              raise SystemExit("Expected RootSystem playback block was not found")
          path.write_text(text.replace(before, after, 1))
          PY

      - name: Export the patched Process source
        uses: actions/upload-artifact@v4
        with:
          name: patched-root-system
          path: src/sections/Process/RootSystem.tsx
          if-no-files-found: error
          retention-days: 1

      - name: Build preview
        run: pnpm build
