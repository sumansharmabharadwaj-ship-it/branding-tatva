name: Reimagine preview build gate

on:
  push:
    branches:
      - reimagine-project-moves
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: reimagine-preview-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out application code
        uses: actions/checkout@v4
        with:
          ref: reimagine-project-moves
          fetch-depth: 1

      - name: Apply final homepage polish
        run: python scripts/finalize_home_release_candidate.py

      - name: Commit final homepage polish
        run: |
          if ! git diff --quiet; then
            git config user.name "Branding Tatva Build Bot"
            git config user.email "actions@users.noreply.github.com"
            git add \
              src/app/home-release-candidate.css \
              src/components/AmbientAudio.tsx \
              src/sections/Elements/VerticalUnfold.tsx \
              src/sections/Hero/index.tsx \
              src/sections/Home/HomeAutoJourney.tsx \
              src/sections/Home/ChapterLadder.tsx
            git commit -m "Polish the homepage reading field and compact navigation"
            git push origin HEAD:reimagine-project-moves
          fi

      - name: Use Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Activate pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.28.0 --activate

      - name: Locate pnpm store
        id: pnpm-cache
        shell: bash
        run: echo "store=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-cache.outputs.store }}
          key: ${{ runner.os }}-pnpm-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build preview
        run: pnpm build
