name: Repair Work hero pointer state

on:
  workflow_dispatch:
  push:
    branches:
      - homepage-cinematic-recovery
    paths:
      - ".github/workflows/repair-work-hero-pointer-state.yml"

permissions:
  contents: write

concurrency:
  group: branding-tatva-work-hero-pointer-repair
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 8

    steps:
      - name: Check out the canonical branch
        uses: actions/checkout@v4
        with:
          ref: homepage-cinematic-recovery
          fetch-depth: 0

      - name: Use Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Replace stranded enter leave state with one pointer writer
        run: |
          node <<'NODE'
          const fs = require("node:fs");
          const file = "src/sections/Work/WorkOpening.tsx";
          const before = fs.readFileSync(file, "utf8");

          const observerBlock = `  useEffect(() => {\n    const stage = stageRef.current;\n    if (!stage) return;\n\n    const observer = new IntersectionObserver(\n      ([entry]) => setInView(entry.isIntersecting),\n      { rootMargin: "120px 0px 120px 0px" },\n    );\n    observer.observe(stage);\n    return () => observer.disconnect();\n  }, []);\n\n`;
          const pointerBlock = `${observerBlock}  useEffect(() => {\n    function trackPointer(event: PointerEvent) {\n      // Hover is a mouse and pen concept. Touch selection already pauses\n      // through the explicit project controls and should never inherit a\n      // stranded hover state from a swipe.\n      if (event.pointerType && event.pointerType !== "mouse" && event.pointerType !== "pen") return;\n\n      const stage = stageRef.current;\n      if (!stage) return;\n      const bounds = stage.getBoundingClientRect();\n      const inside =\n        event.clientX >= bounds.left &&\n        event.clientX <= bounds.right &&\n        event.clientY >= bounds.top &&\n        event.clientY <= bounds.bottom;\n      setPointerPaused((current) => (current === inside ? current : inside));\n    }\n\n    function clearPointerPause() {\n      setPointerPaused(false);\n    }\n\n    window.addEventListener("pointermove", trackPointer, { passive: true });\n    window.addEventListener("blur", clearPointerPause);\n    return () => {\n      window.removeEventListener("pointermove", trackPointer);\n      window.removeEventListener("blur", clearPointerPause);\n    };\n  }, []);\n\n`;

          const observerCount = before.split(observerBlock).length - 1;
          if (observerCount !== 1) {
            throw new Error(`Expected one Work hero observer block, found ${observerCount}`);
          }
          let next = before.replace(observerBlock, pointerBlock);

          const handlers = `            onPointerEnter={() => setPointerPaused(true)}\n            onPointerLeave={() => setPointerPaused(false)}\n`;
          const handlerCount = next.split(handlers).length - 1;
          if (handlerCount !== 1) {
            throw new Error(`Expected one Work hero pointer handler pair, found ${handlerCount}`);
          }
          next = next.replace(handlers, "");
          fs.writeFileSync(file, next);
          NODE

      - name: Commit the pointer-state repair
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/sections/Work/WorkOpening.tsx
          git commit -m "Keep Work hero hover state synchronized with the pointer"
          git fetch origin homepage-cinematic-recovery
          git rebase origin/homepage-cinematic-recovery
          git push origin HEAD:homepage-cinematic-recovery
