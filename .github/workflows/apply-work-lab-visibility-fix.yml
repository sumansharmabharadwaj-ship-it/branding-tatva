name: Apply Work Lab visibility fix

on:
  push:
    branches:
      - homepage-cinematic-recovery
    paths:
      - .github/workflows/apply-work-lab-visibility-fix.yml

permissions:
  contents: write
  actions: write

concurrency:
  group: apply-work-lab-visibility-fix
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Check out application without the media archive
        uses: actions/checkout@v4
        with:
          ref: homepage-cinematic-recovery
          fetch-depth: 0
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/public/videos/*
            !/public/audio/*

      - name: Use Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Activate pnpm
        run: corepack enable

      - name: Apply, build, publish, and verify
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          for attempt in 1 2 3; do
            echo "Work Lab visibility attempt ${attempt}"
            git fetch origin homepage-cinematic-recovery
            git reset --hard origin/homepage-cinematic-recovery

            python <<'PY'
          from pathlib import Path
          import re

          path = Path("src/sections/Work/TatvaLab.tsx")
          workflow = Path(".github/workflows/apply-work-lab-visibility-fix.yml")
          text = path.read_text(encoding="utf-8")

          text = text.replace('import { Reveal } from "@/components/Reveal";\n', '')
          text = text.replace(
              '<section className="py-16 sm:py-24" style={{ backgroundColor: WORK.cream }}>',
              '<section className="scroll-mt-28 py-16 sm:py-24" style={{ backgroundColor: WORK.cream }}>',
              1,
          )

          heading_pattern = re.compile(
              r'<Reveal>\s*(<p[^>]*>\s*Branding Tatva Lab\s*</p>[\s\S]*?<h2[^>]*>\s*Concept studies: the method, demonstrated in the open\.\s*</h2>[\s\S]*?<p[^>]*>\s*Independent, speculative brand work\.[\s\S]*?decisions get made\.\s*</p>)\s*</Reveal>',
              re.MULTILINE,
          )
          text, heading_count = heading_pattern.subn(r'<div>\n\1\n</div>', text, count=1)
          if heading_count not in (0, 1):
              raise RuntimeError(f"Unexpected Lab heading match count: {heading_count}")
          if heading_count == 0 and '<Reveal>' in text and 'Branding Tatva Lab' in text:
              raise RuntimeError("Lab heading still appears Reveal-wrapped")

          boundary_pattern = re.compile(
              r'<Reveal delay=\{0\.06\}>\s*([\s\S]*?aria-label="Lab evidence boundary"[\s\S]*?)\s*</Reveal>',
              re.MULTILINE,
          )
          text, boundary_count = boundary_pattern.subn(r'\1', text, count=1)
          if boundary_count not in (0, 1):
              raise RuntimeError(f"Unexpected Lab boundary match count: {boundary_count}")
          if boundary_count == 0 and 'Reveal delay={0.06}' in text and 'Lab evidence boundary' in text:
              raise RuntimeError("Lab evidence boundary still appears Reveal-wrapped")

          replacements = {
              'className="group relative flex min-h-[12rem] w-full sm:min-h-[18rem] flex-col overflow-hidden rounded-[1.4rem] border p-5 text-left':
                  'className="group relative flex min-h-[11rem] w-full flex-col overflow-hidden rounded-[1.4rem] border p-4 text-left sm:min-h-[18rem] sm:p-6',
              'className="mt-4 block text-[0.6rem] font-medium uppercase tracking-[0.15em]"':
                  'className="mt-3 block text-[0.6rem] font-medium uppercase tracking-[0.15em] sm:mt-4"',
              'className="relative mt-auto block pt-5 sm:pt-8"':
                  'className="relative mt-auto block pt-4 sm:pt-8"',
              'className="absolute left-[8%] right-[8%] top-[1.65rem] h-px sm:top-[2.35rem]"':
                  'className="absolute left-[8%] right-[8%] top-[1.35rem] h-px sm:top-[2.35rem]"',
              'className="mt-2 block text-[0.52rem] uppercase tracking-[0.1em]"':
                  'className="mt-2 block text-[0.56rem] uppercase tracking-[0.08em] sm:text-[0.52rem] sm:tracking-[0.1em]"',
              'className="mt-6 scroll-mt-28 overflow-hidden rounded-[1.7rem] border"':
                  'className="mt-6 scroll-mt-32 overflow-hidden rounded-[1.7rem] border"',
          }
          for old, new in replacements.items():
              if old in text:
                  text = text.replace(old, new, 1)

          if 'Branding Tatva Lab' not in text or 'Lab evidence boundary' not in text:
              raise RuntimeError("Lab framing disappeared during the repair")
          if 'min-h-[11rem]' not in text or 'scroll-mt-32' not in text:
              raise RuntimeError("Mobile Lab density or anchor repair was not installed")

          path.write_text(text, encoding="utf-8")
          workflow.unlink()
          print("Installed static Lab framing, denser mobile dossiers, and safer anchor spacing")
          PY

            pnpm install --frozen-lockfile
            pnpm build

            git add src/sections/Work/TatvaLab.tsx .github/workflows/apply-work-lab-visibility-fix.yml
            if git diff --cached --quiet; then
              echo "Work Lab visibility fixes are already present."
              gh workflow run work-page-gate.yml --ref homepage-cinematic-recovery
              exit 0
            fi

            git commit -m "Keep the Work Lab visible during fast scrolls"
            if git push origin HEAD:homepage-cinematic-recovery; then
              gh workflow run work-page-gate.yml --ref homepage-cinematic-recovery
              echo "Work Lab fixes published and Work gate dispatched."
              exit 0
            fi

            echo "Branch moved during verification; replaying on the newest head."
          done

          exit 1
