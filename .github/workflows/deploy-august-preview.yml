name: Deploy one controlled august preview

on:
  push:
    branches:
      - august-8-isolated
    paths:
      - vercel-preview-release.json

permissions:
  contents: write
  statuses: read

concurrency:
  group: deploy-one-controlled-august-preview
  cancel-in-progress: false

jobs:
  deploy-preview:
    if: contains(github.event.head_commit.message, '[deploy]')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      REQUIRED_ANCESTOR: 839f37cf0fbb35f290b2fd70d396ab7037f65268

    steps:
      - name: Check out the exact release source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          filter: blob:none

      - name: Validate the controlled release contract
        id: release
        shell: bash
        run: |
          set -euo pipefail

          source_sha="$(git rev-parse HEAD)"
          git merge-base --is-ancestor "$REQUIRED_ANCESTOR" "$source_sha"

          release="$(node -p "require('./vercel-preview-release.json').release")"
          message="$(git log -1 --format=%B)"
          if [[ "$message" != *"[deploy]"* ]] || [[ "$message" != *"[release:${release}]"* ]]; then
            echo "The source commit must contain [deploy] and [release:${release}]." >&2
            exit 1
          fi

          echo "source_sha=${source_sha}" >> "$GITHUB_OUTPUT"
          echo "release=${release}" >> "$GITHUB_OUTPUT"

      - name: Enable one Git integrated preview
        id: enable
        shell: bash
        env:
          SOURCE_SHA: ${{ steps.release.outputs.source_sha }}
          RELEASE: ${{ steps.release.outputs.release }}
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin "$GITHUB_REF_NAME"
          git switch -C "$GITHUB_REF_NAME" "origin/$GITHUB_REF_NAME"

          git merge-base --is-ancestor "$SOURCE_SHA" HEAD
          current_release="$(node -p "require('./vercel-preview-release.json').release")"
          if [ "$current_release" != "$RELEASE" ]; then
            echo "Release ${RELEASE} is stale because the branch now declares release ${current_release}." >&2
            exit 1
          fi

          node <<'NODE'
          const fs = require("node:fs");
          const file = "vercel.json";
          const config = JSON.parse(fs.readFileSync(file, "utf8"));
          config.git ??= {};
          config.git.deploymentEnabled ??= {};
          config.git.deploymentEnabled["august-8-isolated"] = true;
          fs.writeFileSync(file, `${JSON.stringify(config, null, 2)}\n`);
          NODE

          git add vercel.json
          git commit --allow-empty -m "Request release ${RELEASE} through Git integration [deploy] [release:${RELEASE}]"
          git push origin "HEAD:${GITHUB_REF_NAME}"
          echo "enable_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Wait for Vercel to finish
        id: wait
        shell: bash
        env:
          ENABLE_SHA: ${{ steps.enable.outputs.enable_sha }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          for attempt in $(seq 1 120); do
            curl --fail --silent --show-error \
              --url "https://api.github.com/repos/${GITHUB_REPOSITORY}/commits/${ENABLE_SHA}/status" \
              --header "Authorization: Bearer ${GITHUB_TOKEN}" \
              --header "Accept: application/vnd.github+json" \
              --header "X-GitHub-Api-Version: 2022-11-28" \
              > /tmp/vercel-commit-status.json

            state="$(node -e 'const x=require("/tmp/vercel-commit-status.json"); const s=x.statuses?.find((item)=>item.context==="Vercel"); process.stdout.write(s?.state || "waiting")')"
            target_url="$(node -e 'const x=require("/tmp/vercel-commit-status.json"); const s=x.statuses?.find((item)=>item.context==="Vercel"); process.stdout.write(s?.target_url || "")')"
            echo "Vercel status for ${ENABLE_SHA}: ${state}"

            if [ "$state" = "success" ]; then
              {
                echo "## Controlled august preview"
                echo
                echo "- Source: \`${ENABLE_SHA}\`"
                echo "- Inspector: ${target_url}"
                echo "- Branch alias: https://branding-tatva-git-august-8-isolated-suman22.vercel.app/"
                echo "- Target: preview only"
                echo "- Status: READY"
              } >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi

            if [ "$state" = "failure" ] || [ "$state" = "error" ]; then
              echo "Vercel reported ${state} for ${ENABLE_SHA}." >&2
              exit 1
            fi

            sleep 6
          done

          echo "Vercel did not finish within 12 minutes." >&2
          exit 1

      - name: Return the branch to controlled mode
        if: always() && steps.enable.outputs.enable_sha != ''
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          for attempt in $(seq 1 5); do
            git fetch origin "$GITHUB_REF_NAME"
            git rebase "origin/$GITHUB_REF_NAME"

            node <<'NODE'
            const fs = require("node:fs");
            const file = "vercel.json";
            const config = JSON.parse(fs.readFileSync(file, "utf8"));
            config.git ??= {};
            config.git.deploymentEnabled ??= {};
            config.git.deploymentEnabled["august-8-isolated"] = false;
            fs.writeFileSync(file, `${JSON.stringify(config, null, 2)}\n`);
          NODE

            if ! git diff --quiet -- vercel.json; then
              git add vercel.json
              git commit -m "Return august preview to controlled mode"
            fi

            if git push origin "HEAD:${GITHUB_REF_NAME}"; then
              exit 0
            fi
          done

          echo "Could not return august-8-isolated to controlled deployment mode." >&2
          exit 1
