name: Deploy one controlled august preview

on:
  workflow_dispatch:
    inputs:
      release:
        description: Current controlled release number to request or retry
        required: true
        type: string
  push:
    branches:
      - august-8-isolated
    paths:
      - vercel-preview-release.json

permissions:
  contents: write
  statuses: write

concurrency:
  group: deploy-one-controlled-august-preview
  cancel-in-progress: false

jobs:
  deploy-preview:
    if: github.ref == 'refs/heads/august-8-isolated' && (github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[deploy]'))
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      REQUIRED_ANCESTOR: 839f37cf0fbb35f290b2fd70d396ab7037f65268

    steps:
      - name: Check out the exact release source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          filter: blob:none

      - name: Validate the controlled release contract
        id: release
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          REQUESTED_RELEASE: ${{ inputs.release }}
        run: |
          set -euo pipefail

          source_sha="$(git rev-parse HEAD)"
          git merge-base --is-ancestor "$REQUIRED_ANCESTOR" "$source_sha"

          release="$(node -p "require('./vercel-preview-release.json').release")"
          message="$(git log -1 --format=%B)"
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            if [ "$REQUESTED_RELEASE" != "$release" ]; then
              echo "Requested release ${REQUESTED_RELEASE} differs from current release ${release}." >&2
              exit 1
            fi
          elif [[ "$message" != *"[deploy]"* ]] || [[ "$message" != *"[release:${release}]"* ]]; then
            echo "The source commit must contain [deploy] and [release:${release}]." >&2
            exit 1
          fi

          echo "source_sha=${source_sha}" >> "$GITHUB_OUTPUT"
          echo "release=${release}" >> "$GITHUB_OUTPUT"

      - name: Report preview request on the release source
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.repos.createCommitStatus({
              ...context.repo,
              sha: context.sha,
              context: 'Controlled preview',
              state: 'pending',
              description: 'Waiting for the controlled preview trigger and Vercel result.',
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            });

      - name: Respect the Vercel deployment cooldown
        id: cooldown
        uses: actions/github-script@v7
        with:
          script: |
            const { checkCooldown } = require('./scripts/vercel_preview_cooldown.cjs');
            const result = await checkCooldown({ github, ...context.repo });
            if (result.blocked) {
              core.setOutput('blocked', 'true');
              core.setOutput('retry_after', result.retryAfter);
              core.summary.addHeading('Vercel cooldown: no deployment requested');
              core.summary.addRaw(`Provider response: ${result.reason}\n\n`);
              core.summary.addRaw(`Earliest permitted retry: ${result.retryAfter}. This is a conservative cooldown, not a guarantee of available quota.\n`);
              await core.summary.write();
              core.setFailed(`Vercel cooldown until ${result.retryAfter}; the preview branch remains disabled.`);
            }

      - name: Check the previous Vercel result before requesting a build
        id: preflight
        uses: actions/github-script@v7
        env:
          RELEASE: ${{ steps.release.outputs.release }}
        with:
          script: |
            const { preflight } = require('./scripts/vercel_preview_status.cjs');
            await preflight({ github, context, core, branch: context.ref.replace('refs/heads/', ''), release: process.env.RELEASE });

      - name: Set up pnpm for the delivery check
        if: steps.preflight.outputs.reuse_sha == ''
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Set up Node.js for the delivery check
        if: steps.preflight.outputs.reuse_sha == ''
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Enable one Git integrated preview
        if: steps.preflight.outputs.reuse_sha == ''
        id: enable
        shell: bash
        env:
          SOURCE_SHA: ${{ steps.release.outputs.source_sha }}
          RELEASE: ${{ steps.release.outputs.release }}
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin "$GITHUB_REF_NAME"
          git switch -C "$GITHUB_REF_NAME" "origin/$GITHUB_REF_NAME"

          git merge-base --is-ancestor "$SOURCE_SHA" HEAD
          current_release="$(node -p "require('./vercel-preview-release.json').release")"
          if [ "$current_release" != "$RELEASE" ]; then
            echo "Release ${RELEASE} is stale because the branch now declares release ${current_release}." >&2
            exit 1
          fi

          # Read the current branch's ledger after waiting for concurrency.
          # Another request may have recorded a newer rejection in the meantime.
          node <<'NODE'
          const { readRecord, cooldownForStatus } = require('./scripts/vercel_preview_cooldown.cjs');
          const cooldown = cooldownForStatus(readRecord()?.status);
          if (cooldown?.blocked) throw new Error(`Vercel cooldown until ${cooldown.retryAfter}; deployment stays disabled.`);
          NODE

          # Check the exact branch contents used by the trigger, including
          # any changes that arrived after the release request was queued.
          # A failed install or test exits before deployment is enabled.
          pnpm install --frozen-lockfile --ignore-scripts
          node scripts/contact_delivery_gate.mjs

          node <<'NODE'
          const fs = require("node:fs");
          const file = "vercel.json";
          const config = JSON.parse(fs.readFileSync(file, "utf8"));
          config.git ??= {};
          config.git.deploymentEnabled ??= {};
          config.git.deploymentEnabled["august-8-isolated"] = true;
          fs.writeFileSync(file, `${JSON.stringify(config, null, 2)}\n`);
          NODE

          git add vercel.json
          git commit --allow-empty -m "Request release ${RELEASE} through Git integration [deploy] [release:${RELEASE}]"
          git push origin "HEAD:${GITHUB_REF_NAME}"
          echo "enable_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Close the Git deployment trigger before waiting
        id: close
        if: always() && steps.enable.outputs.enable_sha != ''
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          for attempt in $(seq 1 5); do
            git fetch origin "$GITHUB_REF_NAME"
            git rebase "origin/$GITHUB_REF_NAME"

            node <<'NODE'
            const fs = require("node:fs");
            const file = "vercel.json";
            const config = JSON.parse(fs.readFileSync(file, "utf8"));
            config.git ??= {};
            config.git.deploymentEnabled ??= {};
            config.git.deploymentEnabled["august-8-isolated"] = false;
            fs.writeFileSync(file, `${JSON.stringify(config, null, 2)}\n`);
          NODE

            if ! git diff --quiet -- vercel.json; then
              git add vercel.json
              git commit -m "Return august preview to controlled mode"
            fi

            if git push origin "HEAD:${GITHUB_REF_NAME}"; then
              exit 0
            fi
          done

          echo "Could not return august-8-isolated to controlled deployment mode." >&2
          exit 1

      - name: Wait for Vercel to finish
        id: wait
        if: steps.enable.outputs.enable_sha != ''
        uses: actions/github-script@v7
        env:
          ENABLE_SHA: ${{ steps.enable.outputs.enable_sha }}
          SOURCE_SHA: ${{ steps.release.outputs.source_sha }}
        with:
          script: |
            const { waitForVercel } = require('./scripts/vercel_preview_status.cjs');
            const fs = require('node:fs');
            await waitForVercel({ github, context, core, trigger: process.env.ENABLE_SHA, source: process.env.SOURCE_SHA,
              onStatus: data => fs.writeFileSync('/tmp/vercel-commit-status.json', JSON.stringify(data)),
            });

      - name: Refresh the permanent preview alias when API credentials are available
        id: alias
        if: steps.wait.outputs.vercel_state == 'success' || steps.preflight.outputs.reuse_sha != ''
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          ENABLE_SHA: ${{ steps.enable.outputs.enable_sha || steps.preflight.outputs.reuse_sha }}
        run: |
          node --input-type=module <<'NODE'
          // Use only the existing CI credential. Git integration can deploy
          // without it, but the connected app cannot reassign a pinned alias.
          const token = process.env.VERCEL_TOKEN;
          if (!token) {
            console.log('::notice::Preview is READY. Permanent alias reassignment requires the existing VERCEL_TOKEN repository secret, which is not configured.');
            process.exit(0);
          }
          const team = 'team_Y7dQ5jNk61chQvy2A92AEyTt';
          const project = 'prj_oqWzTWCHURqzPAdpjXv3b7cubJwJ';
          const alias = 'branding-tatva-git-august-8-isolated-suman22.vercel.app';
          async function request(path, options = {}) {
            const response = await fetch(`https://api.vercel.com${path}`, {
              ...options,
              headers: { Authorization: `Bearer ${token}`, 'Content-Type': 'application/json' },
              signal: AbortSignal.timeout(30000),
            });
            if (!response.ok) throw new Error(`Vercel alias request returned HTTP ${response.status}.`);
            return response.json();
          }
          const list = await request(`/v6/deployments?teamId=${team}&projectId=${project}&limit=20`);
          const deployment = list.deployments?.find(item =>
            item.meta?.githubCommitSha === process.env.ENABLE_SHA &&
            item.meta?.githubCommitRef === 'august-8-isolated' &&
            item.state === 'READY' && item.target !== 'production'
          );
          if (!deployment) throw new Error('Exact READY preview trigger was not found; alias left unchanged.');
          const result = await request(`/v2/deployments/${deployment.uid || deployment.id}/aliases?teamId=${team}`, {
            method: 'POST', body: JSON.stringify({ alias }),
          });
          if (result.alias !== alias) throw new Error('Vercel did not confirm the requested preview alias.');
          console.log(`Permanent preview alias assigned to ${process.env.ENABLE_SHA}.`);
          NODE

      - name: Return the branch to controlled mode
        id: cleanup
        if: always() && steps.enable.outputs.enable_sha != ''
        shell: bash
        env:
          ENABLE_SHA: ${{ steps.enable.outputs.enable_sha }}
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          for attempt in $(seq 1 5); do
            git fetch origin "$GITHUB_REF_NAME"
            git rebase "origin/$GITHUB_REF_NAME"

            node <<'NODE'
            const fs = require("node:fs");
            const file = "vercel.json";
            const config = JSON.parse(fs.readFileSync(file, "utf8"));
            config.git ??= {};
            config.git.deploymentEnabled ??= {};
            config.git.deploymentEnabled["august-8-isolated"] = false;
            fs.writeFileSync(file, `${JSON.stringify(config, null, 2)}\n`);
            const statusFile = '/tmp/vercel-commit-status.json';
            if (fs.existsSync(statusFile)) {
              try {
                const { recordRejection } = require('./scripts/vercel_preview_cooldown.cjs');
                recordRejection(JSON.parse(fs.readFileSync(statusFile, 'utf8')), process.env.ENABLE_SHA);
              } catch {
                console.warn('Could not record a newer cooldown; preserve the existing ledger and disable the preview branch.');
              }
            }
          NODE

            if ! git diff --quiet -- vercel.json vercel-preview-cooldown.json; then
              git add vercel.json vercel-preview-cooldown.json
              git commit -m "Return august preview to controlled mode"
            fi

            if git push origin "HEAD:${GITHUB_REF_NAME}"; then
              exit 0
            fi
          done

          echo "Could not return august-8-isolated to controlled deployment mode." >&2
          exit 1

      - name: Report preview result on the release source
        if: always()
        uses: actions/github-script@v7
        env:
          VERCEL_STATE: ${{ steps.wait.outputs.vercel_state || steps.preflight.outputs.vercel_state }}
          VERCEL_URL: ${{ steps.wait.outputs.target_url || steps.preflight.outputs.target_url }}
          VERCEL_DESCRIPTION: ${{ steps.wait.outputs.description || steps.preflight.outputs.description }}
          REUSE_SHA: ${{ steps.preflight.outputs.reuse_sha }}
          ALIAS_OUTCOME: ${{ steps.alias.outcome }}
          ENABLE_SHA: ${{ steps.enable.outputs.enable_sha }}
          CLEANUP_OUTCOME: ${{ steps.cleanup.outcome }}
          COOLDOWN_BLOCKED: ${{ steps.cooldown.outputs.blocked }}
          RETRY_AFTER: ${{ steps.cooldown.outputs.retry_after }}
        with:
          script: |
            const observed = process.env.VERCEL_STATE;
            const trigger = process.env.ENABLE_SHA || '';
            const cleanupIncomplete = Boolean(trigger) && process.env.CLEANUP_OUTCOME !== 'success';
            const aliasFailed = process.env.ALIAS_OUTCOME === 'failure';
            const state = cleanupIncomplete || aliasFailed
              ? 'error'
              : ['success', 'failure', 'error'].includes(observed) ? observed : 'error';
            const description = process.env.COOLDOWN_BLOCKED === 'true'
              ? `Vercel cooldown until ${process.env.RETRY_AFTER}; no deployment requested.`
              : cleanupIncomplete
              ? `Controlled-mode cleanup unconfirmed; Vercel ${observed || 'result unavailable'}.`
              : aliasFailed
                ? 'Preview built, but permanent alias assignment failed; inspect the workflow.'
                : observed === 'success'
                ? `Preview ready; deployment trigger ${(trigger || process.env.REUSE_SHA).slice(0, 8)}.`
                : observed === 'failure' || observed === 'error'
                  ? (process.env.VERCEL_DESCRIPTION || `Vercel reported ${observed}; trigger ${trigger.slice(0, 8)}.`)
                  : trigger
                    ? 'Preview result unconfirmed: status polling failed, timed out, or was cancelled.'
                    : 'Preview request failed before a deployment trigger was recorded.';
            const workflowUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            await github.rest.repos.createCommitStatus({
              ...context.repo,
              sha: context.sha,
              context: 'Controlled preview',
              state,
              description: description.slice(0, 140),
              target_url: cleanupIncomplete || aliasFailed ? workflowUrl : process.env.VERCEL_URL || workflowUrl,
            });
