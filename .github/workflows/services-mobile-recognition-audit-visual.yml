name: Verify the anchored mobile Recognition Audit composition
run-name: Services Recognition Audit composition pass 2 · ${{ github.sha }}

on:
  push:
    branches:
      - services-mobile-recognition-audit
    paths:
      - .github/workflows/services-mobile-recognition-audit-visual.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: branding-tatva-services-mobile-recognition-audit-visual
  cancel-in-progress: true

jobs:
  build-audit-commit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Check out the focused branch without the large media archive
        uses: actions/checkout@v4
        with:
          ref: services-mobile-recognition-audit
          fetch-depth: 1
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/public/videos/*
            !/public/audio/*

      - name: Refine the mobile audit frame and position contract
        run: |
          python -m py_compile scripts/refine_services_mobile_recognition_audit.py
          python scripts/refine_services_mobile_recognition_audit.py
          git diff --check

      - name: Use Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Activate pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.28.0 --activate

      - name: Install dependencies and Chromium
        run: |
          pnpm install --frozen-lockfile
          pnpm add --save-dev --lockfile=false playwright@1.54.2
          pnpm exec playwright install --with-deps chromium

      - name: Build the production application
        env:
          NEXT_TELEMETRY_DISABLED: 1
        run: pnpm build

      - name: Start the production server
        env:
          NEXT_TELEMETRY_DISABLED: 1
        run: |
          pnpm start --hostname 127.0.0.1 --port 3000 > /tmp/services-recognition-audit-visual.log 2>&1 &
          echo $! > /tmp/services-recognition-audit-visual.pid
          for attempt in {1..90}; do
            if curl --fail --silent http://127.0.0.1:3000/services > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/services-recognition-audit-visual.log
          exit 1

      - name: Walk the complete Services journey at three viewports
        env:
          AUDIT_BASE_URL: http://127.0.0.1:3000
        run: node scripts/services_page_gate.cjs

      - name: Stop the production server
        if: always()
        run: |
          if [ -f /tmp/services-recognition-audit-visual.pid ]; then
            kill "$(cat /tmp/services-recognition-audit-visual.pid)" || true
          fi
          cat /tmp/services-recognition-audit-visual.log || true

      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: services-mobile-recognition-audit-visual-evidence
          path: services-page-audit/*
          if-no-files-found: warn
          retention-days: 7

      - name: Remove one-time refinement tools
        run: |
          rm scripts/refine_services_mobile_recognition_audit.py
          rm .github/workflows/services-mobile-recognition-audit-visual.yml

      - name: Commit the verified anchored audit desk
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            src/app/services/page.tsx \
            src/sections/Services/RecognitionAudit.tsx \
            scripts/services_page_gate.cjs \
            scripts/refine_services_mobile_recognition_audit.py \
            .github/workflows/services-mobile-recognition-audit-visual.yml
          git diff --cached --check
          git commit -m "Anchor the mobile Recognition Audit below the header"
          git push origin HEAD:services-mobile-recognition-audit
