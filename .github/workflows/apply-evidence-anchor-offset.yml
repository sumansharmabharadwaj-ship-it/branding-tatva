name: Apply evidence anchor offset

on:
  push:
    branches:
      - reimagine-project-moves
    paths:
      - .github/workflows/apply-evidence-anchor-offset.yml

permissions:
  contents: write

jobs:
  patch-anchor:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out the preview branch
        uses: actions/checkout@v4
        with:
          ref: reimagine-project-moves
          fetch-depth: 1
          sparse-checkout: src
          sparse-checkout-cone-mode: true

      - name: Keep the evidence heading below the fixed header
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("src/sections/Home/EvidenceWall.tsx")
          text = path.read_text()
          before = 'className="mt-3 font-display text-display-sm font-normal leading-[1.05] text-ivory lg:text-display-md"'
          after = 'className="scroll-mt-28 mt-3 font-display text-display-sm font-normal leading-[1.05] text-ivory lg:text-display-md"'

          if before not in text:
              raise SystemExit("Expected evidence heading class was not found")
          path.write_text(text.replace(before, after, 1))
          PY

      - name: Commit the source change
        shell: bash
        run: |
          git config user.name "Branding Tatva Build Bot"
          git config user.email "actions@users.noreply.github.com"
          git add src/sections/Home/EvidenceWall.tsx
          git commit -m "Keep the diagnosis handoff clear of the fixed header"
          git push origin HEAD:reimagine-project-moves
