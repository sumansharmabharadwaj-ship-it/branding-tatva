name: Repair moodboard homepage

on:
  pull_request:
    branches:
      - work/home-moodboard-film-2026-08-04

permissions:
  contents: write

jobs:
  repair-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out pull request
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Route the film through the isolated Tatva chapter
        run: |
          python <<'PY'
          from pathlib import Path
          import re

          path = Path("src/sections/Home/MoodboardHome.tsx")
          source = path.read_text()

          import_line = 'import { MoodboardTatvaFilm } from "./MoodboardTatvaFilm";\n'
          anchor = 'import { navigation, site } from "@/data/site";\n'
          if import_line not in source:
              if anchor not in source:
                  raise SystemExit("Import anchor was not found")
              source = source.replace(anchor, anchor + import_line, 1)

          replacement = '''function TatvaFilm() {
            return <MoodboardTatvaFilm />;
          }

          function ProcessMountain() {'''
          pattern = re.compile(
              r'function TatvaFilm\(\) \{.*?\n\}\n\nfunction ProcessMountain\(\) \{',
              re.S,
          )
          source, count = pattern.subn(replacement, source, count=1)
          if count != 1:
              raise SystemExit(f"Expected one TatvaFilm block, replaced {count}")

          path.write_text(source)
          PY

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build the site
        id: build
        continue-on-error: true
        run: pnpm build

      - name: Diagnose a prerender failure
        if: steps.build.outcome == 'failure'
        run: |
          echo "--- macro locations in dependencies and output ---"
          grep -R -n --include='*.js' "__NEXT_PRIVATE_MINIMIZE_MACRO_FALSE" node_modules/next node_modules/styled-jsx .next 2>/dev/null | head -40 || true
          echo "--- compiled homepage context ---"
          node <<'NODE'
          const fs = require('fs');
          const candidates = [
            '.next/server/app/page.js',
            '.next/server/chunks/ssr',
          ];
          for (const candidate of candidates) {
            if (!fs.existsSync(candidate)) continue;
            if (fs.statSync(candidate).isDirectory()) continue;
            const source = fs.readFileSync(candidate, 'utf8');
            const needle = '__NEXT_PRIVATE_MINIMIZE_MACRO_FALSE';
            const index = source.indexOf(needle);
            console.log(candidate, 'length', source.length, 'needle', index);
            if (index >= 0) {
              console.log(source.slice(Math.max(0, index - 1600), index + 1600));
            }
          }
          NODE

      - name: Stop after diagnostics
        if: steps.build.outcome == 'failure'
        run: exit 1

      - name: Commit the verified repair to the moodboard branch
        if: steps.build.outcome == 'success'
        run: |
          git fetch origin work/home-moodboard-film-2026-08-04
          git reset --mixed origin/work/home-moodboard-film-2026-08-04
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/sections/Home/MoodboardHome.tsx
          git commit -m "Route the homepage through the isolated Tatva film"
          git push origin HEAD:work/home-moodboard-film-2026-08-04
