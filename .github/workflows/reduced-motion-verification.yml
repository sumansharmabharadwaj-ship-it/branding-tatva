name: Reduced motion verification

on:
  push:
    branches:
      - feat/insights-authority-hub

permissions:
  contents: read

concurrency:
  group: reduced-motion-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - name: Check out application source
        uses: actions/checkout@v4
        with:
          filter: blob:none
          sparse-checkout: |
            /src/
            /package.json
            /pnpm-lock.yaml
            /next.config.ts
            /tsconfig.json
            /postcss.config.mjs
            /eslint.config.mjs
            /next-env.d.ts
            /public/images/higgsfield-himalayan-valley-poster.jpg
            /public/images/pixabay-stream-mist-rays-poster.jpg
            /public/images/pixabay-golden-forest-glow-poster.jpg
            /public/images/pixabay-golden-reeds-wind-poster.jpg
            /public/images/pixabay-sea-of-fog-sunrise-poster.jpg
          sparse-checkout-cone-mode: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install
        run: |
          corepack enable
          corepack prepare pnpm@10.15.0 --activate
          pnpm install --no-frozen-lockfile
          pnpm add --save-dev playwright@1.55.0
          pnpm exec playwright install --with-deps chromium

      - name: Build and start
        run: |
          pnpm build
          pnpm start > /tmp/next.log 2>&1 &
          for attempt in {1..60}; do
            curl --silent --fail http://127.0.0.1:3000/insights > /dev/null && exit 0
            sleep 1
          done
          cat /tmp/next.log
          exit 1

      - name: Test reduced motion hydration
        run: |
          cat > reduced-motion.mjs <<'EOF'
          import { chromium } from "playwright";

          const browser = await chromium.launch({ headless: true });
          const context = await browser.newContext({
            viewport: { width: 390, height: 844 },
            reducedMotion: "reduce",
          });
          const page = await context.newPage();
          const errors = [];
          const consoleErrors = [];

          page.on("pageerror", (error) => errors.push(error.message));
          page.on("console", (message) => {
            if (message.type() === "error") consoleErrors.push(message.text());
          });

          await page.goto("http://127.0.0.1:3000/insights", {
            waitUntil: "networkidle",
          });
          await page.waitForTimeout(1200);

          const combined = [...errors, ...consoleErrors].join("\n");
          if (/hydration|did not match|server rendered html/i.test(combined)) {
            throw new Error(combined);
          }

          const visibleText = await page.locator("body").innerText();
          if (!visibleText.includes("Brand strategy, explained from the roots upward")) {
            throw new Error("Insights hero did not render in reduced motion mode");
          }

          await browser.close();
          EOF
          node reduced-motion.mjs
