name: Insights responsive browser gate
run-name: Insights browser · ${{ github.sha }}

on:
  # Exact-head rerun after replacing the client-proof guide's missing media
  # pair. Both Insight data-file casings now remain inside the browser gate.
  workflow_dispatch:
  push:
    branches:
      - homepage-cinematic-recovery
    paths:
      - .github/workflows/insights-browser-gate.yml
      - scripts/insights_browser_gate.cjs
      - src/app/insights/**
      - src/components/InsightCard.tsx
      - src/components/InsightsExplorer.tsx
      - src/components/Reveal.tsx
      - src/components/ScrollProgress.tsx
      - src/data/**Insight**
      - src/data/**insight**
      - src/data/insightLibrary.ts
      - src/data/insights.ts
      - src/data/pillarInsights.ts
      - package.json
      - pnpm-lock.yaml
      - next.config.ts

permissions:
  contents: read

concurrency:
  group: branding-tatva-insights-browser
  cancel-in-progress: true

jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 26

    steps:
      - name: Check out the application without the media archive
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/public/videos/*
            !/public/audio/*

      - name: Use Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Activate pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.28.0 --activate

      - name: Install dependencies and browser runner
        run: |
          pnpm install --frozen-lockfile
          pnpm add --save-dev --lockfile=false playwright@1.54.2
          pnpm exec playwright install --with-deps chromium

      - name: Build the production application
        env:
          NEXT_TELEMETRY_DISABLED: 1
        run: pnpm build

      - name: Start the production server
        env:
          NEXT_TELEMETRY_DISABLED: 1
        run: |
          pnpm start --hostname 127.0.0.1 --port 3000 > /tmp/branding-tatva-insights-browser.log 2>&1 &
          echo $! > /tmp/branding-tatva-insights-browser.pid
          for attempt in {1..90}; do
            if curl --fail --silent http://127.0.0.1:3000/insights > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/branding-tatva-insights-browser.log
          exit 1

      - name: Verify search, filters, topics, responsive articles, metadata, schema, keyboard, and reduced motion
        env:
          AUDIT_BASE_URL: http://127.0.0.1:3000
          AUDIT_COMMIT: ${{ github.sha }}
          INSIGHTS_EXPECTED_GUIDES: 29
        run: node scripts/insights_browser_gate.cjs

      - name: Stop the production server
        if: always()
        run: |
          if [ -f /tmp/branding-tatva-insights-browser.pid ]; then
            kill "$(cat /tmp/branding-tatva-insights-browser.pid)" || true
          fi
          cat /tmp/branding-tatva-insights-browser.log || true

      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: branding-tatva-insights-browser
          path: insights-browser-audit/*
          if-no-files-found: warn
          retention-days: 7
