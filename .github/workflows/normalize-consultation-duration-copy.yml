name: Normalize consultation duration copy once

on:
  push:
    branches:
      - homepage-cinematic-recovery
    paths:
      - ".github/workflows/normalize-consultation-duration-copy.yml"

permissions:
  contents: write

concurrency:
  group: branding-tatva-consultation-duration-normalizer
  cancel-in-progress: false

jobs:
  normalize:
    runs-on: ubuntu-latest
    timeout-minutes: 8

    steps:
      - name: Check out the canonical branch
        uses: actions/checkout@v4
        with:
          ref: homepage-cinematic-recovery
          fetch-depth: 0

      - name: Use Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Replace only confirmed stale consultation copy
        run: |
          node <<'NODE'
          const fs = require("node:fs");

          const replacements = [
            {
              path: "src/app/services/page.tsx",
              from: 'body="Twenty minutes settles it, with honest feedback either way."',
              to: 'body="Thirty minutes settles it, with honest feedback either way."',
            },
            {
              path: "src/components/SeasonalCalendarPanel.tsx",
              from: "Twenty minutes, just a real conversation.",
              to: "Thirty minutes, just a real conversation.",
            },
            {
              path: "src/sections/Home/FinalInvitation.tsx",
              from: "Twenty minutes to name the tension, choose the direction, and see what the brand needs next.",
              to: "Thirty minutes to name the tension, choose the direction, and see what the brand needs next.",
            },
            {
              path: "src/sections/Home/FinalInvitation.tsx",
              from: '["20 minutes", "honest diagnosis", "zero pitch deck"]',
              to: '["30 minutes", "honest diagnosis", "zero pitch deck"]',
            },
            {
              path: "src/sections/Process/RootSystem.tsx",
              from: "Twenty minutes · zero pitch deck",
              to: "Thirty minutes · zero pitch deck",
            },
            {
              path: "src/sections/Services/StrategyRoomCTA.tsx",
              from: "Twenty minutes, honest feedback either way.",
              to: "Thirty minutes, honest feedback either way.",
            },
          ];

          for (const replacement of replacements) {
            const before = fs.readFileSync(replacement.path, "utf8");
            const count = before.split(replacement.from).length - 1;
            if (count !== 1) {
              throw new Error(
                `${replacement.path}: expected exactly one occurrence of ${JSON.stringify(replacement.from)}, found ${count}`,
              );
            }
            fs.writeFileSync(
              replacement.path,
              before.replace(replacement.from, replacement.to),
            );
          }
          NODE

      - name: Verify the corrected Contact contract
        run: node scripts/contact_contract_gate.cjs

      - name: Commit the normalized visitor-facing copy
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            src/app/services/page.tsx \
            src/components/SeasonalCalendarPanel.tsx \
            src/sections/Home/FinalInvitation.tsx \
            src/sections/Process/RootSystem.tsx \
            src/sections/Services/StrategyRoomCTA.tsx
          git commit -m "Normalize every consultation surface to 30 minutes"
          git fetch origin homepage-cinematic-recovery
          git rebase origin/homepage-cinematic-recovery
          git push origin HEAD:homepage-cinematic-recovery
