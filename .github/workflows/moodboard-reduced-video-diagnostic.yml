name: Diagnose reduced-motion film

on:
  pull_request:
    branches:
      - work/home-moodboard-film-2026-08-04

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: |
          pnpm add --save-dev --ignore-workspace-root-check @playwright/test@1.59.1
          pnpm exec playwright install --with-deps chromium
      - run: pnpm build
      - name: Start server and inspect every reduced-motion video
        run: |
          pnpm start > /tmp/reduced-diagnostic-server.log 2>&1 &
          for attempt in $(seq 1 60); do
            if curl --silent --fail http://127.0.0.1:3000/ > /dev/null; then break; fi
            sleep 1
          done
          mkdir -p .qa
          cat > .qa/reduced-video-diagnostic.mjs <<'EOF'
          import { chromium } from "@playwright/test";

          const browser = await chromium.launch({ headless: true });
          const context = await browser.newContext({
            viewport: { width: 1440, height: 1000 },
            reducedMotion: "reduce",
          });
          const page = await context.newPage();
          await page.addInitScript(() => {
            sessionStorage.setItem("bt-intro-seen", "1");
            localStorage.setItem(
              "bt-consent-v2",
              JSON.stringify({
                necessary: true,
                analytics: false,
                marketing: false,
                updatedAt: "2026-08-04T00:00:00.000Z",
              }),
            );
          });
          await page.goto("http://127.0.0.1:3000/", { waitUntil: "domcontentloaded" });
          await page.evaluate(() => document.fonts.ready);
          await page.waitForTimeout(2000);

          const matches = await page.evaluate(() => ({
            media: window.matchMedia("(prefers-reduced-motion: reduce)").matches,
            dataMotion: document.documentElement.dataset.motion ?? null,
          }));
          console.log("REDUCED_STATE", JSON.stringify(matches));

          for (const fraction of [0, 0.15, 0.3, 0.45, 0.6, 0.75, 0.9, 0.98]) {
            await page.evaluate((position) => {
              const height = Math.max(document.documentElement.scrollHeight, document.body.scrollHeight);
              window.scrollTo(0, Math.max(0, (height - innerHeight) * position));
            }, fraction);
            await page.waitForTimeout(800);
          }

          const videos = await page.locator("main video").evaluateAll((items) =>
            items.map((item, index) => {
              const video = item;
              const section = video.closest("section");
              return {
                index,
                paused: video.paused,
                ended: video.ended,
                readyState: video.readyState,
                networkState: video.networkState,
                srcAttribute: video.getAttribute("src"),
                currentSrc: video.currentSrc,
                poster: video.poster,
                visibility: getComputedStyle(video).visibility,
                display: getComputedStyle(video).display,
                dataset: { ...video.dataset },
                sectionText: (section?.innerText || "").replace(/\s+/g, " ").slice(0, 180),
                outerHTML: video.outerHTML.slice(0, 700),
              };
            }),
          );
          console.log("VIDEO_DIAGNOSTIC", JSON.stringify(videos, null, 2));

          const playing = videos.filter((video) => !video.paused && video.readyState >= 2);
          console.log("PLAYING_DIAGNOSTIC", JSON.stringify(playing, null, 2));
          await browser.close();
          if (playing.length > 0) process.exit(1);
          EOF
          node .qa/reduced-video-diagnostic.mjs
