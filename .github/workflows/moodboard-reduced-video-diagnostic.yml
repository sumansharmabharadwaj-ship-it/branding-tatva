name: Diagnose reduced-motion film

on:
  pull_request:
    branches:
      - work/home-moodboard-film-2026-08-04

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: |
          pnpm add --save-dev --ignore-workspace-root-check @playwright/test@1.59.1
          pnpm exec playwright install --with-deps chromium
      - run: pnpm build
      - name: Reproduce the full reduced-motion browser timeline
        run: |
          pnpm start > /tmp/reduced-diagnostic-server.log 2>&1 &
          for attempt in $(seq 1 60); do
            if curl --silent --fail http://127.0.0.1:3000/ > /dev/null; then break; fi
            sleep 1
          done
          mkdir -p .qa/reduced-diagnostic
          cat > .qa/reduced-diagnostic/run.mjs <<'EOF'
          import { chromium } from "@playwright/test";

          const browser = await chromium.launch({ headless: true });
          const context = await browser.newContext({
            viewport: { width: 1440, height: 1000 },
            reducedMotion: "reduce",
          });
          const page = await context.newPage();

          await page.addInitScript(() => {
            sessionStorage.setItem("bt-intro-seen", "1");
            localStorage.setItem(
              "bt-consent-v2",
              JSON.stringify({
                necessary: true,
                analytics: false,
                marketing: false,
                updatedAt: "2026-08-04T00:00:00.000Z",
              }),
            );

            window.__btVideoTimeline = [];
            const describe = (video, event) => {
              const section = video.closest("section");
              window.__btVideoTimeline.push({
                event,
                at: Math.round(performance.now()),
                scrollY: Math.round(scrollY),
                paused: video.paused,
                readyState: video.readyState,
                networkState: video.networkState,
                src: video.getAttribute("src"),
                currentSrc: video.currentSrc,
                poster: video.getAttribute("poster"),
                visibility: getComputedStyle(video).visibility,
                dataset: { ...video.dataset },
                section: (section?.innerText || "").replace(/\s+/g, " ").slice(0, 160),
              });
            };
            for (const event of ["play", "playing", "pause", "emptied", "loadedmetadata"]) {
              document.addEventListener(
                event,
                (candidate) => {
                  if (candidate.target instanceof HTMLVideoElement) {
                    describe(candidate.target, event);
                  }
                },
                true,
              );
            }
          });

          await page.goto("http://127.0.0.1:3000/", { waitUntil: "domcontentloaded" });
          await page.evaluate(() => document.fonts.ready);
          await page.waitForTimeout(2000);

          const reducedState = await page.evaluate(() => ({
            media: matchMedia("(prefers-reduced-motion: reduce)").matches,
            dataMotion: document.documentElement.dataset.motion ?? null,
          }));
          console.log("REDUCED_STATE", JSON.stringify(reducedState));

          const inspect = async (label) => {
            const snapshot = await page.locator("main video").evaluateAll((items) =>
              items.map((item, index) => {
                const video = item;
                const section = video.closest("section");
                return {
                  label,
                  index,
                  paused: video.paused,
                  ended: video.ended,
                  readyState: video.readyState,
                  networkState: video.networkState,
                  srcAttribute: video.getAttribute("src"),
                  currentSrc: video.currentSrc,
                  poster: video.getAttribute("poster"),
                  visibility: getComputedStyle(video).visibility,
                  display: getComputedStyle(video).display,
                  dataset: { ...video.dataset },
                  sectionText: (section?.innerText || "").replace(/\s+/g, " ").slice(0, 220),
                  outerHTML: video.outerHTML.slice(0, 900),
                };
              }),
            );
            const playing = snapshot.filter((video) => !video.paused && video.readyState >= 2);
            if (snapshot.length || playing.length) {
              console.log(`VIDEO_SNAPSHOT ${label}`, JSON.stringify(snapshot, null, 2));
            }
            return { snapshot, playing };
          };

          const fractions = [0, 0.06, 0.13, 0.21, 0.30, 0.39, 0.49, 0.59, 0.69, 0.79, 0.89, 0.98];
          const observedPlaying = [];

          for (let index = 0; index < fractions.length; index += 1) {
            const fraction = fractions[index];
            await page.evaluate((position) => {
              const height = Math.max(document.documentElement.scrollHeight, document.body.scrollHeight);
              window.scrollTo({
                top: Math.max(0, (height - innerHeight) * position),
                behavior: "instant",
              });
            }, fraction);
            await page.waitForTimeout(700);

            let result = await inspect(`after-scroll-${index}-${Math.round(fraction * 100)}`);
            if (result.playing.length) observedPlaying.push(...result.playing);

            if ([0, 5, 8, 11].includes(index)) {
              await page.screenshot({
                path: `.qa/reduced-diagnostic/${String(index).padStart(2, "0")}.png`,
                animations: "disabled",
              });
              result = await inspect(`after-screenshot-${index}-${Math.round(fraction * 100)}`);
              if (result.playing.length) observedPlaying.push(...result.playing);
            }
          }

          for (const delay of [0, 100, 300, 800, 1600]) {
            if (delay) await page.waitForTimeout(delay);
            const result = await inspect(`final-plus-${delay}ms`);
            if (result.playing.length) observedPlaying.push(...result.playing);
          }

          const timeline = await page.evaluate(() => window.__btVideoTimeline || []);
          console.log("VIDEO_EVENT_TIMELINE", JSON.stringify(timeline, null, 2));
          console.log("OBSERVED_PLAYING", JSON.stringify(observedPlaying, null, 2));

          await browser.close();
          if (observedPlaying.length) process.exit(1);
          EOF
          node .qa/reduced-diagnostic/run.mjs
