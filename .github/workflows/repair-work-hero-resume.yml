name: Repair Work hero resume contract

on:
  workflow_dispatch:
  push:
    branches:
      - homepage-cinematic-recovery
    paths:
      - ".github/workflows/repair-work-hero-resume.yml"

permissions:
  contents: write

concurrency:
  group: branding-tatva-work-hero-resume-repair
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 8

    steps:
      - name: Check out the canonical branch
        uses: actions/checkout@v4
        with:
          ref: homepage-cinematic-recovery
          fetch-depth: 0

      - name: Use Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Make hero resume deterministic and observable
        run: |
          node <<'NODE'
          const fs = require("node:fs");

          function replaceExactly(file, from, to, label) {
            const before = fs.readFileSync(file, "utf8");
            const count = before.split(from).length - 1;
            if (count !== 1) {
              throw new Error(`${file}: expected one ${label}, found ${count}`);
            }
            fs.writeFileSync(file, before.replace(from, to));
          }

          const opening = "src/sections/Work/WorkOpening.tsx";
          replaceExactly(
            opening,
            `  const interactionPaused = pointerPaused || focusPaused;\n  const current = projects[active] ?? projects[0];`,
            `  const interactionPaused = pointerPaused || focusPaused;\n  const rotationEnabled =\n    hydrated &&\n    !prefersReducedMotion &&\n    inView &&\n    !interactionPaused &&\n    !manualPaused &&\n    projects.length > 1;\n  const current = projects[active] ?? projects[0];`,
            "rotation predicate",
          );

          replaceExactly(
            opening,
            `  useEffect(() => {\n    function trackPointer(event: PointerEvent) {\n      const stage = stageRef.current;\n      if (!stage) return;\n      const bounds = stage.getBoundingClientRect();\n      const inside =\n        event.clientX >= bounds.left &&\n        event.clientX <= bounds.right &&\n        event.clientY >= bounds.top &&\n        event.clientY <= bounds.bottom;\n      setPointerPaused(inside);\n    }\n\n    window.addEventListener("pointermove", trackPointer, { passive: true });\n    return () => window.removeEventListener("pointermove", trackPointer);\n  }, []);\n\n`,
            ``,
            "global pointer tracker",
          );

          replaceExactly(
            opening,
            `  useEffect(() => {\n    const canRotate =\n      hydrated &&\n      !prefersReducedMotion &&\n      inView &&\n      !interactionPaused &&\n      !manualPaused &&\n      projects.length > 1;\n\n    if (!canRotate) return;\n\n    const interval = window.setInterval(() => {\n      setActive((index) => (index + 1) % projects.length);\n    }, ROTATION_MS);\n\n    return () => window.clearInterval(interval);\n  }, [hydrated, inView, interactionPaused, manualPaused, prefersReducedMotion]);`,
            `  useEffect(() => {\n    if (!rotationEnabled) return;\n\n    // A restartable timeout gives every cleared pause channel one complete\n    // reading interval. It cannot inherit an almost-expired interval from\n    // before the visitor hovered, focused, or paused the preview.\n    const timeout = window.setTimeout(() => {\n      setActive((index) => (index + 1) % projects.length);\n    }, ROTATION_MS);\n\n    return () => window.clearTimeout(timeout);\n  }, [active, rotationEnabled]);`,
            "rotation effect",
          );

          replaceExactly(
            opening,
            `            data-pointer-paused={pointerPaused ? "true" : "false"}\n            data-focus-paused={focusPaused ? "true" : "false"}\n            data-preview-in-view={inView ? "true" : "false"}`,
            `            data-pointer-paused={pointerPaused ? "true" : "false"}\n            data-focus-paused={focusPaused ? "true" : "false"}\n            data-manual-paused={manualPaused ? "true" : "false"}\n            data-preview-in-view={inView ? "true" : "false"}\n            data-preview-hydrated={hydrated ? "true" : "false"}\n            data-preview-reduced={prefersReducedMotion ? "true" : "false"}\n            data-rotation-enabled={rotationEnabled ? "true" : "false"}`,
            "hero state attributes",
          );

          const gate = "scripts/work_hero_pause_gate.cjs";
          replaceExactly(
            gate,
            `async function selectedIndex(tabs) {\n  return tabs.evaluateAll((nodes) => nodes.findIndex((node) => node.getAttribute("aria-selected") === "true"));\n}\n\nasync function waitForSelectionChange(page, tabs, previous, label) {\n  await page\n    .waitForFunction(\n      ({ selector, before }) => {\n        const nodes = Array.from(document.querySelectorAll(selector));\n        const next = nodes.findIndex((node) => node.getAttribute("aria-selected") === "true");\n        return next >= 0 && next !== before;\n      },\n      { selector: '[data-work-preview-stage="true"] [role="tab"]', before: previous },\n      { timeout: ROTATION_WINDOW_MS + 1_500 },\n    )\n    .catch(() => {\n      throw new Error(\`${"${label}"}: automatic preview did not resume after all pause channels cleared\`);\n    });\n\n  return selectedIndex(tabs);\n}`,
            `async function selectedIndex(tabs) {\n  return tabs.evaluateAll((nodes) => nodes.findIndex((node) => node.getAttribute("aria-selected") === "true"));\n}\n\nasync function previewState(stage) {\n  return stage.evaluate((node) => ({\n    pointerPaused: node.dataset.pointerPaused,\n    focusPaused: node.dataset.focusPaused,\n    manualPaused: node.dataset.manualPaused,\n    inView: node.dataset.previewInView,\n    hydrated: node.dataset.previewHydrated,\n    reduced: node.dataset.previewReduced,\n    rotationEnabled: node.dataset.rotationEnabled,\n    active: Array.from(node.querySelectorAll('[role="tab"]')).findIndex(\n      (tab) => tab.getAttribute("aria-selected") === "true",\n    ),\n  }));\n}\n\nasync function waitForSelectionChange(page, tabs, stage, previous, label) {\n  try {\n    await page.waitForFunction(\n      (selector) => document.querySelector(selector)?.dataset.rotationEnabled === "true",\n      '[data-work-preview-stage="true"]',\n      { timeout: 2_500 },\n    );\n    await page.waitForFunction(\n      ({ selector, before }) => {\n        const nodes = Array.from(document.querySelectorAll(selector));\n        const next = nodes.findIndex((node) => node.getAttribute("aria-selected") === "true");\n        return next >= 0 && next !== before;\n      },\n      { selector: '[data-work-preview-stage="true"] [role="tab"]', before: previous },\n      { timeout: ROTATION_WINDOW_MS + 1_500 },\n    );\n  } catch {\n    const state = await previewState(stage);\n    throw new Error(\`${"${label}"}: automatic preview did not resume; state=${"${JSON.stringify(state)}"}\`);\n  }\n\n  return selectedIndex(tabs);\n}`,
            "hero resume diagnostic",
          );

          replaceExactly(
            gate,
            `    await waitForSelectionChange(page, tabs, hovered, "work/hero-pause");`,
            `    await waitForSelectionChange(page, tabs, stage, hovered, "work/hero-pause");`,
            "first resume call",
          );
          replaceExactly(
            gate,
            `    const resumedAfterManual = await waitForSelectionChange(page, tabs, manuallyPaused, "work/hero-pause: manual resume");`,
            `    const resumedAfterManual = await waitForSelectionChange(\n      page,\n      tabs,\n      stage,\n      manuallyPaused,\n      "work/hero-pause: manual resume",\n    );`,
            "manual resume call",
          );
          NODE

          node --check scripts/work_hero_pause_gate.cjs

      - name: Commit the hero contract repair
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/sections/Work/WorkOpening.tsx scripts/work_hero_pause_gate.cjs
          git commit -m "Make Work hero pause and resume deterministic"
          git fetch origin homepage-cinematic-recovery
          git rebase origin/homepage-cinematic-recovery
          git push origin HEAD:homepage-cinematic-recovery
