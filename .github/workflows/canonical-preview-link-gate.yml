name: Canonical preview link gate

on:
  workflow_dispatch:
  push:
    branches:
      - homepage-cinematic-recovery
  pull_request:

permissions:
  contents: read

jobs:
  preview-link-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Verify the permanent review alias is the only Branding Tatva Vercel URL
        run: node scripts/canonical_preview_link_gate.cjs
