name: Repair Insights authority network gate

on:
  workflow_dispatch:
  push:
    branches:
      - homepage-cinematic-recovery
    paths:
      - ".github/workflows/repair-insights-authority-network-gate.yml"

permissions:
  contents: write

concurrency:
  group: branding-tatva-insights-authority-network-repair
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 8

    steps:
      - name: Check out the canonical branch
        uses: actions/checkout@v4
        with:
          ref: homepage-cinematic-recovery
          fetch-depth: 0

      - name: Use Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Make network failures URL-aware and count only article routes
        run: |
          node <<'NODE'
          const fs = require("node:fs");
          const file = "scripts/insights_authority_gate.cjs";
          let content = fs.readFileSync(file, "utf8");

          function replaceExactly(from, to, label) {
            const count = content.split(from).length - 1;
            if (count !== 1) {
              throw new Error(`Expected one ${label}, found ${count}`);
            }
            content = content.replace(from, to);
          }

          replaceExactly(
            `function actionableConsoleError(text) {\n  return !/Failed to load resource.*(mp4|webm|mp3|png|jpg|jpeg|svg|woff2?)/i.test(text) &&\n    !/_vercel\\/(insights|speed-insights)/i.test(text) &&\n    !/net::ERR_ABORTED/i.test(text);\n}`,
            `function pathnameFor(value) {\n  try {\n    return new URL(value, BASE_URL).pathname;\n  } catch {\n    return value;\n  }\n}\n\nfunction expectedNetworkFailure(url, detail = "") {\n  const pathname = pathnameFor(url);\n  return (\n    /^\\/(?:videos|audio)\\//i.test(pathname) ||\n    /\\/_vercel\\/(?:insights|speed-insights)(?:\\/|$)/i.test(pathname) ||\n    /(?:va\\.vercel-scripts\\.com|vitals\\.vercel-insights\\.com)/i.test(url) ||\n    /net::ERR_ABORTED/i.test(detail)\n  );\n}\n\nfunction actionableConsoleError(text) {\n  // Chromium's generic resource error omits the URL. Response and request\n  // listeners below retain the URL and decide whether the failure is an\n  // intentionally omitted media file or a real route, script, image, or CSS bug.\n  return !/^Failed to load resource:/i.test(text) &&\n    !/_vercel\\/(insights|speed-insights)/i.test(text) &&\n    !/net::ERR_ABORTED/i.test(text);\n}`,
            "network classifier",
          );

          replaceExactly(
            `  page.on("pageerror", (error) => errors.push(error.message));\n\n  const response = await page.goto`,
            `  page.on("pageerror", (error) => errors.push(\`pageerror: ${"${error.message}"}\`));\n  page.on("response", (response) => {\n    if (response.status() < 400) return;\n    const url = response.url();\n    if (!expectedNetworkFailure(url)) {\n      errors.push(\`response: ${"${response.status()}"} ${"${url}"}\`);\n    }\n  });\n  page.on("requestfailed", (request) => {\n    const detail = request.failure()?.errorText || "request failed";\n    const url = request.url();\n    if (!expectedNetworkFailure(url, detail)) {\n      errors.push(\`request: ${"${detail}"} ${"${url}"}\`);\n    }\n  });\n\n  const response = await page.goto`,
            "URL-aware page listeners",
          );

          replaceExactly(
            `    const links = Array.from(document.querySelectorAll('a[href^="/insights/"]'))\n      .map((node) => node.getAttribute("href"))\n      .filter(Boolean);`,
            `    const links = Array.from(document.querySelectorAll('a[href^="/insights/"]'))\n      .map((node) => node.getAttribute("href"))\n      .filter(\n        (href) =>\n          typeof href === "string" &&\n          /^\\/insights\\/[^/]+$/.test(href) &&\n          !href.endsWith(".xml"),\n      );`,
            "article-route filter",
          );

          fs.writeFileSync(file, content);
          NODE

          node --check scripts/insights_authority_gate.cjs

      - name: Commit the authority gate repair
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/insights_authority_gate.cjs
          git commit -m "Classify Insights authority network failures by URL"
          git fetch origin homepage-cinematic-recovery
          git rebase origin/homepage-cinematic-recovery
          git push origin HEAD:homepage-cinematic-recovery
