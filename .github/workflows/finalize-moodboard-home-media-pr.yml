name: Finalize moodboard AmbientVideo ownership

on:
  pull_request:
    branches:
      - work/home-moodboard-film-2026-08-04

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out pull request
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch AmbientVideo ownership
        run: |
          python <<'PY'
          from pathlib import Path

          path = Path("src/sections/Home/MoodboardHome.tsx")
          source = path.read_text()
          source = source.replace(
              'const near = useInView(wrapRef, { margin: "420px 0px 420px 0px" });',
              'const near = useInView(wrapRef, { margin: "120px 0px 120px 0px" });',
              1,
          )
          old = '''  useEffect(() => {
            const video = videoRef.current;
            if (!video || reduced) return;
            if (near) void video.play().catch(() => {});
            else video.pause();
          }, [near, reduced, src]);'''
          new = '''  useEffect(() => {
            const video = videoRef.current;
            if (!video) return;
            if (reduced || !near) {
              video.pause();
              return;
            }
            void video.play().catch(() => {});
            return () => video.pause();
          }, [near, reduced, src]);'''
          if old in source:
              source = source.replace(old, new, 1)
          elif new not in source:
              raise SystemExit("AmbientVideo effect contract was not found")
          path.write_text(source)
          PY

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build the site
        run: pnpm build

      - name: Push the verified repair to the work branch
        run: |
          git fetch origin work/home-moodboard-film-2026-08-04
          git reset --mixed origin/work/home-moodboard-film-2026-08-04
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/sections/Home/MoodboardHome.tsx
          if git diff --cached --quiet; then
            echo "AmbientVideo ownership is already final."
            exit 0
          fi
          git commit -m "Finalize moodboard homepage video ownership"
          git push origin HEAD:work/home-moodboard-film-2026-08-04
