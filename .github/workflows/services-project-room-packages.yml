name: Build and verify the Services Project Room packages
run-name: Services Project Room packages macOS · ${{ github.sha }}

on:
  push:
    branches:
      - services-project-room-packages
    paths:
      - .github/workflows/services-project-room-packages.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: branding-tatva-services-project-room-packages
  cancel-in-progress: true

jobs:
  build-audit-commit:
    if: github.actor != 'github-actions[bot]'
    runs-on: macos-14
    timeout-minutes: 35

    steps:
      - name: Check out the focused branch without the large media archive
        uses: actions/checkout@v4
        with:
          ref: services-project-room-packages
          fetch-depth: 1
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/public/videos/*
            !/public/audio/*

      - name: Install the Project Room browser contract
        run: |
          python3 -m py_compile \
            scripts/apply_services_project_room_gate.py \
            scripts/fix_project_room_route_semantics.py
          python3 scripts/apply_services_project_room_gate.py
          python3 scripts/fix_project_room_route_semantics.py
          git diff --check

      - name: Use Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Activate pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.28.0 --activate

      - name: Install dependencies and Chromium
        run: |
          pnpm install --frozen-lockfile
          pnpm add --save-dev --lockfile=false playwright@1.54.2
          pnpm exec playwright install chromium

      - name: Build the production application
        env:
          NEXT_TELEMETRY_DISABLED: 1
        run: pnpm build

      - name: Start the production server
        env:
          NEXT_TELEMETRY_DISABLED: 1
        run: |
          pnpm start --hostname 127.0.0.1 --port 3000 > /tmp/services-project-room.log 2>&1 &
          echo $! > /tmp/services-project-room.pid
          for attempt in {1..90}; do
            if curl --fail --silent http://127.0.0.1:3000/services > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/services-project-room.log
          exit 1

      - name: Walk the complete Services journey at three viewports
        env:
          AUDIT_BASE_URL: http://127.0.0.1:3000
        run: node scripts/services_page_gate.cjs

      - name: Stop the production server
        if: always()
        run: |
          if [ -f /tmp/services-project-room.pid ]; then
            kill "$(cat /tmp/services-project-room.pid)" || true
          fi
          cat /tmp/services-project-room.log || true

      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: services-project-room-packages-evidence
          path: services-page-audit/*
          if-no-files-found: warn
          retention-days: 7

      - name: Remove one-time verification tools
        run: |
          rm scripts/apply_services_project_room_gate.py
          rm scripts/fix_project_room_route_semantics.py
          rm .github/workflows/services-project-room-packages.yml

      - name: Commit the verified Project Room workspace
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            src/sections/Services/PackageSelector.tsx \
            src/sections/Services/ProjectRoomPackage.tsx \
            scripts/services_page_gate.cjs \
            scripts/apply_services_project_room_gate.py \
            scripts/fix_project_room_route_semantics.py \
            .github/workflows/services-project-room-packages.yml
          git diff --cached --check
          git commit -m "Turn Services packages into visual Project Rooms"
          git push origin HEAD:services-project-room-packages