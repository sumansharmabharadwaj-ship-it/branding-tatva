name: Verify original Services Deliverables backdrop

on:
  push:
    branches:
      - services-original-deliverables-backdrop
    paths:
      - .github/workflows/services-deliverables-backdrop-gate.yml

permissions:
  contents: write

concurrency:
  group: services-original-deliverables-backdrop
  cancel-in-progress: true

jobs:
  integrate-and-build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out focused branch
        uses: actions/checkout@v4
        with:
          ref: services-original-deliverables-backdrop
          fetch-depth: 0

      - name: Replace the unrelated stock film with the original paper archive
        run: |
          python <<'PY'
          from pathlib import Path
          import re

          path = Path("src/app/services/page.tsx")
          page = path.read_text()

          def regex_once(pattern: str, replacement: str, label: str) -> None:
              global page
              page, count = re.subn(pattern, replacement, page, count=1, flags=re.S | re.M)
              if count != 1:
                  raise SystemExit(f"{label}: expected one match, found {count}")

          old_import = 'import { DeliverablesExplorer } from "@/sections/Services/DeliverablesExplorer";'
          new_import = (
              'import { DeliverablesExplorer } from "@/sections/Services/DeliverablesExplorer";\n'
              'import { DeliverablesCinematicBackdrop } from "@/sections/Services/DeliverablesCinematicBackdrop";'
          )
          if page.count(old_import) != 1:
              raise SystemExit(f"Deliverables import: expected one match, found {page.count(old_import)}")
          page = page.replace(old_import, new_import, 1)

          regex_once(
              r'^[ \t]*\{/\* Mood: THE STUDY.*?brightest thing in frame\. \*/\}',
              '''        {/* Mood: THE ARCHIVE. The background now belongs to the work
            being explained: layered paper, vellum, blind-debossed grids,
            and dark folios form one ordered material system. The live
            ArtifactPreview remains the chapter's primary interaction;
            the environment only gives that interaction a tactile world. */}''',
              "Deliverables direction note",
          )

          regex_once(
              r'^[ \t]*\{/\* Fresh clip per direct instruction.*?3\.2MB MP4 / 2\.0MB WebM\. \*/\}\n'
              r'[ \t]*<BackgroundVideo\n'
              r'[ \t]+parallax\n'
              r'[ \t]+push\n'
              r'[ \t]+video="/videos/pexels-dandelion-release\.mp4"\n'
              r'[ \t]+videoWebm="/videos/pexels-dandelion-release\.webm"\n'
              r'[ \t]+poster="/images/pexels-dandelion-release-poster\.jpg"\n'
              r'[ \t]*/>',
              '''          {/* Original generated Deliverables archive: ivory papers,
              translucent vellum, embossed grids, dark folios, and one
              stone weight make the invisible work feel tangible before
              a visitor opens an individual artifact. Its scroll-linked
              drift and edge light remain secondary to the explorer. */}
          <DeliverablesCinematicBackdrop image="/images/generated/bt-services-deliverables-archive.png" />''',
              "Deliverables media block",
          )

          old_gradient = (
              '"linear-gradient(180deg, rgba(23,32,25,0.55) 0%, '
              'rgba(23,32,25,0.28) 45%, rgba(23,32,25,0.6) 100%)"'
          )
          new_gradient = (
              '"linear-gradient(180deg, rgba(13,17,16,0.72) 0%, '
              'rgba(13,17,16,0.46) 44%, rgba(13,17,16,0.68) 100%)"'
          )
          if page.count(old_gradient) != 1:
              raise SystemExit(f"Deliverables overlay gradient: expected one match, found {page.count(old_gradient)}")
          page = page.replace(old_gradient, new_gradient, 1)

          regex_once(
              r'^[ \t]*\{/\* Scene dissolve: Education\'s blue mist hands into the river\n[ \t]+study\. \*/\}',
              '''          {/* Scene dissolve: Education's blue mist settles onto the
              archive's charcoal and paper planes. */}''',
              "Deliverables handoff note",
          )

          path.write_text(page)
          PY

      - name: Check the focused source and media contract
        run: |
          set -euo pipefail
          test -s public/images/generated/bt-services-deliverables-archive.png
          grep -q 'DeliverablesCinematicBackdrop' src/app/services/page.tsx
          grep -q 'bt-services-deliverables-archive.png' src/app/services/page.tsx
          grep -q 'bt-services-deliverables-archive.png' src/app/services/generatedMediaManifest.ts
          ! grep -q 'pexels-dandelion-release' src/app/services/page.tsx
          git diff --check
          git diff --stat

      - name: Use Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Activate pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.28.0 --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build the Next.js application
        run: pnpm build

      - name: Commit the verified Deliverables scene and remove one-time gates
        run: |
          set -euo pipefail
          rm -f \
            .github/workflows/import-services-deliverables-backdrop.yml \
            .github/workflows/services-deliverables-backdrop-gate.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            src/app/services/page.tsx \
            .github/workflows/import-services-deliverables-backdrop.yml \
            .github/workflows/services-deliverables-backdrop-gate.yml
          git commit -m "Replace the stock Deliverables film with an original paper archive"
          git push origin HEAD:services-original-deliverables-backdrop
