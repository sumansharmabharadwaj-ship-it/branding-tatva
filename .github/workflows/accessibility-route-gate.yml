name: Accessibility route gate

on:
  workflow_dispatch:
  workflow_run:
    workflows:
      - Permanent preview source gate
    types:
      - completed

permissions:
  contents: read

concurrency:
  group: accessibility-route-gate
  cancel-in-progress: true

jobs:
  wcag-route-audit:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out canonical preview source
        uses: actions/checkout@v4
        with:
          ref: homepage-cinematic-recovery

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install isolated accessibility audit dependencies
        run: |
          mkdir -p .tmp/accessibility-audit
          npm install --prefix .tmp/accessibility-audit --no-save @axe-core/playwright playwright
          ./.tmp/accessibility-audit/node_modules/.bin/playwright install --with-deps chromium

      - name: Audit primary routes, one case study, and one Insight guide
        env:
          NODE_PATH: ${{ github.workspace }}/.tmp/accessibility-audit/node_modules
          PREVIEW_URL: https://branding-tatva-git-homepage-cinematic-recovery-suman22.vercel.app
          ACCESSIBILITY_OUTPUT_DIR: artifacts/accessibility-route-gate
        run: node scripts/accessibility_route_gate.cjs

      - name: Upload accessibility evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: accessibility-route-gate-${{ github.run_id }}
          path: artifacts/accessibility-route-gate
          if-no-files-found: warn
          retention-days: 14
