name: SEO metadata runtime gate

on:
  workflow_dispatch:
    inputs:
      target:
        description: Site to inspect (read only)
        type: choice
        options: [production, preview]
        default: production
  pull_request:
    paths:
      - "scripts/seo_metadata_runtime_gate*.cjs"
      - ".github/workflows/seo-metadata-runtime-gate.yml"
  push:
    branches: [main]
    paths:
      - "scripts/seo_metadata_runtime_gate*.cjs"
      - ".github/workflows/seo-metadata-runtime-gate.yml"

permissions:
  contents: read

concurrency:
  group: seo-metadata-runtime-gate-${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  validator-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Verify indexing and metadata regression cases
        run: node --test scripts/seo_metadata_runtime_gate.test.cjs

  seo-runtime:
    if: github.event_name == 'workflow_dispatch'
    needs: validator-tests
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out the selected workflow ref
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install the isolated browser audit dependency and Chromium
        run: |
          npm install --prefix "$RUNNER_TEMP/seo-runtime" --no-package-lock --ignore-scripts playwright@1.63.0
          node "$RUNNER_TEMP/seo-runtime/node_modules/playwright/cli.js" install --with-deps chromium

      - name: Verify metadata, canonicals, schemas, social cards, and preview noindex
        env:
          NODE_PATH: ${{ runner.temp }}/seo-runtime/node_modules
          SEO_BASE_URL: ${{ inputs.target == 'preview' && 'https://branding-tatva-git-august-8-isolated-suman22.vercel.app' || 'https://brandingtatva.com' }}
          SEO_OUTPUT_DIR: artifacts/seo-metadata-runtime-gate
        run: node scripts/seo_metadata_runtime_gate.cjs

      - name: Upload SEO evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: seo-metadata-runtime-gate-${{ github.run_id }}
          path: artifacts/seo-metadata-runtime-gate
          if-no-files-found: warn
          retention-days: 14
