name: SEO metadata runtime gate

on:
  workflow_dispatch:
  workflow_run:
    workflows:
      - Permanent preview source gate
    types:
      - completed

permissions:
  contents: read

concurrency:
  group: seo-metadata-runtime-gate
  cancel-in-progress: true

jobs:
  seo-runtime:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out canonical preview source
        uses: actions/checkout@v4
        with:
          ref: homepage-cinematic-recovery

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Verify metadata, canonicals, schemas, social cards, and preview noindex
        env:
          PREVIEW_URL: https://branding-tatva-git-homepage-cinematic-recovery-suman22.vercel.app
          SEO_OUTPUT_DIR: artifacts/seo-metadata-runtime-gate
        run: node scripts/seo_metadata_runtime_gate.cjs

      - name: Upload SEO evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: seo-metadata-runtime-gate-${{ github.run_id }}
          path: artifacts/seo-metadata-runtime-gate
          if-no-files-found: warn
          retention-days: 14
