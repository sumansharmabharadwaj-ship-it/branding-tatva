name: Update canonical backlog evidence

on:
  push:
    branches:
      - homepage-cinematic-recovery
    paths:
      - .github/workflows/update-canonical-backlog-evidence.yml

permissions:
  contents: write

jobs:
  update:
    if: github.event.head_commit.message == 'Run the canonical backlog evidence updater'
    runs-on: ubuntu-latest
    timeout-minutes: 8

    steps:
      - name: Check out the exact triggering commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Update the canonical board
        run: python scripts/update_master_backlog_evidence.py

      - name: Remove temporary updater files and push the board
        run: |
          set -euo pipefail
          rm -f .github/workflows/update-canonical-backlog-evidence.yml
          rm -f scripts/update_master_backlog_evidence.py
          git config user.name "Branding Tatva release board"
          git config user.email "actions@users.noreply.github.com"
          git add docs/MASTER_PENDING_WORK.md .github/workflows/update-canonical-backlog-evidence.yml scripts/update_master_backlog_evidence.py
          git commit -m "Update backlog with verified Insights and Contact evidence"
          git push origin HEAD:homepage-cinematic-recovery
