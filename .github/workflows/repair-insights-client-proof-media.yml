name: Repair client-proof Insight media

on:
  workflow_dispatch:
  push:
    branches:
      - homepage-cinematic-recovery
    paths:
      - .github/workflows/repair-insights-client-proof-media.yml

permissions:
  contents: write

concurrency:
  group: branding-tatva-client-proof-media-repair
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 8

    steps:
      - name: Check out the canonical branch
        uses: actions/checkout@v4
        with:
          ref: homepage-cinematic-recovery
          fetch-depth: 0

      - name: Use Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Replace the missing media pair with the approved water element pair
        run: |
          node <<'NODE'
          const fs = require("node:fs");
          const file = "src/data/clientProofInsights.ts";
          let content = fs.readFileSync(file, "utf8");

          const oldImage = '    heroImage: "/images/cinematic-waterlight-poster.jpg",';
          const oldVideo = '    heroVideo: "/videos/cinematic-waterlight.mp4",';
          const newImage = '    heroImage: "/images/higgsfield-element-water.jpg",';
          const newVideo = '    heroVideo: "/videos/higgsfield-element-water.mp4",';

          for (const [label, value] of [["old image", oldImage], ["old video", oldVideo]]) {
            const count = content.split(value).length - 1;
            if (count !== 1) throw new Error(`Expected exactly one ${label} reference, found ${count}`);
          }

          content = content.replace(oldImage, newImage).replace(oldVideo, newVideo);
          fs.writeFileSync(file, content);
          NODE

          test -s public/images/higgsfield-element-water.jpg
          test -s public/videos/higgsfield-element-water.mp4
          ! git grep -n -I 'cinematic-waterlight' -- src public
          git diff --check

      - name: Commit the media repair
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/clientProofInsights.ts
          git commit -m "Repair the client-proof Insight media pair"
          git fetch origin homepage-cinematic-recovery
          git rebase origin/homepage-cinematic-recovery
          git push origin HEAD:homepage-cinematic-recovery
