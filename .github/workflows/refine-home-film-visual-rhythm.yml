name: Refine homepage film visual rhythm

on:
  push:
    branches:
      - automation/refine-home-film-visual-rhythm-2026-08-04

permissions:
  contents: write

jobs:
  refine-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out the refinement branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Refine the authored homepage film
        run: |
          python <<'PY'
          from pathlib import Path

          def replace_once(source: str, old: str, new: str, label: str) -> str:
              count = source.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected one match, found {count}")
              return source.replace(old, new, 1)

          home = Path("src/sections/Home/MoodboardHome.tsx")
          source = home.read_text()

          source = replace_once(
              source,
              '''  const firstOpacity = useTransform(scrollYProgress, [0, 0.38, 0.72], [1, 1, 0.14]);
          const firstY = useTransform(scrollYProgress, [0, 0.72], [0, -64]);
          const secondOpacity = useTransform(scrollYProgress, [0, 0.35, 0.7, 1], [0.12, 0.12, 1, 1]);
          const secondY = useTransform(scrollYProgress, [0.36, 0.72], [54, 0]);'''.replace("          ", ""),
              '''  const firstOpacity = useTransform(scrollYProgress, [0, 0.3, 0.5, 0.64], [1, 1, 0.34, 0]);
          const firstY = useTransform(scrollYProgress, [0, 0.64], [0, -32]);
          const secondOpacity = useTransform(scrollYProgress, [0, 0.5, 0.64, 1], [0, 0, 1, 1]);
          const secondY = useTransform(scrollYProgress, [0.5, 0.7], [28, 0]);'''.replace("          ", ""),
              "hero crossfade",
          )

          source = replace_once(
              source,
              '    <section ref={ref} className="relative h-[190svh] bg-[#1E2A22] text-ivory">',
              '    <section ref={ref} className="relative h-[172svh] bg-[#1E2A22] text-ivory">',
              "hero duration",
          )

          source = replace_once(
              source,
              '          <div className="absolute inset-0 bg-[linear-gradient(90deg,rgba(16,24,19,.82)_0%,rgba(16,24,19,.43)_54%,rgba(16,24,19,.18)_78%),linear-gradient(180deg,rgba(16,24,19,.18),transparent_42%,rgba(16,24,19,.7))]" />',
              '          <div className="absolute inset-0 bg-[linear-gradient(90deg,rgba(16,24,19,.7)_0%,rgba(16,24,19,.3)_52%,rgba(16,24,19,.08)_78%),linear-gradient(180deg,rgba(16,24,19,.08),transparent_46%,rgba(16,24,19,.56))]" />',
              "hero light grade",
          )

          reduced_heading = '''            <h1 className="mt-6 font-display text-[clamp(3.8rem,9vw,9rem)] font-normal leading-[0.86] tracking-[-0.055em]">
              We do not create brands.
              <span className="block italic text-[#E1C89F]">We reveal what is already true.</span>
            </h1>'''
          reduced_heading_new = '''            <h1 className="mt-6 max-w-[68rem] font-display text-[clamp(3.45rem,8.2vw,8.2rem)] font-normal leading-[0.9] tracking-[-0.045em]">
              <span className="block">We do not create brands.</span>
              <span className="mt-1 block font-medium text-[#E1C89F]">We reveal what is already true.</span>
            </h1>'''
          source = replace_once(source, reduced_heading, reduced_heading_new, "reduced hero heading")

          animated_heading = '''            <h1 className="mt-6 max-w-6xl font-display text-[clamp(4rem,9.5vw,9.6rem)] font-normal leading-[0.84] tracking-[-0.06em]">
              We do not create brands.
              <span className="block italic text-[#E1C89F]">We reveal what is already true.</span>
            </h1>'''
          animated_heading_new = '''            <h1 className="mt-6 max-w-[68rem] font-display text-[clamp(3.55rem,8.25vw,8.45rem)] font-normal leading-[0.9] tracking-[-0.045em]">
              <span className="block">We do not create brands.</span>
              <span className="mt-1 block font-medium text-[#E1C89F]">We reveal what is already true.</span>
            </h1>'''
          source = replace_once(source, animated_heading, animated_heading_new, "animated hero heading")

          second_heading = '''              <p className="mt-6 max-w-5xl font-display text-[clamp(4rem,9vw,9rem)] font-normal leading-[0.84] tracking-[-0.06em]">
                Visibility becomes valuable only when it leaves a <span className="italic text-[#E1C89F]">memory.</span>
              </p>'''
          second_heading_new = '''              <p className="mt-6 max-w-4xl font-display text-[clamp(3.25rem,7.2vw,7.15rem)] font-normal leading-[0.9] tracking-[-0.045em]">
                Visibility becomes valuable only when it leaves a <span className="text-[#E1C89F]">memory.</span>
              </p>'''
          source = replace_once(source, second_heading, second_heading_new, "second hero heading")

          source = replace_once(
              source,
              '    <div className={`relative isolate flex h-28 items-center overflow-hidden ${dark ? "bg-[#1E2A22] text-[#F4EFE6]" : "bg-[#F4EFE6] text-[#22231F]"}`} aria-hidden="true">',
              '    <div className={`relative isolate flex h-20 items-center overflow-hidden sm:h-24 ${dark ? "bg-[#1E2A22] text-[#F4EFE6]" : "bg-[#F4EFE6] text-[#22231F]"}`} aria-hidden="true">',
              "divider height",
          )
          source = replace_once(
              source,
              '      <div className="absolute left-1/2 top-1/2 h-44 w-44 -translate-x-1/2 -translate-y-1/2 rounded-full border border-current/7" />',
              '      <div className="absolute left-1/2 top-1/2 h-32 w-32 -translate-x-1/2 -translate-y-1/2 rounded-full border border-current/7 sm:h-36 sm:w-36" />',
              "divider medallion",
          )

          source = replace_once(
              source,
              '    <section className="film-paper relative overflow-hidden bg-[#EAE1D4] py-24 text-[#22231F] sm:py-32 lg:py-40">\n      <div className="mx-auto grid max-w-[94rem] gap-12 px-6 sm:px-10 lg:grid-cols-[1.06fr_.94fr] lg:items-stretch lg:gap-8 lg:px-14">',
              '    <section className="film-paper relative overflow-hidden bg-[#EAE1D4] pt-24 pb-16 text-[#22231F] sm:pt-28 sm:pb-20 lg:pt-32 lg:pb-24">\n      <div className="mx-auto grid max-w-[94rem] gap-10 px-6 sm:px-10 lg:grid-cols-[1.06fr_.94fr] lg:items-stretch lg:gap-8 lg:px-14">',
              "author section rhythm",
          )
          source = replace_once(
              source,
              '            <h2 className="mt-5 max-w-4xl font-display text-[clamp(3.5rem,7vw,7.4rem)] font-normal leading-[0.88] tracking-[-0.055em]">I study attention before I design <span className="italic text-[#9D6B4C]">expression.</span></h2>',
              '            <h2 className="mt-5 max-w-4xl font-display text-[clamp(3.15rem,6.2vw,6.25rem)] font-normal leading-[0.92] tracking-[-0.045em]">I study attention before I design <span className="font-medium text-[#9D6B4C]">expression.</span></h2>',
              "author heading",
          )
          source = replace_once(
              source,
              '        <div className="film-reveal relative min-h-[44rem] overflow-hidden rounded-[2rem] border border-[#22231F]/10 bg-[#1E2A22]">',
              '        <div className="film-reveal relative min-h-[38rem] overflow-hidden rounded-[2rem] border border-[#22231F]/10 bg-[#1E2A22] sm:min-h-[44rem]">',
              "portrait height",
          )
          source = replace_once(
              source,
              '          <Image src="/images/own-portrait.jpg" alt="Suman Sharma, founder of Branding Tatva" fill sizes="(min-width:1024px) 45vw, 100vw" className="object-cover" style={{ objectPosition:"center 24%" }} />',
              '          <Image src="/images/own-portrait.jpg" alt="Suman Sharma, founder of Branding Tatva" fill sizes="(min-width:1024px) 45vw, 100vw" className="object-cover" style={{ objectPosition:"center 62%" }} />',
              "portrait crop",
          )

          source = replace_once(
              source,
              '    <section className="film-paper relative overflow-hidden bg-[#F4EFE6] py-24 text-[#22231F] sm:py-32 lg:py-40">\n      <div className="mx-auto max-w-[94rem] px-6 sm:px-10 lg:px-14">\n        <div className="film-reveal grid gap-9 lg:grid-cols-[.82fr_1.18fr] lg:items-end">\n          <div><p className="text-[0.6rem] font-medium uppercase tracking-[0.3em] text-[#9D6B4C]">Three paths</p><h2 className="mt-5 max-w-4xl font-display text-[clamp(3.3rem,7vw,7rem)] font-normal leading-[0.9] tracking-[-0.05em]">The work meets the business wherever it stands.</h2></div>',
              '    <section className="film-paper relative overflow-hidden bg-[#F4EFE6] pt-16 pb-24 text-[#22231F] sm:pt-20 sm:pb-28 lg:pt-24 lg:pb-32">\n      <div className="mx-auto max-w-[94rem] px-6 sm:px-10 lg:px-14">\n        <div className="film-reveal grid gap-8 lg:grid-cols-[.82fr_1.18fr] lg:items-end">\n          <div><p className="text-[0.6rem] font-medium uppercase tracking-[0.3em] text-[#9D6B4C]">Three paths</p><h2 className="mt-5 max-w-3xl font-display text-[clamp(3.05rem,6.15vw,6.2rem)] font-normal leading-[0.94] tracking-[-0.045em]">The work meets the business wherever it stands.</h2></div>',
              "three paths chapter rhythm",
          )

          source = replace_once(
              source,
              '    <div className="relative min-h-[92svh] overflow-hidden bg-[#1E2A22] text-[#F4EFE6]"><AmbientVideo src="/videos/pixabay-sea-of-fog-sunrise.mp4" poster="/images/pixabay-sea-of-fog-sunrise-poster.jpg" position="center"/><div className="absolute inset-0 bg-[linear-gradient(180deg,rgba(22,31,25,.14),rgba(22,31,25,.38)_48%,rgba(22,31,25,.78))]"/><div className="relative z-10 mx-auto flex min-h-[92svh] max-w-[94rem] items-end px-6 pb-16 pt-28 sm:px-10 sm:pb-20 lg:px-14"><div className="film-reveal max-w-6xl"><p className="text-[.6rem] uppercase tracking-[.3em] text-[#E1C89F]">The last frame belongs to them</p><h2 className="mt-6 font-display text-[clamp(3.8rem,9vw,9rem)] font-normal leading-[.84] tracking-[-.06em]">What should your audience remember after you leave the room?</h2>',
              '    <div className="relative min-h-[92svh] overflow-hidden bg-[#1E2A22] text-[#F4EFE6]"><AmbientVideo src="/videos/pixabay-sea-of-fog-sunrise.mp4" poster="/images/pixabay-sea-of-fog-sunrise-poster.jpg" position="center"/><div className="absolute inset-0 bg-[linear-gradient(180deg,rgba(22,31,25,.08),rgba(22,31,25,.3)_52%,rgba(22,31,25,.68))]"/><div className="relative z-10 mx-auto flex min-h-[92svh] max-w-[94rem] items-end px-6 pb-16 pt-28 sm:px-10 sm:pb-20 lg:px-14"><div className="film-reveal max-w-[64rem]"><p className="text-[.6rem] uppercase tracking-[.3em] text-[#E1C89F]">The last frame belongs to them</p><h2 className="mt-6 font-display text-[clamp(3.4rem,7.7vw,7.65rem)] font-normal leading-[.9] tracking-[-.045em]">What should your audience remember after you leave the room?</h2>',
              "closing frame scale",
          )

          source = replace_once(
              source,
              '        animation-range:entry 2% cover 34%;',
              '        animation-range:entry 0% cover 24%;',
              "reveal range",
          )
          source = replace_once(
              source,
              '    @keyframes film-rise { from { opacity:.26; transform:translate3d(0,42px,0) scale(.982); } to { opacity:1; transform:translate3d(0,0,0) scale(1); } }',
              '    @keyframes film-rise { from { opacity:.72; transform:translate3d(0,22px,0) scale(.992); } to { opacity:1; transform:translate3d(0,0,0) scale(1); } }',
              "reveal visibility",
          )

          home.write_text(source)

          tatva = Path("src/sections/Home/MoodboardTatvaFilm.tsx")
          source = tatva.read_text()

          replacements = [
              ('    <section ref={ref} className="relative h-[430svh] bg-[#1E2A22] text-[#22231F]">', '    <section ref={ref} className="relative h-[390svh] bg-[#1E2A22] text-[#22231F]">', "tatva duration"),
              ('            initial={{ opacity: 0.16, scale: 1.08 }}', '            initial={{ opacity: 0.46, scale: 1.045 }}', "backdrop entry"),
              ('            exit={{ opacity: 0.14, scale: 1.035 }}', '            exit={{ opacity: 0.34, scale: 1.02 }}', "backdrop exit"),
              ('            transition={{ duration: 0.82, ease: EASE }}', '            transition={{ duration: 0.58, ease: EASE }}', "backdrop transition"),
              ('        <div className="absolute inset-0 bg-[linear-gradient(90deg,rgba(244,239,230,.96)_0%,rgba(244,239,230,.88)_43%,rgba(244,239,230,.24)_72%,rgba(24,34,28,.48)_100%)]" />', '        <div className="absolute inset-0 bg-[linear-gradient(90deg,rgba(244,239,230,.9)_0%,rgba(244,239,230,.78)_43%,rgba(244,239,230,.18)_72%,rgba(24,34,28,.42)_100%)]" />', "tatva horizontal grade"),
              ('        <div className="absolute inset-0 bg-[linear-gradient(180deg,rgba(244,239,230,.18),transparent_42%,rgba(24,34,28,.36))]" />', '        <div className="absolute inset-0 bg-[linear-gradient(180deg,rgba(244,239,230,.08),transparent_44%,rgba(24,34,28,.3))]" />', "tatva vertical grade"),
              ('                initial={{ opacity: 0.22, y: 36 }}', '                initial={{ opacity: 0.74, y: 20 }}', "copy entry"),
              ('                exit={{ opacity: 0.18, y: -24 }}', '                exit={{ opacity: 0.58, y: -14 }}', "copy exit"),
              ('                <h2 className="mt-5 font-display text-[clamp(4.7rem,10vw,10rem)] font-normal leading-[0.78] tracking-[-0.07em]">', '                <h2 className="mt-5 font-display text-[clamp(4.15rem,8.7vw,8.45rem)] font-normal leading-[0.84] tracking-[-0.055em]">', "tatva title scale"),
              ('                <p className="mt-8 max-w-xl font-display text-[clamp(2rem,3.7vw,3.9rem)] leading-[1.02]">', '                <p className="mt-7 max-w-xl font-display text-[clamp(1.8rem,3.15vw,3.2rem)] leading-[1.06]">', "tatva poetic scale"),
              ('              <div className="relative h-[20rem] overflow-hidden rounded-[1.8rem] border border-[#22231F]/10 bg-[#F5F0E8]/66 p-5 backdrop-blur-xl sm:h-[25rem]">', '              <div className="relative h-[20rem] overflow-hidden rounded-[1.8rem] border border-[#22231F]/14 bg-[#F5F0E8]/82 p-5 shadow-[0_26px_70px_-52px_rgba(34,35,31,.5)] backdrop-blur-xl sm:h-[25rem]">', "diagram contrast"),
              ('                    initial={{ opacity: 0.2, scale: 0.91 }}', '                    initial={{ opacity: 0.68, scale: 0.96 }}', "diagram entry"),
              ('                    exit={{ opacity: 0.18, scale: 1.06 }}', '                    exit={{ opacity: 0.56, scale: 1.025 }}', "diagram exit"),
              ('                  initial={{ opacity: 0.22, x: 28 }}', '                  initial={{ opacity: 0.72, x: 16 }}', "change entry"),
              ('                  exit={{ opacity: 0.18, x: -18 }}', '                  exit={{ opacity: 0.58, x: -10 }}', "change exit"),
              ('                  className="rounded-[1.5rem] border border-[#22231F]/10 bg-[#F5F0E8]/72 p-5 backdrop-blur-xl sm:p-6"', '                  className="rounded-[1.5rem] border border-[#22231F]/14 bg-[#F5F0E8]/84 p-5 shadow-[0_22px_64px_-50px_rgba(34,35,31,.46)] backdrop-blur-xl sm:p-6"', "change card contrast"),
              ('                  index === activeIndex ? "opacity-100" : "opacity-30"', '                  index === activeIndex ? "opacity-100" : "opacity-55"', "chapter labels"),
          ]
          for old, new, label in replacements:
              source = replace_once(source, old, new, label)

          source = source.replace('text-[#22231F]/34', 'text-[#22231F]/46')
          source = source.replace('text-[#22231F]/48', 'text-[#22231F]/60')
          source = source.replace('text-[#22231F]/58', 'text-[#22231F]/68')
          tatva.write_text(source)
          PY

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build the complete site
        run: pnpm build

      - name: Push the verified visual refinement to the work branch
        run: |
          rm -f .github/workflows/refine-home-film-visual-rhythm.yml
          git fetch origin work/home-moodboard-film-2026-08-04
          git reset --mixed origin/work/home-moodboard-film-2026-08-04
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/sections/Home/MoodboardHome.tsx src/sections/Home/MoodboardTatvaFilm.tsx
          git commit -m "Refine homepage film typography, contrast, and chapter rhythm"
          git push origin HEAD:work/home-moodboard-film-2026-08-04
