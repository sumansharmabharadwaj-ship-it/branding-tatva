name: Shared runtime audit

on:
  workflow_dispatch:
  push:
    branches:
      - homepage-cinematic-recovery
    paths:
      - .github/workflows/shared-runtime-audit.yml
      - scripts/shared_runtime_audit.cjs
      - src/layouts/Header/**
      - src/components/SmoothScrollProvider.tsx
      - src/data/site.ts
      - package.json
      - pnpm-lock.yaml
      - next.config.ts
  workflow_run:
    workflows:
      - Permanent preview source gate
    types:
      - completed

permissions:
  contents: read

concurrency:
  group: shared-runtime-audit
  cancel-in-progress: true

jobs:
  shared-runtime:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out canonical preview source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_run' && 'homepage-cinematic-recovery' || github.sha }}
          fetch-depth: 1
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/public/videos/*
            !/public/audio/*

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Build exact source for branch pushes
        if: github.event_name == 'push'
        env:
          NEXT_TELEMETRY_DISABLED: 1
        run: pnpm build

      - name: Start exact-source production server
        if: github.event_name == 'push'
        env:
          NEXT_TELEMETRY_DISABLED: 1
        shell: bash
        run: |
          pnpm start --hostname 127.0.0.1 --port 3000 > /tmp/shared-runtime.log 2>&1 &
          echo $! > /tmp/shared-runtime.pid
          for attempt in {1..90}; do
            if curl --fail --silent http://127.0.0.1:3000/ > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/shared-runtime.log
          exit 1

      - name: Audit navigation, mobile menu, reduced motion, Contact, Insights, and About
        env:
          PREVIEW_URL: ${{ github.event_name == 'push' && 'http://127.0.0.1:3000' || 'https://branding-tatva-git-homepage-cinematic-recovery-suman22.vercel.app' }}
          AUDIT_OUTPUT_DIR: artifacts/shared-runtime-audit
        run: node scripts/shared_runtime_audit.cjs

      - name: Stop exact-source production server
        if: always() && github.event_name == 'push'
        shell: bash
        run: |
          if [ -f /tmp/shared-runtime.pid ]; then
            kill "$(cat /tmp/shared-runtime.pid)" || true
          fi
          cat /tmp/shared-runtime.log || true

      - name: Upload runtime evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shared-runtime-audit-${{ github.run_id }}
          path: artifacts/shared-runtime-audit
          if-no-files-found: warn
          retention-days: 14
