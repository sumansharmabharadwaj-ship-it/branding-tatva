name: Trigger Insights verification after poster repair

on:
  workflow_dispatch:
  push:
    branches:
      - homepage-cinematic-recovery
    paths:
      - ".github/workflows/trigger-insights-gates-after-poster.yml"

permissions:
  contents: write

concurrency:
  group: branding-tatva-post-poster-insights-trigger
  cancel-in-progress: false

jobs:
  trigger:
    runs-on: ubuntu-latest
    timeout-minutes: 12

    steps:
      - name: Check out the canonical branch
        uses: actions/checkout@v4
        with:
          ref: homepage-cinematic-recovery
          fetch-depth: 0
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/public/videos/*
            !/public/audio/*

      - name: Wait for the valid poster repair
        shell: bash
        run: |
          set -euo pipefail
          for attempt in {1..36}; do
            git fetch origin homepage-cinematic-recovery
            git reset --hard origin/homepage-cinematic-recovery
            if [ -s public/images/cinematic-waterlight-poster.jpg ] && \
              ffprobe -v error -select_streams v:0 -show_entries stream=width,height \
                -of csv=s=x:p=0 public/images/cinematic-waterlight-poster.jpg | grep -Eq '^[0-9]+x[0-9]+$'; then
              exit 0
            fi
            echo "Poster not ready yet, attempt ${attempt}/36"
            sleep 10
          done
          echo "The waterlight poster repair did not land as a valid image." >&2
          exit 1

      - name: Commit an exact-head Insights verification marker
        shell: bash
        run: |
          set -euo pipefail
          marker="src/app/insights/authority-poster-repair-2026-08-07.ts"
          cat > "$marker" <<'TS'
          // Exact-source marker: the canonical 29-guide Insights library now
          // includes a valid /images/cinematic-waterlight-poster.jpg asset.
          export const insightsWaterlightPosterRepair20260807 = {
            guides: 29,
            topics: 5,
            poster: "/images/cinematic-waterlight-poster.jpg",
            verification: "authority-browser-discovery",
          } as const;
          TS

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$marker"
          if git diff --cached --quiet; then
            echo "Verification marker already current."
            exit 0
          fi
          git commit -m "Verify Insights after restoring the waterlight poster"
          git fetch origin homepage-cinematic-recovery
          git rebase origin/homepage-cinematic-recovery
          git push origin HEAD:homepage-cinematic-recovery
