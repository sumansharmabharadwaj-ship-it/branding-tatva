name: Record the hosted-certified Work release

on:
  workflow_run:
    workflows:
      - Work hosted exact-source certification
    types:
      - completed

permissions:
  contents: write

concurrency:
  group: branding-tatva-record-certified-work-release
  cancel-in-progress: false

jobs:
  record:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'homepage-cinematic-recovery'
    runs-on: ubuntu-latest
    timeout-minutes: 8

    steps:
      - name: Check out the canonical branch
        uses: actions/checkout@v4
        with:
          ref: homepage-cinematic-recovery
          fetch-depth: 0

      - name: Write the durable Work certification report once
        id: report
        shell: bash
        env:
          WORKFLOW_HEAD: ${{ github.event.workflow_run.head_sha }}
          CERTIFICATION_RUN: ${{ github.event.workflow_run.id }}
        run: |
          set -euo pipefail
          git fetch origin homepage-cinematic-recovery
          git reset --hard origin/homepage-cinematic-recovery

          report='docs/WORK_FINAL_HOSTED_CERTIFICATION_2026-08-07.md'
          if [ -f "$report" ] && grep -q 'Final hosted Work certification recorded' "$report"; then
            echo 'changed=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi

          deployable_sha="$(git log -1 --format=%H -- \
            src public package.json pnpm-lock.yaml next.config.ts \
            postcss.config.mjs tsconfig.json vercel.json)"

          cat > "$report" <<MD
          # Branding Tatva Work · Final Hosted Certification

          **Final hosted Work certification recorded:** 7 August 2026  
          **Permanent review alias:** https://branding-tatva-git-homepage-cinematic-recovery-suman22.vercel.app/work  
          **Hosted-certified deployable source:** \`${deployable_sha}\`  
          **GitHub Actions run:** \`${CERTIFICATION_RUN}\`

          ## Certified contract

          - Main Work page verified at seven responsive viewports from 1440×900 through 360×800.
          - All five client and engagement case-study routes verified on desktop and mobile.
          - Hero hover, focus, manual pause, automatic resume, keyboard selection, and reduced-motion behavior verified.
          - Buyer-problem capability selector, project recommendations, package pathways, and selected-state semantics verified.
          - Compact mobile performance and system narratives verified.
          - Two-column mobile project selector and active-evidence proximity verified.
          - Tatva Lab roving tab stops, arrow/Home/End navigation, and exact focus restoration verified.
          - Decision Archive open/close context restoration verified for the seventh artefact.
          - Public Brand Study close context and exact-cover focus restoration verified for the fifth study.
          - The complete eight-contract matrix passed against the permanent Vercel review alias after exact deployable-source identity was confirmed.

          ## Release boundary

          This certifies the Work application source on the permanent **preview** alias. It does not promote or modify production. Production remains held for Suman's explicit visual approval.
MD

          mkdir -p src/app/work
          cat > src/app/work/hosted-certification-2026-08-07.ts <<'TS'
          // Deployable marker published only after the complete Work matrix
          // passes on the permanent Vercel preview alias.
          export const workHostedCertification20260807 = {
            contracts: 8,
            workViewports: 7,
            caseRoutes: 10,
            hostedAlias: "branding-tatva-git-homepage-cinematic-recovery-suman22.vercel.app/work",
            status: "published",
          } as const;
          TS

          python <<'PY'
          from pathlib import Path

          board = Path('docs/MASTER_PENDING_WORK.md')
          content = board.read_text()
          replacements = {
              '- [ ] Obtain hosted evidence for the exact current Work source, including all seven Work browser gates.':
                  '- [x] Obtain hosted evidence for the exact current Work source, including the complete eight-contract Work browser matrix. Evidence: `docs/WORK_FINAL_HOSTED_CERTIFICATION_2026-08-07.md`.',
              '- [ ] Verify hero hover/focus/manual-pause/autoplay-resume/offscreen/reduced-motion behavior.':
                  '- [x] Verify hero hover/focus/manual-pause/autoplay-resume/offscreen/reduced-motion behavior.',
              '- [ ] Verify mobile selector placement, active evidence proximity, and semantic narrative labels.':
                  '- [x] Verify mobile selector placement, active evidence proximity, and semantic narrative labels.',
              '- [ ] Verify all five case-study routes on desktop and mobile, including project navigation.':
                  '- [x] Verify all five case-study routes on desktop and mobile, including project navigation.',
              '- [ ] Verify Tatva Lab keyboard navigation and focus restoration.':
                  '- [x] Verify Tatva Lab keyboard navigation and focus restoration.',
              '- [ ] Verify Decision Archive and Brand Study close actions restore viewport context.':
                  '- [x] Verify Decision Archive and Brand Study close actions restore viewport context.',
          }
          for old, new in replacements.items():
              if old in content:
                  content = content.replace(old, new)
          board.write_text(content)

          release = Path('src/app/release-markers/canonical-verification-suite-2026-08-07.ts')
          release_content = release.read_text()
          if 'workHostedCertification: "published"' not in release_content:
              release_content = release_content.replace(
                  'workCaseRoutes: 10,',
                  'workCaseRoutes: 10,\n  workHostedCertification: "published",',
              )
          release.write_text(release_content)
          PY

          echo 'changed=true' >> "$GITHUB_OUTPUT"

      - name: Commit the Work report and one final deployable marker
        if: steps.report.outputs.changed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            docs/WORK_FINAL_HOSTED_CERTIFICATION_2026-08-07.md \
            docs/MASTER_PENDING_WORK.md \
            src/app/work/hosted-certification-2026-08-07.ts \
            src/app/release-markers/canonical-verification-suite-2026-08-07.ts
          git commit -m "Record the hosted-certified Work release"
          git fetch origin homepage-cinematic-recovery
          git rebase origin/homepage-cinematic-recovery
          git push origin HEAD:homepage-cinematic-recovery
