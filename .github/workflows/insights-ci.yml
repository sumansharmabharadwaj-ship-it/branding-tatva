name: Insights CI

on:
  push:
    branches:
      - feat/insights-authority-hub
  pull_request:
    paths:
      - "src/app/insights/**"
      - "src/components/InsightCard.tsx"
      - "src/components/InsightsExplorer.tsx"
      - "src/data/*Insights.ts"
      - "src/data/repositioning/**"
      - "src/data/insights.ts"
      - "src/data/pillarInsights.ts"
      - "src/app/sitemap.ts"
      - "public/llms.txt"
      - "next.config.ts"

permissions:
  contents: read

concurrency:
  group: insights-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          filter: blob:none

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.15.0 --activate

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Type check
        run: pnpm exec tsc --noEmit

      - name: Build production application
        run: pnpm build

      - name: Start production server
        run: |
          pnpm start > /tmp/branding-tatva-next.log 2>&1 &
          for attempt in {1..60}; do
            if curl --silent --fail http://127.0.0.1:3000/insights > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/branding-tatva-next.log
          exit 1

      - name: Verify Insights routes
        run: |
          curl --silent --fail http://127.0.0.1:3000/insights | grep --quiet "Brand strategy, explained from the roots upward"
          curl --silent --fail http://127.0.0.1:3000/insights/brand-consistency-checklist-service-businesses | grep --quiet "The consistency chain"
          curl --silent --fail http://127.0.0.1:3000/insights/value-proposition-vs-positioning-vs-tagline | grep --quiet "The meaning ladder"
          curl --silent --fail http://127.0.0.1:3000/insights/brand-positioning-statement-examples-why-generic | grep --quiet "The specificity ladder"
          curl --silent --fail http://127.0.0.1:3000/insights/reposition-established-service-business-without-losing-recognition | grep --quiet "The recognition bridge"
          curl --silent --fail http://127.0.0.1:3000/insights/brand-refresh-vs-rebrand | grep --quiet "The depth-of-change diagnostic"
          curl --silent --fail http://127.0.0.1:3000/insights/feed.xml | grep --quiet "Branding Tatva Insights"
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' http://127.0.0.1:3000/blog/visible-versus-remembered)" = "308"
