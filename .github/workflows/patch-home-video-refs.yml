name: Patch homepage video references

on:
  push:
    paths:
      - .github/workflows/patch-home-video-refs.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out application code
        uses: actions/checkout@v4
        with:
          ref: reimagine-project-moves
          fetch-depth: 1
          sparse-checkout: |
            src
          sparse-checkout-cone-mode: true

      - name: Patch video effects
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          replacements = {
              Path("src/sections/Home/EvidenceWall.tsx"): (
                  '''  useEffect(() => {
    if (prefersReducedMotion) return;

    function syncPlayback() {
      const video = activeVideoRef.current;
      if (!video) return;
      if (inView && !document.hidden) void video.play().catch(() => {});
      else video.pause();
    }

    syncPlayback();
    document.addEventListener("visibilitychange", syncPlayback);
    return () => {
      document.removeEventListener("visibilitychange", syncPlayback);
      activeVideoRef.current?.pause();
    };
  }, [activeIndex, inView, prefersReducedMotion]);''',
                  '''  useEffect(() => {
    if (prefersReducedMotion) return;
    const videoAtEffectStart = activeVideoRef.current;

    function syncPlayback() {
      const video = activeVideoRef.current;
      if (!video) return;
      if (inView && !document.hidden) void video.play().catch(() => {});
      else video.pause();
    }

    syncPlayback();
    document.addEventListener("visibilitychange", syncPlayback);
    return () => {
      document.removeEventListener("visibilitychange", syncPlayback);
      videoAtEffectStart?.pause();
    };
  }, [activeIndex, inView, prefersReducedMotion]);''',
              ),
              Path("src/sections/Home/StudioTriptych.tsx"): (
                  '''  useEffect(() => {
    if (prefersReducedMotion) return;

    function syncPlayback() {
      const video = activeVideoRef.current;
      if (!video) return;
      if (inView && !document.hidden) void video.play().catch(() => {});
      else video.pause();
    }

    syncPlayback();
    document.addEventListener("visibilitychange", syncPlayback);
    return () => {
      document.removeEventListener("visibilitychange", syncPlayback);
      activeVideoRef.current?.pause();
    };
  }, [activeIndex, inView, prefersReducedMotion]);''',
                  '''  useEffect(() => {
    if (prefersReducedMotion) return;
    const videoAtEffectStart = activeVideoRef.current;

    function syncPlayback() {
      const video = activeVideoRef.current;
      if (!video) return;
      if (inView && !document.hidden) void video.play().catch(() => {});
      else video.pause();
    }

    syncPlayback();
    document.addEventListener("visibilitychange", syncPlayback);
    return () => {
      document.removeEventListener("visibilitychange", syncPlayback);
      videoAtEffectStart?.pause();
    };
  }, [activeIndex, inView, prefersReducedMotion]);''',
              ),
              Path("src/sections/Process/RootSystem.tsx"): (
                  '''  useEffect(() => {
    const currentVideo = videoRef.current;
    if (!currentVideo || prefersReducedMotion) return;

    function syncPlayback() {
      if (inView && !document.hidden) void currentVideo.play().catch(() => {});
      else currentVideo.pause();
    }

    syncPlayback();
    document.addEventListener("visibilitychange", syncPlayback);
    return () => {
      document.removeEventListener("visibilitychange", syncPlayback);
      currentVideo.pause();
    };
  }, [active, inView, prefersReducedMotion]);''',
                  '''  useEffect(() => {
    if (prefersReducedMotion) return;
    const videoAtEffectStart = videoRef.current;

    function syncPlayback() {
      const video = videoRef.current;
      if (!video) return;
      if (inView && !document.hidden) void video.play().catch(() => {});
      else video.pause();
    }

    syncPlayback();
    document.addEventListener("visibilitychange", syncPlayback);
    return () => {
      document.removeEventListener("visibilitychange", syncPlayback);
      videoAtEffectStart?.pause();
    };
  }, [active, inView, prefersReducedMotion]);''',
              ),
          }

          for path, (before, after) in replacements.items():
              text = path.read_text()
              if before not in text:
                  raise SystemExit(f"Expected playback block missing in {path}")
              path.write_text(text.replace(before, after, 1))
          PY

      - name: Commit patch
        shell: bash
        run: |
          git config user.name "Branding Tatva Build Bot"
          git config user.email "actions@users.noreply.github.com"
          git add src/sections/Home/EvidenceWall.tsx src/sections/Home/StudioTriptych.tsx src/sections/Process/RootSystem.tsx
          git commit -m "Stabilize homepage video reference cleanup"
          git push origin HEAD:reimagine-project-moves
