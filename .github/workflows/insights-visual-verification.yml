name: Insights visual verification

on:
  push:
    branches:
      - feat/insights-authority-hub
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: insights-visual-${{ github.ref }}
  cancel-in-progress: true

jobs:
  visual-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - name: Check out application and Insights media
        uses: actions/checkout@v4
        with:
          filter: blob:none
          sparse-checkout: |
            /src/
            /package.json
            /pnpm-lock.yaml
            /next.config.ts
            /tsconfig.json
            /postcss.config.mjs
            /eslint.config.mjs
            /next-env.d.ts
            /public/images/higgsfield-himalayan-valley-poster.jpg
            /public/images/pixabay-stream-mist-rays-poster.jpg
            /public/images/pixabay-golden-forest-glow-poster.jpg
            /public/images/pixabay-golden-reeds-wind-poster.jpg
            /public/images/pixabay-sea-of-fog-sunrise-poster.jpg
          sparse-checkout-cone-mode: false

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.15.0 --activate

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Build production application
        run: pnpm build

      - name: Start production server
        run: |
          pnpm start > /tmp/insights-next.log 2>&1 &
          for attempt in {1..60}; do
            if curl --silent --fail http://127.0.0.1:3000/insights > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/insights-next.log
          exit 1

      - name: Verify routes and legacy redirects
        run: |
          curl --silent --fail http://127.0.0.1:3000/insights | grep --quiet "Brand strategy, explained from the roots upward"
          curl --silent --fail http://127.0.0.1:3000/insights/brand-positioning-strategy-service-businesses | grep --quiet "The positioning spine"
          curl --silent --fail http://127.0.0.1:3000/insights/feed.xml | grep --quiet "Branding Tatva Insights"
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' http://127.0.0.1:3000/blog/visible-versus-remembered)" = "308"

      - name: Install browser library
        run: |
          pnpm add --save-dev playwright@1.55.0
          pnpm exec playwright install --with-deps chromium

      - name: Capture complete desktop and mobile pages
        run: |
          cat > qa-visual.mjs <<'EOF'
          import { chromium } from "playwright";
          import fs from "node:fs/promises";

          const browser = await chromium.launch({ headless: true });
          await fs.mkdir("qa-artifacts", { recursive: true });

          async function revealWholePage(page, viewportHeight) {
            await page.addStyleTag({
              content: "html { scroll-behavior: auto !important; }",
            });

            let lastPosition = -1;
            for (let pass = 0; pass < 160; pass += 1) {
              const state = await page.evaluate(() => ({
                position: window.scrollY,
                viewport: window.innerHeight,
                height: document.documentElement.scrollHeight,
              }));

              if (state.position + state.viewport >= state.height - 4) break;

              const nextPosition = Math.min(
                state.position + Math.max(280, viewportHeight * 0.72),
                state.height - state.viewport
              );
              await page.evaluate((top) => window.scrollTo(0, top), nextPosition);
              await page.waitForTimeout(140);

              const currentPosition = await page.evaluate(() => window.scrollY);
              if (currentPosition === lastPosition) break;
              lastPosition = currentPosition;
            }

            await page.waitForTimeout(900);
            await page.evaluate(() => window.scrollTo(0, 0));
            await page.waitForTimeout(350);
          }

          async function capture(pathname, output, viewport) {
            const context = await browser.newContext({
              viewport,
              colorScheme: "light",
            });
            const page = await context.newPage();
            const browserErrors = [];

            page.on("pageerror", (error) => browserErrors.push(error.message));
            await page.goto(`http://127.0.0.1:3000${pathname}`, {
              waitUntil: "networkidle",
            });
            await page.evaluate(() => document.fonts.ready);
            await revealWholePage(page, viewport.height);

            const dimensions = await page.evaluate(() => ({
              clientWidth: document.documentElement.clientWidth,
              scrollWidth: document.documentElement.scrollWidth,
            }));

            if (dimensions.scrollWidth > dimensions.clientWidth + 1) {
              throw new Error(
                `${pathname} overflows horizontally: ${dimensions.scrollWidth}px > ${dimensions.clientWidth}px`
              );
            }

            if (browserErrors.length > 0) {
              throw new Error(`${pathname} browser errors: ${browserErrors.join(" | ")}`);
            }

            await page.screenshot({ path: output, fullPage: true });
            await context.close();
          }

          await capture("/insights", "qa-artifacts/insights-desktop.png", {
            width: 1440,
            height: 1100,
          });
          await capture("/insights", "qa-artifacts/insights-mobile.png", {
            width: 390,
            height: 844,
          });
          await capture(
            "/insights/brand-positioning-strategy-service-businesses",
            "qa-artifacts/article-desktop.png",
            { width: 1440, height: 1100 }
          );
          await capture(
            "/insights/brand-positioning-strategy-service-businesses",
            "qa-artifacts/article-mobile.png",
            { width: 390, height: 844 }
          );

          await browser.close();
          EOF
          node qa-visual.mjs

      - name: Upload visual QA
        uses: actions/upload-artifact@v4
        with:
          name: insights-visual-qa
          path: qa-artifacts
          if-no-files-found: error
          retention-days: 1
