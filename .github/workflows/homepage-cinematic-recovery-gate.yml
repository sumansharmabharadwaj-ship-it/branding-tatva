name: Homepage conversion and runtime gate
run-name: Homepage release contract · ${{ github.sha }}

on:
  workflow_dispatch:
  push:
    branches:
      - august-8-isolated
      - homepage-cinematic-recovery
    paths:
      - .github/workflows/homepage-cinematic-recovery-gate.yml
      - package.json
      - pnpm-lock.yaml
      - next.config.ts
      - scripts/homepage_*.cjs
      - scripts/home_link_integrity.cjs
      - scripts/api_contract_gate.cjs
      - src/app/globals.css
      - src/app/home-*.css
      - src/app/home-v4*.css
      - src/app/page.tsx
      - src/components/AmbientAudio.tsx
      - src/components/BackgroundVideo.tsx
      - src/components/ContactCallSequence.tsx
      - src/components/MotionPreference.tsx
      - src/components/VideoBreak.tsx
      - src/components/VideoWarden.tsx
      - src/data/homeQuestions.ts
      - src/data/projects.ts
      - src/data/site.ts
      - src/hooks/useHydratedReducedMotion.ts
      - src/layouts/Header/**
      - src/lib/analytics.ts
      - src/lib/homeDiagnosticState.ts
      - src/lib/servicesJourney.ts
      - src/sections/Footer/**
      - src/sections/Home/**
      - src/sections/HomeV4/**
      - src/sections/Process/**

permissions:
  contents: read

concurrency:
  group: branding-tatva-homepage-release
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 24
    steps:
      - name: Check out exact commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - name: Use Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Activate pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.28.0 --activate

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify source and state contracts
        run: pnpm check:homepage

      - name: Verify TypeScript
        run: pnpm exec tsc --noEmit

      - name: Lint changed homepage contract surfaces
        run: >-
          pnpm exec eslint --max-warnings=0
          src/lib/analytics.ts
          src/lib/homeDiagnosticState.ts
          src/lib/servicesJourney.ts
          src/sections/Home/HomeBrandHealthCheck.tsx
          src/sections/Home/HomePacingDirector.tsx
          src/sections/Home/FinalInvitation.tsx
          src/sections/Home/PathsCinematicChapter.tsx
          src/sections/Home/StudioCinematicChapter.tsx
          src/sections/Home/EvidenceWall.tsx
          src/sections/Home/HomeQuestionsScene.tsx
          src/sections/HomeV4/HomeV4Experience.tsx
          src/sections/HomeV4/HomeV4Scenes.tsx
          src/sections/Process/RootSystem.tsx

      - name: Build exact commit
        env:
          NEXT_TELEMETRY_DISABLED: 1
        run: pnpm build

      - name: Verify fresh rendered output
        run: pnpm check:homepage:built

      - name: Start exact production build
        env:
          NEXT_TELEMETRY_DISABLED: 1
        run: |
          pnpm start --hostname 127.0.0.1 --port 3000 > /tmp/branding-tatva-homepage.log 2>&1 &
          echo $! > /tmp/branding-tatva-homepage.pid
          for attempt in {1..90}; do
            if curl --fail --silent http://127.0.0.1:3000/ > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/branding-tatva-homepage.log
          exit 1

      - name: Verify homepage destinations
        env:
          AUDIT_BASE_URL: http://127.0.0.1:3000
        run: node scripts/home_link_integrity.cjs

      - name: Verify contact and newsletter contracts
        env:
          AUDIT_BASE_URL: http://127.0.0.1:3000
        run: node scripts/api_contract_gate.cjs

      - name: Stop production server
        if: always()
        run: |
          if [ -f /tmp/branding-tatva-homepage.pid ]; then
            kill "$(cat /tmp/branding-tatva-homepage.pid)" || true
          fi
          cat /tmp/branding-tatva-homepage.log || true
