name: Cinematic homepage release gate
run-name: Homepage V5 release · ${{ github.sha }}

on:
  workflow_dispatch:
  push:
    branches:
      - homepage-cinematic-recovery
    paths:
      - .github/workflows/homepage-cinematic-recovery-gate.yml
      - scripts/home_v5_release_gate.cjs
      - scripts/home_link_integrity.cjs
      - scripts/api_contract_gate.cjs
      - src/app/page.tsx
      - src/app/home-v5.css
      - src/app/home-v4-private-strategy.css
      - src/components/BackgroundVideo.tsx
      - src/sections/HomeV5/**
      - src/sections/HomeV4/AskTatva.tsx
      - src/data/faqs.ts
      - src/data/site.ts
      - public/images/home-v5-*
      - public/videos/home-v5-*
      - package.json
      - pnpm-lock.yaml
      - next.config.ts

permissions:
  contents: read

concurrency:
  group: branding-tatva-homepage-v5-release
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 28

    steps:
      - name: Check out application source and the dedicated V5 films
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/public/videos/*
            !/public/audio/*
            /public/videos/home-v5-*

      - name: Use Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Activate pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.28.0 --activate

      - name: Install dependencies and Chromium
        run: |
          pnpm install --frozen-lockfile
          pnpm add --save-dev --lockfile=false playwright@1.54.2
          pnpm exec playwright install --with-deps chromium

      - name: Build the production application
        env:
          NEXT_TELEMETRY_DISABLED: 1
        run: pnpm build

      - name: Start production server
        env:
          NEXT_TELEMETRY_DISABLED: 1
        run: |
          pnpm start --hostname 127.0.0.1 --port 3000 > /tmp/branding-tatva-home-v5.log 2>&1 &
          echo $! > /tmp/branding-tatva-home-v5.pid
          for attempt in {1..90}; do
            if curl --fail --silent http://127.0.0.1:3000/ > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/branding-tatva-home-v5.log
          exit 1

      - name: Verify homepage destinations
        env:
          AUDIT_BASE_URL: http://127.0.0.1:3000
        run: node scripts/home_link_integrity.cjs

      - name: Verify contact and newsletter contracts
        env:
          AUDIT_BASE_URL: http://127.0.0.1:3000
        run: node scripts/api_contract_gate.cjs

      - name: Verify V5 layout, media uniqueness, interactions, chatbot, and mobile fit
        env:
          AUDIT_BASE_URL: http://127.0.0.1:3000
          AUDIT_COMMIT: ${{ github.sha }}
        run: node scripts/home_v5_release_gate.cjs

      - name: Stop production server
        if: always()
        run: |
          if [ -f /tmp/branding-tatva-home-v5.pid ]; then
            kill "$(cat /tmp/branding-tatva-home-v5.pid)" || true
          fi
          cat /tmp/branding-tatva-home-v5.log || true

      - name: Upload release evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: branding-tatva-homepage-v5-release
          path: homepage-v5-audit/*
          if-no-files-found: warn
          retention-days: 7
