name: Cinematic homepage recovery gate
run-name: Cinematic recovery · ${{ github.sha }}

on:
  workflow_dispatch:
  push:
    branches:
      - homepage-cinematic-recovery
    paths:
      - .github/workflows/homepage-cinematic-recovery-gate.yml
      - scripts/homepage_cinematic_gate.cjs
      - scripts/tatva_observatory_evidence.cjs
      - scripts/studio_scene_evidence.cjs
      - scripts/work_page_gate.cjs
      - scripts/work_page_gate_v2.cjs
      - scripts/work_page_gate_v3.cjs
      - scripts/api_contract_gate.cjs
      - scripts/home_link_integrity.cjs
      - src/app/**
      - src/components/**
      - src/data/**
      - src/layouts/**
      - src/lib/**
      - src/sections/**
      - package.json
      - pnpm-lock.yaml
      - next.config.ts

permissions:
  contents: read

concurrency:
  group: branding-tatva-cinematic-recovery
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 28

    steps:
      - name: Check out application without the media archive
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/public/videos/*
            !/public/audio/*

      - name: Use Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Activate pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.28.0 --activate

      - name: Install dependencies
        run: |
          pnpm install --frozen-lockfile
          pnpm add --save-dev --lockfile=false playwright@1.54.2

      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Build the production application
        env:
          NEXT_TELEMETRY_DISABLED: 1
        run: pnpm build

      - name: Start production server
        env:
          NEXT_TELEMETRY_DISABLED: 1
        run: |
          pnpm start --hostname 127.0.0.1 --port 3000 > /tmp/branding-tatva-recovery.log 2>&1 &
          echo $! > /tmp/branding-tatva-recovery.pid
          for attempt in {1..90}; do
            if curl --fail --silent http://127.0.0.1:3000/ > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/branding-tatva-recovery.log
          exit 1

      - name: Verify homepage destinations
        env:
          AUDIT_BASE_URL: http://127.0.0.1:3000
        run: node scripts/home_link_integrity.cjs

      - name: Verify contact and newsletter contracts
        env:
          AUDIT_BASE_URL: http://127.0.0.1:3000
        run: node scripts/api_contract_gate.cjs

      - name: Audit V4 layout, motion control, clipping, media budget, and viewports
        env:
          AUDIT_BASE_URL: http://127.0.0.1:3000
          AUDIT_COMMIT: ${{ github.sha }}
        run: node scripts/homepage_cinematic_gate.cjs

      - name: Capture Tatva observatory and pressure-chamber evidence
        env:
          AUDIT_BASE_URL: http://127.0.0.1:3000
        run: node scripts/tatva_observatory_evidence.cjs

      - name: Capture Studio thinking-room states
        env:
          AUDIT_BASE_URL: http://127.0.0.1:3000
        run: node scripts/studio_scene_evidence.cjs

      - name: Audit Work hierarchy, filters, case studies, reduced motion, and viewports
        env:
          AUDIT_BASE_URL: http://127.0.0.1:3000
          AUDIT_COMMIT: ${{ github.sha }}
        run: node scripts/work_page_gate_v3.cjs

      - name: Stop production server
        if: always()
        run: |
          if [ -f /tmp/branding-tatva-recovery.pid ]; then
            kill "$(cat /tmp/branding-tatva-recovery.pid)" || true
          fi
          cat /tmp/branding-tatva-recovery.log || true

      - name: Upload visual evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: branding-tatva-cinematic-recovery
          path: cinematic-recovery-audit/*
          if-no-files-found: error
          retention-days: 7
