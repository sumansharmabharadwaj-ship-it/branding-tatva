name: Repair remaining CSP-safe Work checks

on:
  workflow_dispatch:
  push:
    branches:
      - homepage-cinematic-recovery
    paths:
      - ".github/workflows/repair-work-remaining-csp-gates.yml"

permissions:
  contents: write

concurrency:
  group: branding-tatva-work-remaining-csp-repair
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 8

    steps:
      - name: Check out the canonical branch
        uses: actions/checkout@v4
        with:
          ref: homepage-cinematic-recovery
          fetch-depth: 0

      - name: Use Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Replace the remaining unsafe-eval waits
        run: |
          node <<'NODE'
          const fs = require("node:fs");

          function replaceExactly(file, from, to, label) {
            const before = fs.readFileSync(file, "utf8");
            const count = before.split(from).length - 1;
            if (count !== 1) {
              throw new Error(`${file}: expected one ${label}, found ${count}`);
            }
            fs.writeFileSync(file, before.replace(from, to));
          }

          replaceExactly(
            "scripts/work_mobile_narrative_gate.cjs",
            `async function waitForChangedText(page, selector, previousText, label) {\n  await page\n    .waitForFunction(\n      ({ selector: query, before }) => {\n        const node = document.querySelector(query);\n        return Boolean(node && node.textContent && node.textContent.replace(/\\s+/g, " ").trim() !== before);\n      },\n      { selector, before: previousText },\n      { timeout: 3_000 },\n    )\n    .catch(() => {\n      throw new Error(\`${"${label}"}: active evidence text did not change\`);\n    });\n}`,
            `async function waitForChangedText(page, selector, previousText, label) {\n  const deadline = Date.now() + 3_000;\n  while (Date.now() < deadline) {\n    const next = await page.locator(selector).evaluate((node) =>\n      (node.textContent || "").replace(/\\s+/g, " ").trim(),\n    );\n    if (next && next !== previousText) return next;\n    await page.waitForTimeout(70);\n  }\n  throw new Error(\`${"${label}"}: active evidence text did not change\`);\n}`,
            "mobile narrative text wait",
          );

          const lab = "scripts/work_lab_accessibility_gate.cjs";
          replaceExactly(
            lab,
            `async function assertSelectedAndFocused(page, tabs, index, label) {\n  await page.waitForFunction(\n    ({ tabIndex }) => {\n      const tablist = Array.from(document.querySelectorAll('[role="tablist"]')).find((node) =>\n        (node.getAttribute("aria-label") || "").endsWith("strategy phases"),\n      );\n      const tab = tablist?.querySelectorAll('[role="tab"]')[tabIndex];\n      return Boolean(tab && tab.getAttribute("aria-selected") === "true" && document.activeElement === tab);\n    },\n    { tabIndex: index },\n    { timeout: 3_000 },\n  ).catch(() => {\n    throw new Error(\`work/lab-a11y: ${"${label}"} did not select and focus tab ${"${index + 1}"}\`);\n  });\n\n  const tabStops = await tabs.evaluateAll((nodes) => nodes.map((node) => node.tabIndex));`,
            `async function assertSelectedAndFocused(page, tabs, index, label) {\n  const deadline = Date.now() + 3_000;\n  let ready = false;\n  while (Date.now() < deadline) {\n    ready = await tabs.nth(index).evaluate((node) =>\n      node.getAttribute("aria-selected") === "true" && document.activeElement === node,\n    );\n    if (ready) break;\n    await page.waitForTimeout(70);\n  }\n  if (!ready) {\n    throw new Error(\`work/lab-a11y: ${"${label}"} did not select and focus tab ${"${index + 1}"}\`);\n  }\n\n  const tabStops = await tabs.evaluateAll((nodes) => nodes.map((node) => node.tabIndex));`,
            "Lab tab focus wait",
          );

          replaceExactly(
            lab,
            `    await closeButton.click();\n    await page.waitForFunction(\n      ({ controlledId }) => {\n        const active = document.activeElement;\n        return Boolean(active && active.getAttribute("aria-controls") === controlledId);\n      },\n      { controlledId: originControl },\n      { timeout: 4_000 },\n    ).catch(() => {\n      throw new Error("work/lab-a11y: closing the dossier did not restore focus to its originating cover");\n    });`,
            `    await closeButton.click();\n    const focusDeadline = Date.now() + 4_000;\n    let focusRestored = false;\n    while (Date.now() < focusDeadline) {\n      focusRestored = await originCover.evaluate(\n        (node, controlledId) =>\n          document.activeElement === node && node.getAttribute("aria-controls") === controlledId,\n        originControl,\n      );\n      if (focusRestored) break;\n      await page.waitForTimeout(70);\n    }\n    if (!focusRestored) {\n      throw new Error("work/lab-a11y: closing the dossier did not restore focus to its originating cover");\n    }`,
            "Lab close-focus wait",
          );
          NODE

          node --check scripts/work_mobile_narrative_gate.cjs
          node --check scripts/work_lab_accessibility_gate.cjs

      - name: Commit the remaining CSP-safe checks
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/work_mobile_narrative_gate.cjs scripts/work_lab_accessibility_gate.cjs
          git commit -m "Keep every Work verifier inside the production CSP"
          git fetch origin homepage-cinematic-recovery
          git rebase origin/homepage-cinematic-recovery
          git push origin HEAD:homepage-cinematic-recovery
