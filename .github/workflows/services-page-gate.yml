name: Complete Services page journey gate
run-name: Services journey and scroll density · ${{ github.sha }}

on:
  push:
    branches:
      - homepage-cinematic-recovery
    paths:
      - .github/workflows/services-page-gate.yml
      - scripts/services_page_gate.cjs
      - scripts/services_scroll_experience_gate.cjs
      - src/app/services/**
      - src/sections/Services/**
      - src/components/BackgroundVideo.tsx
      - src/components/PhotoHero.tsx
      - src/components/TexturedDark.tsx
      - src/components/SectionJumpNav.tsx
      - src/components/CalendlyEmbed.tsx
      - src/components/PricingProvider.tsx
      - src/components/RegionSelector.tsx
      - src/components/motion/WaystoneField.tsx
      - src/hooks/useVideoFadeIn.ts
      - src/data/services.ts
      - src/data/pricing.ts
      - src/data/deliverables.ts
      - src/lib/recommendationEngine.ts
      - public/images/generated/**
      - package.json
      - pnpm-lock.yaml
      - next.config.ts
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: branding-tatva-services-page-gate
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 34

    steps:
      - name: Check out the application without the large media archive
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/public/videos/*
            !/public/audio/*

      - name: Use Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Activate pnpm
        shell: bash
        run: |
          corepack enable
          corepack prepare pnpm@10.28.0 --activate

      - name: Install dependencies and Chromium
        shell: bash
        run: |
          pnpm install --frozen-lockfile
          pnpm add --save-dev --lockfile=false playwright@1.54.2
          pnpm exec playwright install --with-deps chromium

      - name: Build the production application
        env:
          NEXT_TELEMETRY_DISABLED: 1
        run: pnpm build

      - name: Start the production server
        env:
          NEXT_TELEMETRY_DISABLED: 1
        shell: bash
        run: |
          pnpm start --hostname 127.0.0.1 --port 3000 > /tmp/services-page.log 2>&1 &
          echo $! > /tmp/services-page.pid
          for attempt in {1..90}; do
            if curl --fail --silent http://127.0.0.1:3000/services > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/services-page.log
          exit 1

      - name: Walk every Services chapter, interaction, and viewport
        env:
          AUDIT_BASE_URL: http://127.0.0.1:3000
        run: node scripts/services_page_gate.cjs

      - name: Measure native control, exploration density, and compressed scenes
        env:
          AUDIT_BASE_URL: http://127.0.0.1:3000
          AUDIT_COMMIT: ${{ github.sha }}
        run: node scripts/services_scroll_experience_gate.cjs

      - name: Stop the production server
        if: always()
        shell: bash
        run: |
          if [ -f /tmp/services-page.pid ]; then
            kill "$(cat /tmp/services-page.pid)" || true
          fi
          cat /tmp/services-page.log || true

      - name: Upload Services journey evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: services-page-evidence
          path: |
            services-page-audit/*
            services-scroll-audit/*
          if-no-files-found: error
          retention-days: 7
