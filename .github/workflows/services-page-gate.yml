name: Services release gate
run-name: Services release gate · ${{ github.sha }}

on:
  workflow_dispatch:
  push:
    branches:
      - homepage-cinematic-recovery
    paths:
      - .github/workflows/services-page-gate.yml
      - docs/SERVICES_SCROLL_MAP.md
      - scripts/services_page_gate.cjs
      - scripts/services_scroll_experience_gate.cjs
      - scripts/services_semantic_progress_gate.cjs
      - scripts/services_native_input_gate.cjs
      - scripts/services_archive_gate.cjs
      - scripts/services_anchor_gate.cjs
      - scripts/services_exploration_density_report.cjs
      - scripts/services_media_loading_gate.cjs
      - scripts/services_media_release_gate.cjs
      - scripts/services_hash_override_gate.cjs
      - src/app/services/**
      - src/sections/Services/**
      - src/components/SectionJumpNav.tsx
      - src/components/BackgroundVideo.tsx
      - src/components/PhotoHero.tsx
      - src/components/TexturedDark.tsx
      - src/components/SmoothScrollProvider.tsx
      - src/components/CalendlyEmbed.tsx
      - src/components/SeasonalCalendarPanel.tsx
      - src/components/PricingProvider.tsx
      - src/components/RegionSelector.tsx
      - src/data/services.ts
      - src/data/pricing.ts
      - src/data/deliverables.ts
      - src/lib/servicesJourney.ts
      - src/lib/recommendationEngine.ts
      - package.json
      - pnpm-lock.yaml
      - next.config.ts
      - public/images/services-*-film-v2-poster.jpg
      - public/videos/services-*-film-v2.mp4
      - public/videos/site-seasonal-conversation-film-v2.mp4

permissions:
  contents: read

concurrency:
  group: branding-tatva-services-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Check out the exact Services source without the large media archive
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/public/videos/*
            !/public/audio/*
            /public/videos/services-*-film-v2.mp4
            /public/videos/pexels-valley-first-light.mp4
            /public/videos/pexels-aspen-sunburst.mp4
            /public/videos/site-seasonal-conversation-film-v2.mp4

      - name: Use Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Activate pnpm
        shell: bash
        run: |
          corepack enable
          corepack prepare pnpm@10.28.0 --activate

      - name: Verify distinct long-form Services films
        run: node scripts/services_media_release_gate.cjs

      - name: Install dependencies and Chromium
        shell: bash
        run: |
          pnpm install --frozen-lockfile
          pnpm add --save-dev --lockfile=false playwright@1.54.2
          pnpm exec playwright install --with-deps chromium

      - name: Build the production application
        env:
          NEXT_TELEMETRY_DISABLED: 1
        run: pnpm build

      - name: Start the production server
        env:
          NEXT_TELEMETRY_DISABLED: 1
        shell: bash
        run: |
          pnpm start --hostname 127.0.0.1 --port 3000 > /tmp/services-release.log 2>&1 &
          echo $! > /tmp/services-release.pid
          for attempt in {1..100}; do
            if curl --fail --silent http://127.0.0.1:3000/services > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/services-release.log
          exit 1

      - name: Walk every Services chapter and interaction
        env:
          AUDIT_BASE_URL: http://127.0.0.1:3000
        run: node scripts/services_page_gate.cjs

      - name: Measure native control and compressed scenes
        env:
          AUDIT_BASE_URL: http://127.0.0.1:3000
          AUDIT_COMMIT: ${{ github.sha }}
        run: node scripts/services_scroll_experience_gate.cjs

      - name: Record semantic exploration density
        env:
          AUDIT_BASE_URL: http://127.0.0.1:3000
          AUDIT_COMMIT: ${{ github.sha }}
        run: node scripts/services_exploration_density_report.cjs

      - name: Verify semantic scroll progression and explicit commitment
        env:
          AUDIT_BASE_URL: http://127.0.0.1:3000
        run: node scripts/services_semantic_progress_gate.cjs

      - name: Verify archive progression on desktop and tap control on touch
        env:
          AUDIT_BASE_URL: http://127.0.0.1:3000
        run: node scripts/services_archive_gate.cjs

      - name: Verify readable direct-anchor landings
        env:
          AUDIT_BASE_URL: http://127.0.0.1:3000
        run: node scripts/services_anchor_gate.cjs

      - name: Verify closing media stays out of the initial waterfall
        env:
          AUDIT_BASE_URL: http://127.0.0.1:3000
        run: node scripts/services_media_loading_gate.cjs

      - name: Verify manual scroll cancels delayed hash recovery
        env:
          AUDIT_BASE_URL: http://127.0.0.1:3000
        run: node scripts/services_hash_override_gate.cjs

      - name: Verify wheel, keyboard, anchors, history, reversal, and sticky re-entry
        env:
          AUDIT_BASE_URL: http://127.0.0.1:3000
        run: node scripts/services_native_input_gate.cjs

      - name: Stop the production server
        if: always()
        shell: bash
        run: |
          if [ -f /tmp/services-release.pid ]; then
            kill "$(cat /tmp/services-release.pid)" || true
          fi
          cat /tmp/services-release.log || true

      - name: Upload Services release evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: services-release-evidence
          path: |
            services-page-audit/*
            services-scroll-audit/*
            services-scroll-experience-audit/*
          if-no-files-found: warn
          retention-days: 7
