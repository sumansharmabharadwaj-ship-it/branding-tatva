name: About route memory gate
run-name: About memory · ${{ github.sha }}

on:
  workflow_dispatch:
  push:
    branches:
      - homepage-cinematic-recovery
    paths:
      - .github/workflows/about-route-memory-gate.yml
      - scripts/about_route_memory_gate.cjs
      - src/app/about/**
      - src/components/AboutSplitHero.tsx
      - src/components/MeadowClosing.tsx
      - src/components/ParallaxVideoBackdrop.tsx
      - src/components/BackgroundVideo.tsx
      - src/components/AboutRouteNavigationRuntime.tsx
      - src/hooks/useVideoFadeIn.ts
      - src/sections/About/**
      - package.json
      - pnpm-lock.yaml
      - next.config.ts

permissions:
  contents: read

concurrency:
  group: branding-tatva-about-memory
  cancel-in-progress: true

jobs:
  memory:
    runs-on: ubuntu-latest
    timeout-minutes: 24

    steps:
      - name: Check out application without the media archive
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/public/videos/*
            !/public/audio/*

      - name: Use Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Activate pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.28.0 --activate

      - name: Install application and browser runner
        run: |
          pnpm install --frozen-lockfile
          pnpm add --save-dev --lockfile=false playwright@1.54.2
          pnpm exec playwright install --with-deps chromium

      - name: Create a deterministic lightweight video response
        run: |
          ffmpeg -hide_banner -loglevel error -y \
            -f lavfi -i color=c=black:s=32x32:d=1:r=12 \
            -an -c:v libx264 -pix_fmt yuv420p -movflags +faststart \
            /tmp/about-memory-video.mp4

      - name: Build the production application
        env:
          NEXT_TELEMETRY_DISABLED: 1
        run: pnpm build

      - name: Start the production server
        env:
          NEXT_TELEMETRY_DISABLED: 1
        run: |
          pnpm start --hostname 127.0.0.1 --port 3000 > /tmp/branding-tatva-about-memory.log 2>&1 &
          echo $! > /tmp/branding-tatva-about-memory.pid
          for attempt in {1..90}; do
            if curl --fail --silent http://127.0.0.1:3000/work > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/branding-tatva-about-memory.log
          exit 1

      - name: Measure repeated About route round trips
        env:
          AUDIT_BASE_URL: http://127.0.0.1:3000
          ABOUT_MEMORY_MOCK_VIDEO: /tmp/about-memory-video.mp4
          ABOUT_MEMORY_WARMUPS: 1
          ABOUT_MEMORY_TRIPS: 4
          ABOUT_MEMORY_ENFORCE: 0
        run: node scripts/about_route_memory_gate.cjs

      - name: Stop the production server
        if: always()
        run: |
          if [ -f /tmp/branding-tatva-about-memory.pid ]; then
            kill "$(cat /tmp/branding-tatva-about-memory.pid)" || true
          fi
          cat /tmp/branding-tatva-about-memory.log || true

      - name: Upload About memory evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: branding-tatva-about-memory
          path: about-memory-audit/*
          if-no-files-found: warn
          retention-days: 7
