name: About route memory gate
run-name: About memory · ${{ github.sha }}

on:
  workflow_dispatch:
  push:
    branches:
      - homepage-cinematic-recovery
      - august-8-isolated
    paths:
      - .github/workflows/about-route-memory-gate.yml
      - scripts/about_resolution_quality_gate.cjs
      - scripts/about_resolution_rendered_gate.cjs
      - scripts/about_route_memory_gate.cjs
      - src/app/about/**
      - src/components/AboutSplitHero.tsx
      - src/components/AboutSignalField3D.tsx
      - src/components/MeadowClosing.tsx
      - src/components/ParallaxVideoBackdrop.tsx
      - src/components/BackgroundVideo.tsx
      - src/components/VideoWarden.tsx
      - src/hooks/useVideoFadeIn.ts
      - src/sections/About/**
      - package.json
      - pnpm-lock.yaml
      - next.config.ts

permissions:
  contents: read

concurrency:
  group: branding-tatva-about-memory
  cancel-in-progress: true

jobs:
  memory:
    runs-on: ubuntu-latest
    timeout-minutes: 24

    steps:
      - name: Check out application without the media archive
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/public/videos/*
            !/public/audio/*

      - name: Use Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Verify About source contracts before installation
        run: npm run check:about

      - name: Activate pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.28.0 --activate

      - name: Install application and browser runner
        run: |
          pnpm install --frozen-lockfile
          pnpm add --save-dev --lockfile=false playwright@1.54.2
          pnpm exec playwright install --with-deps chromium

      - name: Create a deterministic lightweight video response
        shell: bash
        run: |
          printf '%s' '' | base64 --decode > /tmp/about-memory-video.mp4
          test -s /tmp/about-memory-video.mp4

      - name: Build the production application
        env:
          NEXT_TELEMETRY_DISABLED: 1
        run: pnpm build

      - name: Start the production server
        env:
          NEXT_TELEMETRY_DISABLED: 1
        run: |
          pnpm start --hostname 127.0.0.1 --port 3000 > /tmp/branding-tatva-about-memory.log 2>&1 &
          echo $! > /tmp/branding-tatva-about-memory.pid
          for attempt in {1..90}; do
            if curl --fail --silent http://127.0.0.1:3000/services > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/branding-tatva-about-memory.log
          exit 1

      - name: Measure repeated About route round trips
        id: memory
        continue-on-error: true
        env:
          AUDIT_BASE_URL: http://127.0.0.1:3000
          ABOUT_MEMORY_MOCK_VIDEO: /tmp/about-memory-video.mp4
          ABOUT_MEMORY_WARMUPS: 1
          ABOUT_MEMORY_TRIPS: 4
          ABOUT_MEMORY_ENFORCE: 1
        run: node scripts/about_route_memory_gate.cjs

      - name: Verify the rendered About closing record
        id: rendered
        continue-on-error: true
        env:
          AUDIT_BASE_URL: http://127.0.0.1:3000
          ABOUT_MEMORY_MOCK_VIDEO: /tmp/about-memory-video.mp4
        run: npm run check:about:rendered

      - name: Enforce About browser gates
        if: ${{ always() }}
        env:
          MEMORY_OUTCOME: ${{ steps.memory.outcome }}
          RENDERED_OUTCOME: ${{ steps.rendered.outcome }}
        shell: bash
        run: |
          failures=()
          if [ "$MEMORY_OUTCOME" != "success" ]; then
            failures+=("memory=$MEMORY_OUTCOME")
          fi
          if [ "$RENDERED_OUTCOME" != "success" ]; then
            failures+=("rendered=$RENDERED_OUTCOME")
          fi
          if [ "${#failures[@]}" -gt 0 ]; then
            printf 'About browser gates failed: %s\n' "${failures[*]}"
            exit 1
          fi
          echo "About memory and responsive rendering gates passed."

      - name: Stop the production server
        if: always()
        run: |
          if [ -f /tmp/branding-tatva-about-memory.pid ]; then
            kill "$(cat /tmp/branding-tatva-about-memory.pid)" || true
          fi
          cat /tmp/branding-tatva-about-memory.log || true

      - name: Upload About memory evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: branding-tatva-about-memory
          path: |
            about-memory-audit/*
            about-resolution-audit/*
          if-no-files-found: warn
          retention-days: 7
