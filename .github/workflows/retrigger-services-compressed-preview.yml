name: Retrigger compressed Services preview

on:
  push:
    branches:
      - preview/services-compressed-journey-v2
    paths:
      - .github/workflows/retrigger-services-compressed-preview.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  retrigger:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out the frozen preview branch
        uses: actions/checkout@v4
        with:
          ref: preview/services-compressed-journey-v2
          fetch-depth: 1
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            .github/workflows/retrigger-services-compressed-preview.yml
            src/app/services/compressedJourneyPreviewV2.ts

      - name: Produce a source-path bot commit and remove this workflow
        shell: bash
        run: |
          cat > src/app/services/compressedJourneyPreviewV2.ts <<'EOF'
          // Deployment-only marker for the frozen compressed Services review.
          // The application never imports this module.
          export const compressedServicesReviewBuild = "2026-08-06-v2-actions" as const;
          EOF
          rm .github/workflows/retrigger-services-compressed-preview.yml

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/app/services/compressedJourneyPreviewV2.ts .github/workflows/retrigger-services-compressed-preview.yml
          git diff --cached --check
          git commit -m "Retrigger the frozen Services review deployment"
          git push origin HEAD:preview/services-compressed-journey-v2
