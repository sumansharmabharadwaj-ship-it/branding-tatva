name: Apply poster-first motion media gate

on:
  push:
    branches:
      - automation/apply-motion-media-gate-2026-08-04

permissions:
  contents: write

jobs:
  patch-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out automation branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Gate homepage film resources behind confirmed motion permission
        run: |
          python <<'PY'
          from pathlib import Path

          home = Path("src/sections/Home/MoodboardHome.tsx")
          source = home.read_text()
          import_line = 'import { useMotionMediaAllowed } from "@/hooks/useMotionMediaAllowed";\n'
          import_anchor = 'import { useHydratedReducedMotion } from "@/hooks/useHydratedReducedMotion";\n'
          if import_line not in source:
              if import_anchor not in source:
                  raise SystemExit("MoodboardHome motion import anchor was not found")
              source = source.replace(import_anchor, import_anchor + import_line, 1)

          start = source.index("function AmbientVideo")
          end = source.index("function HomeHeader", start)
          block = source[start:end]
          block = block.replace(
              "  const reduced = useHydratedReducedMotion();",
              "  const mediaAllowed = useMotionMediaAllowed();",
              1,
          )
          effect_start = block.index("  useEffect(() => {")
          effect_end_marker = "}, [near, reduced, src]);"
          effect_end = block.index(effect_end_marker, effect_start) + len(effect_end_marker)
          effect = '''  useEffect(() => {
            const video = videoRef.current;
            if (!video) return;
            if (!mediaAllowed || !near) {
              video.pause();
              return;
            }
            void video.play().catch(() => {});
            return () => video.pause();
          }, [mediaAllowed, near, src]);'''.replace("          ", "")
          block = block[:effect_start] + effect + block[effect_end:]
          block = block.replace("{!reduced && src ? (", "{mediaAllowed && src ? (", 1)
          if "near, reduced, src" in block or "!reduced && src" in block:
              raise SystemExit("MoodboardHome retained the old video gate")
          source = source[:start] + block + source[end:]
          home.write_text(source)

          tatva = Path("src/sections/Home/MoodboardTatvaFilm.tsx")
          source = tatva.read_text()
          if import_line not in source:
              if import_anchor not in source:
                  raise SystemExit("MoodboardTatvaFilm motion import anchor was not found")
              source = source.replace(import_anchor, import_anchor + import_line, 1)

          start = source.index("function ActiveBackdrop")
          end = source.index("function TatvaDiagram", start)
          block = source[start:end]
          block = block.replace(
              "  const reduced = useHydratedReducedMotion();",
              "  const mediaAllowed = useMotionMediaAllowed();",
              1,
          )
          effect_start = block.index("  useEffect(() => {")
          effect_end_marker = "  }, [element.slug, reduced, visible]);"
          effect_end = block.index(effect_end_marker, effect_start) + len(effect_end_marker)
          effect = '''  useEffect(() => {
            const video = videoRef.current;
            if (!video) return;
            if (!mediaAllowed || !visible) {
              video.pause();
              return;
            }
            void video.play().catch(() => {});
            return () => video.pause();
          }, [element.slug, mediaAllowed, visible]);'''.replace("          ", "")
          block = block[:effect_start] + effect + block[effect_end:]
          block = block.replace(
              "{!reduced && element.video ? (",
              "{mediaAllowed && element.video ? (",
              1,
          )
          if "element.slug, reduced, visible" in block or "!reduced && element.video" in block:
              raise SystemExit("MoodboardTatvaFilm retained the old video gate")
          source = source[:start] + block + source[end:]
          tatva.write_text(source)
          PY

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build the complete site
        run: pnpm build

      - name: Push the verified gate to the moodboard work branch
        run: |
          rm -f .github/workflows/apply-motion-media-gate.yml
          git fetch origin work/home-moodboard-film-2026-08-04
          git reset --mixed origin/work/home-moodboard-film-2026-08-04
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/sections/Home/MoodboardHome.tsx src/sections/Home/MoodboardTatvaFilm.tsx
          git commit -m "Mount homepage films only after motion permission"
          git push origin HEAD:work/home-moodboard-film-2026-08-04
