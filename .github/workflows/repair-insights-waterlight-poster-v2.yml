name: Deterministic Insights waterlight poster repair

on:
  workflow_dispatch:
  push:
    branches:
      - homepage-cinematic-recovery
    paths:
      - "docs/.repair-insights-waterlight-poster-v2"

permissions:
  contents: write

concurrency:
  group: branding-tatva-insights-waterlight-repair
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out the canonical branch
        uses: actions/checkout@v4
        with:
          ref: homepage-cinematic-recovery
          fetch-depth: 0

      - name: Select and validate approved repository media
        run: |
          set -euo pipefail
          target="public/images/cinematic-waterlight-poster.jpg"
          report="docs/INSIGHTS_WATERLIGHT_ASSET_REPAIR_2026-08-07.md"
          mkdir -p public/images docs

          if [ -s "$target" ] && [ "$(file -b --mime-type "$target")" = "image/jpeg" ]; then
            source_path="$target"
            status="already valid"
          else
            find public/images -type f \( -iname '*.jpg' -o -iname '*.jpeg' \) -print | sort > /tmp/all-jpegs.txt
            : > /tmp/valid-jpegs.txt
            while IFS= read -r candidate; do
              [ -n "$candidate" ] || continue
              [ "$candidate" = "$target" ] && continue
              if [ "$(file -b --mime-type "$candidate")" = "image/jpeg" ]; then
                printf '%s\n' "$candidate" >> /tmp/valid-jpegs.txt
              fi
            done < /tmp/all-jpegs.txt

            cat > /tmp/select-waterlight-jpeg.cjs <<'NODE'
          const fs = require('node:fs');
          const files = fs.readFileSync('/tmp/valid-jpegs.txt', 'utf8').split(/\r?\n/).filter(Boolean);
          if (!files.length) throw new Error('No valid committed JPEG is available');
          const weights = {
            waterlight: 150,
            water: 110,
            cinematic: 95,
            mist: 80,
            river: 70,
            lake: 70,
            ocean: 65,
            ripple: 60,
            insight: 55,
            poster: 40,
            hero: 30,
            nature: 20,
          };
          const score = (file) => Object.entries(weights).reduce(
            (total, [term, points]) => total + (file.toLowerCase().includes(term) ? points : 0),
            0,
          );
          files.sort((a, b) => score(b) - score(a) || a.localeCompare(b));
          fs.writeFileSync('/tmp/selected-waterlight-jpeg.txt', `${files[0]}\n`);
          NODE

            node /tmp/select-waterlight-jpeg.cjs
            source_path="$(cat /tmp/selected-waterlight-jpeg.txt)"
            test -n "$source_path"
            cp "$source_path" "$target"
            test "$(file -b --mime-type "$target")" = "image/jpeg"
            status="restored from existing approved repository media"
          fi

          references="$(git grep -n -F '/images/cinematic-waterlight-poster.jpg' -- ':!docs/INSIGHTS_WATERLIGHT_ASSET_REPAIR_2026-08-07.md' || true)"
          target_sha="$(sha256sum "$target" | awk '{print $1}')"
          source_sha="$(sha256sum "$source_path" | awk '{print $1}')"
          bytes="$(wc -c < "$target" | tr -d ' ')"

          {
            echo '# Insights waterlight poster repair'
            echo
            echo '- Date: 7 August 2026'
            echo "- Status: ${status}"
            echo '- Public path: `/images/cinematic-waterlight-poster.jpg`'
            echo "- Repository target: \`${target}\`"
            echo "- Approved source reused: \`${source_path}\`"
            echo "- MIME: \`$(file -b --mime-type "$target")\`"
            echo "- Bytes: \`${bytes}\`"
            echo "- Target SHA-256: \`${target_sha}\`"
            echo "- Source SHA-256: \`${source_sha}\`"
            echo
            echo '## Source references'
            echo
            if [ -n "$references" ]; then
              echo '```text'
              printf '%s\n' "$references"
              echo '```'
            else
              echo 'No literal source reference was found. The path is produced indirectly by the current content or media registry.'
            fi
            echo
            echo 'No new external stock file was introduced. The repaired path reuses an image already approved and committed in this repository.'
          } > "$report"

          git rm -f --ignore-unmatch \
            .github/workflows/repair-insights-waterlight-poster-v2.yml \
            docs/.repair-insights-waterlight-poster-v2
          git diff --check
          git status --short

      - name: Commit the valid poster and its provenance record
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "The repair is already present."
            exit 0
          fi
          git commit -m "Restore the valid Insights waterlight poster"
          git fetch origin homepage-cinematic-recovery
          git rebase origin/homepage-cinematic-recovery
          git push origin HEAD:homepage-cinematic-recovery
