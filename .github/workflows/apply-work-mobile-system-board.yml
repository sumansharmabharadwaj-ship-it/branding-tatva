name: Apply Work mobile system board

on:
  push:
    branches:
      - homepage-cinematic-recovery
    paths:
      - .github/workflows/apply-work-mobile-system-board.yml

permissions:
  contents: write

concurrency:
  group: apply-work-mobile-system-board
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the working branch without the media archive
        uses: actions/checkout@v4
        with:
          ref: homepage-cinematic-recovery
          fetch-depth: 0
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/public/videos/*
            !/public/audio/*

      - name: Use Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Activate pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.28.0 --activate

      - name: Apply, build, and publish
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          for attempt in 1 2 3; do
            echo "Mobile system-board attempt ${attempt}"
            git fetch origin homepage-cinematic-recovery
            git reset --hard origin/homepage-cinematic-recovery

            python <<'PY'
          from pathlib import Path

          path = Path("src/sections/Work/SystemFlagship.tsx")
          workflow = Path(".github/workflows/apply-work-mobile-system-board.yml")
          text = path.read_text(encoding="utf-8")

          def replace_once(old: str, new: str) -> None:
              global text
              count = text.count(old)
              if count != 1:
                  raise RuntimeError(f"Expected one occurrence, found {count}: {old[:160]!r}")
              text = text.replace(old, new, 1)

          replace_once(
              '''  ];

  useEffect(() => {''',
              '''  ];
  const currentStep = steps[active] ?? steps[0];

  useEffect(() => {''',
          )
          replace_once(
              '    if (!hydrated || prefersReducedMotion) return;',
              '    if (!hydrated || prefersReducedMotion || !window.matchMedia("(min-width: 1024px)").matches) return;',
          )
          replace_once(
              '''  function goToStep(index: number) {
    setActive(index);
    const element = stepRefs.current[index];''',
              '''  function goToStep(index: number) {
    setActive(index);
    if (!window.matchMedia("(min-width: 1024px)").matches) return;
    const element = stepRefs.current[index];''',
          )
          replace_once(
              '<section className="relative scroll-mt-28 overflow-hidden py-20 sm:py-28"',
              '<section className="relative scroll-mt-28 overflow-hidden py-14 sm:py-28"',
          )
          replace_once(
              'className="grid gap-8 border-b pb-10 lg:grid-cols-[1fr_auto] lg:items-end"',
              'className="grid gap-6 border-b pb-7 sm:gap-8 sm:pb-10 lg:grid-cols-[1fr_auto] lg:items-end"',
          )
          replace_once(
              'className="mt-12 grid gap-12 lg:grid-cols-[1.05fr_0.95fr] lg:gap-16"',
              'className="mt-8 grid gap-8 sm:mt-12 sm:gap-12 lg:grid-cols-[1.05fr_0.95fr] lg:gap-16"',
          )
          replace_once(
              '''                    onClick={() => goToStep(index)}
                    aria-current={active === index ? "step" : undefined}
                    aria-label={`${String(index + 1).padStart(2, "0")}: ${step.label}`}''',
              '''                    onClick={() => goToStep(index)}
                    aria-current={active === index ? "step" : undefined}
                    aria-pressed={active === index}
                    aria-controls="mobile-system-step"
                    aria-label={`${String(index + 1).padStart(2, "0")}: ${step.label}`}''',
          )
          replace_once(
              '''            </ol>
          </div>

          <div>
            {steps.map((step, index) => (''',
              '''            </ol>

            <AnimatePresence mode="wait" initial={false}>
              <motion.article
                id="mobile-system-step"
                key={currentStep.label}
                role="region"
                aria-label={`${currentStep.label}: ${currentStep.title}`}
                initial={animateTransitions ? { opacity: 0, y: 10 } : false}
                animate={{ opacity: 1, y: 0 }}
                exit={animateTransitions ? { opacity: 0, y: -8 } : undefined}
                transition={{ duration: animateTransitions ? 0.42 : 0, ease: EASE_ORGANIC }}
                className="mt-4 rounded-[1.35rem] border p-5 lg:hidden"
                style={{ borderColor: "rgba(198,169,122,0.3)", backgroundColor: "rgba(23,32,39,0.92)" }}
              >
                <p className="flex items-center justify-between gap-4 text-[0.58rem] font-medium uppercase tracking-[0.17em]" style={{ color: WORK.sand }}>
                  <span>{currentStep.label}</span>
                  <span className="font-display text-sm" aria-hidden="true">
                    {String(active + 1).padStart(2, "0")} / 03
                  </span>
                </p>
                <h3 className="mt-3 font-display text-2xl font-normal leading-tight text-white min-[430px]:text-3xl">
                  {currentStep.title}
                </h3>
                <p className="mt-4 text-[0.95rem] leading-relaxed text-white/76">{currentStep.body}</p>
              </motion.article>
            </AnimatePresence>

            <div
              className="mt-4 rounded-[1.35rem] border p-5 lg:hidden"
              style={{ borderColor: "rgba(198,169,122,0.3)", backgroundColor: "rgba(198,169,122,0.08)" }}
            >
              <p className="text-[0.58rem] font-medium uppercase tracking-[0.17em]" style={{ color: WORK.sand }}>
                Outcome on record
              </p>
              <p className="mt-3 text-[0.95rem] leading-relaxed text-white/82">{project.outcome}</p>
              <Link
                href={`/work/${project.slug}`}
                className="link-underline mt-5 inline-flex items-center gap-2 text-sm font-medium"
                style={{ color: WORK.sand }}
              >
                Read the full case study <span aria-hidden="true">→</span>
              </Link>
            </div>
          </div>

          <div className="hidden lg:block">
            {steps.map((step, index) => (''',
          )

          path.write_text(text, encoding="utf-8")
          workflow.unlink()
          PY

            corepack enable
            pnpm install --frozen-lockfile
            pnpm build

            git add src/sections/Work/SystemFlagship.tsx .github/workflows/apply-work-mobile-system-board.yml
            git commit -m "Turn the mobile system flagship into a three-state board"
            if git push origin HEAD:homepage-cinematic-recovery; then
              exit 0
            fi
          done

          exit 1
