name: Verify original Services media integration

on:
  push:
    branches:
      - services-original-media-rollout
    paths:
      - .github/workflows/apply-services-original-media-code.yml

permissions:
  contents: write

concurrency:
  group: services-original-media-verification
  cancel-in-progress: true

jobs:
  verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out rollout branch
        uses: actions/checkout@v4
        with:
          ref: services-original-media-rollout
          fetch-depth: 0

      - name: Remove superseded hero direction notes
        run: |
          python <<'PY'
          from pathlib import Path
          import re

          def regex_once(text: str, pattern: str, replacement: str, label: str) -> str:
              updated, count = re.subn(pattern, replacement, text, count=1, flags=re.S | re.M)
              if count != 1:
                  raise SystemExit(f"{label}: expected one match, found {count}")
              return updated

          page_path = Path("src/app/services/page.tsx")
          page = page_path.read_text()

          opening_note = (
              '        {/* Curiosity opens on Branding Tatva\'s original root-system\n'
              '            film. The visible work sits above an interconnected\n'
              '            foundation, so the first scene demonstrates the page\'s\n'
              '            central argument before the visitor reads it. The hero\n'
              '            remains a compact secondary-page masthead, while the\n'
              '            chapter index supplies immediate orientation and escape. */}\n'
              '        <ServicesCinematicHero'
          )
          page = regex_once(
              page,
              r'^[ \t]*\{/\* Curiosity —.*?previews the four objections the rest of the page answers\. \*/\}\n[ \t]*<ServicesCinematicHero',
              opening_note,
              "Services opening direction note",
          )

          scrim_note = (
              '          {/* A restrained directional scrim protects the masthead\n'
              '              while leaving the root architecture readable on the\n'
              '              right. The hero shell already carries the cool global\n'
              '              contrast layer, so this remains a local composition aid. */}'
          )
          page = regex_once(
              page,
              r'^[ \t]*\{/\* Phase 1 hero pass\..*?frame stays open and cinematic\. \*/\}',
              scrim_note,
              "Services hero scrim note",
          )

          type_note = (
              '          {/* The word-level headline reveal arrives quickly enough to\n'
              '              remain readable while still participating in the opening\n'
              '              scene. The footage supplies depth; the type supplies the\n'
              '              first clear narrative beat. */}'
          )
          page = regex_once(
              page,
              r'^[ \t]*\{/\* Phase 2, hero motion language:.*?depth through type, no imagery involved\. \*/\}',
              type_note,
              "Services hero type note",
          )

          page_path.write_text(page)
          PY

      - name: Check the focused diff
        run: |
          set -euo pipefail
          git diff --check
          git diff --stat

      - name: Use Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Activate pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.28.0 --activate

      - name: Locate pnpm store
        id: pnpm-cache
        shell: bash
        run: echo "store=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-cache.outputs.store }}
          key: ${{ runner.os }}-pnpm-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build the Next.js application
        run: pnpm build

      - name: Commit verified direction cleanup
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/app/services/page.tsx
          git commit -m "Align Services direction notes with original media"
          git push origin HEAD:services-original-media-rollout
