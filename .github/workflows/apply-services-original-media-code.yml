name: Apply original Services media integration

on:
  push:
    branches:
      - services-original-media-rollout
    paths:
      - .github/workflows/apply-services-original-media-code.yml

permissions:
  contents: write

jobs:
  integrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out rollout branch
        uses: actions/checkout@v4
        with:
          ref: services-original-media-rollout
          fetch-depth: 0

      - name: Integrate generated media into the Services experience
        run: |
          python <<'PY'
          from pathlib import Path
          from textwrap import dedent
          import re

          def block(value: str) -> str:
              return dedent(value).strip("\n")

          def replace_once(text: str, old: str, new: str, label: str) -> str:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected one match, found {count}")
              return text.replace(old, new, 1)

          def regex_once(text: str, pattern: str, replacement: str, label: str) -> str:
              updated, count = re.subn(pattern, replacement, text, count=1, flags=re.S)
              if count != 1:
                  raise SystemExit(f"{label}: expected one match, found {count}")
              return updated

          page_path = Path("src/app/services/page.tsx")
          page = page_path.read_text()

          page = replace_once(
              page,
              'import { PhotoHero } from "@/components/PhotoHero";',
              'import { ServicesCinematicHero } from "@/sections/Services/ServicesCinematicHero";',
              "Services hero import",
          )

          page = replace_once(
              page,
              '  preload("/images/pexels-aspen-sunburst-poster.jpg", { as: "image", fetchPriority: "high" });',
              '  preload("/images/services-hero-root-system-poster.jpg", { as: "image", fetchPriority: "high" });',
              "Services hero poster preload",
          )

          page = replace_once(
              page,
              block('''
                <PhotoHero
                  video="/videos/pexels-aspen-sunburst.mp4"
                  poster="/images/pexels-aspen-sunburst-poster.jpg"
                  minHeight="70vh"
                >
              '''),
              block('''
                <ServicesCinematicHero
                  video="/videos/services-hero-root-system.mp4"
                  poster="/images/services-hero-root-system-poster.jpg"
                  minHeight="70vh"
                >
              '''),
              "Services hero media",
          )

          page = replace_once(page, "        </PhotoHero>", "        </ServicesCinematicHero>", "Services hero closing tag")

          page = regex_once(
              page,
              r'''          /\*\{ Approved awakening footage.*?page wakes into the burst\. \*/\}'''.replace("/*{", "{/*"),
              block('''
                {/* Original Branding Tatva film: a realistic underground root
                    network whose connected paths become visible through a
                    restrained ivory-mineral pulse. The visual teaches the
                    opening idea before the copy completes it: recognition
                    breaks when the system beneath visible work disconnects. */}
              '''),
              "Services hero source note",
          )

          page = replace_once(page, "              <Reveal delay={1.7}>", "              <Reveal delay={0.35}>", "Services hero copy delay")

          page = replace_once(
              page,
              block('''
                <SplitReveal
                  as="h1"
                  splitType="chars"
              '''),
              block('''
                <SplitReveal
                  as="h1"
                  splitType="words"
              '''),
              "Services hero word reveal",
          )

          page = replace_once(
              page,
              block('''
                <BackgroundVideo
                  parallax
                  video="/videos/pexels-redwood-ferns.mp4"
                  videoWebm="/videos/pexels-redwood-ferns.webm"
                  poster="/images/pexels-redwood-ferns-poster.jpg"
                />
              '''),
              block('''
                <BackgroundVideo
                  video="/videos/services-strategy-topography.mp4"
                  poster="/images/services-strategy-topography-poster.jpg"
                />
              '''),
              "Services strategy media",
          )

          page = regex_once(
              page,
              r'''          \{\/\* Approved Education footage.*?reads as shrinking\)\. \*\/\}''',
              block('''
                {/* Original Brand Strategy film: dark topographic terrain
                    clarifies into one deliberate route. It gives the education
                    chapter a service-specific visual argument rather than
                    another interchangeable forest scene. */}
              '''),
              "Services strategy source note",
          )

          page = replace_once(
              page,
              block('''
                <BackgroundVideo
                  parallax
                  video="/videos/pexels-moss-stream.mp4"
                  videoWebm="/videos/pexels-moss-stream.webm"
                  poster="/images/pexels-moss-stream-poster.jpg"
                />
              '''),
              block('''
                <BackgroundVideo
                  video="/videos/services-health-reflection.mp4"
                  poster="/images/services-health-reflection-poster.jpg"
                />
              '''),
              "Services health media",
          )

          page = regex_once(
              page,
              r'''          \{\/\* Media replaced per direct approval.*?2\.0MB MP4 / 0\.7MB WebM\. \*\/\}''',
              block('''
                {/* Original Brand Health film: a glass-dark reflective surface
                    reveals quiet structural fractures beneath it, then settles.
                    The movement behaves like diagnosis, not decorative nature
                    footage, while preserving the page's calm forest register. */}
              '''),
              "Services health source note",
          )

          page_path.write_text(page)
          PY

      - name: Check the focused integration diff
        run: |
          set -euo pipefail
          git diff --check
          git diff --stat
          grep -R "services-hero-root-system\|services-strategy-topography\|services-health-reflection" \
            src/app/services/page.tsx \
            src/sections/Services/ServicesCinematicHero.tsx \
            src/sections/Services/HeroReveal.tsx

      - name: Commit the original-media integration
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/app/services/page.tsx
          git commit -m "Integrate original generated Services films"
          git push origin HEAD:services-original-media-rollout
