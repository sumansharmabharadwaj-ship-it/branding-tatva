name: Homepage V5 prelude timing gate
run-name: Homepage prelude clock · ${{ github.sha }}

on:
  workflow_dispatch:
  push:
    branches:
      - homepage-cinematic-recovery
    paths:
      - .github/workflows/home-v4-loader-timing-gate.yml
      - scripts/home_v4_loader_timing_gate.cjs
      - src/components/PageLoadVeil.tsx
      - src/sections/HomeV5/HomeV5Experience.tsx
      - src/app/page.tsx
      - src/app/home-v5.css
      - package.json
      - pnpm-lock.yaml
      - next.config.ts

permissions:
  contents: read

concurrency:
  group: branding-tatva-home-v4-loader-${{ github.ref }}
  cancel-in-progress: true

jobs:
  timing:
    runs-on: ubuntu-latest
    timeout-minutes: 18

    steps:
      - name: Check out the exact homepage source without the media archive
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/public/videos/*
            !/public/audio/*

      - name: Use Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Activate pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.28.0 --activate

      - name: Install dependencies and Chromium
        run: |
          pnpm install --frozen-lockfile
          pnpm add --save-dev --lockfile=false playwright@1.54.2
          pnpm exec playwright install --with-deps chromium

      - name: Build production application
        env:
          NEXT_TELEMETRY_DISABLED: 1
        run: pnpm build

      - name: Start production server
        env:
          NEXT_TELEMETRY_DISABLED: 1
        run: |
          pnpm start --hostname 127.0.0.1 --port 3000 > /tmp/home-v4-loader.log 2>&1 &
          echo $! > /tmp/home-v4-loader.pid
          for attempt in {1..90}; do
            if curl --fail --silent http://127.0.0.1:3000/ > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/home-v4-loader.log
          exit 1

      - name: Enforce first-load and repeat-visit prelude timing
        env:
          AUDIT_BASE_URL: http://127.0.0.1:3000
        run: node scripts/home_v4_loader_timing_gate.cjs

      - name: Stop production server
        if: always()
        run: |
          if [ -f /tmp/home-v4-loader.pid ]; then
            kill "$(cat /tmp/home-v4-loader.pid)" || true
          fi
          cat /tmp/home-v4-loader.log || true

      - name: Upload loader timing evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: home-v4-loader-timing-evidence
          path: homepage-v4-audit/*loader*
          if-no-files-found: warn
          retention-days: 7
