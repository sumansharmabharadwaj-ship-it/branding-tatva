name: Insights final exact-head certification
run-name: Insights final certification · ${{ github.sha }}

on:
  workflow_dispatch:
  push:
    branches:
      - homepage-cinematic-recovery
    paths:
      - .github/workflows/insights-final-certification.yml
      - src/app/insights/**
      - src/components/InsightCard.tsx
      - src/components/InsightsExplorer.tsx
      - src/components/Reveal.tsx
      - src/components/ScrollProgress.tsx
      - src/data/**Insights.ts
      - src/data/insightLibrary.ts
      - src/data/insights.ts
      - src/data/pillarInsights.ts
      - scripts/insights_authority_gate.cjs
      - scripts/insights_browser_gate.cjs
      - scripts/insights_discovery_gate.cjs
      - scripts/insights_media_uniqueness_gate.cjs
      - public/images/insights/**
      - public/videos/insights/**
      - public/images/cinematic-waterlight-poster.jpg
      - public/llms.txt
      - package.json
      - pnpm-lock.yaml
      - next.config.ts

permissions:
  contents: read

concurrency:
  group: branding-tatva-insights-final-certification
  cancel-in-progress: true

jobs:
  certify:
    runs-on: macos-latest
    timeout-minutes: 34

    steps:
      - name: Check out the exact application source without the media archive
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/public/videos/*
            !/public/audio/*
            /public/videos/insights/*

      - name: Use Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Activate pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.28.0 --activate

      - name: Install dependencies and Chromium
        run: |
          pnpm install --frozen-lockfile
          pnpm add --save-dev --lockfile=false playwright@1.54.2
          pnpm exec playwright install chromium

      - name: Validate the restored waterlight poster
        run: |
          test -s public/images/cinematic-waterlight-poster.jpg
          sips -g pixelWidth -g pixelHeight public/images/cinematic-waterlight-poster.jpg \
            | grep -Eq 'pixel(Width|Height): [1-9][0-9]+'

      - name: Build the production application
        env:
          NEXT_TELEMETRY_DISABLED: 1
        run: pnpm build

      - name: Validate unique forward films for guides, archive, and topic hubs
        run: node scripts/insights_media_uniqueness_gate.cjs

      - name: Start the production server
        env:
          NEXT_TELEMETRY_DISABLED: 1
        run: |
          pnpm start --hostname 127.0.0.1 --port 3000 > /tmp/branding-tatva-insights-final.log 2>&1 &
          echo $! > /tmp/branding-tatva-insights-final.pid
          for attempt in {1..90}; do
            if curl --fail --silent http://127.0.0.1:3000/insights > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/branding-tatva-insights-final.log
          exit 1

      - name: Certify authority inventory, article routes, metadata, schema, and viewports
        env:
          AUDIT_BASE_URL: http://127.0.0.1:3000
          AUDIT_COMMIT: ${{ github.sha }}
          INSIGHTS_EXPECTED_MIN: 29
        run: node scripts/insights_authority_gate.cjs

      - name: Certify archive interaction, representative articles, keyboard, and reduced motion
        env:
          AUDIT_BASE_URL: http://127.0.0.1:3000
          AUDIT_COMMIT: ${{ github.sha }}
          INSIGHTS_EXPECTED_GUIDES: 29
        run: node scripts/insights_browser_gate.cjs

      - name: Certify sitemap, feeds, robots, citations, topics, and AI discovery
        env:
          AUDIT_BASE_URL: http://127.0.0.1:3000
          AUDIT_COMMIT: ${{ github.sha }}
          INSIGHTS_EXPECTED_MIN: 29
          INSIGHTS_EXPECTED_TOPICS: 5
        run: node scripts/insights_discovery_gate.cjs

      - name: Report the exact certified source
        run: |
          {
            echo "## Insights final certification"
            echo
            echo "- Commit: \`${GITHUB_SHA}\`"
            echo "- Guides: 29"
            echo "- Topic hubs: 5"
            echo "- Waterlight poster: valid"
            echo "- Authority gate: passed"
            echo "- Browser gate: passed"
            echo "- Discovery gate: passed"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Stop the production server
        if: always()
        run: |
          if [ -f /tmp/branding-tatva-insights-final.pid ]; then
            kill "$(cat /tmp/branding-tatva-insights-final.pid)" || true
          fi
          cat /tmp/branding-tatva-insights-final.log || true

      - name: Upload final Insights evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: branding-tatva-insights-final-${{ github.sha }}
          path: |
            insights-authority-audit/*
            insights-browser-audit/*
            insights-discovery-audit/*
          if-no-files-found: warn
          retention-days: 14
