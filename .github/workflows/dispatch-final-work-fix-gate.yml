name: Dispatch final Work fix gate

on:
  push:
    branches:
      - homepage-cinematic-recovery
    paths:
      - .github/workflows/dispatch-final-work-fix-gate.yml

permissions:
  actions: write
  contents: write

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the working branch
        uses: actions/checkout@v4
        with:
          ref: homepage-cinematic-recovery
          fetch-depth: 0
          filter: blob:none
          sparse-checkout: |
            .github/workflows/dispatch-final-work-fix-gate.yml

      - name: Dispatch the final Work gate and remove this helper
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh workflow run work-page-gate.yml --ref homepage-cinematic-recovery
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/dispatch-final-work-fix-gate.yml
          git commit -m "Remove final Work gate dispatcher"
          git push origin HEAD:homepage-cinematic-recovery
