name: Homepage audit build check

on:
  pull_request:
    branches:
      - redesign/conversion-architecture
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out audited branch
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build the Next.js site
        run: pnpm build

      - name: Assemble audit artifacts
        run: |
          cp -R .next/static .next/standalone/.next/static
          cp -R public .next/standalone/public
          tar -czf homepage-audit-standalone.tar.gz -C .next/standalone .
          tar -czf homepage-audit-source.tar.gz src next.config.ts package.json pnpm-lock.yaml

      - name: Upload standalone preview artifact
        uses: actions/upload-artifact@v4
        with:
          name: homepage-audit-standalone-tar
          path: homepage-audit-standalone.tar.gz
          if-no-files-found: error
          retention-days: 1

      - name: Upload audited source artifact
        uses: actions/upload-artifact@v4
        with:
          name: homepage-audit-source
          path: homepage-audit-source.tar.gz
          if-no-files-found: error
          retention-days: 1
