name: Form API runtime gate

on:
  workflow_dispatch:
  workflow_run:
    workflows:
      - Permanent preview source gate
    types:
      - completed

permissions:
  contents: read

concurrency:
  group: form-api-runtime-gate
  cancel-in-progress: true

jobs:
  safe-api-runtime:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out canonical preview source
        uses: actions/checkout@v4
        with:
          ref: homepage-cinematic-recovery

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Verify invalid requests fail safely and release endpoints remain uncached
        env:
          PREVIEW_URL: https://branding-tatva-git-homepage-cinematic-recovery-suman22.vercel.app
          API_OUTPUT_DIR: artifacts/form-api-runtime-gate
        run: node scripts/form_api_runtime_gate.cjs

      - name: Upload API evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: form-api-runtime-gate-${{ github.run_id }}
          path: artifacts/form-api-runtime-gate
          if-no-files-found: warn
          retention-days: 14
