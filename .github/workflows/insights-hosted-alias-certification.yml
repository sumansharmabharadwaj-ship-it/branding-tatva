name: Insights hosted permanent-alias certification
run-name: Insights hosted certification · ${{ github.event.workflow_run.head_sha }}

on:
  workflow_dispatch:
  workflow_run:
    workflows:
      - Insights final exact-head certification
    types:
      - completed

permissions:
  contents: read

concurrency:
  group: branding-tatva-insights-hosted-alias
  cancel-in-progress: true

jobs:
  certify-hosted-alias:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'homepage-cinematic-recovery')
    runs-on: macos-latest
    timeout-minutes: 32

    steps:
      - name: Check out the exact certified source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && github.sha || github.event.workflow_run.head_sha }}
          fetch-depth: 1
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/public/videos/*
            !/public/audio/*

      - name: Use Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Activate pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.28.0 --activate

      - name: Install the browser runner
        run: |
          pnpm install --frozen-lockfile
          pnpm add --save-dev --lockfile=false playwright@1.54.2
          pnpm exec playwright install chromium

      - name: Wait for the permanent alias to serve the exact certified commit
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PREVIEW_URL: https://branding-tatva-git-homepage-cinematic-recovery-suman22.vercel.app
          CANONICAL_BRANCH: homepage-cinematic-recovery
          GATE_TIMEOUT_MS: "900000"
          GATE_POLL_MS: "15000"
        run: node scripts/permanent_preview_source_gate.cjs

      - name: Certify the hosted authority inventory and article viewports
        env:
          AUDIT_BASE_URL: https://branding-tatva-git-homepage-cinematic-recovery-suman22.vercel.app
          AUDIT_COMMIT: ${{ github.event_name == 'workflow_dispatch' && github.sha || github.event.workflow_run.head_sha }}
          INSIGHTS_EXPECTED_MIN: 29
        run: node scripts/insights_authority_gate.cjs

      - name: Certify hosted archive interaction, representative articles, keyboard, and reduced motion
        env:
          AUDIT_BASE_URL: https://branding-tatva-git-homepage-cinematic-recovery-suman22.vercel.app
          AUDIT_COMMIT: ${{ github.event_name == 'workflow_dispatch' && github.sha || github.event.workflow_run.head_sha }}
          INSIGHTS_EXPECTED_GUIDES: 29
        run: node scripts/insights_browser_gate.cjs

      - name: Certify hosted sitemap, feeds, robots, citations, topics, and AI discovery
        env:
          AUDIT_BASE_URL: https://branding-tatva-git-homepage-cinematic-recovery-suman22.vercel.app
          AUDIT_COMMIT: ${{ github.event_name == 'workflow_dispatch' && github.sha || github.event.workflow_run.head_sha }}
          INSIGHTS_EXPECTED_MIN: 29
          INSIGHTS_EXPECTED_TOPICS: 5
        run: node scripts/insights_discovery_gate.cjs

      - name: Report the permanent-alias certification
        run: |
          {
            echo "## Hosted Insights certification"
            echo
            echo "- Alias: https://branding-tatva-git-homepage-cinematic-recovery-suman22.vercel.app"
            echo "- Certified commit: \`${{ github.event_name == 'workflow_dispatch' && github.sha || github.event.workflow_run.head_sha }}\`"
            echo "- Guides: 29"
            echo "- Topic hubs: 5"
            echo "- Source identity: exact"
            echo "- Hosted authority, browser, and discovery gates: passed"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload hosted Insights evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: branding-tatva-insights-hosted-${{ github.event_name == 'workflow_dispatch' && github.sha || github.event.workflow_run.head_sha }}
          path: |
            insights-authority-audit/*
            insights-browser-audit/*
            insights-discovery-audit/*
          if-no-files-found: warn
          retention-days: 14
