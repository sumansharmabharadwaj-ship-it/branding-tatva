name: Apply diagnosis conversion handoff

on:
  push:
    branches:
      - reimagine-project-moves
    paths:
      - .github/workflows/apply-diagnosis-handoff.yml

permissions:
  contents: write

jobs:
  patch-diagnosis:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out the preview branch
        uses: actions/checkout@v4
        with:
          ref: reimagine-project-moves
          fetch-depth: 1
          sparse-checkout: src
          sparse-checkout-cone-mode: true

      - name: Send diagnosis into proof rather than an early sales ask
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("src/sections/Home/ClarityCTA.tsx")
          text = path.read_text()
          marker = "Discuss the right starting point"

          if marker not in text:
              raise SystemExit("Expected diagnosis CTA label was not found")

          marker_index = text.index(marker)
          href = 'href="/contact"'
          href_index = text.rfind(href, 0, marker_index)
          if href_index < 0:
              raise SystemExit("Expected diagnosis CTA href was not found")

          text = (
              text[:href_index]
              + 'href="#evidence-wall-title"'
              + text[href_index + len(href):]
          )
          text = text.replace(marker, "See how decisions become proof", 1)
          path.write_text(text)
          PY

      - name: Commit the source change
        shell: bash
        run: |
          git config user.name "Branding Tatva Build Bot"
          git config user.email "actions@users.noreply.github.com"
          git add src/sections/Home/ClarityCTA.tsx
          git commit -m "Move the diagnosis CTA forward into proof"
          git push origin HEAD:reimagine-project-moves
