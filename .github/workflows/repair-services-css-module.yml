name: Repair Services CSS module selector

on:
  workflow_dispatch:
  push:
    branches:
      - reimagine-project-moves
    paths:
      - .github/workflows/repair-services-css-module.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the preview branch
        uses: actions/checkout@v4
        with:
          ref: reimagine-project-moves
          fetch-depth: 1

      - name: Replace the impure global selector
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("src/sections/Services/ServicesReframe.module.css")
          source = path.read_text()
          before = ":global(body:has([data-services-reframe])) {"
          after = ".root[data-services-reframe] {"
          if before not in source:
              raise SystemExit("Expected selector was not found")
          path.write_text(source.replace(before, after, 1))
          PY

      - name: Commit the repaired stylesheet
        run: |
          git config user.name "branding-tatva-release-bot"
          git config user.email "actions@users.noreply.github.com"
          git add src/sections/Services/ServicesReframe.module.css
          git commit -m "Make the Services stylesheet CSS-module safe"
          git push origin HEAD:reimagine-project-moves
