name: Repair Services contact audit selector

on:
  workflow_dispatch:
  push:
    branches:
      - reimagine-project-moves
    paths:
      - .github/workflows/repair-services-css-module.yml

permissions:
  contents: write

concurrency:
  group: branding-tatva-services-audit-instrumentation
  cancel-in-progress: true

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Check out only the audit harness
        uses: actions/checkout@v4
        with:
          ref: reimagine-project-moves
          fetch-depth: 1
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /scripts/services_release_gate.cjs

      - name: Select the enquiry email exactly and fail immediately on harness errors
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("scripts/services_release_gate.cjs")
          source = path.read_text()

          email_before = '  await contactPage.getByLabel("Email").fill("qa@example.com");'
          email_after = '  await contactPage.getByRole("textbox", { name: "Email", exact: true }).fill("qa@example.com");'
          if email_before not in source:
              raise SystemExit("Contact email selector was not found")
          source = source.replace(email_before, email_after, 1)

          catch_before = (
              '})().catch((error) => {\n'
              '  console.error(error);\n'
              '  process.exitCode = 1;\n'
              '});'
          )
          catch_after = (
              '})().catch((error) => {\n'
              '  clearTimeout(auditWatchdog);\n'
              '  console.error(error);\n'
              '  process.exit(1);\n'
              '});'
          )
          if catch_before not in source:
              raise SystemExit("Audit catch block was not found")
          source = source.replace(catch_before, catch_after, 1)

          path.write_text(source)
          PY

      - name: Commit the repaired audit selector
        run: |
          git config user.name "branding-tatva-release-bot"
          git config user.email "actions@users.noreply.github.com"
          git add scripts/services_release_gate.cjs
          git commit -m "Repair Services contact audit selector"
          git push origin HEAD:reimagine-project-moves
