name: Repair Services route typing

on:
  workflow_dispatch:
  push:
    branches:
      - reimagine-project-moves
    paths:
      - .github/workflows/repair-services-css-module.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the preview branch
        uses: actions/checkout@v4
        with:
          ref: reimagine-project-moves
          fetch-depth: 1

      - name: Widen the contextual stage parameter
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("src/sections/Services/ServicesReframe.tsx")
          source = path.read_text()
          before = "function contactHref(packageSlug: string, stage = scenario.key) {"
          after = "function contactHref(packageSlug: string, stage: string = scenario.key) {"
          if before not in source:
              raise SystemExit("Expected helper signature was not found")
          path.write_text(source.replace(before, after, 1))
          PY

      - name: Commit the repaired Services helper
        run: |
          git config user.name "branding-tatva-release-bot"
          git config user.email "actions@users.noreply.github.com"
          git add src/sections/Services/ServicesReframe.tsx
          git commit -m "Allow health-check context in Services enquiry links"
          git push origin HEAD:reimagine-project-moves
