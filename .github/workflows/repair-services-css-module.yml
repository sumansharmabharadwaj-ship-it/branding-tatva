name: Repair Services audit bounds

on:
  workflow_dispatch:
  push:
    branches:
      - reimagine-project-moves
    paths:
      - .github/workflows/repair-services-css-module.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the preview branch
        uses: actions/checkout@v4
        with:
          ref: reimagine-project-moves
          fetch-depth: 1

      - name: Bound navigation and media promises
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("scripts/services_release_gate.cjs")
          source = path.read_text()

          play_before = "      await element.play();"
          play_after = (
              "      await Promise.race([\n"
              "        element.play(),\n"
              "        new Promise((_, reject) =>\n"
              "          setTimeout(() => reject(new Error(\"Media play timed out after 5 seconds\")), 5000),\n"
              "        ),\n"
              "      ]);"
          )
          if play_before not in source:
              raise SystemExit("Expected media probe was not found")
          source = source.replace(play_before, play_after, 1)

          if 'waitUntil: "networkidle"' not in source:
              raise SystemExit("Expected navigation waits were not found")
          source = source.replace('waitUntil: "networkidle"', 'waitUntil: "domcontentloaded"')

          source = source.replace(
              "const page = await context.newPage();",
              "const page = await context.newPage();\n    page.setDefaultTimeout(10000);",
              1,
          )
          source = source.replace(
              "const contactPage = await contactContext.newPage();",
              "const contactPage = await contactContext.newPage();\n  contactPage.setDefaultTimeout(10000);",
              1,
          )

          path.write_text(source)
          PY

      - name: Commit the bounded audit harness
        run: |
          git config user.name "branding-tatva-release-bot"
          git config user.email "actions@users.noreply.github.com"
          git add scripts/services_release_gate.cjs
          git commit -m "Bound Services browser audit waits"
          git push origin HEAD:reimagine-project-moves
