name: Repair Services local analytics audit noise

on:
  workflow_dispatch:
  push:
    branches:
      - reimagine-project-moves
    paths:
      - .github/workflows/repair-services-css-module.yml

permissions:
  contents: write

concurrency:
  group: branding-tatva-services-audit-instrumentation
  cancel-in-progress: true

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Check out only the audit harness
        uses: actions/checkout@v4
        with:
          ref: reimagine-project-moves
          fetch-depth: 1
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /scripts/services_release_gate.cjs

      - name: Ignore only the unavailable local Vercel analytics endpoint
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("scripts/services_release_gate.cjs")
          source = path.read_text()

          before = (
              '    page.on("console", (message) => {\n'
              '      if (message.type() === "error") consoleErrors.push(message.text());\n'
              '    });'
          )
          after = (
              '    page.on("console", (message) => {\n'
              '      if (message.type() !== "error") return;\n'
              '      const text = message.text();\n'
              '      const location = message.location();\n'
              '      if (\n'
              '        location.url.includes("/_vercel/") ||\n'
              '        text.includes("/_vercel/insights") ||\n'
              '        text.includes("/_vercel/speed-insights")\n'
              '      ) {\n'
              '        return;\n'
              '      }\n'
              '      consoleErrors.push(text);\n'
              '    });'
          )
          if before not in source:
              raise SystemExit("Console handler was not found")
          path.write_text(source.replace(before, after, 1))
          PY

      - name: Commit the local analytics filter
        run: |
          git config user.name "branding-tatva-release-bot"
          git config user.email "actions@users.noreply.github.com"
          git add scripts/services_release_gate.cjs
          git commit -m "Exclude local Vercel analytics noise from Services QA"
          git push origin HEAD:reimagine-project-moves
