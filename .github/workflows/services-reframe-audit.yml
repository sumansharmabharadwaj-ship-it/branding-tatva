# Final candidate includes shared Footer and Contact media in the QA checkout.
name: Services reframe release gate
run-name: Services reframe gate · ${{ github.sha }}

on:
  workflow_dispatch:
  push:
    branches:
      - reimagine-project-moves
    paths:
      - .github/workflows/services-reframe-audit.yml
      - scripts/services_release_gate.cjs
      - scripts/api_contract_gate.cjs
      - src/app/services/page.tsx
      - src/app/contact/page.tsx
      - src/app/api/contact/route.ts
      - src/components/ContactForm.tsx
      - src/components/PricingProvider.tsx
      - src/data/pricing.ts
      - src/data/services.ts
      - src/lib/contact-schema.ts
      - src/sections/Services/ServicesReframe.tsx
      - src/sections/Services/ServicesReframe.module.css

permissions:
  contents: read

concurrency:
  group: branding-tatva-services-reframe-gate
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 24

    steps:
      - name: Check out the exact Services candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/public/videos/*
            !/public/images/*
            /public/videos/pexels-aspen-sunburst.webm
            /public/videos/pexels-fog-sunrise.webm
            /public/videos/pixabay-campfire-conversation.mp4
            /public/videos/own-jagged-peaks.mp4
            /public/videos/pexels-studio-morning-light.webm
            /public/videos/pexels-studio-morning-light.mp4
            /public/images/pexels-aspen-sunburst-poster.jpg
            /public/images/higgsfield-himalayan-valley-poster.jpg
            /public/images/pexels-root-network-poster.jpg
            /public/images/pexels-river-dawn-poster.jpg
            /public/images/card-dr-haley-nutrition-poster.jpg
            /public/images/pexels-fog-sunrise-poster.jpg
            /public/images/pixabay-campfire-conversation-poster.jpg
            /public/images/own-jagged-peaks.jpg
            /public/images/pexels-studio-morning-light-poster.jpg

      - name: Use Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Activate pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.28.0 --activate

      - name: Install application and browser audit dependencies
        run: |
          pnpm install --frozen-lockfile
          pnpm add --save-dev --lockfile=false playwright@1.54.2

      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Build the production application
        env:
          NEXT_TELEMETRY_DISABLED: 1
        run: pnpm build

      - name: Start the production application
        env:
          NEXT_TELEMETRY_DISABLED: 1
        run: |
          pnpm start --hostname 127.0.0.1 --port 3000 > /tmp/branding-tatva-services.log 2>&1 &
          echo $! > /tmp/branding-tatva-services.pid
          for attempt in {1..90}; do
            if curl --fail --silent http://127.0.0.1:3000/services > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/branding-tatva-services.log
          exit 1

      - name: Verify protected API contracts
        env:
          AUDIT_BASE_URL: http://127.0.0.1:3000
        run: node scripts/api_contract_gate.cjs

      - name: Audit Services layout, pricing, interactions, media, and enquiry flow
        env:
          AUDIT_BASE_URL: http://127.0.0.1:3000
          AUDIT_COMMIT: ${{ github.sha }}
        run: node scripts/services_release_gate.cjs

      - name: Stop the application
        if: always()
        run: |
          if [ -f /tmp/branding-tatva-services.pid ]; then
            kill "$(cat /tmp/branding-tatva-services.pid)" || true
          fi

      - name: Upload Services release evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: branding-tatva-services-reframe-audit
          path: services-audit/*
          if-no-files-found: error
          retention-days: 7
