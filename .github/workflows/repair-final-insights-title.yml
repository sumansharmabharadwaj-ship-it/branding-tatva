name: Repair final Insights title

on:
  push:
    branches:
      - homepage-cinematic-recovery
    paths:
      - .github/workflows/repair-final-insights-title.yml

permissions:
  contents: write
  actions: write

concurrency:
  group: branding-tatva-final-insights-title-repair
  cancel-in-progress: false

jobs:
  repair:
    if: github.event.head_commit.message == 'Trigger final Insights title repair'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out the exact triggering commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Shorten the remaining overlong search title
        run: |
          python - <<'PY'
          from pathlib import Path

          insight_path = Path("src/data/competitorResearchInsights.ts")
          source = insight_path.read_text()
          old_title = 'seoTitle: "Competitor research for brand strategy without copying competitors",'
          new_title = 'seoTitle: "Competitor research without copying the category",'
          if source.count(old_title) != 1:
              raise SystemExit("The expected competitor-research SEO title was not found exactly once.")
          insight_path.write_text(source.replace(old_title, new_title))
          PY

      - name: Remove this one-use workflow and push the source repair
        run: |
          set -euo pipefail
          rm -f .github/workflows/repair-final-insights-title.yml
          git config user.name "Branding Tatva release repair"
          git config user.email "actions@users.noreply.github.com"
          git add src/data/competitorResearchInsights.ts .github/workflows/repair-final-insights-title.yml
          git commit -m "Shorten competitor-research metadata title"
          git push origin HEAD:homepage-cinematic-recovery

      - name: Dispatch the complete discovery and release gates
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run insights-discovery-gate.yml --ref homepage-cinematic-recovery
          gh workflow run preview-release-gate.yml --ref homepage-cinematic-recovery
