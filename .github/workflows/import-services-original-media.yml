name: Import original Services media

on:
  push:
    branches:
      - services-original-media-rollout
    paths:
      - .github/workflows/import-services-original-media.yml

permissions:
  contents: write

jobs:
  import-media:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out rollout branch
        uses: actions/checkout@v4
        with:
          ref: services-original-media-rollout
          fetch-depth: 0

      - name: Download generated films and matching posters
        env:
          HERO_VIDEO_URL: "https://production-273614-media-export.storage.googleapis.com/58971987-3d4a-433e-8b32-561326d17874/original.mp4?X-Goog-Algorithm=GOOG4-RSA-SHA256&X-Goog-Credential=descript-api%40production-273614.iam.gserviceaccount.com%2F20260806%2Fauto%2Fstorage%2Fgoog4_request&X-Goog-Date=20260806T092616Z&X-Goog-Expires=86400&X-Goog-SignedHeaders=host&X-Goog-"
          STRATEGY_VIDEO_URL: "https://production-273614-media-export.storage.googleapis.com/50334337-5602-4de5-b8a9-3d2c2dedee84/original.mp4?X-Goog-Algorithm=GOOG4-RSA-SHA256&X-Goog-Credential=descript-api%40production-273614.iam.gserviceaccount.com%2F20260806%2Fauto%2Fstorage%2Fgoog4_request&X-Goog-Date=20260806T095605Z&X-Goog-Expires=86400&X-Goog-SignedHeaders=host&X-Goog-"
          HEALTH_VIDEO_URL: "https://production-273614-media-export.storage.googleapis.com/54e3d353-4a4f-4ab4-b6c4-1a6c31c45874/original.mp4?X-Goog-Algorithm=GOOG4-RSA-SHA256&X-Goog-Credential=descript-api%40production-273614.iam.gserviceaccount.com%2F20260806%2Fauto%2Fstorage%2Fgoog4_request&X-Goog-Date=20260806T095720Z&X-Goog-Expires=86400&X-Goog-SignedHeaders=host&X-Goog-"
          HERO_POSTER_URL: "https://media.canva.com/v2/files/uri:ifs%3A%2F%2FV%2FpQ7MHtzakHxXfFfG3Bl6xTpzRLEy4Q-KFcGoyZSjHHY.jpg?csig=AAAAAAAAAAAAAAAAAAAAAJQ1Wnk4Mf7dthzQmH4cdaOa3pLG8ZgYrxKTQlAPaLuc&exp=1786017900&signer=video-rpc&token=AAIAAVYAL3BRN01IdHpha0h4WGZGZkczQmw2eFRwelJMRXk0US1LRmNHb3laU2pISFkuanBnAAAAAAGf1vZl4P0BSXFnJzsRqls0y3R-TAh9DG6DM82f_rENChYpFUQB"
          STRATEGY_POSTER_URL: "https://media.canva.com/v2/files/uri:ifs%3A%2F%2FV%2F9Bv0ERDvES5QIr479D5BfqEnAv-lXRj4WZtkgEDStmo.jpg?csig=AAAAAAAAAAAAAAAAAAAAAC8iQCgCgjCGWJtnhtVkJgJotlWV8ocTxJwteT1ixScs&exp=1786020420&signer=video-rpc&token=AAIAAVYALzlCdjBFUkR2RVM1UUlyNDc5RDVCZnFFbkF2LWxYUmo0V1p0a2dFRFN0bW8uanBnAAAAAAGf1xzZoJcYA0hcIfN4iEaBEsWsBcJXhd2yjPejmDkHwMQ-pxOz"
          HEALTH_POSTER_URL: "https://media.canva.com/v2/files/uri:ifs%3A%2F%2FV%2FLGMNgZYlP7Aj_j23piTSu4oYu2z-NzFUsd_EO1Q6QPE.jpg?csig=AAAAAAAAAAAAAAAAAAAAAOrbTd3AeIe-R0OTOAfmQyhSWMGc10lM5XJ1H4LteLBj&exp=1786018920&signer=video-rpc&token=AAIAAVYAL0xHTU5nWllsUDdBal9qMjNwaVRTdTRvWXUyei1OekZVc2RfRU8xUTZRUEUuanBnAAAAAAGf1wX2QGTpdJwhTZGevbp1ip4E_p0o-oy-IdEIjw7wFMRbw5p7"
        run: |
          set -euo pipefail
          mkdir -p public/videos public/images

          curl --fail --location --retry 3 --retry-all-errors "$HERO_VIDEO_URL" --output public/videos/services-hero-root-system.mp4
          curl --fail --location --retry 3 --retry-all-errors "$STRATEGY_VIDEO_URL" --output public/videos/services-strategy-topography.mp4
          curl --fail --location --retry 3 --retry-all-errors "$HEALTH_VIDEO_URL" --output public/videos/services-health-reflection.mp4

          curl --fail --location --retry 3 --retry-all-errors "$HERO_POSTER_URL" --output public/images/services-hero-root-system-poster.jpg
          curl --fail --location --retry 3 --retry-all-errors "$STRATEGY_POSTER_URL" --output public/images/services-strategy-topography-poster.jpg
          curl --fail --location --retry 3 --retry-all-errors "$HEALTH_POSTER_URL" --output public/images/services-health-reflection-poster.jpg

          test -s public/videos/services-hero-root-system.mp4
          test -s public/videos/services-strategy-topography.mp4
          test -s public/videos/services-health-reflection.mp4
          test -s public/images/services-hero-root-system-poster.jpg
          test -s public/images/services-strategy-topography-poster.jpg
          test -s public/images/services-health-reflection-poster.jpg

          ls -lh \
            public/videos/services-hero-root-system.mp4 \
            public/videos/services-strategy-topography.mp4 \
            public/videos/services-health-reflection.mp4 \
            public/images/services-hero-root-system-poster.jpg \
            public/images/services-strategy-topography-poster.jpg \
            public/images/services-health-reflection-poster.jpg

      - name: Commit generated media to the rollout branch
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            public/videos/services-hero-root-system.mp4 \
            public/videos/services-strategy-topography.mp4 \
            public/videos/services-health-reflection.mp4 \
            public/images/services-hero-root-system-poster.jpg \
            public/images/services-strategy-topography-poster.jpg \
            public/images/services-health-reflection-poster.jpg
          git commit -m "Install original generated Services media"
          git push origin HEAD:services-original-media-rollout
