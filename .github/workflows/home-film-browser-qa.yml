name: Homepage film browser QA

on:
  pull_request:
    branches:
      - work/home-moodboard-film-2026-08-04

permissions:
  contents: read

jobs:
  browser-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out pull request
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install project dependencies
        run: pnpm install --frozen-lockfile

      - name: Install temporary browser tooling
        run: |
          pnpm add --save-dev --ignore-workspace-root-check @playwright/test@1.59.1
          pnpm exec playwright install --with-deps chromium

      - name: Build the complete site
        run: pnpm build

      - name: Author the browser matrix
        run: |
          mkdir -p .qa/home-film artifacts/home-film/screenshots
          cat > .qa/home-film/playwright.config.ts <<'EOF'
          import { defineConfig } from "@playwright/test";

          export default defineConfig({
            testDir: ".",
            testMatch: "home.spec.ts",
            timeout: 100_000,
            expect: { timeout: 15_000 },
            workers: 1,
            retries: 0,
            reporter: [["line"]],
            use: {
              baseURL: "http://127.0.0.1:3000",
              browserName: "chromium",
              headless: true,
              colorScheme: "light",
              locale: "en-US",
              trace: "retain-on-failure",
              screenshot: "only-on-failure",
            },
          });
          EOF

          cat > .qa/home-film/home.spec.ts <<'EOF'
          import { expect, test, type Page } from "@playwright/test";
          import fs from "node:fs/promises";
          import path from "node:path";

          const output = path.resolve(process.cwd(), "artifacts/home-film");

          async function prepare(page: Page) {
            await page.addInitScript(() => {
              sessionStorage.setItem("bt-intro-seen", "1");
              localStorage.removeItem("bt-motion");
              localStorage.setItem(
                "bt-consent-v2",
                JSON.stringify({
                  necessary: true,
                  analytics: false,
                  marketing: false,
                  updatedAt: "2026-08-04T00:00:00.000Z",
                }),
              );
            });
          }

          async function audit(
            page: Page,
            label: string,
            viewport: { width: number; height: number },
            reducedMotion = false,
          ) {
            const consoleErrors: string[] = [];
            const pageErrors: string[] = [];
            page.on("console", (message) => {
              if (message.type() === "error") consoleErrors.push(message.text());
            });
            page.on("pageerror", (error) => pageErrors.push(error.message));

            await page.setViewportSize(viewport);
            // Explicit emulation is used for every test. This avoids a Chromium
            // worker-context leak in which a describe-level preference can be
            // applied after the page's first media-query subscription.
            await page.emulateMedia({
              reducedMotion: reducedMotion ? "reduce" : "no-preference",
            });
            await prepare(page);
            await page.goto("/", { waitUntil: "domcontentloaded" });
            await page.evaluate(() => document.fonts.ready);
            await page.waitForTimeout(1_800);

            const nativeReduced = await page.evaluate(() =>
              matchMedia("(prefers-reduced-motion: reduce)").matches,
            );
            expect(nativeReduced).toBe(reducedMotion);

            await expect(page.locator("h1")).toHaveCount(1);
            await expect(page.getByText("Attention can spike. Recognition has to grow.")).toBeVisible();
            await expect(page.getByText("Which sentence feels a little too familiar?")).toBeVisible();
            await expect(page.getByText("The result is the last thing you should look at.")).toBeVisible();
            await expect(page.getByText("The work meets the business wherever it stands.")).toBeVisible();
            await expect(page.getByText("A project does not move forward. It moves deeper.")).toBeVisible();

            const fonts = await page.evaluate(() => ({
              display: getComputedStyle(document.querySelector("h1")!).fontFamily,
              body: getComputedStyle(document.body).fontFamily,
            }));
            expect(fonts.display.toLowerCase()).toContain("newsreader");
            expect(fonts.body.toLowerCase()).toContain("dm sans");

            const dimensions = await page.evaluate(() => ({
              scrollWidth: document.documentElement.scrollWidth,
              viewportWidth: innerWidth,
              pageHeight: Math.max(document.documentElement.scrollHeight, document.body.scrollHeight),
            }));
            const horizontalOverflow = Math.max(
              0,
              dimensions.scrollWidth - dimensions.viewportWidth,
            );
            expect(horizontalOverflow).toBeLessThanOrEqual(2);

            const fractions = [0, 0.06, 0.13, 0.21, 0.30, 0.39, 0.49, 0.59, 0.69, 0.79, 0.89, 0.98];
            const blankFrames: Array<{ fraction: number; text: string }> = [];
            let maxPlayingVideos = 0;

            for (let index = 0; index < fractions.length; index += 1) {
              const fraction = fractions[index];
              await page.evaluate((position) => {
                const height = Math.max(
                  document.documentElement.scrollHeight,
                  document.body.scrollHeight,
                );
                window.scrollTo({
                  top: Math.max(0, (height - innerHeight) * position),
                  behavior: "instant",
                });
              }, fraction);
              await page.waitForTimeout(650);

              const sample = await page.evaluate(() => {
                const root = document.querySelector("main") ?? document.body;
                const text = Array.from(
                  root.querySelectorAll<HTMLElement>(
                    "h1,h2,h3,p,a,button,summary,figcaption,span",
                  ),
                )
                  .filter((element) => {
                    const rect = element.getBoundingClientRect();
                    const style = getComputedStyle(element);
                    return (
                      rect.bottom > 0 &&
                      rect.top < innerHeight &&
                      rect.right > 0 &&
                      rect.left < innerWidth &&
                      style.display !== "none" &&
                      style.visibility !== "hidden" &&
                      Number.parseFloat(style.opacity || "1") > 0.06
                    );
                  })
                  .map((element) => (element.innerText || element.textContent || "").trim())
                  .filter(Boolean)
                  .join(" ")
                  .replace(/\s+/g, " ")
                  .slice(0, 700);

                const playing = Array.from(
                  root.querySelectorAll<HTMLVideoElement>("video"),
                ).filter(
                  (video) => !video.paused && !video.ended && video.readyState >= 2,
                ).length;

                return { text, playing };
              });

              maxPlayingVideos = Math.max(maxPlayingVideos, sample.playing);
              if (sample.text.length < 24) {
                blankFrames.push({ fraction, text: sample.text });
              }

              if ([0, 5, 8, 11].includes(index)) {
                await page.screenshot({
                  path: path.join(
                    output,
                    "screenshots",
                    `${label}-${String(index).padStart(2, "0")}-${Math.round(fraction * 100)}.png`,
                  ),
                  animations: "disabled",
                });
              }
            }

            expect(blankFrames, "No sampled viewport may become a blank film frame").toEqual([]);
            expect(maxPlayingVideos, "At most two scene films may decode together").toBeLessThanOrEqual(2);

            if (reducedMotion) {
              // The source contract is stronger than merely pausing: no video
              // element or media resource is mounted after the native reduced
              // preference has been confirmed. Posters carry the complete story.
              await expect
                .poll(async () => page.locator("main video").count(), {
                  message: "Reduced motion must remain poster-only",
                  timeout: 3_000,
                  intervals: [100, 200, 400, 800],
                })
                .toBe(0);
            } else if (label === "desktop") {
              await page.evaluate(() => window.scrollTo({ top: 0, behavior: "instant" }));
              await expect
                .poll(
                  async () =>
                    page.locator("main video").evaluateAll((videos) =>
                      videos.filter((item) => {
                        const video = item as HTMLVideoElement;
                        return !video.paused && video.readyState >= 2;
                      }).length,
                    ),
                  { timeout: 8_000 },
                )
                .toBeGreaterThan(0);
            }

            await page
              .getByRole("button", {
                name: /People see us, but every version feels different/i,
              })
              .click();
            await expect(
              page.getByText(
                "Attention is arriving, but nothing stable is being stored in memory.",
              ),
            ).toBeVisible();
            await page.getByRole("tab", { name: "Name" }).click();
            await expect(
              page.getByText("Which words survive after the explanation disappears?"),
            ).toBeVisible();

            expect(pageErrors, "No uncaught browser errors").toEqual([]);
            expect(
              consoleErrors.filter((message) => !message.includes("favicon")),
              "No browser console errors",
            ).toEqual([]);

            await fs.mkdir(path.join(output, "audit-json"), { recursive: true });
            await fs.writeFile(
              path.join(output, "audit-json", `${label}.json`),
              JSON.stringify(
                {
                  label,
                  viewport,
                  reducedMotion,
                  fonts,
                  pageHeight: dimensions.pageHeight,
                  horizontalOverflow,
                  blankFrames,
                  maxPlayingVideos,
                  consoleErrors,
                  pageErrors,
                },
                null,
                2,
              ),
            );
          }

          test("desktop film", async ({ page }) => {
            await audit(page, "desktop", { width: 1440, height: 1000 });
          });

          test("short laptop film", async ({ page }) => {
            await audit(page, "short-laptop", { width: 1366, height: 768 });
          });

          test("mobile authored film", async ({ page }) => {
            await audit(page, "mobile", { width: 390, height: 844 });
          });

          test("reduced-motion desktop remains poster-only", async ({ page }) => {
            await audit(
              page,
              "reduced-desktop",
              { width: 1440, height: 1000 },
              true,
            );
          });

          test("reduced-motion mobile remains poster-only", async ({ page }) => {
            await audit(page, "reduced-mobile", { width: 390, height: 844 }, true);
          });
          EOF

      - name: Start the production server
        run: |
          pnpm start > /tmp/home-film-server.log 2>&1 &
          for attempt in $(seq 1 60); do
            if curl --silent --fail http://127.0.0.1:3000/ > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/home-film-server.log
          exit 1

      - name: Run the browser matrix
        run: pnpm exec playwright test --config=.qa/home-film/playwright.config.ts

      - name: Print the production server log
        if: always()
        run: cat /tmp/home-film-server.log || true

      - name: Upload the browser QA record
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: homepage-film-browser-qa
          path: artifacts/home-film
          if-no-files-found: warn
          retention-days: 3
