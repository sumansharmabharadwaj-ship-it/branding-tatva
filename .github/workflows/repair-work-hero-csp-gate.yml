name: Repair CSP-safe Work hero verifier

on:
  workflow_dispatch:
  push:
    branches:
      - homepage-cinematic-recovery
    paths:
      - ".github/workflows/repair-work-hero-csp-gate.yml"

permissions:
  contents: write

concurrency:
  group: branding-tatva-work-hero-csp-repair
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 8

    steps:
      - name: Check out the canonical branch
        uses: actions/checkout@v4
        with:
          ref: homepage-cinematic-recovery
          fetch-depth: 0

      - name: Use Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Replace the masked hero waits with direct polling
        run: |
          node <<'NODE'
          const fs = require("node:fs");
          const file = "scripts/work_hero_pause_gate.cjs";
          const before = fs.readFileSync(file, "utf8");
          const from = `async function waitForSelectionChange(page, tabs, stage, previous, label) {\n  try {\n    await page.waitForFunction(\n      (selector) => document.querySelector(selector)?.dataset.rotationEnabled === "true",\n      '[data-work-preview-stage="true"]',\n      { timeout: 2_500 },\n    );\n    await page.waitForFunction(\n      ({ selector, before }) => {\n        const nodes = Array.from(document.querySelectorAll(selector));\n        const next = nodes.findIndex((node) => node.getAttribute("aria-selected") === "true");\n        return next >= 0 && next !== before;\n      },\n      { selector: '[data-work-preview-stage="true"] [role="tab"]', before: previous },\n      { timeout: ROTATION_WINDOW_MS + 1_500 },\n    );\n  } catch {\n    const state = await previewState(stage);\n    throw new Error(\`${"${label}"}: automatic preview did not resume; state=${"${JSON.stringify(state)}"}\`);\n  }\n\n  return selectedIndex(tabs);\n}`;
          const to = `async function waitForSelectionChange(page, tabs, stage, previous, label) {\n  const enableDeadline = Date.now() + 2_500;\n  let enabled = false;\n  while (Date.now() < enableDeadline) {\n    enabled = (await stage.getAttribute("data-rotation-enabled")) === "true";\n    if (enabled) break;\n    await page.waitForTimeout(70);\n  }\n\n  if (!enabled) {\n    const state = await previewState(stage);\n    throw new Error(\`${"${label}"}: automatic preview never became eligible; state=${"${JSON.stringify(state)}"}\`);\n  }\n\n  const changeDeadline = Date.now() + ROTATION_WINDOW_MS + 1_500;\n  while (Date.now() < changeDeadline) {\n    const next = await selectedIndex(tabs);\n    if (next >= 0 && next !== previous) return next;\n    await page.waitForTimeout(70);\n  }\n\n  const state = await previewState(stage);\n  throw new Error(\`${"${label}"}: automatic preview did not resume; state=${"${JSON.stringify(state)}"}\`);\n}`;
          const count = before.split(from).length - 1;
          if (count !== 1) {
            throw new Error(`Expected one hero wait contract, found ${count}`);
          }
          fs.writeFileSync(file, before.replace(from, to));
          NODE

          node --check scripts/work_hero_pause_gate.cjs

      - name: Commit the CSP-safe hero verifier
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/work_hero_pause_gate.cjs
          git commit -m "Keep the Work hero verifier inside the production CSP"
          git fetch origin homepage-cinematic-recovery
          git rebase origin/homepage-cinematic-recovery
          git push origin HEAD:homepage-cinematic-recovery
