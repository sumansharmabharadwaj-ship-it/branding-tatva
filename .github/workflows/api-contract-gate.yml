name: API contract gate

on:
  workflow_dispatch:
  push:
    branches:
      - homepage-cinematic-recovery
    paths:
      - "src/app/api/contact/**"
      - "src/app/api/newsletter/**"
      - "src/lib/api-protection.ts"
      - "src/lib/contact-schema.ts"
      - "src/lib/newsletter-schema.ts"
      - "scripts/api_contract_gate.cjs"
      - ".github/workflows/api-contract-gate.yml"
      - "package.json"
      - "pnpm-lock.yaml"
      - "next.config.ts"
  pull_request:
    paths:
      - "src/app/api/contact/**"
      - "src/app/api/newsletter/**"
      - "src/lib/api-protection.ts"
      - "src/lib/contact-schema.ts"
      - "src/lib/newsletter-schema.ts"
      - "scripts/api_contract_gate.cjs"
      - ".github/workflows/api-contract-gate.yml"
      - "package.json"
      - "pnpm-lock.yaml"
      - "next.config.ts"

permissions:
  contents: read

concurrency:
  group: branding-tatva-api-contract-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 16

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify TypeScript
        run: pnpm exec tsc --noEmit

      - name: Build the production application
        env:
          NEXT_TELEMETRY_DISABLED: 1
        run: pnpm build

      - name: Start the production server
        env:
          NEXT_TELEMETRY_DISABLED: 1
        run: |
          pnpm start --hostname 127.0.0.1 --port 3000 > /tmp/branding-tatva-api-contract.log 2>&1 &
          echo $! > /tmp/branding-tatva-api-contract.pid
          for attempt in {1..90}; do
            if curl --fail --silent http://127.0.0.1:3000/api/release > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/branding-tatva-api-contract.log
          exit 1

      - name: Verify API protection and form contracts
        env:
          AUDIT_BASE_URL: http://127.0.0.1:3000
        run: node scripts/api_contract_gate.cjs

      - name: Stop the production server
        if: always()
        run: |
          if [ -f /tmp/branding-tatva-api-contract.pid ]; then
            kill "$(cat /tmp/branding-tatva-api-contract.pid)" || true
          fi
          cat /tmp/branding-tatva-api-contract.log || true
