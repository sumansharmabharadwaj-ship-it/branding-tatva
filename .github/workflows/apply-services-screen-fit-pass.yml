name: Apply Services screen-fit and offering-focus pass

on:
  push:
    branches:
      - homepage-cinematic-recovery
    paths:
      - .github/workflows/apply-services-screen-fit-pass.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: branding-tatva-services-screen-fit-pass
  cancel-in-progress: false

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out the transformer and affected Services files
        uses: actions/checkout@v4
        with:
          ref: homepage-cinematic-recovery
          fetch-depth: 1
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            .github/workflows/apply-services-screen-fit-pass.yml
            scripts/apply_services_screen_fit_pass.py
            scripts/services_page_gate.cjs
            src/app/services/page.tsx
            src/components/ScrollCue.tsx
            src/app/globals.css

      - name: Apply and validate the screen-fit pass
        shell: bash
        run: |
          python -m py_compile scripts/apply_services_screen_fit_pass.py
          python scripts/apply_services_screen_fit_pass.py

      - name: Remove the one-time transformer
        shell: bash
        run: |
          rm .github/workflows/apply-services-screen-fit-pass.yml
          rm scripts/apply_services_screen_fit_pass.py

      - name: Commit the verified screen-fit pass
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            src/app/services/page.tsx \
            src/components/ScrollCue.tsx \
            src/app/globals.css \
            scripts/services_page_gate.cjs \
            scripts/apply_services_screen_fit_pass.py \
            .github/workflows/apply-services-screen-fit-pass.yml
          git diff --cached --check
          git commit -m "Make the Services opening a full-screen cinematic scene"
          git pull --rebase origin homepage-cinematic-recovery
          git push origin HEAD:homepage-cinematic-recovery
