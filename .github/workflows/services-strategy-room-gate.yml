name: Services Strategy Room visual gate

on:
  push:
    branches:
      - homepage-cinematic-recovery
    paths:
      - .github/workflows/services-strategy-room-gate.yml
      - src/app/services/page.tsx
      - src/components/TexturedDark.tsx
      - src/sections/Services/StrategyRoomCTA.tsx
      - public/images/generated/bt-services-strategy-room-poster.jpg
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: branding-tatva-services-strategy-room-gate
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 24

    steps:
      - name: Check out the application without the large media archive
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/public/videos/*
            !/public/audio/*

      - name: Use Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Activate pnpm
        shell: bash
        run: |
          corepack enable
          corepack prepare pnpm@10.28.0 --activate

      - name: Install dependencies and Chromium
        shell: bash
        run: |
          pnpm install --frozen-lockfile
          pnpm add --save-dev --lockfile=false playwright@1.54.2
          pnpm exec playwright install --with-deps chromium

      - name: Build the production application
        env:
          NEXT_TELEMETRY_DISABLED: 1
        run: pnpm build

      - name: Start the production server
        env:
          NEXT_TELEMETRY_DISABLED: 1
        shell: bash
        run: |
          pnpm start --hostname 127.0.0.1 --port 3000 > /tmp/strategy-room.log 2>&1 &
          echo $! > /tmp/strategy-room.pid
          for attempt in {1..90}; do
            if curl --fail --silent http://127.0.0.1:3000/services > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/strategy-room.log
          exit 1

      - name: Audit the final Services scene and its complete decision journey
        env:
          AUDIT_BASE_URL: http://127.0.0.1:3000
        shell: bash
        run: |
          mkdir -p strategy-room-audit
          node <<'NODE'
          const path = require("node:path");
          const { chromium } = require("playwright");

          const base = process.env.AUDIT_BASE_URL;
          const output = path.join(process.cwd(), "strategy-room-audit");
          const viewports = [
            { name: "desktop-1440x900", width: 1440, height: 900, touch: false },
            { name: "mobile-390x844", width: 390, height: 844, touch: true },
          ];

          function assert(condition, message) {
            if (!condition) throw new Error(message);
          }

          async function waitForPage(page) {
            const veil = page.locator("[data-page-load-veil]");
            if (await veil.count()) {
              await veil.waitFor({ state: "detached", timeout: 10000 }).catch(() => {});
            }
            await page.evaluate(() => document.fonts.ready);
            await page.waitForTimeout(350);
          }

          async function assertNoOverflow(page, label) {
            const dimensions = await page.evaluate(() => ({
              viewport: window.innerWidth,
              document: document.documentElement.scrollWidth,
              body: document.body.scrollWidth,
            }));
            assert(
              dimensions.document <= dimensions.viewport + 2 && dimensions.body <= dimensions.viewport + 2,
              `${label}: horizontal overflow ${JSON.stringify(dimensions)}`,
            );
          }

          async function assertTouchTargets(locator, label) {
            const boxes = await locator.evaluateAll((nodes) =>
              nodes
                .filter((node) => {
                  const rect = node.getBoundingClientRect();
                  return rect.width > 0 && rect.height > 0;
                })
                .map((node) => {
                  const rect = node.getBoundingClientRect();
                  return {
                    text: (node.textContent || "").trim().replace(/\s+/g, " "),
                    width: rect.width,
                    height: rect.height,
                  };
                }),
            );
            for (const box of boxes) {
              assert(box.width >= 40 && box.height >= 40, `${label}: small target ${JSON.stringify(box)}`);
            }
          }

          async function waitForText(locator, text, label) {
            await locator.filter({ hasText: text }).first().waitFor({ state: "visible", timeout: 8000 });
            assert(((await locator.textContent()) || "").includes(text), `${label}: expected text ${text}`);
          }

          (async () => {
            const browser = await chromium.launch({ headless: true });

            for (const viewport of viewports) {
              const context = await browser.newContext({
                viewport: { width: viewport.width, height: viewport.height },
                hasTouch: viewport.touch,
                reducedMotion: "reduce",
              });
              const page = await context.newPage();
              await page.goto(`${base}/services`, { waitUntil: "domcontentloaded", timeout: 90000 });
              await waitForPage(page);

              const section = page.locator("#book");
              await section.scrollIntoViewIfNeeded();
              await page.waitForTimeout(500);
              await section.waitFor({ state: "visible" });

              const heading = section.getByRole("heading", { level: 2, name: /Open the strategy room/i });
              assert(await heading.isVisible(), `${viewport.name}: Strategy Room heading is not visible`);

              const poster = section.locator('img[src*="bt-services-strategy-room-poster"], img[srcset*="bt-services-strategy-room-poster"]');
              assert((await poster.count()) >= 1, `${viewport.name}: generated Strategy Room poster is missing`);
              await assertNoOverflow(page, `${viewport.name}/opening`);
              await assertTouchTargets(section.getByRole("button"), `${viewport.name}/opening`);

              await section.screenshot({
                path: path.join(output, `strategy-room-${viewport.name}-opening.png`),
                animations: "disabled",
              });

              await section.getByRole("button", { name: "I am beginning with an idea", exact: true }).click();
              await section.getByText("What matters most right now?", { exact: true }).waitFor({ state: "visible" });
              assert((await section.getByText(/Question 2 of 3/i).count()) === 1, `${viewport.name}: second-step progress missing`);
              assert((await section.getByRole("button", { name: /Back/i }).count()) === 1, `${viewport.name}: back action missing on step two`);
              await assertTouchTargets(section.getByRole("button"), `${viewport.name}/priority`);

              await section.getByRole("button", { name: "Building recognition", exact: true }).click();
              await section.getByText("What's the main focus?", { exact: true }).waitFor({ state: "visible" });
              assert((await section.getByText(/Question 3 of 3/i).count()) === 1, `${viewport.name}: third-step progress missing`);
              await assertTouchTargets(section.getByRole("button"), `${viewport.name}/focus`);

              await section.getByRole("button", { name: "Content & voice", exact: true }).click();
              await section.getByText("Good. Grab a time that works.", { exact: true }).waitFor({ state: "visible" });
              const summary = section.locator('[aria-label="Your Strategy Room answers"]');
              await summary.waitFor({ state: "visible" });
              const summaryText = (await summary.textContent()) || "";
              for (const answer of ["I am beginning with an idea", "Building recognition", "Content & voice"]) {
                assert(summaryText.includes(answer), `${viewport.name}: answer summary is missing ${answer}`);
              }
              const changeAnswers = section.getByRole("button", { name: /Change answers/i });
              assert((await changeAnswers.count()) === 1, `${viewport.name}: change-answers action missing`);
              await assertTouchTargets(section.getByRole("button"), `${viewport.name}/calendar`);
              await assertNoOverflow(page, `${viewport.name}/calendar`);

              await section.screenshot({
                path: path.join(output, `strategy-room-${viewport.name}-calendar.png`),
                animations: "disabled",
              });

              await changeAnswers.click();
              await section.getByText("Where is your brand right now?", { exact: true }).waitFor({ state: "visible" });
              assert((await section.getByText(/Question 1 of 3/i).count()) === 1, `${viewport.name}: restart did not restore step one`);

              await context.close();
            }

            const motionContext = await browser.newContext({ viewport: { width: 1280, height: 800 } });
            const motionPage = await motionContext.newPage();
            await motionPage.goto(`${base}/services`, { waitUntil: "domcontentloaded", timeout: 90000 });
            await waitForPage(motionPage);
            const motionSection = motionPage.locator("#book");
            await motionSection.scrollIntoViewIfNeeded();
            await motionPage.waitForTimeout(700);
            await motionSection.locator("video").waitFor({ state: "attached", timeout: 8000 });
            const sources = await motionSection.locator("video source").evaluateAll((nodes) =>
              nodes.map((node) => ({ src: node.getAttribute("src"), media: node.getAttribute("media") })),
            );
            assert(
              sources.some((source) => source.src?.includes("bt-services-strategy-room-mobile.mp4") && source.media),
              "Responsive Strategy Room source is missing",
            );
            assert(
              sources.some((source) => source.src?.includes("bt-services-strategy-room.mp4") && !source.media),
              "Desktop Strategy Room source is missing",
            );
            await motionContext.close();
            await browser.close();
            console.log("Services Strategy Room visual and decision-journey gate passed.");
          })().catch((error) => {
            console.error(error);
            process.exit(1);
          });
          NODE

      - name: Stop the production server
        if: always()
        shell: bash
        run: |
          if [ -f /tmp/strategy-room.pid ]; then
            kill "$(cat /tmp/strategy-room.pid)" || true
          fi
          cat /tmp/strategy-room.log || true

      - name: Upload Strategy Room evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: services-strategy-room-evidence
          path: strategy-room-audit/*
          if-no-files-found: error
          retention-days: 7
