name: Apply homepage autoplay eligibility repair

on:
  push:
    branches:
      - reimagine-project-moves
    paths:
      - .github/workflows/apply-home-autoplay-eligibility.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out the preview branch
        uses: actions/checkout@v4
        with:
          ref: reimagine-project-moves
          fetch-depth: 1

      - name: Mark active decorative films and compact mobile Explore
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          element_path = Path("src/components/ElementRowBackground.tsx")
          element = element_path.read_text()
          old_root = '<div ref={ref} className="absolute inset-0" style={{ backgroundColor: color }} aria-hidden="true">'
          new_root = '<div ref={ref} data-video-decorative-root className="absolute inset-0" style={{ backgroundColor: color }} aria-hidden="true">'
          if old_root not in element:
              raise SystemExit("Element background root was not found")
          element = element.replace(old_root, new_root, 1)

          old_can_play = '          onCanPlay={() => setVideoReady(true)}\n          src={video}\n          muted\n          loop'
          new_can_play = '          onCanPlay={(event) => {\n            setVideoReady(true);\n            if (playing) void event.currentTarget.play().catch(() => {});\n          }}\n          src={video}\n          muted\n          autoPlay={playing}\n          loop'
          if old_can_play not in element:
              raise SystemExit("Element video playback block was not found")
          element_path.write_text(element.replace(old_can_play, new_can_play, 1))

          process_path = Path("src/sections/Process/RootSystem.tsx")
          process = process_path.read_text()
          old_process = '<div className="project-journey__media" aria-hidden="true">'
          new_process = '<div className="project-journey__media" data-video-decorative-root aria-hidden="true">'
          if old_process not in process:
              raise SystemExit("Process media root was not found")
          process_path.write_text(process.replace(old_process, new_process, 1))

          css_path = Path("src/app/home-audit-fixes.css")
          css = css_path.read_text()
          old_css = """  [data-chapter-ladder-mobile] > button {
    min-height: 2.8rem !important;
    padding-inline: 0.9rem !important;
  }
}"""
          new_css = """  [data-chapter-ladder-mobile] > button {
    width: 2.8rem !important;
    height: 2.8rem !important;
    min-height: 2.8rem !important;
    justify-content: center !important;
    gap: 0 !important;
    padding: 0 !important;
  }

  [data-chapter-ladder-mobile] > button > span:not(:first-child) {
    display: none !important;
  }
}"""
          if old_css not in css:
              raise SystemExit("Mobile Explore repair block was not found")
          css_path.write_text(css.replace(old_css, new_css, 1))
          PY

      - name: Commit the repair and remove the one time workflow
        shell: bash
        run: |
          git config user.name "Branding Tatva Build Bot"
          git config user.email "actions@users.noreply.github.com"
          git add src/components/ElementRowBackground.tsx src/sections/Process/RootSystem.tsx src/app/home-audit-fixes.css
          git rm .github/workflows/apply-home-autoplay-eligibility.yml
          git commit -m "Wake the Elements and Process films without reviving hidden slides"
          git push origin HEAD:reimagine-project-moves
