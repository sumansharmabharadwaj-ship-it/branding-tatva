name: Direct august preview retry

on:
  push:
    branches:
      - august-8-isolated
    paths:
      - .github/workflows/direct-august-preview-retry.yml

permissions:
  contents: read

concurrency:
  group: direct-august-preview-retry
  cancel-in-progress: false

jobs:
  deploy-preview:
    if: contains(github.event.head_commit.message, '[release:8]')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      VERCEL_PROJECT_ID: prj_oqWzTWCHURqzPAdpjXv3b7cubJwJ
      VERCEL_TEAM_ID: team_Y7dQ5jNk61chQvy2A92AEyTt
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      PREVIEW_ALIAS: branding-tatva-git-august-8-isolated-suman22.vercel.app

    steps:
      - name: Check out the exact retry source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Request the exact Git preview
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${VERCEL_TOKEN:-}" ]; then
            echo "VERCEL_TOKEN is not configured." >&2
            exit 1
          fi

          SOURCE_SHA="${GITHUB_SHA}" node <<'NODE' > /tmp/vercel-deployment-request.json
          const payload = {
            name: "branding-tatva",
            project: process.env.VERCEL_PROJECT_ID,
            target: null,
            gitSource: {
              type: "github",
              org: "sumansharmabharadwaj-ship-it",
              repo: "branding-tatva",
              ref: "august-8-isolated",
              sha: process.env.SOURCE_SHA,
            },
            meta: {
              rescueLane: "august-preview-retry",
              sourceCommit: process.env.SOURCE_SHA,
            },
          };
          process.stdout.write(JSON.stringify(payload));
          NODE

          curl --fail --silent --show-error             --request POST             --url "https://api.vercel.com/v13/deployments?teamId=${VERCEL_TEAM_ID}"             --header "Authorization: Bearer ${VERCEL_TOKEN}"             --header "Content-Type: application/json"             --data-binary @/tmp/vercel-deployment-request.json             > /tmp/vercel-deployment-response.json

          node <<'NODE'
          const fs = require("node:fs");
          const response = JSON.parse(fs.readFileSync("/tmp/vercel-deployment-response.json", "utf8"));
          if (!response.id) {
            throw new Error(`Vercel did not return a deployment id: ${JSON.stringify(response)}`);
          }
          fs.writeFileSync("/tmp/vercel-deployment-id", `${response.id}\n`);
          fs.writeFileSync("/tmp/vercel-deployment-url", `${response.url || ""}\n`);
          NODE

      - name: Wait for READY
        shell: bash
        run: |
          set -euo pipefail
          deployment_id="$(cat /tmp/vercel-deployment-id)"
          ready=false
          for attempt in $(seq 1 100); do
            curl --fail --silent --show-error               --url "https://api.vercel.com/v13/deployments/${deployment_id}?teamId=${VERCEL_TEAM_ID}"               --header "Authorization: Bearer ${VERCEL_TOKEN}"               > /tmp/vercel-deployment-status.json

            state="$(node -e "const x=require('/tmp/vercel-deployment-status.json'); process.stdout.write(x.readyState || x.state || '')")"
            echo "Vercel deployment ${deployment_id}: ${state:-unknown}"
            if [ "${state}" = "READY" ]; then
              ready=true
              break
            fi
            if [ "${state}" = "ERROR" ] || [ "${state}" = "CANCELED" ]; then
              cat /tmp/vercel-deployment-status.json
              exit 1
            fi
            sleep 6
          done
          if [ "${ready}" != true ]; then
            echo "The direct preview retry did not become ready in time." >&2
            exit 1
          fi

      - name: Assign the permanent branch alias
        shell: bash
        run: |
          set -euo pipefail
          deployment_id="$(cat /tmp/vercel-deployment-id)"
          printf '{"alias":"%s"}\n' "${PREVIEW_ALIAS}" > /tmp/vercel-alias-request.json
          curl --fail --silent --show-error             --request POST             --url "https://api.vercel.com/v2/deployments/${deployment_id}/aliases?teamId=${VERCEL_TEAM_ID}"             --header "Authorization: Bearer ${VERCEL_TOKEN}"             --header "Content-Type: application/json"             --data-binary @/tmp/vercel-alias-request.json             > /tmp/vercel-alias-response.json

          {
            echo "## Direct preview retry"
            echo
            echo "- Deployment: \`${deployment_id}\`"
            echo "- Source: \`${GITHUB_SHA}\`"
            echo "- Alias: https://${PREVIEW_ALIAS}/"
            echo "- Status: READY"
          } >> "${GITHUB_STEP_SUMMARY}"
