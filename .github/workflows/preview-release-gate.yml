name: Canonical preview release gate
run-name: Preview release · ${{ github.sha }}

on:
  workflow_dispatch:
  push:
    branches:
      - homepage-cinematic-recovery
    paths:
      - .github/workflows/preview-release-gate.yml
      - scripts/site_release_smoke.cjs
      - src/app/**
      - src/components/**
      - src/data/**
      - src/hooks/**
      - src/layouts/**
      - src/lib/**
      - src/sections/**
      - package.json
      - pnpm-lock.yaml
      - next.config.ts

permissions:
  contents: read

concurrency:
  group: branding-tatva-canonical-preview-release
  cancel-in-progress: true

jobs:
  release-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 26

    steps:
      - name: Check out the application without the media archive
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/public/videos/*
            !/public/audio/*

      - name: Use Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Activate pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.28.0 --activate

      - name: Install dependencies
        run: |
          pnpm install --frozen-lockfile
          pnpm add --save-dev --lockfile=false playwright@1.54.2

      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Build the production application
        env:
          NEXT_TELEMETRY_DISABLED: 1
        run: pnpm build

      - name: Start the production server
        env:
          NEXT_TELEMETRY_DISABLED: 1
        run: |
          pnpm start --hostname 127.0.0.1 --port 3000 > /tmp/branding-tatva-preview-release.log 2>&1 &
          echo $! > /tmp/branding-tatva-preview-release.pid
          for attempt in {1..90}; do
            if curl --fail --silent http://127.0.0.1:3000/ > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/branding-tatva-preview-release.log
          exit 1

      - name: Verify primary routes, dynamic destinations, metadata, forms, contact paths, and release fingerprint
        env:
          AUDIT_BASE_URL: http://127.0.0.1:3000
          AUDIT_COMMIT: ${{ github.sha }}
        run: node scripts/site_release_smoke.cjs

      - name: Stop the production server
        if: always()
        run: |
          if [ -f /tmp/branding-tatva-preview-release.pid ]; then
            kill "$(cat /tmp/branding-tatva-preview-release.pid)" || true
          fi
          cat /tmp/branding-tatva-preview-release.log || true

      - name: Upload integrated release evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: branding-tatva-preview-release
          path: site-release-audit/*
          if-no-files-found: warn
          retention-days: 7
