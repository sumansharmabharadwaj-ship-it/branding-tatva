name: Repair CSP-safe Work verifiers

on:
  workflow_dispatch:
  push:
    branches:
      - homepage-cinematic-recovery
    paths:
      - ".github/workflows/repair-work-csp-gates.yml"

permissions:
  contents: write

concurrency:
  group: branding-tatva-work-csp-verifier-repair
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 8

    steps:
      - name: Check out the canonical branch
        uses: actions/checkout@v4
        with:
          ref: homepage-cinematic-recovery
          fetch-depth: 0

      - name: Use Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Replace unsafe-eval waits with CSP-safe polling
        run: |
          node <<'NODE'
          const fs = require("node:fs");

          function replaceExactly(file, from, to, label) {
            const before = fs.readFileSync(file, "utf8");
            const count = before.split(from).length - 1;
            if (count !== 1) {
              throw new Error(`${file}: expected one ${label}, found ${count}`);
            }
            fs.writeFileSync(file, before.replace(from, to));
          }

          replaceExactly(
            "scripts/work_capability_attention_gate.cjs",
            `async function waitForRoute(page, route) {\n  await page.waitForFunction(\n    ({ id, project, slug, capabilities, packageName }) => {\n      const selected = document.querySelector(\`[data-waystone-id="${"${id}"}"]\`);\n      const proof = document.querySelector("[data-recommended-proof]");\n      const mobileMap = document.querySelector("[data-mobile-capability-map]");\n      const projectLink = proof?.querySelector(\`a[href="/work/${"${slug}"}"]\`);\n      const serviceLink = proof?.querySelector('a[href="/services#desire"]');\n      const proofText = proof?.textContent?.replace(/\\s+/g, " ") || "";\n\n      return Boolean(\n        selected?.getAttribute("aria-pressed") === "true" &&\n          proofText.includes(project) &&\n          proofText.includes(\`${"${capabilities}"} capabilities\`) &&\n          proofText.includes(packageName) &&\n          projectLink &&\n          serviceLink &&\n          mobileMap?.getAttribute("data-active-capability-count") === String(capabilities),\n      );\n    },\n    route,\n    { timeout: 4_000 },\n  );\n}`,
            `async function waitForRoute(page, route) {\n  const deadline = Date.now() + 4_000;\n  while (Date.now() < deadline) {\n    const ready = await page.evaluate(\n      ({ id, project, slug, capabilities, packageName }) => {\n        const selected = document.querySelector(\`[data-waystone-id="${"${id}"}"]\`);\n        const proof = document.querySelector("[data-recommended-proof]");\n        const mobileMap = document.querySelector("[data-mobile-capability-map]");\n        const projectLink = proof?.querySelector(\`a[href="/work/${"${slug}"}"]\`);\n        const serviceLink = proof?.querySelector('a[href="/services#desire"]');\n        const proofText = proof?.textContent?.replace(/\\s+/g, " ") || "";\n\n        return Boolean(\n          selected?.getAttribute("aria-pressed") === "true" &&\n            proofText.includes(project) &&\n            proofText.includes(\`${"${capabilities}"} capabilities\`) &&\n            proofText.includes(packageName) &&\n            projectLink &&\n            serviceLink &&\n            mobileMap?.getAttribute("data-active-capability-count") === String(capabilities),\n        );\n      },\n      route,\n    );\n    if (ready) return;\n    await page.waitForTimeout(80);\n  }\n  throw new Error(\`work/capability-attention: route ${"${route.id}"} did not settle\`);\n}`,
            "capability wait",
          );

          replaceExactly(
            "scripts/work_mobile_index_control_gate.cjs",
            `    await page.waitForFunction(\n      ({ selector, before }) => {\n        const node = document.querySelector(selector);\n        const next = node?.textContent?.replace(/\\s+/g, " ").trim() || "";\n        return Boolean(next && next !== before);\n      },\n      { selector: "#active-work-preview", before: beforeText },\n      { timeout: 4_000 },\n    );`,
            `    const previewDeadline = Date.now() + 4_000;\n    let previewChanged = false;\n    while (Date.now() < previewDeadline) {\n      const nextText = ((await preview.textContent()) || "").replace(/\\s+/g, " ").trim();\n      if (nextText && nextText !== beforeText) {\n        previewChanged = true;\n        break;\n      }\n      await page.waitForTimeout(80);\n    }\n    assert(previewChanged, "work/mobile-index: active evidence did not change after selection");`,
            "mobile index wait",
          );

          const decision = "scripts/work_decision_context_gate.cjs";
          replaceExactly(
            decision,
            `async function assertNoOverflow(page) {`,
            `async function waitForAttribute(locator, name, expected, label, timeout = 3_000) {\n  const deadline = Date.now() + timeout;\n  while (Date.now() < deadline) {\n    if ((await locator.getAttribute(name)) === expected) return;\n    await locator.page().waitForTimeout(70);\n  }\n  throw new Error(\`work/decision-context: ${"${label}"} did not reach ${"${name}"}=${"${expected}"}\`);\n}\n\nasync function assertNoOverflow(page) {`,
            "decision polling helper",
          );
          replaceExactly(
            decision,
            `    await page.waitForFunction(\n      ({ panelId }) => Boolean(document.getElementById(panelId)),\n      { panelId: controlledId },\n      { timeout: 3_000 },\n    );\n    await page.waitForFunction(\n      () => {\n        const buttons = document.querySelectorAll('ul[aria-label="Decision artefacts"] button[aria-expanded]');\n        const last = buttons[buttons.length - 1];\n        return last?.dataset.contextScrollCalls === "1";\n      },\n      undefined,\n      { timeout: 3_000 },\n    );`,
            `    await page.locator(\`#${"${controlledId}"}\`).waitFor({ state: "attached", timeout: 3_000 });\n    await waitForAttribute(trigger, "data-context-scroll-calls", "1", "open context restoration");`,
            "decision open waits",
          );
          replaceExactly(
            decision,
            `    await page.waitForFunction(\n      () => {\n        const buttons = document.querySelectorAll('ul[aria-label="Decision artefacts"] button[aria-expanded]');\n        const last = buttons[buttons.length - 1];\n        return last?.dataset.contextScrollCalls === "2";\n      },\n      undefined,\n      { timeout: 3_000 },\n    );`,
            `    await waitForAttribute(trigger, "data-context-scroll-calls", "2", "close context restoration");`,
            "decision close wait",
          );

          const study = "scripts/work_brand_study_context_gate.cjs";
          replaceExactly(
            study,
            `async function inViewport(locator) {`,
            `async function waitForAttribute(locator, name, expected, label, timeout = 3_000) {\n  const deadline = Date.now() + timeout;\n  while (Date.now() < deadline) {\n    if ((await locator.getAttribute(name)) === expected) return;\n    await locator.page().waitForTimeout(70);\n  }\n  throw new Error(\`work/study-context: ${"${label}"} did not reach ${"${name}"}=${"${expected}"}\`);\n}\n\nasync function inViewport(locator) {`,
            "study polling helper",
          );
          replaceExactly(
            study,
            `    await page.waitForFunction(\n      () => {\n        const buttons = document.querySelectorAll('[aria-label="Independent brand-study mechanisms"] button[aria-expanded]');\n        const last = buttons[buttons.length - 1];\n        return last?.dataset.contextScrollCalls === "1";\n      },\n      undefined,\n      { timeout: 3_000 },\n    );`,
            `    await waitForAttribute(cover, "data-context-scroll-calls", "1", "close context restoration");`,
            "study close wait",
          );
          NODE

          node --check scripts/work_capability_attention_gate.cjs
          node --check scripts/work_mobile_index_control_gate.cjs
          node --check scripts/work_decision_context_gate.cjs
          node --check scripts/work_brand_study_context_gate.cjs

      - name: Commit the CSP-safe verifier repairs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            scripts/work_capability_attention_gate.cjs \
            scripts/work_mobile_index_control_gate.cjs \
            scripts/work_decision_context_gate.cjs \
            scripts/work_brand_study_context_gate.cjs
          git commit -m "Keep Work browser gates inside the production CSP"
          git fetch origin homepage-cinematic-recovery
          git rebase origin/homepage-cinematic-recovery
          git push origin HEAD:homepage-cinematic-recovery
