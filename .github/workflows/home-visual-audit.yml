name: Capture homepage visual audit
# Final pass validates the restored Evidence chapter, quieter WebM-first
# fragments, complete path promise, mobile wakeups and horizontal containment.

on:
  push:
    branches:
      - reimagine-project-moves
    paths:
      - .github/workflows/home-visual-audit.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out the preview branch
        uses: actions/checkout@v4
        with:
          ref: reimagine-project-moves
          fetch-depth: 1

      - name: Use Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Activate pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.28.0 --activate

      - name: Install project and audit dependencies
        run: |
          pnpm install --frozen-lockfile
          pnpm add --save-dev --ignore-workspace-root-check --lockfile=false playwright@1.54.2

      - name: Install Chromium for the audit
        run: pnpm exec playwright install --with-deps chromium

      - name: Build the production application
        env:
          NEXT_TELEMETRY_DISABLED: "1"
        run: pnpm build

      - name: Start the production application
        env:
          NEXT_TELEMETRY_DISABLED: "1"
        run: |
          pnpm start --hostname 127.0.0.1 --port 3000 > /tmp/branding-tatva-start.log 2>&1 &
          echo $! > /tmp/branding-tatva-start.pid
          for attempt in {1..90}; do
            if curl --fail --silent http://127.0.0.1:3000/ > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/branding-tatva-start.log
          exit 1

      - name: Capture every chapter at its real scroll position
        run: |
          mkdir -p visual-audit
          cat > capture-home.cjs <<'JS'
          const { chromium } = require('playwright');
          const fs = require('fs');

          const profiles = [
            { name: 'desktop', viewport: { width: 1440, height: 1100 }, deviceScaleFactor: 1 },
            { name: 'mobile', viewport: { width: 390, height: 844 }, deviceScaleFactor: 1 },
          ];

          (async () => {
            const browser = await chromium.launch({ headless: true });
            const report = { captures: [], consoleErrors: [], pageErrors: [] };

            for (const profile of profiles) {
              const context = await browser.newContext({
                viewport: profile.viewport,
                deviceScaleFactor: profile.deviceScaleFactor,
                reducedMotion: 'no-preference',
              });
              const page = await context.newPage();
              page.on('console', (message) => {
                if (message.type() === 'error') report.consoleErrors.push({ profile: profile.name, text: message.text() });
              });
              page.on('pageerror', (error) => report.pageErrors.push({ profile: profile.name, text: error.message }));

              await page.goto('http://127.0.0.1:3000/', { waitUntil: 'networkidle' });
              await page.waitForTimeout(5200);

              await page.screenshot({ path: `visual-audit/${profile.name}-00-opening.png`, fullPage: false });
              report.captures.push({ profile: profile.name, chapter: 'opening', path: `visual-audit/${profile.name}-00-opening.png` });

              const chapters = await page.locator('[data-home-chapter]').evaluateAll((elements) =>
                elements.map((element, index) => ({
                  index,
                  id: element.getAttribute('data-home-chapter') || `chapter-${index + 1}`,
                })),
              );

              for (const chapter of chapters) {
                const locator = page.locator('[data-home-chapter]').nth(chapter.index);
                await locator.evaluate((element) => {
                  const top = window.scrollY + element.getBoundingClientRect().top - 72;
                  window.scrollTo({ top, behavior: 'instant' });
                });
                await page.waitForTimeout(3000);
                const safe = chapter.id.replace(/[^a-z0-9_-]+/gi, '-').toLowerCase();
                const path = `visual-audit/${profile.name}-${String(chapter.index + 1).padStart(2, '0')}-${safe}.png`;
                await page.screenshot({ path, fullPage: false });
                const playback = await locator.evaluate((chapterElement) => {
                  const rect = chapterElement.getBoundingClientRect();
                  const viewportWidth = document.documentElement.clientWidth;
                  const documentWidth = document.documentElement.scrollWidth;
                  const visibleVideoDetails = Array.from(document.querySelectorAll('video'))
                    .filter((video) => {
                      const videoRect = video.getBoundingClientRect();
                      return videoRect.bottom > 0 && videoRect.top < window.innerHeight;
                    })
                    .map((video) => ({
                      src: video.currentSrc || video.getAttribute('src') || '',
                      paused: video.paused,
                      readyState: video.readyState,
                      opacity: Number.parseFloat(window.getComputedStyle(video).opacity || '1'),
                    }));
                  return {
                    scrollY: Math.round(window.scrollY),
                    viewportWidth,
                    documentWidth,
                    horizontalOverflow: Math.max(0, documentWidth - viewportWidth),
                    chapterLeft: Math.round(rect.left),
                    chapterRight: Math.round(rect.right),
                    chapterWidth: Math.round(rect.width),
                    visibleVideos: visibleVideoDetails.length,
                    playingVideos: visibleVideoDetails.filter((video) => !video.paused).length,
                    visibleVideoDetails,
                  };
                });
                report.captures.push({ profile: profile.name, chapter: chapter.id, path, ...playback });
              }

              await context.close();
            }

            fs.writeFileSync('visual-audit/report.json', JSON.stringify(report, null, 2));
            await browser.close();
          })().catch((error) => {
            console.error(error);
            process.exit(1);
          });
          JS
          node capture-home.cjs

      - name: Stop the application
        if: always()
        run: |
          if [ -f /tmp/branding-tatva-start.pid ]; then
            kill "$(cat /tmp/branding-tatva-start.pid)" || true
          fi

      - name: Upload the visual audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: branding-tatva-home-visual-audit
          path: visual-audit/*
          if-no-files-found: error
          retention-days: 1
