name: Moodboard homepage browser QA

on:
  pull_request:
    branches:
      - work/home-moodboard-film-2026-08-04

permissions:
  contents: read

jobs:
  browser-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out pull request
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install project dependencies
        run: pnpm install --frozen-lockfile

      - name: Install temporary browser test tooling
        run: |
          pnpm add --save-dev --ignore-workspace-root-check @playwright/test@1.59.1
          pnpm exec playwright install --with-deps chromium

      - name: Build the site
        run: pnpm build

      - name: Author browser tests
        run: |
          mkdir -p .qa/moodboard/tests artifacts/screenshots
          cat > .qa/moodboard/playwright.config.ts <<'EOF'
          import { defineConfig } from "@playwright/test";

          export default defineConfig({
            testDir: "./tests",
            timeout: 90_000,
            expect: { timeout: 15_000 },
            fullyParallel: false,
            workers: 1,
            retries: 0,
            reporter: [
              ["line"],
              ["html", { outputFolder: "../../artifacts/playwright-report", open: "never" }],
            ],
            outputDir: "../../artifacts/test-results",
            use: {
              baseURL: "http://127.0.0.1:3000",
              browserName: "chromium",
              headless: true,
              colorScheme: "light",
              locale: "en-US",
              trace: "retain-on-failure",
              screenshot: "only-on-failure",
            },
          });
          EOF

          cat > .qa/moodboard/tests/home.spec.ts <<'EOF'
          import { expect, test, type Page, type TestInfo } from "@playwright/test";
          import fs from "node:fs/promises";
          import path from "node:path";

          type AuditResult = {
            viewport: string;
            displayFont: string;
            bodyFont: string;
            pageHeight: number;
            blankSamples: Array<{ fraction: number; visibleText: string }>;
            horizontalOverflow: number;
            consoleErrors: string[];
            pageErrors: string[];
            maxPlayingVideos: number;
            reducedMotionVideoCount: number | null;
          };

          const screenshotDir = path.resolve(process.cwd(), "artifacts/screenshots");
          const reportDir = path.resolve(process.cwd(), "artifacts/audit-json");

          async function prepare(page: Page) {
            await page.addInitScript(() => {
              sessionStorage.setItem("bt-intro-seen", "1");
              localStorage.setItem(
                "bt-consent-v2",
                JSON.stringify({
                  necessary: true,
                  analytics: false,
                  marketing: false,
                  updatedAt: "2026-08-04T00:00:00.000Z",
                }),
              );
            });
          }

          async function auditFilm(page: Page, testInfo: TestInfo, reducedMotion = false) {
            const consoleErrors: string[] = [];
            const pageErrors: string[] = [];
            page.on("console", (message) => {
              if (message.type() === "error") consoleErrors.push(message.text());
            });
            page.on("pageerror", (error) => pageErrors.push(error.message));

            await prepare(page);
            await page.goto("/", { waitUntil: "domcontentloaded" });
            await page.evaluate(() => document.fonts.ready);
            await page.waitForTimeout(1_800);

            await expect(page.locator("h1")).toHaveCount(1);
            await expect(page.getByText("Attention can spike. Recognition has to grow.")).toBeVisible();
            await expect(page.getByText("Which sentence feels a little too familiar?")).toBeVisible();
            await expect(page.getByText("The result is the last thing you should look at.")).toBeVisible();
            await expect(page.getByText("The work meets the business wherever it stands.")).toBeVisible();
            await expect(page.getByText("A project does not move forward. It moves deeper.")).toBeVisible();

            const fonts = await page.evaluate(() => ({
              display: getComputedStyle(document.querySelector("h1")!).fontFamily,
              body: getComputedStyle(document.body).fontFamily,
            }));
            expect(fonts.display.toLowerCase()).toContain("newsreader");
            expect(fonts.body.toLowerCase()).toContain("dm sans");

            const dimensions = await page.evaluate(() => ({
              width: document.documentElement.scrollWidth,
              viewport: window.innerWidth,
              height: Math.max(
                document.documentElement.scrollHeight,
                document.body.scrollHeight,
              ),
            }));
            const horizontalOverflow = Math.max(0, dimensions.width - dimensions.viewport);
            expect(horizontalOverflow).toBeLessThanOrEqual(2);

            const fractions = [0, 0.06, 0.13, 0.21, 0.30, 0.39, 0.49, 0.59, 0.69, 0.79, 0.89, 0.98];
            const blankSamples: Array<{ fraction: number; visibleText: string }> = [];
            let maxPlayingVideos = 0;

            for (let index = 0; index < fractions.length; index += 1) {
              const fraction = fractions[index];
              await page.evaluate((position) => {
                const height = Math.max(
                  document.documentElement.scrollHeight,
                  document.body.scrollHeight,
                );
                window.scrollTo(0, Math.max(0, (height - window.innerHeight) * position));
              }, fraction);
              await page.waitForTimeout(420);

              const sample = await page.evaluate(() => {
                const selectors = "h1,h2,h3,p,a,button,summary,figcaption,span";
                const visible = Array.from(document.querySelectorAll<HTMLElement>(selectors))
                  .filter((element) => {
                    const rect = element.getBoundingClientRect();
                    const style = getComputedStyle(element);
                    return (
                      rect.bottom > 0 &&
                      rect.top < window.innerHeight &&
                      rect.right > 0 &&
                      rect.left < window.innerWidth &&
                      style.display !== "none" &&
                      style.visibility !== "hidden" &&
                      Number.parseFloat(style.opacity || "1") > 0.06
                    );
                  })
                  .map((element) => (element.innerText || element.textContent || "").trim())
                  .filter(Boolean);

                const playing = Array.from(document.querySelectorAll<HTMLVideoElement>("video"))
                  .filter((video) => !video.paused && !video.ended && video.readyState >= 2).length;

                return {
                  visibleText: visible.join(" ").replace(/\s+/g, " ").slice(0, 500),
                  playing,
                };
              });

              maxPlayingVideos = Math.max(maxPlayingVideos, sample.playing);
              if (sample.visibleText.length < 24) {
                blankSamples.push({ fraction, visibleText: sample.visibleText });
              }

              if ([0, 2, 4, 6, 8, 10, 11].includes(index)) {
                const name = `${testInfo.project.name}-${String(index).padStart(2, "0")}-${Math.round(fraction * 100)}.png`;
                await page.screenshot({
                  path: path.join(screenshotDir, name),
                  animations: "disabled",
                });
              }
            }

            expect(blankSamples, "No sampled viewport may become an empty scroll frame").toEqual([]);
            expect(maxPlayingVideos).toBeLessThanOrEqual(2);

            let reducedMotionVideoCount: number | null = null;
            if (reducedMotion) {
              reducedMotionVideoCount = await page.locator("video").count();
              expect(reducedMotionVideoCount).toBe(0);
            } else if (testInfo.project.name !== "mobile") {
              await page.evaluate(() => window.scrollTo(0, 0));
              await expect
                .poll(async () =>
                  page.locator("video").evaluateAll((videos) =>
                    videos.filter((item) => {
                      const video = item as HTMLVideoElement;
                      return !video.paused && video.readyState >= 2;
                    }).length,
                  ),
                )
                .toBeGreaterThan(0);
            }

            // Exercise two state-changing diagrams rather than only checking static markup.
            await page.getByRole("button", { name: /People see us, but every version feels different/i }).click();
            await expect(page.getByText("Attention is arriving, but nothing stable is being stored in memory.")).toBeVisible();
            await page.getByRole("tab", { name: "Name" }).click();
            await expect(page.getByText("Which words survive after the explanation disappears?")).toBeVisible();

            expect(pageErrors, "No uncaught browser errors").toEqual([]);
            expect(
              consoleErrors.filter((message) => !message.includes("favicon")),
              "No browser console errors",
            ).toEqual([]);

            const result: AuditResult = {
              viewport: testInfo.project.name,
              displayFont: fonts.display,
              bodyFont: fonts.body,
              pageHeight: dimensions.height,
              blankSamples,
              horizontalOverflow,
              consoleErrors,
              pageErrors,
              maxPlayingVideos,
              reducedMotionVideoCount,
            };
            await fs.mkdir(reportDir, { recursive: true });
            await fs.writeFile(
              path.join(reportDir, `${testInfo.project.name}.json`),
              JSON.stringify(result, null, 2),
            );
          }

          test.describe("moodboard homepage film", () => {
            test("desktop cinematic flow", async ({ page }, testInfo) => {
              await page.setViewportSize({ width: 1440, height: 1000 });
              await auditFilm(page, testInfo);
            });

            test("short laptop flow", async ({ page }, testInfo) => {
              await page.setViewportSize({ width: 1366, height: 768 });
              await auditFilm(page, testInfo);
            });

            test("mobile authored flow", async ({ page }, testInfo) => {
              await page.setViewportSize({ width: 390, height: 844 });
              await auditFilm(page, testInfo);
            });
          });

          test.describe("reduced motion", () => {
            test.use({ reducedMotion: "reduce" });

            test("desktop retains the complete story without video", async ({ page }, testInfo) => {
              await page.setViewportSize({ width: 1440, height: 1000 });
              await auditFilm(page, testInfo, true);
            });

            test("mobile retains the complete story without video", async ({ page }, testInfo) => {
              await page.setViewportSize({ width: 390, height: 844 });
              await auditFilm(page, testInfo, true);
            });
          });
          EOF

      - name: Start production server
        run: |
          pnpm start > /tmp/branding-tatva-server.log 2>&1 &
          echo $! > /tmp/branding-tatva-server.pid
          for attempt in $(seq 1 60); do
            if curl --silent --fail http://127.0.0.1:3000/ > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/branding-tatva-server.log
          exit 1

      - name: Run browser audit
        run: pnpm exec playwright test --config=.qa/moodboard/playwright.config.ts

      - name: Print server log
        if: always()
        run: cat /tmp/branding-tatva-server.log || true

      - name: Upload browser QA artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: moodboard-home-browser-qa
          path: artifacts
          if-no-files-found: warn
          retention-days: 3
