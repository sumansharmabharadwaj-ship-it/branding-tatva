name: Repair first Services journey audit findings

on:
  push:
    branches:
      - homepage-cinematic-recovery
    paths:
      - .github/workflows/fix-services-gate-first-pass.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: branding-tatva-fix-services-gate-first-pass
  cancel-in-progress: false

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 8

    steps:
      - name: Check out the affected Services files
        uses: actions/checkout@v4
        with:
          ref: homepage-cinematic-recovery
          fetch-depth: 1
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            .github/workflows/fix-services-gate-first-pass.yml
            scripts/services_page_gate.cjs
            src/sections/Services/PackageSelector.tsx
            src/sections/Services/DeliverablesExplorer.tsx

      - name: Apply the accessibility and audit repairs
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          package = Path("src/sections/Services/PackageSelector.tsx")
          text = package.read_text()
          old = '''              type="button"
              onClick={() => {
                setActive(choice.slug);'''
          new = '''              type="button"
              aria-pressed={isActive}
              onClick={() => {
                setActive(choice.slug);'''
          if text.count(old) != 1:
              raise SystemExit(f"Package selector insertion point count: {text.count(old)}")
          package.write_text(text.replace(old, new, 1))

          deliverables = Path("src/sections/Services/DeliverablesExplorer.tsx")
          text = deliverables.read_text()
          old = '''className={`rounded-full border px-3.5 py-1.5 text-xs uppercase tracking-[0.12em] transition-colors duration-300 focus-visible:outline focus-visible:outline-2 focus-visible:outline-sandstone ${'''
          new = '''className={`min-h-11 rounded-full border px-3.5 py-1.5 text-xs uppercase tracking-[0.12em] transition-colors duration-300 focus-visible:outline focus-visible:outline-2 focus-visible:outline-sandstone ${'''
          if text.count(old) != 1:
              raise SystemExit(f"Deliverables filter insertion point count: {text.count(old)}")
          deliverables.write_text(text.replace(old, new, 1))

          gate = Path("scripts/services_page_gate.cjs")
          text = gate.read_text()
          old = '''  const packageCards = desire.locator("button").filter({ has: desire.locator("span.font-display") }).filter({ hasText: /Starting with an idea|Feeling unclear or inconsistent|Needing ongoing consistency/ });'''
          new = '''  const packageCards = desire
    .locator("button")
    .filter({ hasText: /Starting with an idea|Feeling unclear or inconsistent|Needing ongoing consistency/ });'''
          if text.count(old) != 1:
              raise SystemExit(f"Package-card audit selector count: {text.count(old)}")
          gate.write_text(text.replace(old, new, 1))
          PY

          grep -q 'aria-pressed={isActive}' src/sections/Services/PackageSelector.tsx
          grep -q 'min-h-11 rounded-full' src/sections/Services/DeliverablesExplorer.tsx
          grep -q 'Feeling unclear or inconsistent|Needing ongoing consistency' scripts/services_page_gate.cjs

      - name: Remove the one-time patch workflow
        run: rm .github/workflows/fix-services-gate-first-pass.yml

      - name: Commit the first audit repairs
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            scripts/services_page_gate.cjs \
            src/sections/Services/PackageSelector.tsx \
            src/sections/Services/DeliverablesExplorer.tsx \
            .github/workflows/fix-services-gate-first-pass.yml
          git diff --cached --check
          git commit -m "Fix package selection semantics and Services touch targets"
          git pull --rebase origin homepage-cinematic-recovery
          git push origin HEAD:homepage-cinematic-recovery
