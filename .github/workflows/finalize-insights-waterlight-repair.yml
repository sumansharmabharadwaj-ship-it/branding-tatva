name: Finalize Insights waterlight repair

on:
  workflow_dispatch:
  push:
    branches:
      - homepage-cinematic-recovery
    paths:
      - "docs/INSIGHTS_WATERLIGHT_ASSET_REPAIR_2026-08-07.md"

permissions:
  contents: write

concurrency:
  group: branding-tatva-insights-waterlight-finalizer
  cancel-in-progress: false

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 8

    steps:
      - name: Check out the canonical branch
        uses: actions/checkout@v4
        with:
          ref: homepage-cinematic-recovery
          fetch-depth: 0

      - name: Validate the restored poster and make every Insights gate media-aware
        run: |
          set -euo pipefail

          target="public/images/cinematic-waterlight-poster.jpg"
          report="docs/INSIGHTS_WATERLIGHT_ASSET_REPAIR_2026-08-07.md"

          test -s "$target"
          test -s "$report"
          test "$(file -b --mime-type "$target")" = "image/jpeg"

          node <<'NODE'
          const fs = require('node:fs');
          const workflows = [
            '.github/workflows/insights-authority-gate.yml',
            '.github/workflows/insights-browser-gate.yml',
            '.github/workflows/insights-discovery-gate.yml',
          ];
          const mediaPath = '      - public/images/cinematic-waterlight-poster.jpg';

          for (const file of workflows) {
            let content = fs.readFileSync(file, 'utf8');
            if (!content.includes(mediaPath.trim())) {
              const anchor = '      - next.config.ts';
              if (!content.includes(anchor)) {
                throw new Error(`${file}: next.config.ts path anchor is missing`);
              }
              content = content.replace(anchor, `${mediaPath}\n${anchor}`);
            }
            fs.writeFileSync(file, content);
          }
          NODE

          git rm -f .github/workflows/repair-insights-waterlight-poster.yml
          git rm -f .github/workflows/finalize-insights-waterlight-repair.yml
          git diff --check
          git status --short

      - name: Commit the permanent media-aware verification contract
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/insights-authority-gate.yml \
            .github/workflows/insights-browser-gate.yml \
            .github/workflows/insights-discovery-gate.yml \
            .github/workflows/repair-insights-waterlight-poster.yml \
            .github/workflows/finalize-insights-waterlight-repair.yml
          git commit -m "Verify the repaired Insights poster across every gate"
          git fetch origin homepage-cinematic-recovery
          git rebase origin/homepage-cinematic-recovery
          git push origin HEAD:homepage-cinematic-recovery
