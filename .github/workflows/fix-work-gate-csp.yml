name: Fix Work audit CSP compatibility

on:
  push:
    branches:
      - homepage-cinematic-recovery
    paths:
      - .github/workflows/fix-work-gate-csp.yml

permissions:
  contents: write

jobs:
  patch-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out the audit script
        uses: actions/checkout@v4
        with:
          ref: homepage-cinematic-recovery
          fetch-depth: 1
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            .github/workflows/fix-work-gate-csp.yml
            scripts/work_page_gate_v2.cjs

      - name: Replace CSP-blocked waitForFunction with locator polling
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("scripts/work_page_gate_v2.cjs")
          text = path.read_text()
          old = '  await page.waitForFunction(() => document.getElementById("hero-project-preview")?.textContent?.includes("MyShopInEurope"));'
          new = '''  await page.locator("#hero-project-preview", { hasText: "MyShopInEurope" }).waitFor({
            state: "visible",
            timeout: 8_000,
          });'''

          if text.count(old) != 1:
              raise SystemExit(f"Expected one CSP-blocked wait, found {text.count(old)}")

          path.write_text(text.replace(old, new, 1))
          PY

      - name: Remove the one-time patch workflow
        shell: bash
        run: rm .github/workflows/fix-work-gate-csp.yml

      - name: Commit the audit repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/work_page_gate_v2.cjs .github/workflows/fix-work-gate-csp.yml
          git diff --cached --check
          git commit -m "fix: avoid unsafe eval in Work audit"
          git pull --rebase origin homepage-cinematic-recovery
          git push origin HEAD:homepage-cinematic-recovery
