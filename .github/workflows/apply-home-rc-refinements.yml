name: Apply homepage release candidate refinements

on:
  push:
    branches:
      - reimagine-project-moves
    paths:
      - .github/workflows/apply-home-rc-refinements.yml

permissions:
  contents: write

jobs:
  refine-home:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out the preview branch
        uses: actions/checkout@v4
        with:
          ref: reimagine-project-moves
          fetch-depth: 1
          sparse-checkout: src
          sparse-checkout-cone-mode: true

      - name: Refine outcome copy and preserve the ladder safe zone
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(filename, before, after):
              path = Path(filename)
              text = path.read_text()
              if before not in text:
                  raise SystemExit("Expected source block was not found in " + filename)
              path.write_text(text.replace(before, after, 1))

          replace_once(
              "src/sections/Home/ThreePathsSection.tsx",
              "A position the business can grow from",
              "A position built to grow",
          )
          replace_once(
              "src/sections/Home/ThreePathsSection.tsx",
              "One recognisable idea across every touchpoint",
              "One idea across every touchpoint",
          )
          replace_once(
              "src/sections/Home/ThreePathsSection.tsx",
              "Recognition that keeps earning after launch",
              "Recognition that keeps compounding",
          )
          replace_once(
              "src/sections/Home/TatvaStrip.tsx",
              "lg:flex lg:items-start lg:justify-between lg:gap-2",
              "lg:flex lg:items-start lg:justify-between lg:gap-2 xl:pr-52 2xl:pr-60",
          )
          replace_once(
              "src/sections/Home/ChapterLadder.tsx",
              "pointer-events-none w-44 rounded-2xl",
              "pointer-events-none w-40 rounded-2xl",
          )
          replace_once(
              "src/sections/Home/ChapterLadder.tsx",
              "backdrop-blur-xl lg:w-52",
              "backdrop-blur-xl lg:w-44 2xl:w-52",
          )
          replace_once(
              "src/sections/Home/HomeAmbientFilm.tsx",
              "absolute bottom-4 left-4 right-4 font-display",
              "absolute bottom-4 left-4 right-4 hidden font-display sm:block",
          )

          css = Path("src/app/home-earth-tones.css")
          text = css.read_text()
          marker = '[data-home-earth-tone="paths"] svg > text:last-of-type {'
          start = text.find(marker)
          if start >= 0:
              start = text.rfind("\n", 0, start) + 1
              end = text.find("\n  }", start)
              if end < 0:
                  raise SystemExit("Path result size rule ending was not found")
              end = end + len("\n  }")
              css.write_text(text[:start] + text[end:])
          PY

      - name: Commit the source refinements
        shell: bash
        run: |
          git config user.name "Branding Tatva Build Bot"
          git config user.email "actions@users.noreply.github.com"
          git add src
          git commit -m "Refine path outcomes and protect the framework ladder safe zone"
          git push origin HEAD:reimagine-project-moves
