name: Trace About route retainers

on:
  workflow_dispatch:
  push:
    branches:
      - homepage-cinematic-recovery
    paths:
      - .github/workflows/trace-about-route-retainers.yml

permissions:
  contents: read

jobs:
  trace:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out application source without media blobs
        uses: actions/checkout@v4
        with:
          ref: homepage-cinematic-recovery
          fetch-depth: 1
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /src
            /package.json
            /pnpm-lock.yaml
            /next.config.ts
            /tsconfig.json

      - name: Trace About route imports and lifecycle-bearing code
        shell: bash
        run: |
          set -euo pipefail
          echo "## About page imports"
          sed -n '1,90p' src/app/about/page.tsx

          echo
          echo "## Raw video elements in About-owned and directly imported components"
          grep -RsnE '<video|videoRef|useVideoFadeIn' \
            src/app/about \
            src/sections/About \
            src/components/AboutSplitHero.tsx \
            src/components/ParallaxVideoBackdrop.tsx \
            src/components/MeadowClosing.tsx \
            src/components/NotebookClose.tsx \
            src/components/DesignRationaleGrid.tsx \
            src/components/AuditInvite.tsx \
            src/components/TiltCard.tsx \
            src/components/Reveal.tsx \
            src/components/ScrollProgress.tsx \
            src/components/AboutRouteNavigationRuntime.tsx \
            2>/dev/null || true

          echo
          echo "## Lifecycle and browser-global registrations"
          grep -RsnE 'addEventListener|removeEventListener|IntersectionObserver|ResizeObserver|MutationObserver|requestAnimationFrame|cancelAnimationFrame|setInterval|clearInterval|setTimeout|clearTimeout|ScrollTrigger|gsap\.|useScroll\(|useMotionValue|useSpring|useAnimationFrame' \
            src/app/about \
            src/sections/About \
            src/components/AboutSplitHero.tsx \
            src/components/ParallaxVideoBackdrop.tsx \
            src/components/MeadowClosing.tsx \
            src/components/NotebookClose.tsx \
            src/components/DesignRationaleGrid.tsx \
            src/components/AuditInvite.tsx \
            src/components/TiltCard.tsx \
            src/components/Reveal.tsx \
            src/components/ScrollProgress.tsx \
            src/components/AboutRouteNavigationRuntime.tsx \
            2>/dev/null || true

          echo
          echo "## All raw video elements in src/components and About sections"
          grep -Rsn '<video' src/components src/sections/About 2>/dev/null || true
