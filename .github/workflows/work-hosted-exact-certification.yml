name: Work hosted exact-source certification
run-name: Work hosted certification · ${{ github.sha }}

on:
  workflow_dispatch:
  push:
    branches:
      - homepage-cinematic-recovery
    paths:
      - .github/workflows/work-hosted-exact-certification.yml
      - src/app/work/**
      - src/sections/Work/**
      - src/sections/CaseStudies/BrandStudies.tsx
      - src/data/projects.ts
      - src/data/workTaxonomy.ts
      - src/data/caseStudyPresentation.ts
      - src/data/decisionArtifacts.ts
      - src/data/conceptProjects.ts
      - src/data/brandStudies.ts
      - src/data/capabilities.ts
      - src/app/release-markers/**
      - public/images/work-evidence-*.svg
      - scripts/work_page_gate_v3.cjs
      - scripts/work_hero_pause_gate.cjs
      - scripts/work_capability_attention_gate.cjs
      - scripts/work_mobile_narrative_gate.cjs
      - scripts/work_mobile_index_control_gate.cjs
      - scripts/work_lab_accessibility_gate.cjs
      - scripts/work_decision_context_gate.cjs
      - scripts/work_brand_study_context_gate.cjs
      - package.json
      - pnpm-lock.yaml
      - next.config.ts
      - vercel.json

permissions:
  contents: write

concurrency:
  group: branding-tatva-work-hosted-exact-certification
  cancel-in-progress: true

jobs:
  certify-work:
    runs-on: macos-latest
    timeout-minutes: 42

    steps:
      - name: Check out the newest canonical application source without the media archive
        uses: actions/checkout@v4
        with:
          ref: homepage-cinematic-recovery
          fetch-depth: 0
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/public/videos/*
            !/public/audio/*

      - name: Resolve the newest deployable source commit
        id: source
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin homepage-cinematic-recovery
          git reset --hard origin/homepage-cinematic-recovery
          sha="$(git log -1 --format=%H -- \
            src public package.json pnpm-lock.yaml next.config.ts \
            postcss.config.mjs tsconfig.json vercel.json)"
          test -n "$sha"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "Deployable Work source: $sha"

      - name: Use Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Activate pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.28.0 --activate

      - name: Install the Work browser runner
        run: |
          pnpm install --frozen-lockfile
          pnpm add --save-dev --lockfile=false playwright@1.54.2
          pnpm exec playwright install chromium

      - name: Wait for the permanent alias to serve the exact deployable source
        shell: bash
        env:
          EXPECTED_SHA: ${{ steps.source.outputs.sha }}
          EXPECTED_BRANCH: homepage-cinematic-recovery
          PREVIEW_URL: https://branding-tatva-git-homepage-cinematic-recovery-suman22.vercel.app
        run: |
          set -euo pipefail
          node <<'NODE'
          const expectedSha = process.env.EXPECTED_SHA;
          const expectedBranch = process.env.EXPECTED_BRANCH;
          const baseUrl = process.env.PREVIEW_URL.replace(/\/$/, "");
          const deadline = Date.now() + 15 * 60 * 1000;

          function contains(value, needle) {
            if (typeof value === "string") return value.includes(needle);
            if (Array.isArray(value)) return value.some((item) => contains(item, needle));
            if (value && typeof value === "object") {
              return Object.entries(value).some(([key, item]) => contains(key, needle) || contains(item, needle));
            }
            return false;
          }

          while (Date.now() < deadline) {
            try {
              const response = await fetch(`${baseUrl}/api/release`, {
                cache: "no-store",
                headers: { "user-agent": "branding-tatva-work-hosted-certification" },
              });
              const text = await response.text();
              let body;
              try { body = JSON.parse(text); } catch { body = { text }; }
              if (response.ok && contains(body, expectedSha) && contains(body, expectedBranch)) {
                console.log(JSON.stringify({ exactSource: true, expectedSha, body }, null, 2));
                process.exit(0);
              }
              console.log(`Alias not exact yet: status=${response.status}, expected=${expectedSha.slice(0, 12)}`);
            } catch (error) {
              console.log(`Alias probe failed: ${error instanceof Error ? error.message : String(error)}`);
            }
            await new Promise((resolve) => setTimeout(resolve, 15_000));
          }

          throw new Error(`Permanent alias did not serve exact Work source ${expectedSha} within 15 minutes`);
          NODE

      - name: Audit hosted Work hierarchy, filters, cases, reduced motion, and seven viewports
        id: page
        continue-on-error: true
        env:
          AUDIT_BASE_URL: https://branding-tatva-git-homepage-cinematic-recovery-suman22.vercel.app
          AUDIT_COMMIT: ${{ steps.source.outputs.sha }}
        run: node scripts/work_page_gate_v3.cjs

      - name: Audit hosted hero autoplay pause channels and keyboard selection
        id: hero
        continue-on-error: true
        env:
          AUDIT_BASE_URL: https://branding-tatva-git-homepage-cinematic-recovery-suman22.vercel.app
        run: node scripts/work_hero_pause_gate.cjs

      - name: Audit hosted capability attention states and recommendation routes
        id: capability
        continue-on-error: true
        env:
          AUDIT_BASE_URL: https://branding-tatva-git-homepage-cinematic-recovery-suman22.vercel.app
        run: node scripts/work_capability_attention_gate.cjs

      - name: Audit hosted compact mobile narratives and focused dossiers
        id: mobile_narrative
        continue-on-error: true
        env:
          AUDIT_BASE_URL: https://branding-tatva-git-homepage-cinematic-recovery-suman22.vercel.app
        run: node scripts/work_mobile_narrative_gate.cjs

      - name: Audit hosted mobile selector and active-evidence proximity
        id: mobile_index
        continue-on-error: true
        env:
          AUDIT_BASE_URL: https://branding-tatva-git-homepage-cinematic-recovery-suman22.vercel.app
        run: node scripts/work_mobile_index_control_gate.cjs

      - name: Audit hosted Lab focus restoration and phase-keyboard navigation
        id: lab
        continue-on-error: true
        env:
          AUDIT_BASE_URL: https://branding-tatva-git-homepage-cinematic-recovery-suman22.vercel.app
        run: node scripts/work_lab_accessibility_gate.cjs

      - name: Audit hosted seventh-decision mobile context restoration
        id: decision
        continue-on-error: true
        env:
          AUDIT_BASE_URL: https://branding-tatva-git-homepage-cinematic-recovery-suman22.vercel.app
        run: node scripts/work_decision_context_gate.cjs

      - name: Audit hosted fifth-study mobile close context restoration
        id: study
        continue-on-error: true
        env:
          AUDIT_BASE_URL: https://branding-tatva-git-homepage-cinematic-recovery-suman22.vercel.app
        run: node scripts/work_brand_study_context_gate.cjs

      - name: Report the complete hosted Work verification matrix
        env:
          PAGE_OUTCOME: ${{ steps.page.outcome }}
          HERO_OUTCOME: ${{ steps.hero.outcome }}
          CAPABILITY_OUTCOME: ${{ steps.capability.outcome }}
          MOBILE_NARRATIVE_OUTCOME: ${{ steps.mobile_narrative.outcome }}
          MOBILE_INDEX_OUTCOME: ${{ steps.mobile_index.outcome }}
          LAB_OUTCOME: ${{ steps.lab.outcome }}
          DECISION_OUTCOME: ${{ steps.decision.outcome }}
          STUDY_OUTCOME: ${{ steps.study.outcome }}
          SOURCE_SHA: ${{ steps.source.outputs.sha }}
        shell: bash
        run: |
          set -euo pipefail
          checks=(
            "page=$PAGE_OUTCOME"
            "hero=$HERO_OUTCOME"
            "capability=$CAPABILITY_OUTCOME"
            "mobile-narrative=$MOBILE_NARRATIVE_OUTCOME"
            "mobile-index=$MOBILE_INDEX_OUTCOME"
            "lab=$LAB_OUTCOME"
            "decision=$DECISION_OUTCOME"
            "study=$STUDY_OUTCOME"
          )
          failures=()
          {
            echo "## Hosted Work verification matrix"
            echo
            echo "- Alias: https://branding-tatva-git-homepage-cinematic-recovery-suman22.vercel.app/work"
            echo "- Exact deployable source: \`$SOURCE_SHA\`"
            echo
            echo "| Contract | Outcome |"
            echo "|---|---|"
            for check in "${checks[@]}"; do
              name="${check%%=*}"
              outcome="${check#*=}"
              echo "| $name | $outcome |"
              if [ "$outcome" != "success" ]; then
                failures+=("$name:$outcome")
              fi
            done
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "${#failures[@]}" -gt 0 ]; then
            printf 'Hosted Work verification failures: %s\n' "${failures[*]}"
            exit 1
          fi

      - name: Create an immutable hosted Work certification tag
        shell: bash
        env:
          CERTIFIED_SHA: ${{ steps.source.outputs.sha }}
        run: |
          set -euo pipefail
          short="${CERTIFIED_SHA:0:12}"
          tag="work-hosted-certified-${short}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git ls-remote --exit-code --tags origin "refs/tags/${tag}" >/dev/null 2>&1; then
            echo "Certification tag ${tag} already exists."
            exit 0
          fi
          git tag -a "$tag" "$CERTIFIED_SHA" -m "Complete Work experience certified on the permanent Vercel alias"
          git push origin "$tag"

      - name: Upload hosted Work visual evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: branding-tatva-work-hosted-${{ steps.source.outputs.sha }}
          path: cinematic-recovery-audit/*
          if-no-files-found: warn
          retention-days: 14
