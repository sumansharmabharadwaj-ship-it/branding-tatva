name: Work quick build macOS
run-name: Work quick build · ${{ github.sha }}

on:
  push:
    branches:
      - homepage-cinematic-recovery
    paths:
      - .github/workflows/work-quick-build-macos.yml

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-14
    timeout-minutes: 16

    steps:
      - name: Check out application without the media archive
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/public/videos/*
            !/public/audio/*

      - name: Use Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Activate pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.28.0 --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build production application
        env:
          NEXT_TELEMETRY_DISABLED: 1
        run: pnpm build
