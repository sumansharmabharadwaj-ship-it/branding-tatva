name: Import generated Services banner videos

on:
  push:
    branches:
      - homepage-cinematic-recovery
    paths:
      - .github/workflows/import-generated-service-videos.yml

permissions:
  contents: write

jobs:
  import-generated-media:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out the active cinematic branch
        uses: actions/checkout@v4
        with:
          ref: homepage-cinematic-recovery
          fetch-depth: 0

      - name: Download the generated 1080p silent loops
        env:
          HERO_URL: "https://production-273614-media-export.storage.googleapis.com/58971987-3d4a-433e-8b32-561326d17874/original.mp4?X-Goog-Algorithm=GOOG4-RSA-SHA256&X-Goog-Credential=descript-api%40production-273614.iam.gserviceaccount.com%2F20260806%2Fauto%2Fstorage%2Fgoog4_request&X-Goog-Date=20260806T092616Z&X-Goog-Expires=86400&X-Goog-SignedHeaders=host&X-Goog-"
          STRATEGY_URL: "https://production-273614-media-export.storage.googleapis.com/ef5947ed-b6af-4119-9b47-8289da03ab4d/original.mp4?X-Goog-Algorithm=GOOG4-RSA-SHA256&X-Goog-Credential=descript-api%40production-273614.iam.gserviceaccount.com%2F20260806%2Fauto%2Fstorage%2Fgoog4_request&X-Goog-Date=20260806T094942Z&X-Goog-Expires=86400&X-Goog-SignedHeaders=host&X-Goog-"
          HEALTH_URL: "https://production-273614-media-export.storage.googleapis.com/05c2c7f7-33a1-48c5-b7bb-be47e0f1802e/original.mp4?X-Goog-Algorithm=GOOG4-RSA-SHA256&X-Goog-Credential=descript-api%40production-273614.iam.gserviceaccount.com%2F20260806%2Fauto%2Fstorage%2Fgoog4_request&X-Goog-Date=20260806T094951Z&X-Goog-Expires=86400&X-Goog-SignedHeaders=host&X-Goog-"
        run: |
          set -euo pipefail

          output_dir="public/videos/generated"
          mkdir -p "$output_dir"

          curl --location --fail --show-error --silent --retry 3 --retry-delay 2 \
            "$HERO_URL" \
            --output "$output_dir/bt-services-hero-root-system.mp4"

          curl --location --fail --show-error --silent --retry 3 --retry-delay 2 \
            "$STRATEGY_URL" \
            --output "$output_dir/bt-services-strategy-topography.mp4"

          curl --location --fail --show-error --silent --retry 3 --retry-delay 2 \
            "$HEALTH_URL" \
            --output "$output_dir/bt-services-health-reflection.mp4"

          for video in "$output_dir"/*.mp4; do
            test -s "$video"
            file "$video" | grep -qi "mp4\|iso media"
          done

          sha256sum "$output_dir"/*.mp4 > "$output_dir/SHA256SUMS.txt"

      - name: Commit the generated media to the branch
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/videos/generated

          if git diff --cached --quiet; then
            echo "Generated media already exists; nothing to commit."
            exit 0
          fi

          git commit -m "feat: add original generated Services banner loops"
          git push origin HEAD:homepage-cinematic-recovery
