name: Repair client-proof Insight media fast

on:
  workflow_dispatch:
  push:
    branches:
      - homepage-cinematic-recovery
    paths:
      - .github/workflows/repair-insights-client-proof-media-fast.yml

permissions:
  contents: write

concurrency:
  group: branding-tatva-client-proof-media-fast-repair
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 8

    steps:
      - name: Check out only the media contract files
        uses: actions/checkout@v4
        with:
          ref: homepage-cinematic-recovery
          fetch-depth: 0
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /.github/workflows/repair-insights-client-proof-media-fast.yml
            /src/data/clientProofInsights.ts
            /public/images/higgsfield-element-water.jpg
            /public/videos/higgsfield-element-water.mp4

      - name: Use Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Repair the missing media pair idempotently
        run: |
          node <<'NODE'
          const fs = require("node:fs");
          const file = "src/data/clientProofInsights.ts";
          let content = fs.readFileSync(file, "utf8");

          const oldImage = '    heroImage: "/images/cinematic-waterlight-poster.jpg",';
          const oldVideo = '    heroVideo: "/videos/cinematic-waterlight.mp4",';
          const newImage = '    heroImage: "/images/higgsfield-element-water.jpg",';
          const newVideo = '    heroVideo: "/videos/higgsfield-element-water.mp4",';

          const alreadyRepaired = content.includes(newImage) && content.includes(newVideo);
          const needsRepair = content.includes(oldImage) && content.includes(oldVideo);
          if (!alreadyRepaired && !needsRepair) {
            throw new Error("Client-proof media contract is in an unexpected state");
          }

          if (needsRepair) {
            content = content.replace(oldImage, newImage).replace(oldVideo, newVideo);
            fs.writeFileSync(file, content);
          }
          NODE

          test -s public/images/higgsfield-element-water.jpg
          test -s public/videos/higgsfield-element-water.mp4
          ! git grep -n -I 'cinematic-waterlight' -- src public
          git diff --check

      - name: Commit only when the source changed
        run: |
          if git diff --quiet -- src/data/clientProofInsights.ts; then
            echo "The media pair was already repaired."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/clientProofInsights.ts
          git commit -m "Repair the client-proof Insight media pair"
          git fetch origin homepage-cinematic-recovery
          git rebase origin/homepage-cinematic-recovery
          git push origin HEAD:homepage-cinematic-recovery
