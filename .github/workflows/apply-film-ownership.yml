name: Apply homepage film ownership cleanup

on:
  push:
    branches:
      - reimagine-project-moves
    paths:
      - .github/workflows/apply-film-ownership.yml

permissions:
  contents: write

jobs:
  clean-film-layers:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out the preview branch
        uses: actions/checkout@v4
        with:
          ref: reimagine-project-moves
          fetch-depth: 1
          sparse-checkout: src
          sparse-checkout-cone-mode: true

      - name: Let local WebM fragments own Paths and Framework
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("src/sections/Home/HomeFilmConstellation.tsx")
          text = path.read_text()

          def remove_array_entry(source, container_marker, key):
              container = source.find(container_marker)
              if container < 0:
                  raise SystemExit("Container was not found: " + container_marker)
              start_marker = "\n  " + key + ": [\n"
              start = source.find(start_marker, container)
              if start < 0:
                  raise SystemExit("Entry was not found: " + key)
              end = source.find("\n  ],\n", start)
              if end < 0:
                  raise SystemExit("Entry ending was not found: " + key)
              return source[:start] + "\n" + source[end + len("\n  ],\n"):]

          for key in ("paths", "framework"):
              text = remove_array_entry(text, "const CHAPTER_FILMS", key)
          for key in ("paths", "framework"):
              text = remove_array_entry(text, "const PLACEMENTS", key)

          for line in (
              '  paths: "Choose the path",\n',
              '  framework: "Read the five forces",\n',
          ):
              if line not in text:
                  raise SystemExit("Chapter label was not found: " + line.strip())
              text = text.replace(line, "", 1)

          path.write_text(text)
          PY

      - name: Commit the ownership cleanup
        shell: bash
        run: |
          git config user.name "Branding Tatva Build Bot"
          git config user.email "actions@users.noreply.github.com"
          git add src/sections/Home/HomeFilmConstellation.tsx
          git commit -m "Let local WebM fragments own Paths and Framework"
          git push origin HEAD:reimagine-project-moves
