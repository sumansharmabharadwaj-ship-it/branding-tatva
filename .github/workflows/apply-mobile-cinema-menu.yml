name: Apply mobile cinema menu

on:
  push:
    branches:
      - reimagine-project-moves
    paths:
      - .github/workflows/apply-mobile-cinema-menu.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out the preview branch
        uses: actions/checkout@v4
        with:
          ref: reimagine-project-moves
          fetch-depth: 1

      - name: Consolidate the mobile cinema controls
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("src/sections/Home/HomeAutoJourney.tsx")
          text = path.read_text()

          text = text.replace(
              'import { motion, useReducedMotion } from "framer-motion";',
              'import { AnimatePresence, motion, useReducedMotion } from "framer-motion";',
              1,
          )

          old_state = '  const [complete, setComplete] = useState(false);'
          new_state = '  const [complete, setComplete] = useState(false);\n  const [isMobile, setIsMobile] = useState(false);\n  const [mobileMenuOpen, setMobileMenuOpen] = useState(false);\n  const [audioEnabled, setAudioEnabled] = useState(false);'
          if old_state not in text:
              raise SystemExit("HomeAutoJourney state anchor was not found")
          text = text.replace(old_state, new_state, 1)

          old_ignore = '        target.closest("[data-auto-journey-control]")'
          new_ignore = '        target.closest("[data-auto-journey-ui]")'
          if old_ignore not in text:
              raise SystemExit("HomeAutoJourney manual-input guard was not found")
          text = text.replace(old_ignore, new_ignore, 1)
          text = text.replace(
              '      pauseForReading();',
              '      setMobileMenuOpen(false);\n      pauseForReading();',
              1,
          )

          marker = '  useEffect(() => {\n    if (prefersReducedMotion) {'
          if marker not in text:
              raise SystemExit("HomeAutoJourney reduced-motion effect was not found")
          utilities_effect = '''  useEffect(() => {
    const query = window.matchMedia("(max-width: 767px)");

    function syncViewport() {
      setIsMobile(query.matches);
      if (!query.matches) setMobileMenuOpen(false);
    }

    function onAudioState(event: Event) {
      const detail = (event as CustomEvent<{ enabled?: boolean }>).detail;
      setAudioEnabled(Boolean(detail?.enabled));
    }

    function onEscape(event: KeyboardEvent) {
      if (event.key === "Escape") setMobileMenuOpen(false);
    }

    syncViewport();
    query.addEventListener("change", syncViewport);
    window.addEventListener("bt:ambient-audio-state", onAudioState as EventListener);
    window.addEventListener("keydown", onEscape);
    window.dispatchEvent(new CustomEvent("bt:ambient-audio-query"));

    return () => {
      query.removeEventListener("change", syncViewport);
      window.removeEventListener("bt:ambient-audio-state", onAudioState as EventListener);
      window.removeEventListener("keydown", onEscape);
    };
  }, []);

'''
          text = text.replace(marker, utilities_effect + marker, 1)

          tail_start = text.find('  function toggle() {')
          if tail_start < 0:
              raise SystemExit("HomeAutoJourney toggle function was not found")
          tail_end = text.rfind('\n}')
          if tail_end < tail_start:
              raise SystemExit("HomeAutoJourney component end was not found")

          new_tail = '''  function startJourney() {
    holdUntilRef.current = 0;
    setHolding(false);
    setMobileMenuOpen(false);

    if (complete) {
      setComplete(false);
      autoScrollRef.current = true;
      scrollToIndex(0, "replay");
      window.setTimeout(() => {
        autoScrollRef.current = false;
      }, 1900);
    } else {
      broadcastChapter(activeIndexRef.current, "journey");
    }

    setPlaying(true);
  }

  function stopJourney() {
    setPlaying(false);
    setHolding(false);
    setMobileMenuOpen(false);
  }

  function handlePrimaryControl() {
    if (playing) {
      stopJourney();
      return;
    }

    if (isMobile) {
      setMobileMenuOpen((open) => !open);
      return;
    }

    startJourney();
  }

  function toggleAmbientSound() {
    window.dispatchEvent(new CustomEvent("bt:ambient-audio-toggle"));
  }

  const controlLabel =
    isMobile && !playing ? "Open journey and sound controls" : label;

  return (
    <div data-auto-journey-ui className="contents">
      <AnimatePresence>
        {isMobile && mobileMenuOpen && !playing && (
          <motion.div
            id="mobile-cinema-controls"
            data-auto-journey-ui
            initial={{ opacity: 0, y: 10, scale: 0.96 }}
            animate={{ opacity: 1, y: 0, scale: 1 }}
            exit={{ opacity: 0, y: 8, scale: 0.97 }}
            transition={{ duration: 0.24, ease: [0.22, 1, 0.36, 1] }}
            className="fixed bottom-[7.9rem] right-4 z-[47] w-60 overflow-hidden rounded-3xl border border-white/12 bg-[#17140f]/94 p-2 text-left text-ivory shadow-[0_24px_70px_rgba(0,0,0,0.4)] backdrop-blur-xl md:hidden"
          >
            <p className="px-3 pb-2 pt-2 text-[0.55rem] font-medium uppercase tracking-[0.2em] text-ivory/38">
              Cinema controls
            </p>
            <button
              type="button"
              data-auto-journey-ui
              onClick={startJourney}
              className="flex w-full items-center justify-between gap-4 rounded-2xl px-3 py-3 transition-colors hover:bg-white/[0.06] focus-visible:outline focus-visible:outline-2 focus-visible:outline-sandstone"
            >
              <span>
                <span className="block font-display text-lg leading-none text-ivory">
                  {complete ? "Replay the journey" : "Play the journey"}
                </span>
                <span className="mt-1.5 block text-[0.62rem] leading-relaxed text-ivory/45">
                  Move chapter by chapter. Any touch returns control to you.
                </span>
              </span>
              <span aria-hidden="true" className="text-sandstone">▶</span>
            </button>
            <button
              type="button"
              data-auto-journey-ui
              aria-pressed={audioEnabled}
              onClick={toggleAmbientSound}
              className="mt-1 flex w-full items-center justify-between gap-4 rounded-2xl px-3 py-3 transition-colors hover:bg-white/[0.06] focus-visible:outline focus-visible:outline-2 focus-visible:outline-sandstone"
            >
              <span>
                <span className="block font-display text-lg leading-none text-ivory">
                  Ambient sound
                </span>
                <span className="mt-1.5 block text-[0.62rem] leading-relaxed text-ivory/45">
                  {audioEnabled ? "Playing softly. Tap to mute." : "Silent by default. Tap to listen."}
                </span>
              </span>
              <span
                aria-hidden="true"
                className={`h-2.5 w-2.5 rounded-full ${audioEnabled ? "bg-sandstone shadow-[0_0_14px_rgba(212,185,154,0.75)]" : "border border-ivory/25"}`}
              />
            </button>
          </motion.div>
        )}
      </AnimatePresence>

      <button
        type="button"
        data-auto-journey-control
        data-auto-journey-ui
        aria-pressed={playing}
        aria-expanded={isMobile && !playing ? mobileMenuOpen : undefined}
        aria-controls={isMobile && !playing ? "mobile-cinema-controls" : undefined}
        aria-label={controlLabel}
        onClick={handlePrimaryControl}
        className="fixed bottom-4 right-4 z-[46] inline-flex min-h-10 items-center gap-2 rounded-full border border-white/12 bg-[#17140f]/82 px-3.5 text-[0.56rem] font-medium uppercase tracking-[0.15em] text-ivory/72 shadow-[0_14px_42px_rgba(0,0,0,0.26)] backdrop-blur-xl transition-colors hover:text-ivory focus-visible:outline focus-visible:outline-2 focus-visible:outline-sandstone md:bottom-5 md:left-1/2 md:right-auto md:-translate-x-1/2"
      >
        <span
          aria-hidden="true"
          className="relative flex h-3.5 w-3.5 items-center justify-center text-sandstone"
        >
          {playing ? (
            <>
              <span className="h-2.5 w-px bg-current" />
              <span className="ml-1 h-2.5 w-px bg-current" />
            </>
          ) : (
            <span className="ml-0.5 h-0 w-0 border-b-[4px] border-l-[7px] border-t-[4px] border-b-transparent border-l-current border-t-transparent" />
          )}
          {playing && !holding && (
            <motion.span
              className="absolute inset-0 rounded-full border border-sandstone/40"
              animate={{ scale: [0.72, 1.5, 0.72], opacity: [0.8, 0, 0.8] }}
              transition={{ duration: 2.8, repeat: Infinity, ease: "easeInOut" }}
            />
          )}
        </span>
        <span>{label}</span>
        <span className="text-sandstone/70">
          {String(activeIndex + 1).padStart(2, "0")}/{String(total).padStart(2, "0")}
        </span>
      </button>
    </div>
  );'''

          text = text[:tail_start] + new_tail + text[tail_end:]
          path.write_text(text)

          css_path = Path("src/app/home-audit-fixes.css")
          css = css_path.read_text()
          addition = '\n:root[data-motion="reduced"] [data-ambient-audio-control] {\n  display: flex !important;\n}\n'
          if 'data-motion="reduced"] [data-ambient-audio-control]' not in css:
              css_path.write_text(css + addition)
          PY

      - name: Commit the mobile cinema menu and remove the one time workflow
        shell: bash
        run: |
          git config user.name "Branding Tatva Build Bot"
          git config user.email "actions@users.noreply.github.com"
          git add src/sections/Home/HomeAutoJourney.tsx src/app/home-audit-fixes.css
          git rm .github/workflows/apply-mobile-cinema-menu.yml
          git commit -m "Consolidate mobile journey and sound into one cinema menu"
          git push origin HEAD:reimagine-project-moves
