name: Work page evidence gate
run-name: Work evidence gate · ${{ github.sha }}

on:
  # Keep a manual route available for accessibility and deployment verification.
  # Every focused contract now runs before the job reports its combined result.
  workflow_dispatch:
  push:
    branches:
      - homepage-cinematic-recovery
    paths:
      - .github/workflows/work-page-gate.yml
      - scripts/work_page_gate_v2.cjs
      - scripts/work_page_gate_v3.cjs
      - scripts/work_mobile_narrative_gate.cjs
      - scripts/work_mobile_index_control_gate.cjs
      - scripts/work_lab_accessibility_gate.cjs
      - scripts/work_decision_context_gate.cjs
      - scripts/work_brand_study_context_gate.cjs
      - scripts/work_hero_pause_gate.cjs
      - scripts/work_capability_attention_gate.cjs
      - public/images/work-evidence-*.svg
      - src/app/work/**
      - src/sections/Work/**
      - src/sections/CaseStudies/BrandStudies.tsx
      - src/data/projects.ts
      - src/data/workTaxonomy.ts
      - src/data/caseStudyPresentation.ts
      - src/data/decisionArtifacts.ts
      - src/data/conceptProjects.ts
      - src/data/brandStudies.ts
      - src/data/capabilities.ts
      - src/components/**
      - src/layouts/**
      - src/lib/**
      - package.json
      - pnpm-lock.yaml
      - next.config.ts

permissions:
  contents: read

concurrency:
  group: branding-tatva-work-evidence-gate
  cancel-in-progress: true

jobs:
  audit-work:
    # Temporary final-verification lane: macOS bypasses the saturated Ubuntu queue.
    runs-on: macos-latest
    timeout-minutes: 30

    steps:
      - name: Check out application without the media archive
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/public/videos/*
            !/public/audio/*

      - name: Use Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Activate pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.28.0 --activate

      - name: Install dependencies
        run: |
          pnpm install --frozen-lockfile
          pnpm add --save-dev --lockfile=false playwright@1.54.2

      - name: Install Chromium
        run: pnpm exec playwright install chromium

      - name: Build production application
        env:
          NEXT_TELEMETRY_DISABLED: 1
        run: pnpm build

      - name: Start production server
        env:
          NEXT_TELEMETRY_DISABLED: 1
        run: |
          pnpm start --hostname 127.0.0.1 --port 3000 > /tmp/branding-tatva-work.log 2>&1 &
          echo $! > /tmp/branding-tatva-work.pid
          for attempt in {1..90}; do
            if curl --fail --silent http://127.0.0.1:3000/work > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/branding-tatva-work.log
          exit 1

      - name: Audit Work hierarchy, filters, case studies, reduced motion, and viewports
        id: page
        continue-on-error: true
        env:
          AUDIT_BASE_URL: http://127.0.0.1:3000
          AUDIT_COMMIT: ${{ github.sha }}
        run: node scripts/work_page_gate_v3.cjs

      - name: Audit hero autoplay pause channels and keyboard selection
        id: hero
        continue-on-error: true
        env:
          AUDIT_BASE_URL: http://127.0.0.1:3000
        run: node scripts/work_hero_pause_gate.cjs

      - name: Audit capability attention states and recommendation routes
        id: capability
        continue-on-error: true
        env:
          AUDIT_BASE_URL: http://127.0.0.1:3000
        run: node scripts/work_capability_attention_gate.cjs

      - name: Audit compact mobile narratives and focused dossiers
        id: mobile_narrative
        continue-on-error: true
        env:
          AUDIT_BASE_URL: http://127.0.0.1:3000
        run: node scripts/work_mobile_narrative_gate.cjs

      - name: Audit mobile Work selector and active-evidence proximity
        id: mobile_index
        continue-on-error: true
        env:
          AUDIT_BASE_URL: http://127.0.0.1:3000
        run: node scripts/work_mobile_index_control_gate.cjs

      - name: Audit Lab focus restoration and phase-keyboard navigation
        id: lab
        continue-on-error: true
        env:
          AUDIT_BASE_URL: http://127.0.0.1:3000
        run: node scripts/work_lab_accessibility_gate.cjs

      - name: Audit seventh-decision mobile context restoration
        id: decision
        continue-on-error: true
        env:
          AUDIT_BASE_URL: http://127.0.0.1:3000
        run: node scripts/work_decision_context_gate.cjs

      - name: Audit fifth-study mobile close context restoration
        id: study
        continue-on-error: true
        env:
          AUDIT_BASE_URL: http://127.0.0.1:3000
        run: node scripts/work_brand_study_context_gate.cjs

      - name: Report the complete Work verification matrix
        if: always()
        env:
          PAGE_OUTCOME: ${{ steps.page.outcome }}
          HERO_OUTCOME: ${{ steps.hero.outcome }}
          CAPABILITY_OUTCOME: ${{ steps.capability.outcome }}
          MOBILE_NARRATIVE_OUTCOME: ${{ steps.mobile_narrative.outcome }}
          MOBILE_INDEX_OUTCOME: ${{ steps.mobile_index.outcome }}
          LAB_OUTCOME: ${{ steps.lab.outcome }}
          DECISION_OUTCOME: ${{ steps.decision.outcome }}
          STUDY_OUTCOME: ${{ steps.study.outcome }}
        run: |
          checks=(
            "page=$PAGE_OUTCOME"
            "hero=$HERO_OUTCOME"
            "capability=$CAPABILITY_OUTCOME"
            "mobile-narrative=$MOBILE_NARRATIVE_OUTCOME"
            "mobile-index=$MOBILE_INDEX_OUTCOME"
            "lab=$LAB_OUTCOME"
            "decision=$DECISION_OUTCOME"
            "study=$STUDY_OUTCOME"
          )
          failures=()
          {
            echo "## Work verification matrix"
            echo
            echo "| Contract | Outcome |"
            echo "|---|---|"
            for check in "${checks[@]}"; do
              name="${check%%=*}"
              outcome="${check#*=}"
              echo "| $name | $outcome |"
              if [ "$outcome" != "success" ]; then
                failures+=("$name:$outcome")
              fi
            done
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "${#failures[@]}" -gt 0 ]; then
            printf 'Work verification failures: %s\n' "${failures[*]}"
            exit 1
          fi

      - name: Stop production server
        if: always()
        run: |
          if [ -f /tmp/branding-tatva-work.pid ]; then
            kill "$(cat /tmp/branding-tatva-work.pid)" || true
          fi
          cat /tmp/branding-tatva-work.log || true

      - name: Upload Work visual evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: branding-tatva-work-evidence
          path: cinematic-recovery-audit/*
          if-no-files-found: error
          retention-days: 7
