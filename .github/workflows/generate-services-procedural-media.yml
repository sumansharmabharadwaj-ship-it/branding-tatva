name: Generate original Services procedural media

on:
  push:
    branches:
      - homepage-cinematic-recovery
    paths:
      - .github/workflows/generate-services-procedural-media.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: branding-tatva-services-procedural-media
  cancel-in-progress: false

jobs:
  generate-and-integrate:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out only the generator, page, and generated media
        uses: actions/checkout@v4
        with:
          ref: homepage-cinematic-recovery
          fetch-depth: 1
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            .github/workflows/generate-services-procedural-media.yml
            scripts/generate_services_procedural_media.py
            src/app/services/page.tsx
            public/videos/generated
            public/images/generated

      - name: Use Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install rendering dependencies
        shell: bash
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg
          python -m pip install --disable-pip-version-check --no-cache-dir numpy pillow

      - name: Render, optimise, and wire the original loops
        shell: bash
        run: python scripts/generate_services_procedural_media.py

      - name: Validate media duration, dimensions, and audio state
        shell: bash
        run: |
          set -euo pipefail
          for video in \
            public/videos/generated/bt-services-package-current.mp4 \
            public/videos/generated/bt-services-package-current-mobile.mp4 \
            public/videos/generated/bt-services-perception-ascent.mp4 \
            public/videos/generated/bt-services-perception-ascent-mobile.mp4
          do
            test -s "$video"
            duration="$(ffprobe -v error -show_entries format=duration -of csv=p=0 "$video")"
            python -c 'import sys; d=float(sys.argv[1]); assert 4.8 <= d <= 5.2, d' "$duration"
            audio_streams="$(ffprobe -v error -select_streams a -show_entries stream=index -of csv=p=0 "$video" | wc -l)"
            test "$audio_streams" -eq 0
          done

          test -s public/images/generated/bt-services-package-current-poster.jpg
          test -s public/images/generated/bt-services-perception-ascent-poster.jpg
          grep -q 'bt-services-package-current.mp4' src/app/services/page.tsx
          grep -q 'bt-services-perception-ascent.mp4' src/app/services/page.tsx

      - name: Commit the rendered media and Services integration
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            public/videos/generated \
            public/images/generated \
            src/app/services/page.tsx

          if git diff --cached --quiet; then
            echo "Procedural media is already current."
            exit 0
          fi

          git diff --cached --check
          git commit -m "feat: install original package and perception loops"
          git pull --rebase origin homepage-cinematic-recovery
          git push origin HEAD:homepage-cinematic-recovery
