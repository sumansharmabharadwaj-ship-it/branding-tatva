name: Fix the Work mobile model narrowing
run-name: Work mobile narrowing repair · ${{ github.sha }}

on:
  push:
    branches:
      - homepage-cinematic-recovery
    paths:
      - .github/workflows/fix-work-mobile-model-narrowing.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: branding-tatva-work-mobile-model-narrowing
  cancel-in-progress: true

jobs:
  repair-build-commit:
    if: github.actor != 'github-actions[bot]'
    runs-on: macos-14
    timeout-minutes: 24

    steps:
      - name: Check out the current cinematic branch without the media archive
        uses: actions/checkout@v4
        with:
          ref: homepage-cinematic-recovery
          fetch-depth: 1
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/public/videos/*
            !/public/audio/*

      - name: Apply the model narrowing repair
        run: |
          python3 -m py_compile scripts/fix_work_mobile_model_narrowing.py
          python3 scripts/fix_work_mobile_model_narrowing.py
          git diff --check

      - name: Use Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Activate pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.28.0 --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build the production application
        env:
          NEXT_TELEMETRY_DISABLED: 1
        run: pnpm build

      - name: Remove one-time repair tools
        run: |
          rm scripts/fix_work_mobile_model_narrowing.py
          rm .github/workflows/fix-work-mobile-model-narrowing.yml

      - name: Commit the verified Work build repair
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            src/sections/Work/MobileNarrativeEnhancers.tsx \
            scripts/fix_work_mobile_model_narrowing.py \
            .github/workflows/fix-work-mobile-model-narrowing.yml
          git diff --cached --check
          git commit -m "Stabilize Work mobile deck model access"
          git push origin HEAD:homepage-cinematic-recovery
