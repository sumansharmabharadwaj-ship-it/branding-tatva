name: Assert mobile Lab dossier handoff

on:
  push:
    branches:
      - homepage-cinematic-recovery
    paths:
      - .github/workflows/assert-mobile-lab-handoff.yml

permissions:
  contents: write
  actions: write

concurrency:
  group: assert-mobile-lab-handoff
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the working branch
        uses: actions/checkout@v4
        with:
          ref: homepage-cinematic-recovery
          fetch-depth: 0
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/public/videos/*
            !/public/audio/*

      - name: Apply, validate, publish, and dispatch
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          for attempt in 1 2 3; do
            echo "Lab handoff assertion attempt ${attempt}"
            git fetch origin homepage-cinematic-recovery
            git reset --hard origin/homepage-cinematic-recovery

            python <<'PY'
          from pathlib import Path

          path = Path("scripts/work_page_gate_v3.cjs")
          workflow = Path(".github/workflows/assert-mobile-lab-handoff.yml")
          source = path.read_text(encoding="utf-8")

          old = '''    await labButtons.first().click();
              await page.waitForTimeout(260);
              assert((await labButtons.first().getAttribute("aria-expanded")) === "true", `${label}: Lab dossier did not open`);
              await captureLocator(page, labSection, `work-${viewport.name}-lab-open.png`);'''.replace("          ", "")

          new = '''    await labButtons.first().click();
              await page.waitForTimeout(900);
              assert((await labButtons.first().getAttribute("aria-expanded")) === "true", `${label}: Lab dossier did not open`);

              if (viewport.name === "mobile-390x844") {
                const dossierTop = await page.locator("#lab-deodar-retreat").evaluate(
                  (node) => node.getBoundingClientRect().top,
                );
                assert(
                  dossierTop >= 72 && dossierTop <= 220,
                  `${label}: opened Lab dossier did not hand off into the viewport, top=${dossierTop}`,
                );
                await page.screenshot({
                  path: path.join(OUTPUT, "work-mobile-390x844-lab-handoff.png"),
                  animations: "disabled",
                });
              }

              await captureLocator(page, labSection, `work-${viewport.name}-lab-open.png`);'''.replace("          ", "")

          count = source.count(old)
          if count != 1:
              raise RuntimeError(f"Expected one Lab interaction block, found {count}")

          path.write_text(source.replace(old, new, 1), encoding="utf-8")
          workflow.unlink()
          print("Installed mobile Lab handoff geometry assertion and viewport capture")
          PY

            node --check scripts/work_page_gate_v3.cjs
            git add scripts/work_page_gate_v3.cjs .github/workflows/assert-mobile-lab-handoff.yml

            if git diff --cached --quiet; then
              echo "Mobile Lab handoff assertion is already present."
              gh workflow run work-page-gate.yml --ref homepage-cinematic-recovery
              exit 0
            fi

            git commit -m "Verify the mobile Lab dossier handoff"
            if git push origin HEAD:homepage-cinematic-recovery; then
              gh workflow run work-page-gate.yml --ref homepage-cinematic-recovery
              echo "Lab handoff assertion published and Work gate dispatched."
              exit 0
            fi

            echo "Branch moved; replaying on the newest head."
          done

          exit 1
