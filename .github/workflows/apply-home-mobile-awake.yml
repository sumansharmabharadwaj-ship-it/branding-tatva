name: Apply homepage mobile scene wakeups

on:
  push:
    branches:
      - reimagine-project-moves
    paths:
      - .github/workflows/apply-home-mobile-awake.yml

permissions:
  contents: write

jobs:
  patch-scenes:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out the preview branch
        uses: actions/checkout@v4
        with:
          ref: reimagine-project-moves
          fetch-depth: 1
          sparse-checkout: src
          sparse-checkout-cone-mode: true

      - name: Wake tall chapters as soon as they enter a phone viewport
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          pairs = [
              (
                  Path("src/sections/Home/ClarityCTA.tsx"),
                  "const inView = useInView(sectionRef, { amount: 0.38 });",
                  "const inView = useInView(sectionRef, { margin: \"12% 0px\", amount: 0.08 });",
              ),
              (
                  Path("src/sections/Home/EvidenceWall.tsx"),
                  "const inView = useInView(sectionRef, { amount: 0.42 });",
                  "const inView = useInView(sectionRef, { margin: \"12% 0px\", amount: 0.08 });",
              ),
              (
                  Path("src/sections/Home/ThreePathsSection.tsx"),
                  "const inView = useInView(sectionRef, { amount: 0.34 });",
                  "const inView = useInView(sectionRef, { margin: \"12% 0px\", amount: 0.1 });",
              ),
              (
                  Path("src/sections/Home/TatvaSystemLab.tsx"),
                  "const inView = useInView(sectionRef, { amount: 0.28 });",
                  "const inView = useInView(sectionRef, { margin: \"12% 0px\", amount: 0.1 });",
              ),
              (
                  Path("src/sections/Process/RootSystem.tsx"),
                  "const inView = useInView(sectionRef, { amount: 0.32 });",
                  "const inView = useInView(sectionRef, { margin: \"12% 0px\", amount: 0.08 });",
              ),
          ]

          for path, before, after in pairs:
              text = path.read_text()
              if before not in text:
                  raise SystemExit("Expected in-view threshold was not found in " + str(path))
              path.write_text(text.replace(before, after, 1))

          slider = Path("src/sections/Elements/PinnedSlider.tsx")
          text = slider.read_text()
          before = """      if (detail?.id !== \"elements\") return;
      pauseAutoplay(900);
      showIndex(0);"""
          after = """      if (detail?.id !== \"elements\") return;
      setIsVisible(true);
      pauseAutoplay(900);
      showIndex(0);"""
          if before not in text:
              raise SystemExit("Expected Elements chapter handler was not found")
          slider.write_text(text.replace(before, after, 1))
          PY

      - name: Commit the scene wakeups
        shell: bash
        run: |
          git config user.name "Branding Tatva Build Bot"
          git config user.email "actions@users.noreply.github.com"
          git add src
          git commit -m "Wake tall homepage scenes on mobile"
          git push origin HEAD:reimagine-project-moves
