name: Integrate generated Services videos

on:
  push:
    branches:
      - homepage-cinematic-recovery
    paths:
      - .github/workflows/integrate-generated-service-videos.yml

permissions:
  contents: write

jobs:
  integrate-generated-media:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out only the media and files being edited
        uses: actions/checkout@v4
        with:
          ref: homepage-cinematic-recovery
          fetch-depth: 1
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            .github/workflows/import-generated-service-videos.yml
            .github/workflows/import-generated-service-videos-fast.yml
            .github/workflows/integrate-generated-service-videos.yml
            public/videos/generated
            public/images/generated
            scripts/integrate-generated-service-media.py
            scripts/integrate-generated-service-media.sh
            src/app/services/page.tsx
            src/components/BackgroundVideo.tsx
            src/components/PhotoHero.tsx

      - name: Optimise, validate, and wire the generated media
        shell: bash
        run: bash scripts/integrate-generated-service-media.sh

      - name: Remove temporary import machinery
        shell: bash
        run: |
          rm -f \
            .github/workflows/import-generated-service-videos.yml \
            .github/workflows/import-generated-service-videos-fast.yml \
            .github/workflows/integrate-generated-service-videos.yml \
            scripts/integrate-generated-service-media.py \
            scripts/integrate-generated-service-media.sh

      - name: Commit the finished integration
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            .github/workflows \
            public/videos/generated \
            public/images/generated \
            scripts \
            src/app/services/page.tsx \
            src/components/BackgroundVideo.tsx \
            src/components/PhotoHero.tsx
          git diff --cached --check
          git commit -m "feat: install original generated Services media"
          git pull --rebase origin homepage-cinematic-recovery
          git push origin HEAD:homepage-cinematic-recovery
