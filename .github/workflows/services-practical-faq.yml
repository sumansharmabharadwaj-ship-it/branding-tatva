name: Build and verify the Services practical FAQ
run-name: Services practical FAQ macOS · ${{ github.sha }}

on:
  push:
    branches:
      - services-practical-faq
    paths:
      - .github/workflows/services-practical-faq.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: branding-tatva-services-practical-faq
  cancel-in-progress: true

jobs:
  build-audit-commit:
    if: github.actor != 'github-actions[bot]'
    runs-on: macos-14
    timeout-minutes: 35

    steps:
      - name: Check out the focused branch without the media archive
        uses: actions/checkout@v4
        with:
          ref: services-practical-faq
          fetch-depth: 1
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/public/videos/*
            !/public/audio/*

      - name: Install the FAQ chapter and browser contract
        run: |
          python3 -m py_compile scripts/apply_services_practical_faq.py
          python3 scripts/apply_services_practical_faq.py
          git diff --check

      - name: Use Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Activate pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.28.0 --activate

      - name: Install dependencies and Chromium
        run: |
          pnpm install --frozen-lockfile
          pnpm add --save-dev --lockfile=false playwright@1.54.2
          pnpm exec playwright install chromium

      - name: Build the production application
        env:
          NEXT_TELEMETRY_DISABLED: 1
        run: pnpm build

      - name: Start the production server
        env:
          NEXT_TELEMETRY_DISABLED: 1
        run: |
          pnpm start --hostname 127.0.0.1 --port 3000 > /tmp/services-practical-faq.log 2>&1 &
          echo $! > /tmp/services-practical-faq.pid
          for attempt in {1..90}; do
            if curl --fail --silent http://127.0.0.1:3000/services > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/services-practical-faq.log
          exit 1

      - name: Walk the complete Services journey at three viewports
        env:
          AUDIT_BASE_URL: http://127.0.0.1:3000
        run: node scripts/services_page_gate.cjs

      - name: Stop the production server
        if: always()
        run: |
          if [ -f /tmp/services-practical-faq.pid ]; then
            kill "$(cat /tmp/services-practical-faq.pid)" || true
          fi
          cat /tmp/services-practical-faq.log || true

      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: services-practical-faq-evidence
          path: services-page-audit/*
          if-no-files-found: warn
          retention-days: 7

      - name: Remove one-time verification tools
        run: |
          rm scripts/apply_services_practical_faq.py
          rm .github/workflows/services-practical-faq.yml
          cat > vercel.json <<'JSON'
          {
            "$schema": "https://openapi.vercel.sh/vercel.json",
            "ignoreCommand": "git diff --quiet HEAD^ HEAD -- src public package.json pnpm-lock.yaml next.config.ts postcss.config.mjs tsconfig.json vercel.json",
            "git": {
              "deploymentEnabled": {
                "homepage-cinematic-recovery": false,
                "feat/insights-authority-hub": false,
                "staging/site-integration": false
              }
            }
          }
          JSON

      - name: Commit the verified FAQ chapter
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            src/app/services/page.tsx \
            src/data/servicesFaqs.ts \
            src/sections/Services/ServicesFAQ.tsx \
            scripts/services_page_gate.cjs \
            scripts/apply_services_practical_faq.py \
            .github/workflows/services-practical-faq.yml \
            vercel.json
          git diff --cached --check
          git commit -m "Add the practical Services FAQ risk-removal chapter"
          git push origin HEAD:services-practical-faq
