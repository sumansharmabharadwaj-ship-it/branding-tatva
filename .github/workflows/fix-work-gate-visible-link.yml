name: Repair Work verifier visible project route

on:
  workflow_dispatch:
  push:
    branches:
      - homepage-cinematic-recovery
    paths:
      - ".github/workflows/fix-work-gate-visible-link.yml"

permissions:
  contents: write

concurrency:
  group: branding-tatva-work-visible-route-repair
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 8

    steps:
      - name: Check out the canonical branch
        uses: actions/checkout@v4
        with:
          ref: homepage-cinematic-recovery
          fetch-depth: 0

      - name: Use Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Target the visible responsive project link
        run: |
          node <<'NODE'
          const fs = require("node:fs");
          const file = "scripts/work_page_gate_v3.cjs";
          const before = fs.readFileSync(file, "utf8");
          const from = `  await page.locator('#index a[href="/work/dr-haley-nutrition"]').first().click();`;
          const to = `  const projectRoute = page.locator('#index a[href="/work/dr-haley-nutrition"]:visible').first();\n  await projectRoute.waitFor({ state: "visible", timeout: 8_000 });\n  await projectRoute.click();`;
          const count = before.split(from).length - 1;
          if (count !== 1) {
            throw new Error(`Expected one responsive project-route assertion, found ${count}`);
          }
          fs.writeFileSync(file, before.replace(from, to));
          NODE
          node --check scripts/work_page_gate_v3.cjs

      - name: Commit the verifier repair
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/work_page_gate_v3.cjs
          git commit -m "Target the visible Work project route in browser verification"
          git fetch origin homepage-cinematic-recovery
          git rebase origin/homepage-cinematic-recovery
          git push origin HEAD:homepage-cinematic-recovery
