name: Contact hosted exact-source certification
run-name: Contact hosted certification · ${{ github.sha }}

on:
  workflow_dispatch:
  push:
    branches:
      - homepage-cinematic-recovery
    paths:
      - .github/workflows/contact-hosted-exact-certification.yml
      - scripts/contact_hosted_gate.cjs
      - src/app/contact/**
      - src/app/api/contact/**
      - src/app/api/newsletter/**
      - src/app/release-markers/**
      - src/components/**Contact**
      - src/components/**Calendly**
      - src/components/**Form**
      - src/data/contact.ts
      - src/data/site.ts
      - src/layouts/**
      - package.json
      - pnpm-lock.yaml
      - next.config.ts
      - vercel.json

permissions:
  contents: write

concurrency:
  group: branding-tatva-contact-hosted-exact-certification
  cancel-in-progress: true

jobs:
  certify-contact:
    runs-on: macos-latest
    timeout-minutes: 34

    steps:
      - name: Check out the newest canonical application source without the media archive
        uses: actions/checkout@v4
        with:
          ref: homepage-cinematic-recovery
          fetch-depth: 0
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/public/videos/*
            !/public/audio/*

      - name: Resolve the newest deployable source commit
        id: source
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin homepage-cinematic-recovery
          git reset --hard origin/homepage-cinematic-recovery
          sha="$(git log -1 --format=%H -- \
            src public package.json pnpm-lock.yaml next.config.ts \
            postcss.config.mjs tsconfig.json vercel.json)"
          test -n "$sha"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "Deployable Contact source: $sha"

      - name: Use Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Activate pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.28.0 --activate

      - name: Install the Contact browser runner
        run: |
          pnpm install --frozen-lockfile
          pnpm add --save-dev --lockfile=false playwright@1.54.2
          pnpm exec playwright install chromium

      - name: Wait for the permanent alias to serve the exact deployable source
        shell: bash
        env:
          EXPECTED_SHA: ${{ steps.source.outputs.sha }}
          EXPECTED_BRANCH: homepage-cinematic-recovery
          PREVIEW_URL: https://branding-tatva-git-homepage-cinematic-recovery-suman22.vercel.app
        run: |
          set -euo pipefail
          node <<'NODE'
          const expectedSha = process.env.EXPECTED_SHA;
          const expectedBranch = process.env.EXPECTED_BRANCH;
          const baseUrl = process.env.PREVIEW_URL.replace(/\/$/, "");
          const deadline = Date.now() + 15 * 60 * 1000;

          function contains(value, needle) {
            if (typeof value === "string") return value.includes(needle);
            if (Array.isArray(value)) return value.some((item) => contains(item, needle));
            if (value && typeof value === "object") {
              return Object.entries(value).some(([key, item]) => contains(key, needle) || contains(item, needle));
            }
            return false;
          }

          while (Date.now() < deadline) {
            try {
              const response = await fetch(`${baseUrl}/api/release`, {
                cache: "no-store",
                headers: { "user-agent": "branding-tatva-contact-hosted-certification" },
              });
              const text = await response.text();
              let body;
              try { body = JSON.parse(text); } catch { body = { text }; }
              if (response.ok && contains(body, expectedSha) && contains(body, expectedBranch)) {
                console.log(JSON.stringify({ exactSource: true, expectedSha, body }, null, 2));
                process.exit(0);
              }
              console.log(`Alias not exact yet: status=${response.status}, expected=${expectedSha.slice(0, 12)}`);
            } catch (error) {
              console.log(`Alias probe failed: ${error instanceof Error ? error.message : String(error)}`);
            }
            await new Promise((resolve) => setTimeout(resolve, 15_000));
          }

          throw new Error(`Permanent alias did not serve exact Contact source ${expectedSha} within 15 minutes`);
          NODE

      - name: Audit hosted Contact, booking paths, mobile layout, validation, and safe API rejection paths
        env:
          AUDIT_BASE_URL: https://branding-tatva-git-homepage-cinematic-recovery-suman22.vercel.app
          AUDIT_COMMIT: ${{ steps.source.outputs.sha }}
        run: node scripts/contact_hosted_gate.cjs

      - name: Create an immutable hosted Contact certification tag
        shell: bash
        env:
          CERTIFIED_SHA: ${{ steps.source.outputs.sha }}
        run: |
          set -euo pipefail
          short="${CERTIFIED_SHA:0:12}"
          tag="contact-hosted-certified-${short}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git ls-remote --exit-code --tags origin "refs/tags/${tag}" >/dev/null 2>&1; then
            echo "Certification tag ${tag} already exists."
            exit 0
          fi
          git tag -a "$tag" "$CERTIFIED_SHA" -m "Contact and non-destructive booking paths certified on the permanent Vercel alias"
          git push origin "$tag"

      - name: Upload hosted Contact evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: branding-tatva-contact-hosted-${{ steps.source.outputs.sha }}
          path: contact-hosted-audit/*
          if-no-files-found: warn
          retention-days: 14
