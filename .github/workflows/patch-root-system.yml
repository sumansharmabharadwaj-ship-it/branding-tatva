name: Patch RootSystem playback

on:
  push:
    branches:
      - reimagine-project-moves
    paths:
      - .github/workflows/patch-root-system.yml

permissions:
  contents: write

jobs:
  patch-root:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out the preview branch
        uses: actions/checkout@v4
        with:
          ref: reimagine-project-moves
          fetch-depth: 1
          sparse-checkout: src
          sparse-checkout-cone-mode: true

      - name: Replace the nullable playback closure
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path("src/sections/Process/RootSystem.tsx")
          text = path.read_text()
          before = "  useEffect(() => {\n    const currentVideo = videoRef.current;\n    if (!currentVideo || prefersReducedMotion) return;\n\n    function syncPlayback() {\n      if (inView && !document.hidden) void currentVideo.play().catch(() => {});\n      else currentVideo.pause();\n    }\n\n    syncPlayback();\n    document.addEventListener(\"visibilitychange\", syncPlayback);\n    return () => {\n      document.removeEventListener(\"visibilitychange\", syncPlayback);\n      currentVideo.pause();\n    };\n  }, [active, inView, prefersReducedMotion]);"
          after = "  useEffect(() => {\n    if (prefersReducedMotion) return;\n    const videoAtEffectStart = videoRef.current;\n\n    function syncPlayback() {\n      const video = videoRef.current;\n      if (!video) return;\n      if (inView && !document.hidden) void video.play().catch(() => {});\n      else video.pause();\n    }\n\n    syncPlayback();\n    document.addEventListener(\"visibilitychange\", syncPlayback);\n    return () => {\n      document.removeEventListener(\"visibilitychange\", syncPlayback);\n      videoAtEffectStart?.pause();\n    };\n  }, [active, inView, prefersReducedMotion]);"
          if before not in text:
              raise SystemExit("Expected RootSystem playback block was not found")
          path.write_text(text.replace(before, after, 1))
          PY

      - name: Commit the source fix
        shell: bash
        run: |
          git config user.name "Branding Tatva Build Bot"
          git config user.email "actions@users.noreply.github.com"
          git add src/sections/Process/RootSystem.tsx
          git commit -m "Stabilize Process film playback cleanup"
          git push origin HEAD:reimagine-project-moves
