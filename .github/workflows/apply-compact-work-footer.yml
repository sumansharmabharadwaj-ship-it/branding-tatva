name: Apply compact Work footer

on:
  push:
    branches:
      - homepage-cinematic-recovery
    paths:
      - .github/workflows/apply-compact-work-footer.yml

permissions:
  contents: write
  actions: write

concurrency:
  group: apply-compact-work-footer
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Check out application without the media archive
        uses: actions/checkout@v4
        with:
          ref: homepage-cinematic-recovery
          fetch-depth: 0
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/public/videos/*
            !/public/audio/*

      - name: Use Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Activate pnpm
        run: corepack enable

      - name: Apply, build, publish, and verify
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          for attempt in 1 2 3; do
            echo "Compact Work footer attempt ${attempt}"
            git fetch origin homepage-cinematic-recovery
            git reset --hard origin/homepage-cinematic-recovery

            echo '' | base64 -d > /tmp/apply-compact-work-footer.py
            python /tmp/apply-compact-work-footer.py

            pnpm install --frozen-lockfile
            pnpm build

            git add src/sections/Footer/index.tsx src/app/work/page.tsx scripts/work_page_gate_v3.cjs .github/workflows/apply-compact-work-footer.yml
            if git diff --cached --quiet; then
              echo "Compact Work footer is already present."
              gh workflow run work-page-gate.yml --ref homepage-cinematic-recovery
              exit 0
            fi

            git commit -m "Give the Work page one decisive ending"
            if git push origin HEAD:homepage-cinematic-recovery; then
              gh workflow run work-page-gate.yml --ref homepage-cinematic-recovery
              echo "Compact Work footer published and evidence gate dispatched."
              exit 0
            fi

            echo "Branch moved during verification; replaying on the newest head."
          done

          exit 1
