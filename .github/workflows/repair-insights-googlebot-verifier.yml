name: Repair Insights Googlebot verifier

on:
  workflow_dispatch:
  push:
    branches:
      - homepage-cinematic-recovery
    paths:
      - ".github/workflows/repair-insights-googlebot-verifier.yml"

permissions:
  contents: write

concurrency:
  group: branding-tatva-insights-googlebot-verifier-repair
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 8

    steps:
      - name: Check out the canonical branch
        uses: actions/checkout@v4
        with:
          ref: homepage-cinematic-recovery
          fetch-depth: 0

      - name: Use Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Read robots and Googlebot directives together
        run: |
          node <<'NODE'
          const fs = require("node:fs");
          const file = "scripts/insights_browser_gate.cjs";
          const before = fs.readFileSync(file, "utf8");
          const from = `      const robots = document.querySelector('meta[name="robots"]')?.getAttribute("content") || "";`;
          const to = `      const robots = [\n        document.querySelector('meta[name="robots"]')?.getAttribute("content") || "",\n        document.querySelector('meta[name="googlebot"]')?.getAttribute("content") || "",\n      ].filter(Boolean).join(", ");`;
          const count = before.split(from).length - 1;
          if (count !== 1) {
            throw new Error(`Expected one robots parser, found ${count}`);
          }
          fs.writeFileSync(file, before.replace(from, to));
          NODE

          node --check scripts/insights_browser_gate.cjs

      - name: Commit the standards-aware verifier
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/insights_browser_gate.cjs
          git commit -m "Read Googlebot preview directives from their own meta tag"
          git fetch origin homepage-cinematic-recovery
          git rebase origin/homepage-cinematic-recovery
          git push origin HEAD:homepage-cinematic-recovery
