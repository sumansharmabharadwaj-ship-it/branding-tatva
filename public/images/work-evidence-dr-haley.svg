<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1200" viewBox="0 0 1600 1200" role="img" aria-labelledby="title desc">
  <title id="title">Dr. Haley Nutrition performance evidence</title>
  <desc id="desc">An editorial performance diagram showing fewer Instagram posts and higher value per post, with verified January results.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#102018"/>
      <stop offset="1" stop-color="#244331"/>
    </linearGradient>
    <linearGradient id="value" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#8FAE83"/>
      <stop offset="1" stop-color="#D8C498"/>
    </linearGradient>
    <pattern id="grid" width="64" height="64" patternUnits="userSpaceOnUse">
      <path d="M64 0H0V64" fill="none" stroke="#F2F0E8" stroke-opacity=".045"/>
    </pattern>
  </defs>
  <rect width="1600" height="1200" fill="url(#bg)"/>
  <rect width="1600" height="1200" fill="url(#grid)"/>
  <circle cx="1320" cy="140" r="250" fill="#8FAE83" fill-opacity=".08"/>
  <g font-family="Arial, Helvetica, sans-serif" fill="#F2F0E8">
    <text x="96" y="102" font-size="22" letter-spacing="7" fill="#C6A97A">MEASURED PERFORMANCE</text>
    <text x="96" y="174" font-family="Georgia, 'Times New Roman', serif" font-size="62">Less volume. More value per post.</text>
    <text x="96" y="220" font-size="24" fill="#C7D2C7">December 2025 → January 2026</text>
  </g>

  <g transform="translate(96 310)">
    <rect width="610" height="720" rx="34" fill="#09120E" fill-opacity=".46" stroke="#F2F0E8" stroke-opacity=".14"/>
    <text x="42" y="58" font-family="Arial, Helvetica, sans-serif" font-size="18" letter-spacing="5" fill="#AFC1AF">PUBLISHING CADENCE</text>
    <line x1="42" y1="600" x2="568" y2="600" stroke="#F2F0E8" stroke-opacity=".16"/>
    <rect x="96" y="190" width="150" height="410" rx="18" fill="#F2F0E8" fill-opacity=".14"/>
    <rect x="364" y="386" width="150" height="214" rx="18" fill="url(#value)"/>
    <text x="171" y="656" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="70" fill="#F2F0E8">23</text>
    <text x="439" y="656" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="70" fill="#D8C498">12</text>
    <text x="171" y="700" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="17" letter-spacing="3" fill="#AFC1AF">DEC POSTS</text>
    <text x="439" y="700" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="17" letter-spacing="3" fill="#AFC1AF">JAN POSTS</text>
    <path d="M246 292C300 238 320 238 364 300" fill="none" stroke="#C6A97A" stroke-width="3" stroke-dasharray="8 10"/>
    <text x="305" y="255" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" letter-spacing="2" fill="#C6A97A">48% FEWER</text>
  </g>

  <g transform="translate(754 310)" font-family="Arial, Helvetica, sans-serif">
    <rect width="750" height="720" rx="34" fill="#F2F0E8" fill-opacity=".055" stroke="#F2F0E8" stroke-opacity=".14"/>
    <text x="42" y="58" font-size="18" letter-spacing="5" fill="#AFC1AF">VERIFIED JANUARY SIGNALS</text>
    <g transform="translate(42 112)">
      <rect width="316" height="244" rx="26" fill="#8FAE83" fill-opacity=".12" stroke="#8FAE83" stroke-opacity=".38"/>
      <text x="28" y="92" font-family="Georgia, 'Times New Roman', serif" font-size="68" fill="#D8C498">104%</text>
      <text x="28" y="136" font-size="20" fill="#F2F0E8">more followers</text>
      <text x="28" y="168" font-size="20" fill="#F2F0E8">earned per post</text>
    </g>
    <g transform="translate(390 112)">
      <rect width="316" height="244" rx="26" fill="#8FAE83" fill-opacity=".12" stroke="#8FAE83" stroke-opacity=".38"/>
      <text x="28" y="92" font-family="Georgia, 'Times New Roman', serif" font-size="62" fill="#D8C498">1,350%</text>
      <text x="28" y="136" font-size="20" fill="#F2F0E8">jump in comments</text>
      <text x="28" y="168" font-size="20" fill="#F2F0E8">per post</text>
    </g>
    <g transform="translate(42 388)">
      <rect width="316" height="244" rx="26" fill="#8FAE83" fill-opacity=".12" stroke="#8FAE83" stroke-opacity=".38"/>
      <text x="28" y="92" font-family="Georgia, 'Times New Roman', serif" font-size="68" fill="#D8C498">365%</text>
      <text x="28" y="136" font-size="20" fill="#F2F0E8">rise in LinkedIn</text>
      <text x="28" y="168" font-size="20" fill="#F2F0E8">impressions</text>
    </g>
    <g transform="translate(390 388)">
      <rect width="316" height="244" rx="26" fill="#8FAE83" fill-opacity=".12" stroke="#8FAE83" stroke-opacity=".38"/>
      <text x="28" y="92" font-family="Georgia, 'Times New Roman', serif" font-size="68" fill="#D8C498">2.81%</text>
      <text x="28" y="136" font-size="20" fill="#F2F0E8">engagement rate</text>
      <text x="28" y="168" font-size="20" fill="#F2F0E8">up from 0.71%</text>
    </g>
  </g>
  <text x="96" y="1126" font-family="Arial, Helvetica, sans-serif" font-size="18" letter-spacing="4" fill="#AFC1AF">INSTAGRAM · FACEBOOK · LINKEDIN</text>
</svg>