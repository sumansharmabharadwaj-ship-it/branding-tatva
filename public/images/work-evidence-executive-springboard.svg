    <text x="742" y="382" text-anchor="middle" font-size="18" letter-spacing="4" fill="#9FB4C7">INTENT</text>
    <text x="1230" y="382" text-anchor="middle" font-size="18" letter-spacing="4" fill="#C6A97A">CONVERSION</text>
