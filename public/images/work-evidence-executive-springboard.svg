<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1200" viewBox="0 0 1600 1200" role="img" aria-labelledby="title desc">
  <title id="title">Executive Springboard conversion journey evidence</title>
  <desc id="desc">An editorial journey diagram connecting everyday content to webinars and registration through a platform-specific content system.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#101722"/>
      <stop offset="1" stop-color="#294359"/>
    </linearGradient>
    <linearGradient id="path" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#9FB4C7"/>
      <stop offset="1" stop-color="#C6A97A"/>
