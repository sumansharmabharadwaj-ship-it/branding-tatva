<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1200" viewBox="0 0 1600 1200" role="img" aria-labelledby="title desc">
  <title id="title">MyShopInEurope brand-system evidence</title>
  <desc id="desc">An editorial diagram showing a marketplace moving from access to origin and into a complete brand and content system.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0F151A"/>
      <stop offset="1" stop-color="#23313A"/>
    </linearGradient>
    <pattern id="lines" width="72" height="72" patternUnits="userSpaceOnUse">
      <path d="M0 72L72 0" stroke="#F2E9DF" stroke-opacity=".035"/>
    </pattern>
  </defs>
  <rect width="1600" height="1200" fill="url(#bg)"/>
  <rect width="1600" height="1200" fill="url(#lines)"/>
  <circle cx="1430" cy="160" r="320" fill="#B85A34" fill-opacity=".1"/>
  <g font-family="Arial, Helvetica, sans-serif">
    <text x="96" y="100" font-size="22" letter-spacing="7" fill="#C6A97A">POSITIONING AND BRAND SYSTEM</text>
    <text x="96" y="182" font-family="Georgia, 'Times New Roman', serif" font-size="72" fill="#F2E9DF">ACCESS → ORIGIN → SYSTEM</text>
    <text x="96" y="230" font-size="24" fill="#AEB9BE">Craft and story before price.</text>
  </g>

  <g transform="translate(96 320)" font-family="Arial, Helvetica, sans-serif">
    <rect width="430" height="700" rx="34" fill="#080D10" fill-opacity=".46" stroke="#F2E9DF" stroke-opacity=".14"/>
    <text x="34" y="54" font-size="17" letter-spacing="5" fill="#C6A97A">01 · FOUNDATION</text>
    <text x="34" y="126" font-family="Georgia, 'Times New Roman', serif" font-size="50" fill="#F2E9DF">What the brand</text>
    <text x="34" y="184" font-family="Georgia, 'Times New Roman', serif" font-size="50" fill="#F2E9DF">stands on.</text>
    <g transform="translate(34 258)" font-size="20" fill="#E7DDD2">
      <rect width="362" height="74" rx="18" fill="#B85A34" fill-opacity=".15" stroke="#B85A34" stroke-opacity=".55"/>
      <text x="24" y="46">Core belief</text>
      <rect y="92" width="362" height="74" rx="18" fill="#B85A34" fill-opacity=".1" stroke="#B85A34" stroke-opacity=".4"/>
      <text x="24" y="138">Mission</text>
      <rect y="184" width="362" height="74" rx="18" fill="#B85A34" fill-opacity=".1" stroke="#B85A34" stroke-opacity=".4"/>
      <text x="24" y="230">Promise</text>
      <rect y="276" width="362" height="74" rx="18" fill="#B85A34" fill-opacity=".1" stroke="#B85A34" stroke-opacity=".4"/>
      <text x="24" y="322">Value</text>
    </g>
  </g>

  <g transform="translate(566 320)" font-family="Arial, Helvetica, sans-serif">
    <rect width="430" height="700" rx="34" fill="#F2E9DF" fill-opacity=".055" stroke="#F2E9DF" stroke-opacity=".14"/>
    <text x="34" y="54" font-size="17" letter-spacing="5" fill="#C6A97A">02 · CONTENT MIX</text>
    <text x="34" y="126" font-family="Georgia, 'Times New Roman', serif" font-size="50" fill="#F2E9DF">Teach and prove</text>
    <text x="34" y="184" font-family="Georgia, 'Times New Roman', serif" font-size="50" fill="#F2E9DF">before promoting.</text>
    <circle cx="215" cy="414" r="154" fill="none" stroke="#F2E9DF" stroke-opacity=".12" stroke-width="66"/>
    <path d="M215 260A154 154 0 1 1 91 505" fill="none" stroke="#B85A34" stroke-width="66" stroke-linecap="round"/>
    <path d="M91 505A154 154 0 0 1 187 565" fill="none" stroke="#C6A97A" stroke-width="66" stroke-linecap="round"/>
    <text x="215" y="402" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="62" fill="#F2E9DF">65%</text>
    <text x="215" y="444" text-anchor="middle" font-size="18" letter-spacing="3" fill="#AEB9BE">AUTHORITY</text>
    <g transform="translate(34 608)" font-size="17" fill="#E7DDD2">
      <text x="0" y="0">65% education and authority</text>
      <text x="0" y="34">25% culture and people</text>
      <text x="0" y="68">10% direct branding</text>
    </g>
  </g>

  <g transform="translate(1036 320)" font-family="Arial, Helvetica, sans-serif">
    <rect width="468" height="700" rx="34" fill="#080D10" fill-opacity=".46" stroke="#F2E9DF" stroke-opacity=".14"/>
    <text x="34" y="54" font-size="17" letter-spacing="5" fill="#C6A97A">03 · ROLLOUT</text>
    <text x="34" y="126" font-family="Georgia, 'Times New Roman', serif" font-size="50" fill="#F2E9DF">One position,</text>
    <text x="34" y="184" font-family="Georgia, 'Times New Roman', serif" font-size="50" fill="#F2E9DF">carried forward.</text>
    <line x1="72" y1="282" x2="72" y2="610" stroke="#C6A97A" stroke-opacity=".55" stroke-width="3"/>
    <g fill="#B85A34" stroke="#F2E9DF" stroke-opacity=".22">
      <circle cx="72" cy="302" r="15"/>
      <circle cx="72" cy="402" r="15"/>
      <circle cx="72" cy="502" r="15"/>
      <circle cx="72" cy="602" r="15"/>
    </g>
    <g font-size="21" fill="#E7DDD2">
      <text x="112" y="310">Foundation</text>
      <text x="112" y="410">Audience pull</text>
      <text x="112" y="510">Lead quality</text>
      <text x="112" y="610">Market position</text>
    </g>
    <text x="34" y="672" font-size="17" letter-spacing="3" fill="#AEB9BE">LINKEDIN · INSTAGRAM · YOUTUBE · REDDIT</text>
  </g>
  <text x="96" y="1125" font-family="Arial, Helvetica, sans-serif" font-size="18" letter-spacing="4" fill="#AEB9BE">INDIAN ORIGIN · EUROPEAN RETAIL · QUARTER-BY-QUARTER OPERATING SYSTEM</text>
</svg>