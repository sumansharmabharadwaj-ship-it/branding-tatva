<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1200" viewBox="0 0 1600 1200" role="img" aria-labelledby="title desc">
  <title id="title">HerbalCart perception-reset evidence</title>
  <desc id="desc">An editorial comparison showing a shift from an herbal assumption to a modern supplement-first frame, supported by five native content formats.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#171710"/>
      <stop offset="1" stop-color="#39321B"/>
    </linearGradient>
    <linearGradient id="modern" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#C28A28" stop-opacity=".28"/>
      <stop offset="1" stop-color="#E0B96A" stop-opacity=".09"/>
    </linearGradient>
  </defs>
  <rect width="1600" height="1200" fill="url(#bg)"/>
  <circle cx="1420" cy="1040" r="420" fill="#C28A28" fill-opacity=".08"/>
  <g font-family="Arial, Helvetica, sans-serif">
    <text x="96" y="104" font-size="22" letter-spacing="7" fill="#E0B96A">PERCEPTION RESET</text>
    <text x="96" y="184" font-family="Georgia, 'Times New Roman', serif" font-size="72" fill="#F2EEE1">The product was modern. The category frame was not.</text>
    <text x="96" y="232" font-size="24" fill="#BEB79D">Campaign direction for a supplement-first wellness brand.</text>
  </g>

  <g transform="translate(96 320)" font-family="Arial, Helvetica, sans-serif">
    <rect width="670" height="430" rx="38" fill="#090904" fill-opacity=".43" stroke="#F2EEE1" stroke-opacity=".14"/>
    <text x="38" y="58" font-size="18" letter-spacing="5" fill="#9E997F">ASSUMED CATEGORY</text>
    <text x="38" y="152" font-family="Georgia, 'Times New Roman', serif" font-size="62" fill="#C8C3AB">Herbal.</text>
    <text x="38" y="220" font-family="Georgia, 'Times New Roman', serif" font-size="62" fill="#C8C3AB">Ayurvedic.</text>
    <text x="38" y="288" font-family="Georgia, 'Times New Roman', serif" font-size="62" fill="#C8C3AB">Traditional.</text>
    <text x="38" y="368" font-size="20" fill="#9E997F">A frame that obscured whey protein,</text>
    <text x="38" y="398" font-size="20" fill="#9E997F">pre-workout, and protein bars.</text>
  </g>

  <g transform="translate(834 320)" font-family="Arial, Helvetica, sans-serif">
    <rect width="670" height="430" rx="38" fill="url(#modern)" stroke="#C28A28" stroke-opacity=".55"/>
    <text x="38" y="58" font-size="18" letter-spacing="5" fill="#E0B96A">INTENDED FRAME</text>
    <text x="38" y="152" font-family="Georgia, 'Times New Roman', serif" font-size="62" fill="#F2EEE1">Modern.</text>
    <text x="38" y="220" font-family="Georgia, 'Times New Roman', serif" font-size="62" fill="#F2EEE1">Practical.</text>
    <text x="38" y="288" font-family="Georgia, 'Times New Roman', serif" font-size="62" fill="#F2EEE1">Supplement-first.</text>
    <text x="38" y="368" font-size="20" fill="#F2EEE1">Natural food has a gap.</text>
    <text x="38" y="398" font-size="20" fill="#F2EEE1">Supplementation fills a specific need.</text>
  </g>

  <path d="M768 535H824" stroke="#E0B96A" stroke-width="3"/>
  <path d="M814 523L826 535L814 547" fill="none" stroke="#E0B96A" stroke-width="3"/>

  <g transform="translate(96 820)" font-family="Arial, Helvetica, sans-serif">
    <text x="0" y="20" font-size="18" letter-spacing="5" fill="#E0B96A">FIVE SHOOT-READY FORMATS</text>
    <g transform="translate(0 62)" font-size="18" fill="#F2EEE1">
      <rect width="260" height="136" rx="24" fill="#F2EEE1" fill-opacity=".055" stroke="#C28A28" stroke-opacity=".42"/>
      <text x="22" y="46" fill="#E0B96A">01</text><text x="22" y="84">Food vs supplement</text>
      <rect x="286" width="260" height="136" rx="24" fill="#F2EEE1" fill-opacity=".055" stroke="#C28A28" stroke-opacity=".42"/>
      <text x="308" y="46" fill="#E0B96A">02</text><text x="308" y="84">Why supplement</text>
      <rect x="572" width="260" height="136" rx="24" fill="#F2EEE1" fill-opacity=".055" stroke="#C28A28" stroke-opacity=".42"/>
      <text x="594" y="46" fill="#E0B96A">03</text><text x="594" y="84">DIY recipes</text>
      <rect x="858" width="260" height="136" rx="24" fill="#F2EEE1" fill-opacity=".055" stroke="#C28A28" stroke-opacity=".42"/>
      <text x="880" y="46" fill="#E0B96A">04</text><text x="880" y="84">Real-user change</text>
      <rect x="1144" width="264" height="136" rx="24" fill="#C28A28" fill-opacity=".12" stroke="#E0B96A" stroke-opacity=".58"/>
      <text x="1166" y="46" fill="#E0B96A">05</text><text x="1166" y="84">Reaction reviews</text>
    </g>
  </g>
  <text x="96" y="1126" font-family="Arial, Helvetica, sans-serif" font-size="18" letter-spacing="4" fill="#BEB79D">HINGLISH SCRIPTS · REAL CULTURAL REFERENCES · NATIVE OVER PHARMA-POLISHED</text>
</svg>